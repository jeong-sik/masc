name = "masc_msx_press"
description = """
Hold one or more keys on the shared MSX machine for hold_frames, then run \
the rest of frames released, and return the observation (see \
masc_msx_screen). Keys: up down left right space esc return trigger_a \
trigger_b f1-f5 or one character. Games read input edges, so a short hold \
(5 frames) is a press. Every edge is recorded in the ledger with your name \
and the frame number. Frames are 1/60 s; at most 300 per call."""
additional_properties = false

defer_loading = true

[[params]]
name = "keys"
type = "array"
required = true
items = { type = "string" }
min_items = 1
description = "Keys held together, e.g. [\"space\"] or [\"right\", \"space\"]."

[[params]]
name = "hold_frames"
type = "integer"
description = "Frames the keys stay down. Default 5."
minimum = 1
maximum = 300
default = 5

[[params]]
name = "frames"
type = "integer"
description = "Total frames this call advances, including the hold. Default 30 (half a second)."
minimum = 1
maximum = 300
default = 30
