name = "masc_browser_instruct"
description = """
Use the owned browser lane and tabId returned by BrowserTabs. observe finds matching elements: automation uses its installation-selected locate Exact Output and returns freshly checked node references; stagehand uses its observer. Model explanations are inference, not permission to click. act and extract require stagehand; act can change external state and extract returns data shaped by schema. No browser is substituted for the observed tab."""
additional_properties = false

[[params]]
name = "lane"
type = "string"
enum = ["automation", "stagehand"]
required = true
description = "The owned lane that supplied tabId."

[[params]]
name = "action"
type = "string"
enum = ["act", "observe", "extract"]
required = true

[[params]]
name = "instruction"
type = "string"
description = "Required for act and extract."

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "schema"
type = "string"
description = "extract only: JSON Schema text for the data."
