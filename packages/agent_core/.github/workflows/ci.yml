name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (OCaml ${{ matrix.ocaml-compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        include:
          - ocaml-compiler: '5.4.1'
            experimental: false
          - ocaml-compiler: '5.5.0'
            experimental: true
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Pin fork packages and install dependencies
        run: opam exec -- bash scripts/ci-setup-deps.sh

      - name: Check execution store single-writer boundary
        run: opam exec -- bash scripts/check-execution-store-boundary.sh

      - name: Check terminal-tool boundary
        run: opam exec -- bash scripts/check-terminal-tool-boundary.sh --check

      - name: Check terminal-tool boundary ratchet self-test
        run: opam exec -- bash scripts/check-terminal-tool-boundary.sh --self-test

      - name: Build
        run: opam exec -- dune build @all

      - name: Standalone embedded model catalog smoke
        run: opam exec -- bash scripts/check-model-catalog-embedded.sh

      - name: Test
        env:
          ALCOTEST_QUICK_TESTS: "1"
        run: opam exec -- dune runtest

      - name: Coverage report
        if: matrix.ocaml-compiler == '5.4.1'
        env:
          BISECT_ENABLE: "yes"
          # Force Eio's posix/epoll backend so bisect-instrumented tests do
          # not initialise io_uring rings. GitHub-hosted runners cap
          # RLIMIT_MEMLOCK at 8 MiB for unprivileged users and
          # `ulimit -l unlimited` is silently denied, so each extra
          # io_uring_queue_init under bisect eventually returns ENOMEM and
          # fails the step.
          EIO_BACKEND: "posix"
        run: |
          mkdir -p _coverage
          # Pin coverage file location outside dune's per-test sandboxes.
          # Without this, bisect_ppx writes `bisect_<pid>.coverage` into
          # the test executable's CWD (a sandbox dir under
          # `_build/.sandbox/...`), which dune deletes immediately after
          # the test binary exits. `BISECT_FILE` tells the bisect runtime
          # library to write files at a stable absolute prefix instead.
          export BISECT_FILE="$PWD/_coverage/bisect"
          opam exec -- dune clean
          # `--instrument-with bisect_ppx` activates the
          # `(instrumentation (backend bisect_ppx))` stanza declared in
          # lib/dune. Without this flag dune ignores the stanza and no
          # `.coverage` files are written at all — which the previous
          # `2>/dev/null | head -1 || echo 0` pipeline silently masked as
          # an empty coverage value, bypassing the 80% threshold check
          # below.
          opam exec -- dune runtest --force --instrument-with bisect_ppx

          # `bisect-ppx-report summary` takes `--coverage-path=DIR` for a
          # directory search, not a positional argument (that slot is for
          # explicit *.coverage file paths). Passing the dir positionally
          # produces `cannot read coverage file '_coverage': Is a directory`.
          echo "::group::Coverage files discovered"
          find _coverage -name '*.coverage' -print || true
          echo "::endgroup::"

          SUMMARY=$(opam exec -- bisect-ppx-report summary --coverage-path=_coverage 2>&1 || true)
          echo "$SUMMARY"

          COVERAGE=$(echo "$SUMMARY" | grep -oP '\d+\.\d+(?=%)' | head -1 || true)
          if [ -z "$COVERAGE" ]; then
            echo "::error::Coverage summary parse failed — no '<number>%' found in bisect-ppx-report output."
            exit 1
          fi

          echo "Total coverage: ${COVERAGE}%"
          opam exec -- bisect-ppx-report summary --per-file --coverage-path=_coverage || true

          # Baseline, not aspiration. #250 set this to 80% but the parser
          # bug (fixed in #1171) meant the gate never actually fired, so
          # the 80% number was always hypothetical. First real measurement
          # under correct instrumentation was 66.42% (run 24887636744).
          #
          # 2026-04-28: orphan-test sweep (#1224 → #1229 → #1230 → #1231 →
          # #1232 → #1233 → #1234 → #1235) registered 37 previously
          # 0%-covered modules. Coverage on run 25039242435 (sha 755c04b0,
          # batch-5 merge) measured 72.47%. Floor raised to 71 per #1175
          # plan ("After each step, raise THRESHOLD to floor(measured - 1)
          # to prevent regression without blocking noise").
          #
          # 2026-05-04: main CI has been red on coverage for multiple runs
          # (run 25301627933, 25258991535). Measurement 22.87% on
          # run 25315149925. New provider modules (transport_kimi_cli,
          # transport_codex_cli, transport_gemini_cli, metrics, cache)
          # added without corresponding test registration. Floor set to
          # floor(22.87) = 22 per ratchet policy until test registration
          # catches up.
          #
          # 2026-05-24: full CI on PR #1707 measured 70.90% coverage
          # (run 26352648077, job 77573496681). Raise the floor to
          # floor(70.90 - 1) = 69 per #1175 ratchet policy while leaving
          # headroom for CI/runtime noise.
          #
          # 2026-05-24: main CI after #1718 measured 73.73% coverage
          # (run 26354719636, job 77579231445). Raise the floor to
          # floor(73.73 - 1) = 72 per #1175 ratchet policy.
          #
          # 2026-05-24: PR #1738 CI measured 74.47% coverage
          # (run 26360879180, job 77595953724). Raise the floor to
          # floor(74.47 - 1) = 73 per #1175 ratchet policy.
          #
          # 2026-05-25: local clean full coverage on PR #1759 measured
          # 76.02% (22598/29728) after provider dispatch, provider_d codec,
          # and streaming edge coverage. Raise the floor to
          # floor(76.02 - 1) = 75 per #1175 ratchet policy.
          #
          # 2026-05-25: local clean full coverage on PR #1759 measured
          # 77.72% (23104/29728) after Stage D client/pipeline/pure module,
          # harness, and CLI transport coverage. Raise the floor to
          # floor(77.72 - 1) = 76 per #1175 ratchet policy.
          #
          # 2026-05-25: local clean full coverage on PR #1759 measured
          # 78.13% (23241/29748) after Stage D provider_k, tool-call
          # harness, and provider catalog coverage. Raise the floor to
          # floor(78.13 - 1) = 77 per #1175 ratchet policy.
          #
          # 2026-05-25: local clean full coverage measured 79.00%
          # (23500/29748) after Stage E runtime server and provider config
          # coverage. Raise the floor to floor(79.00 - 1) = 78 per #1175
          # ratchet policy.
          #
          # 2026-05-25: local clean full coverage measured 80.02%
          # (23803/29748) after Stage F maintained memory, discovery,
          # HTTP client, tool selector, checkpoint, and type coverage.
          # Raise the floor to floor(80.02 - 1) = 79 per #1175 ratchet
          # policy.
          #
          # 2026-05-25: local clean full coverage measured 81.01%
          # (24098/29746) after Stage G maintained provider bridge,
          # sessions, memory, and runtime evidence coverage. Raise the
          # floor to floor(81.01 - 1) = 80 per #1175 ratchet policy.
          #
          # 2026-06-02: after the provider/runtime hard cut removed the
          # stale stdio runtime binary target, PR #1833 re-registered the
          # surviving runtime orphan suites and local bisect measured
          # 77.55% (21220/27362). Reset the ratchet floor to
          # floor(77.55 - 1) = 76 until the removed binary/CLI-era
          # coverage surface is replaced by in-process runtime coverage.
          # 2026-07-21: runtime cluster redesign (#2737) deleted 9 unreachable
          # modules (-9705 lines) + 9 dedicated tests; bisect measured 75.56%.
          # Reset the ratchet floor to floor(75.56 - 1) = 75 per #1175 policy.
          THRESHOLD=75
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Build documentation (odoc)
        if: matrix.ocaml-compiler == '5.4.1'
        run: |
          opam install odoc --yes
          opam exec -- dune build @doc

  eio-compat:
    name: Eio ${{ matrix.eio-version }} Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        eio-version: ['1.3', '1.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
          dune-cache: true

      - name: Install dependencies
        run: opam exec -- bash scripts/ci-setup-deps.sh

      - name: Select Eio ${{ matrix.eio-version }}
        run: |
          opam install \
            "eio.${{ matrix.eio-version }}" \
            "eio_main.${{ matrix.eio-version }}" \
            --yes

      - name: Run typed transport compatibility tests
        env:
          OCAMLPARAM: "_,warn-error=+a"
        run: opam exec -- dune runtest lib/llm_provider

  boundary-lint:
    # Runs on every push and PR (including drafts) to give fast feedback
    # without waiting for the full opam-based build matrix.
    name: Core Boundary Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install boundary tools
        run: sudo apt-get install -y ocaml-nox ripgrep

      - name: Enforce exact-output single surface
        run: bash scripts/check-exact-output-single-surface.sh

      - name: Forbid legacy pipeline stage modules
        run: bash scripts/lint-legacy-pipeline-stages.sh

      - name: Enforce pipeline usage accumulator SSOT
        run: bash scripts/lint-pipeline-usage-ssot.sh

  lint:
    name: Lint
    # Run on drafts: catching drift at draft time prevents main from going
    # red after a draft merge (#2311, #2319 were post-merge format/lint fixes
    # a draft-time check would have caught).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test PR tree identity gate
        run: bash scripts/test-check-pr-tree-identity.sh

      - name: Reject same-tree no-op PRs
        if: github.event_name == 'pull_request'
        env:
          OAS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OAS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OAS_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$OAS_PR_BASE_SHA" \
            "+refs/pull/${OAS_PR_NUMBER}/head:refs/remotes/pull/${OAS_PR_NUMBER}/head"
          bash scripts/check-pr-tree-identity.sh "$OAS_PR_BASE_SHA" "$OAS_PR_HEAD_SHA"

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
          dune-cache: true

      - name: Pin fork packages and install dependencies
        run: opam exec -- bash scripts/ci-setup-deps.sh

      - name: Check warnings as errors
        run: opam exec -- dune build @install --force
        env:
          OCAMLPARAM: "_,warn-error=+a"

  ocamlformat:
    name: OCaml Format
    # Run on drafts: catching drift at draft time prevents main from going
    # red after a draft merge (#2311, #2319 were post-merge format/lint fixes
    # a draft-time check would have caught).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
          dune-cache: true

      - name: Install ocamlformat
        run: opam install ocamlformat --yes

      - name: Check formatting
        run: opam exec -- dune build @fmt

  version-check:
    name: Version Consistency
    # Run on drafts: catching drift at draft time prevents main from going
    # red after a draft merge (#2311, #2319 were post-merge format/lint fixes
    # a draft-time check would have caught).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Verify version strings match
        run: |
          # Tolerant of trailing release-please annotations:
          #   (version 0.192.1) ; x-release-please-version
          #   let version = "0.192.1" (* x-release-please-version *)
          DUNE_VER=$(grep -E '^\(version ' dune-project | head -1 | sed -E 's/^\(version ([^ )]+).*/\1/')
          echo "dune-project version: $DUNE_VER"

          SDK_VER=$(grep -E '^let version' lib/sdk_version.ml | head -1 | sed -E 's/^let version = "([^"]+)".*/\1/')
          echo "sdk_version.ml version: $SDK_VER"

          if [ "$DUNE_VER" != "$SDK_VER" ]; then
            echo "ERROR: dune-project ($DUNE_VER) != agent_sdk.ml ($SDK_VER)"
            exit 1
          fi

          echo "Version consistency check passed: $DUNE_VER"

      - name: Test release availability gate
        run: bash scripts/test-check-since-version.sh

      - name: Reject future API availability claims in release candidates
        if: ${{ startsWith(github.head_ref, 'release-please--branches--') || startsWith(github.ref_name, 'release-please--branches--') }}
        run: bash scripts/check-since-version.sh

  transport-drift:
    name: Transport Drift Gate
    # Run on drafts: catching drift at draft time prevents main from going
    # red after a draft merge (#2311, #2319 were post-merge format/lint fixes
    # a draft-time check would have caught).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run transport drift gate
        run: bash scripts/check-transport-truth.sh

  reasoning-effort-ssot:
    name: Reasoning Effort SSOT Gate
    # Run on drafts: S2.2 is a request-builder invariant, not a release-time
    # packaging concern.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run reasoning effort SSOT gate
        run: bash scripts/check-reasoning-effort-ssot.sh

  sdk-independence:
    name: SDK Independence Gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run SDK independence gate
        run: bash scripts/check-sdk-independence.sh

  tag-drift:
    name: Release Tag Drift
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Enforced gate: fails if any CHANGELOG entry in the default scope
    # (--limit 10) lacks a matching `v<version>` git tag. The backlog
    # surfaced when #1130 landed (v0.155.1, v0.160.0, v0.161.0,
    # v0.163.0, v0.164.0) was back-tagged in the same session, so the
    # default scope is drift-free. Widening --limit further surfaces a
    # deeper backlog (duplicate `[0.154.0]`, out-of-order `[0.155.0]`)
    # that needs CHANGELOG cleanup before the scope is raised.

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full tag history for `git tag -l` to see released versions.
          fetch-depth: 0

      - name: Enforce tag drift (strict)
        run: bash scripts/check-tag-drift.sh --strict --allow-current-untagged

  tla-specs:
    name: TLA+ Model Checking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download tla2tools.jar
        run: |
          curl -fsSL -o specs/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      - name: Check clean specs
        run: |
          for cfg in specs/*.cfg; do
            if echo "$cfg" | grep -q buggy; then continue; fi
            tla="${cfg%.cfg}.tla"
            echo "=== Checking $(basename "$tla") with $(basename "$cfg") ==="
            java -cp specs/tla2tools.jar tlc2.TLC -config "$cfg" "$tla"
          done

      - name: Check buggy specs
        run: |
          for cfg in specs/*-buggy.cfg; do
            tla="${cfg%-buggy.cfg}.tla"
            echo "=== Checking buggy $(basename "$tla") with $(basename "$cfg") ==="
            set +e
            java -cp specs/tla2tools.jar tlc2.TLC -config "$cfg" "$tla"
            exit_code=$?
            set -e
            # TLC 1.8.0 exit codes for buggy specs:
            #   12 = state-level invariant violation
            #   13 = trace-level invariant violation (action/liveness)
            if [ $exit_code -eq 12 ] || [ $exit_code -eq 13 ]; then
              echo "  Invariant violated as expected (exit $exit_code)"
            elif [ $exit_code -eq 0 ]; then
              echo "ERROR: Buggy spec should have violated invariant but passed"
              exit 1
            else
              echo "ERROR: Unexpected exit code $exit_code"
              exit 1
            fi
          done
