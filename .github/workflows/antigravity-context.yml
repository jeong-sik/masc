name: Antigravity context transport
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-prompt-pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 test/test_antigravity_context_transport.py
