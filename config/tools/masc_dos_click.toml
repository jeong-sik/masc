name = "masc_dos_click"
description = """
Set the mouse and run the shared DOS machine.

The mouse is state, not a queue: the cursor and buttons stay where they are \
put until the next call moves them. A click (buttons 1 left or 2 right) is \
button down, run, button up, run, in one call -- the up half always runs so \
the button is never left held. buttons 0 is a move: position set, one run. \
Coordinates are frame pixels and must land inside the frame; a graphics \
mode's size is in the masc_dos_screen observation. A program that polls the \
mouse instead of asking the BIOS for keys never settles; its clicks read as \
settled false with the budget spent, which is the expected shape for a game \
driven this way. The action is recorded in the ledger like a key."""
additional_properties = false

defer_loading = true

[[params]]
name = "x"
type = "integer"
required = true
description = "Frame pixel column, 0 to width-1."
minimum = 0

[[params]]
name = "y"
type = "integer"
required = true
description = "Frame pixel row, 0 to height-1."
minimum = 0

[[params]]
name = "buttons"
type = "integer"
description = "0 move, 1 left click, 2 right click. Default 1."
minimum = 0
maximum = 2
default = 1

[[params]]
name = "steps"
type = "integer"
description = "Instruction budget for the whole call. Default 1000000."
minimum = 1
maximum = 4000000
default = 1000000
