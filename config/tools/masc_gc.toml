name = "masc_gc"
description = """
Run the explicit workspace garbage-collection pass with a retention horizon of `days`: archive Done and Cancelled tasks older than that, delete workspace messages older than that unless their body mentions an open task id, and run the backend pubsub cleanup. An open task found in the task archive is moved back to the backlog. Agent lifecycle is not modified."""
additional_properties = false

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called once in one turn, 323 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most one extra request over the same week.
defer_loading = true

[[params]]
name = "days"
type = "integer"
required = true
description = "Operator-selected retention horizon in days"
minimum = 1
