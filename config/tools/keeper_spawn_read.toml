name = "keeper_spawn_read"
description = """
Read output stream bytes from a spawned process starting at an offset.

Returns newly produced bytes and the next offset to continue reading from."""
additional_properties = false

[[params]]
name = "handle"
type = "string"
required = true
description = "Handle returned by keeper_spawn."

[[params]]
name = "stream"
type = "string"
enum = ["stdout", "stderr"]
description = "Stream to read (stdout or stderr). Defaults to stdout."

[[params]]
name = "from"
type = "integer"
description = "Byte offset to read from. Defaults to start of stream."
