name = "masc_schedule_lane_act_create"
description = """
Hand an action to a declared Lane Add-on installation at a later time. At each \
due time the installation's live worker receives the action with the \
occurrence id as its request id, under your own access. Give exactly one of \
due_in_sec, due_at_iso or due_at_unix; a daily or cron recurrence may give \
none and derive its first due time. A due time before the current second is \
refused with error_kind due_already_past. You are recorded as the requester \
and the scheduler. To wake a Keeper, use masc_schedule_create."""
additional_properties = false
defer_loading = true

[[params]]
name = "due_in_sec"
type = "integer"
minimum = 1
description = "Seconds after the server runs this call."

[[params]]
name = "due_at_unix"
type = "number"
description = "Unix timestamp in seconds."

[[params]]
name = "due_at_iso"
type = "string"
description = """
RFC 3339 timestamp with Z or an explicit numeric offset, for example \
2026-08-02T09:00:00+09:00. It is normalized to whole-second UTC; fractional \
seconds are accepted and truncated."""

[[params]]
name = "installation_id"
type = "string"
required = true
description = """
The declared Lane Add-on installation (its declaration id) whose live worker \
runs action at each due time. Read the declared installations with \
masc_lane_inspect; a name that is not declared fails at the due time."""

[[params]]
name = "action"
type = "object"
required = true
description = """
The action object the installation's package schema accepts, such as \
{"kind": "compose", "questions": 5}. It is checked against the worker that \
runs it, at each due time."""

[[params]]
name = "schedule_id"
type = "string"
description = "Optional stable schedule id."

[[params]]
name = "requested_at_unix"
type = "number"
description = """
Optional request timestamp for replay/tests. Recorded only; no due time \
counts from it."""

[[params]]
name = "expires_at_unix"
type = "number"
description = "Optional expiry timestamp."

[[params]]
name = "recurrence_kind"
type = "string"
description = "Recurrence kind. Defaults to one_shot."
enum = ["one_shot", "interval", "daily", "cron"]

[[params]]
name = "recurrence_interval_sec"
type = "integer"
description = """
Required when recurrence_kind is interval; seconds between runs."""

[[params]]
name = "recurrence_hour"
type = "integer"
description = "Required when recurrence_kind is daily; local hour in 0..23."

[[params]]
name = "recurrence_minute"
type = "integer"
description = """
Required when recurrence_kind is daily; local minute in 0..59."""

[[params]]
name = "recurrence_second"
type = "integer"
description = """
Optional when recurrence_kind is daily; local second in 0..59."""

[[params]]
name = "recurrence_cron"
type = "string"
description = """
Required when recurrence_kind is cron. Standard 5-field cron expression: \
minute hour day-of-month month day-of-week. Supports wildcards, comma lists, \
numeric ranges, and steps such as */15 or 1-5/2."""

[[params]]
name = "recurrence_timezone"
type = "string"
description = """
Required when recurrence_kind is daily or cron. Fixed-offset only: UTC, \
Asia/Seoul/KST as +09:00 aliases, or offsets like +09:00/UTC+09:00. \
DST-aware IANA zones are not supported."""
