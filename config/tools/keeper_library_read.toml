name = "keeper_library_read"
description = """
Read a full document from the knowledge library by exact topic name. Use after \
keeper_library_search identifies a relevant document, or with a known topic \
name. Returns full document text."""

# Held back from the request until the model asks for it by name. Not
# called once on 2026-08-29 or 2026-08-30 across the fleet.
defer_loading = true

[[params]]
name = "topic"
type = "string"
required = true
description = "Exact document topic name (from search results or known)"
