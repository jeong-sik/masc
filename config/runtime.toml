# ── Runtime candidate orders ─────────────────────────────────
# A lane is an ordered list of runtime candidates under a name you pick. When a
# keeper is assigned to a lane, the turn attempts candidates in order until one
# succeeds or the lane is exhausted. Lanes are resolved at config load; unknown
# candidate ids abort startup. Ordering is the only semantics; a lane table
# carries only [candidates].
#
# The name is yours: it does not have to be a runtime id, and two lanes may
# start at the same runtime under different names. A lane that no assignment
# names is never walked.
[runtime.lanes.coding]
candidates = [
  "ollama_cloud.ollama-cloud-deepseek-v4-1-flash",
  "deepseek.deepseek-v4-pro",
]

# Opt-in reviewer route: separate providers let a review continue when one
# subscription account is quota-blocked. Select this lane explicitly in the
# live runtime assignments; the public seed never assigns deployment-local
# keeper names and is not copied over an existing workspace's configuration.
# A failed attempt with an unknown outward effect remains fenced by the
# runtime; declaring another candidate does not authorize duplicate execution.
[runtime.lanes.reviewer-failover]
candidates = [
  "codex_subscription.codex-gpt-6-1-sol-high",
  "glm-coding.glm-5-3",
  "antigravity_subscription.antigravity-gemini-3-8-flash-high",
]

# Subscription-first worker route: OpenCode Go head, then Ollama Cloud and
# Z.AI fallbacks on independent quotas. Select explicitly in live assignments;
# the public seed never assigns deployment-local keeper names.
[runtime.lanes.go-deepseek-then-glm]
candidates = [
  "opencode_go.opencode-go-deepseek-flash",
  "ollama_cloud.ollama-cloud-deepseek-v4-1-flash",
  "glm-coding.glm-5-3-flash",
]

# The judge seat of the shipped Fusion presets. A seat names a route and walks
# its candidates in order, so a judge whose first
# runtime is rate-limited, timing out or refusing the request still answers from
# the next one instead of failing the whole deliberation. The candidates sit on
# three different providers on purpose: one provider's outage takes one
# candidate, not the seat.
[runtime.lanes.fusion-judge]
candidates = [
  "ollama_cloud.minimax-m3",
  "ollama_cloud.ollama-cloud-deepseek-v4-pro",
  "deepseek.deepseek-v4-pro",
]

# ── Keeper assignments ──────────────────────────────────────────────
# Keepers are assigned to a model by provider.model key. Unassigned
# keepers fall back to [runtime].default. Per-keeper overrides in the
# live config (<base>/.masc/config/runtime.toml) take precedence.
#
# The public seed ships no keeper assignments: keeper names are
# deployment-local identities, so per-keeper routing belongs in the live
# config, not here (enforced by test_runtime_config_validity "public seed
# has no keeper assignments").
# Do not assign general keeper lanes to Pro here. Pro is reserved for explicit
# judge/evaluator lanes ([runtime.exact_output_lanes.verifier_exact] and
# [fusion].judge).
#
# An assignment names a [runtime.lanes] lane or a runtime id
# (<provider>.<model>). A lane of that name is taken first, so a lane named
# after a runtime still wins. A name that is neither is rejected at load — which
# is why a lane with a name of its own is worth more than one that copies a
# runtime id: delete it and the load fails instead of quietly walking that
# runtime alone.
[runtime.assignments]
# Per-keeper routing belongs in <base>/.masc/config/runtime.toml.

# Connectors: trigger_policy in {"mention_or_thread", "mention_only", "all", "user_only:<id>"}.
[discord]
trigger_policy = "mention_or_thread"

