name = "masc_browser_tabs"
description = """
List open tabs in live Firefox/Zen (operator extension) or isolated automation Firefox. Returns an array of {id, active, title, url}; live also includes index/windowId. Choose relevant titles/URLs, then pass the returned id and same lane to BrowserRead."""
additional_properties = false

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation"]
description = "Which browser lane to ask. Default: live."
default = "live"
