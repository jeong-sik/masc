# DeepL's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.deepl.com/.well-known/oauth-protected-resource,
# authorization server (https://mcp.deepl.com/) offers S256 PKCE and dynamic
# client registration (HTTP 201). It publishes 'offline_access' scope.

id = "deepl"
label = "DeepL"
mcp_url = "https://mcp.deepl.com/v1/mcp"

access_token_env = "DEEPL_ACCESS_TOKEN"
expires_at_env = "DEEPL_EXPIRES_AT"
refresh_token_file = "deepl_refresh_token"
renew_before_sec = 300
