\* Clean model: after a typed size refusal a run steps down three fixed
\* rungs (resume, fresh start, floor) and never back up. It measures no size
\* and uses no reported number to choose a rung; a turn-text refusal and a
\* window refusal step down the same way
\* (RFC-size-refusal-starts-fresh-then-cuts-to-the-floor).
\* A goal of 40 is over TurnLimit on every rung, so the model reaches the
\* end with no rung left. A side of 190 is over the window on the floor, and
\* a side of 90 fits the floor only with the carrier by address or with it
\* inline, depending on the blob write.
\* Expected: no violation.
SPECIFICATION SpecClean

CONSTANTS
    TurnLimit       = 35
    WindowLimit     = 200
    FixedTurnSizes  = {20, 40}
    FixedSideSizes  = {30, 90, 190}
    ResumeTurnSizes = {30, 50}
    VendorSizes     = {20, 200}
    CarrierInline   = 40
    CarrierAddress  = 5
    MemoryFull      = 40
    MemoryDeferred  = 5
    HistoryFull     = 32
    HistoryFloor    = 4

INVARIANTS
    TypeOK
    WritesOnlyForTheFloor
    EndsOnlyWhenNoRungIsLeft
    NoPrematureEnd

PROPERTIES
    EveryResendStepsDown
    FreshStartCarriesEverything
    RunEnds

CHECK_DEADLOCK FALSE
