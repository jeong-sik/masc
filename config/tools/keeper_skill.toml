name = "keeper_skill"
description = "Read one frozen instruction Skill body. Every row in the Available list below is something this workspace wrote down about work that recurs here — a failure that repeats, a convention and the reason for it, a sequence whose order matters. Open the row whose one-line description names the work you are about to start, before starting it. The common error is not opening one that applied: a body that turns out not to apply costs a single call.\n\nPass a row's name as `identity.name`. `source_id`, `package_id` and `content_revision` are optional: one you write is compared with the Skill's own and the call is refused when it differs, so leave them out unless a refusal asks you to tell two Skills apart. Without `content_revision`, this turn's frozen list decides which revision is read. When that body names a bundled file needed for the current work, call again with its relative `file` path. Bodies or resources larger than the inline wire boundary are returned as structured artifact handles readable via `keeper_artifact_read`."
additional_properties = false
# Keep discovery resident: this schema carries the Available Skill list.
# The shared Keeper prompt also directs task-based selection without a user
# naming a Skill; bodies and relevant resources are still read on demand.
defer_loading = false

[[params]]
name = "identity"
type = "object"
required = true
additional_properties = false
description = "The Skill to read. `name` is one row of the Available list."

# source_id and package_id are optional. A Keeper's list holds a name once
# unless a Task pins another source or revision of it; the handler refuses a
# name it holds twice and prints the references to choose from.
#
# Both were required, and the Available list printed all three on every row.
# Of 56 refused calls (2026-11-21..27, 1,164 calls), 49 wrote an identity the
# Keeper did not carry. In 47 of those the name was in that Keeper's own list
# (its nearest stored request) and source_id or package_id differed; in 2 the
# name was not in it. 32 wrote the id of another configured source as the
# source_id, 18 wrote a source id as the package_id. None left a field out.
# No stored list of November (63 distinct) held a name twice, and every row
# had package_id = name.
#
# A field the call writes is still matched exactly and refused on a mismatch.
[[params.params]]
name = "source_id"
type = "string"
required = false
min_length = 1

[[params.params]]
name = "package_id"
type = "string"
required = false
min_length = 1

[[params.params]]
name = "name"
type = "string"
required = true
min_length = 1

# No length/pattern gate here: a caller that lacks the revision must reach
# the handler, whose refusal carries the exact references this keeper does
# carry. A schema-level gate answered those calls with a generic length
# error that could not name the catalog (task-828).
#
# Optional. Omitted, the turn's frozen Skill list decides
# which body is read — the same list a spelled-out revision is matched against,
# so leaving it out reaches nothing new. Spelled out, it is still matched
# exactly and refused on a mismatch: a revision the caller named is never
# quietly replaced.
#
# It was required because the call was meant to pin what it read. That pin also
# has to be typed, and the Available list never printed it: it reaches the
# caller in a Task's Skill reference, a keeper_capability_search result or
# this tool's refusal — of 292 tasks recorded on this workspace, 0 named a Skill,
# and 126 of those were made through masc_add_task, which has carried a skills
# parameter all along.
[[params]]
name = "content_revision"
type = "string"
required = false
description = "Optional canonical domain-separated SHA-256 content revision of the exact frozen SKILL.md bytes: 64 lowercase hex characters. Omit it to read whichever revision this turn's Skill list carries under that name; pass it to pin one, copied verbatim from the Task skill reference, a `keeper_capability_search` result or this tool's refusal. The Available list does not print it."

[[params]]
name = "file"
type = "string"
role = "path"
required = false
min_length = 1
description = "Optional bundled resource path relative to the Skill root, exactly as SKILL.md names it. Omit it to read the frozen Skill body."
