# MiniMax M3 (Ollama Cloud) — chat/runtime binding. No wire schema guarantee:
# the 2026-08-29 probe found ollama.com cloud ignores json_schema on /v1 and
# `format` on /api/chat alike, so structured output is a prompt+parser
# contract here, never a runtime capability claim.
# api-name originally verified 2026-06-18 against
# https://ollama.com/v1/chat/completions.
[models.minimax-m3]
reasoning-uncontrolled = true
api-name = "minimax-m3"
# The MiniMax-M3 model card recommends temperature 1.0. This host honours
# temperature, so without this line the keeper default 0.4 is sent.
temperature = 1.0
tools-support = true
thinking-support = true
streaming = true

[models.minimax-m3.capabilities]
max-output-tokens = 131072
thinking-control-format = "none"
# SSOT = agent-core models.toml. This binding reaches MiniMax over Ollama
# Cloud's OpenAI-compatible wire ([providers.ollama_cloud] points at
# https://ollama.com/v1), not MiniMax's own Chat API, and that wire documents
# response_format as supported and tool_choice as not
# (docs.ollama.com/api/openai-compatibility, checked 2026-09-21). A capability
# this binding has therefore comes from the wire as much as from the model, and
# models.toml carries a row per wire: a bare minimax-m3 row for MiniMax's own
# API and an ollama_cloud row for this one. That row declares structured output
# off as well — /v1 accepts json_schema but does not guarantee schema-shaped
# output, and strict schemas belong on the native /api/chat lane.
supports-image-input = true
supports-multimodal-inputs = true

[ollama_cloud.minimax-m3]

