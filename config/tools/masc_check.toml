name = "masc_check"
title = "Check Preconditions"
description = """
Assert task preconditions on your agent state (task claimed, current task \
set, etc). Call when you want to confirm prerequisites before starting work; \
returns pass/fail with fix hints."""
additional_properties = false

[[params]]
name = "assertions"
type = "array"
required = true
items = { type = "string", enum = ["task_claimed", "current_task_set"] }
description = """
List of task-state assertions to check. Each returns true/false with a fix \
hint if false."""
