name = "masc_plan_update"
description = """
Overwrite the current task plan with new content (markdown). Use when \
refining or replacing the execution plan for your current task. After \
masc_plan_init creates the structure; pair with masc_plan_get to review."""
additional_properties = false

[[params]]
name = "task_id"
type = "string"
required = true
description = "Task ID"

[[params]]
name = "content"
type = "string"
required = true
description = "New plan content (markdown)"
