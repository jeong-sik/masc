name: Closed PR CI Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: closed-pr-ci-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel-pr-ci:
    name: Cancel abandoned PR checks
    # A merged PR is not abandoned. Its required jobs must finish so the
    # merge-audit can read the verdict the merge actually carried. Cancelling
    # here erased Build and Test / CI Gate after #30755 merged early and made
    # the broken window harder to inspect. Closed-without-merge PRs still free
    # their runners immediately.
    if: ${{ github.event.pull_request.merged == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Cancel in-flight checks for the abandoned PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          for status in queued in_progress pending; do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --event pull_request \
              --branch "$PR_HEAD_REF" \
              --status "$status" \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.PR_HEAD_SHA) | .databaseId' |
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            done
          done
