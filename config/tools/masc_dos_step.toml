name = "masc_dos_step"
description = """
Let the DOS machine run, with no key pressed.

Time here is 8086 instructions, not frames — a DOS program has no frame \
clock. By default this stops as soon as the program asks for a key, which is \
the normal way to hand a turn back; set until_input=false to burn the whole \
budget. Returns the observation and steps_run. reached_input=false with the \
budget spent means it is still busy."""
additional_properties = false

defer_loading = true

[[params]]
name = "steps"
type = "integer"
description = "Instruction budget for this call. Default 1000000 (about 40 ms of emulation)."
minimum = 1
maximum = 4000000
default = 1000000

[[params]]
name = "until_input"
type = "boolean"
description = "Stop as soon as the program asks for a key. Default true."
default = true
