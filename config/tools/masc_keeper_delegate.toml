name = "masc_keeper_delegate"
description = """
Submit one typed Keeper chat operation and return its durable operation_id \
without waiting for the turn. A Keeper that submits one is woken with the \
answer when that turn ends: the reply lands in its own queue, carrying the \
text, so there is nothing to poll for. Use masc_keeper_delegate_status only \
to read the operation's state before then."""
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 5 turns needed it across 6317 provider requests, and its
# 691 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 5 turns and saves the 691 B on the rest.
defer_loading = true
[[params]]
name = "target"
type = "object"
required = true
additional_properties = false

[[params.params]]
name = "kind"
type = "string"
required = true
enum = ["keeper"]

[[params.params]]
name = "name"
type = "string"
required = true

[[params]]
name = "prompt"
type = "string"
required = true
