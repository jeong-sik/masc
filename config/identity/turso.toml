# Turso's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.turso.ai/.well-known/oauth-protected-resource,
# authorization server (https://api.turso.tech) offers S256 PKCE and dynamic
# client registration (HTTP 201).

id = "turso"
label = "Turso"
mcp_url = "https://mcp.turso.ai/mcp"

# Measured 2026-11-02: registration refuses a redirect URI on a public https
# host and accepts the RFC 8252 loopback form,
# http://127.0.0.1:<port>/api/v1/keepers/oauth/callback. With the loopback
# client the authorize step sends the browser on to sign-in, which is as far
# as a probe without consent goes. So a login here names the loopback
# callback, and the browser that consents has to reach this server on
# 127.0.0.1.
callback = "loopback"

access_token_env = "TURSO_ACCESS_TOKEN"
expires_at_env = "TURSO_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.turso/refresh_token"

renew_before_sec = 600
