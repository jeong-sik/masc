\* A counting slot, a typed slot and a bare 400 slot; two Memory versions. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Slots <- SlotsA
    Kind <- KindA
    Verdict <- VerdictA
    Declared0 <- SlotsA
    MaxVersion = 2
    MaxDecl = 2
    MaxPulse = 2
    MaxResume = 1
    MaxSkip = 1
    MaxQuiet = 1
    E4Lane = "judged"
    Bug = "none"
INVARIANT TypeOK
INVARIANT BottomOnlyWhenAllSized
INVARIANT NoCallOnFact
INVARIANT E4Exact
PROPERTY DescendsOnlyOnInput
PROPERTY UnsizedLaneStaysAbove
PROPERTY StaleVerdictNeverUsed
PROPERTY E4Ends
CHECK_DEADLOCK FALSE
