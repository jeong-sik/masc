name = "keeper_memory_search"
description = """
Search your durable Memory OS facts or conversation history. Current fact \
results preserve snapshot order and include exact memory_id, category, and \
observed or derived basis. Use returned memory_id values as premise_ids when \
writing a derived conclusion only when store='current_memory_snapshot'; other \
results name their different store explicitly. Default searches the durable \
fact store. Use source='absorbed' for facts a librarian merged into a newer \
claim. Results are returned in merge order and include each original fact's \
basis. into names the newer claim's memory_id, and \
into_current=false means that claim is not current -- removed since, or never \
committed. Use source='history' for raw user messages, source='all' for every \
store."""
additional_properties = false

[[params]]
name = "query"
type = "string"
required = true
description = "keyword to search for"

[[params]]
name = "limit"
type = "integer"
description = """
max results (1-10, default 5). Must be a bare integer (e.g. 5); a quoted \
value is rejected."""

[[params]]
name = "source"
type = "string"
enum = ["memory", "absorbed", "history", "all"]
description = """
Search scope: memory (default, durable facts), absorbed (facts merged into a \
newer claim), history (raw messages), or all"""
