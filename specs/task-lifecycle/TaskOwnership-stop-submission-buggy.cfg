\* A stop request that only the operator may answer must be caught as a wait
\* with no other way out.

SPECIFICATION SpecBugStopSubmission

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    PendingNeverNeedsOperator

CHECK_DEADLOCK
    FALSE
