name = "masc_dos_save"
description = """
Save the whole DOS machine under a name, without advancing it.

Keeps CPU, memory, screen, open files, step count and key ledger; survives \
a server restart. Replaces the named slot. Needs no controller. Restore \
with masc_dos_restore. A game's own save menu is separate."""
additional_properties = false

defer_loading = true

[[params]]
name = "slot"
type = "string"
description = "1..64 letters, digits, _ or -. Default quick."
default = "quick"
