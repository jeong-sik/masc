name = "masc_operator_board_attention_quarantine_requeue"
title = "Requeue Board Quarantine"
description = """
Acknowledge and requeue exactly one Board-attention quarantine. The observed \
keeper, partition, candidate, and opaque quarantine id must all match; this \
tool never auto-retries."""
additional_properties = false

[[params]]
name = "keeper_name"
type = "string"
required = true
min_length = 1

[[params]]
name = "partition_id"
type = "string"
required = true
min_length = 1

[[params]]
name = "candidate_id"
type = "string"
required = true
min_length = 1

[[params]]
name = "expected_quarantine_id"
type = "string"
required = true
min_length = 1

[[params]]
name = "decision"
type = "string"
required = true
enum = ["acknowledge_and_requeue"]
