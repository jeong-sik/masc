name = "masc_agent_fitness"
description = """
Get fitness scores for agents based on completion rate, reliability, and speed metrics."""
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 2 turns needed it across 6317 provider requests, and its
# 424 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 2 turns and saves the 424 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
[[params]]
name = "agent_name"
type = "string"
description = """
Optional: Get fitness for specific agent. If omitted, returns all agents."""

[[params]]
name = "days"
type = "integer"
description = "Number of days to analyze (default: 7)"
default = 7
