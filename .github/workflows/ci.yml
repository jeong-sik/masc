name: CI

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-manual-${{ github.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changed Surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.scope.outputs.build }}
      lint: ${{ steps.scope.outputs.lint }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      health: ${{ steps.scope.outputs.health }}
      health_snapshot: ${{ steps.scope.outputs.health_snapshot }}
      lib_deps: ${{ steps.scope.outputs.lib_deps }}
      doc_truth: ${{ steps.scope.outputs.doc_truth }}
      tla: ${{ steps.scope.outputs.tla }}
      agent_core: ${{ steps.scope.outputs.agent_core }}
      spec_refs: ${{ steps.scope.outputs.spec_refs }}
      nav_event_parity: ${{ steps.scope.outputs.nav_event_parity }}
      shell_ir: ${{ steps.scope.outputs.shell_ir }}
      keeper_cwd: ${{ steps.scope.outputs.keeper_cwd }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect scope
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit_all_true() {
            for key in build lint dashboard health health_snapshot lib_deps doc_truth tla agent_core spec_refs nav_event_parity shell_ir keeper_cwd; do
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            done
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            emit_all_true
            echo "::notice::workflow_dispatch forces every CI surface to run"
            exit 0
          fi

          changed_file_list="$(mktemp)"
          base_ref=""
          head_ref="${GITHUB_SHA}"

          if [ -n "${GITHUB_BEFORE}" ] && [ "${GITHUB_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${GITHUB_BEFORE}"
          fi

          if [ -n "${base_ref}" ]; then
            git diff --name-only "${base_ref}" "${head_ref}" > "${changed_file_list}"
          else
            git ls-files > "${changed_file_list}"
          fi

          if [ ! -s "${changed_file_list}" ]; then
            git ls-files > "${changed_file_list}"
          fi

          echo "Changed files:"
          sed 's/^/  - /' "${changed_file_list}"

          has_match() {
            grep -Eq "$1" "${changed_file_list}"
          }

          ci_core=false
          build=false
          lint=false
          dashboard=false
          health=false
          health_snapshot=false
          lib_deps=false
          doc_truth=false
          tla=false
          agent_core=false
          spec_refs=false
          nav_event_parity=false
          shell_ir=false
          keeper_cwd=false

          # Local setup actions affect the compiler environment and still need
          # compile proof. Workflow YAML itself is checked by blocking lint;
          # compiling the entire OCaml tree cannot validate a YAML edit.
          if has_match '^\.github/actions/'; then
            ci_core=true
          fi

          # The build trigger must stay a SUPERSET of the dune build graph.
          # ci-gate treats a skipped required job as PASS (see check() near
          # line 1206), so any code-bearing PR that does NOT set build=true
          # merges with a green "CI Gate" while the Build job (dune compile)
          # never ran. The prefix list below (bin/ lib/ test/ proto/ config/)
          # missed build-graph dirs ppx/ ppx_tla/ test_lib/ tools/
          # and the root dune file, so a PR touching only those compiled
          # nowhere yet reported success. Match any OCaml/dune source plus C
          # foreign stubs by suffix so new source dirs are covered without
          # editing this list, and keep explicit prefixes for Dune-declared
          # non-source deps (e.g. tools/tlc_test_gen/test/fixtures/*.tla).
          # Over-triggering on dune-excluded dirs (dashboard_bonsai/ per the
          # root dune (dirs ...) stanza) is harmless: the Build job runs but
          # dune build skips those dirs.
          # scripts/harness/ stays a prefix match (not suffix): the Build and
          # Test job executes scripts/harness/contract/run_all.sh, so any
          # harness file — including non-.sh/.json ones and future extensions —
          # must force build=true. ci_core is intentionally NOT OR-ed here:
          # the ci_core block below already forces build=true.
          # scripts/fixtures/ is a prefix for the same reason (#25726 moved the
          # release-evidence fixtures out of heredocs into files): test/dune
          # declares (source_tree ../scripts/fixtures) and
          # test_runtime_config_validity.ml discovers scripts/fixtures/<name>/
          # runtime.toml, so a fixture edit changes test input while matching
          # none of the suffixes above (.toml is not .ml/.json/.sh) and the
          # Build job would skip.
          if has_match '^(bin/|lib/|test/|proto/|config/|tools/|scripts/harness/|scripts/fixtures/|scripts/keeper-full-lifecycle-evidence\.py$|scripts/ci/check_env_reads_below_config\.py$|dune-project$|dune-workspace$|.*\.opam$|.*\.ml$|.*\.mli$|.*\.mll$|.*\.mly$|.*\.c$|.*\.h$|.*\.json$|.*\.sh$|(.*/)?dune$)'; then
            build=true
          fi

          # The lint trigger set must stay a superset of every path the Lint
          # job reads. scripts/check-ssot.sh R6 scans bin/ lib/ scripts/ docs/,
          # so docs/ and scripts/ (whole tree, not just the curated entries)
          # must trigger Lint — otherwise a docs-only or scripts-only PR can
          # merge gate-skipped while pushing an R6 count past its baseline,
          # breaking Lint for every subsequent PR (#20729: RFC docs #20717 /
          # #20718 landed bare ~/.masc paths and took main's Lint red).
          # scripts/ subsumes the previously enumerated scripts/* entries.
          if has_match '^(bin/|lib/|test/|proto/|config/|docs/|scripts/|\.github/workflows/|dune-project$|dune-workspace$|.*\.opam$|dashboard/src/)'; then
            lint=true
          fi

          if has_match '^dashboard/'; then
            dashboard=true
          fi

          # SSE wire surface -> Dashboard coupling (#28925 audit, defect (a)).
          # A lib-only PR that changes an SSE payload shape used to skip the
          # Dashboard job entirely, so dashboard/src/schemas/sse.ts (a closed
          # event-type allowlist that silently drops unknown shapes) was never
          # exercised against the new wire — exactly the PR shape this gate
          # exists to catch. The list below is every file that constructs or
          # broadcasts a dashboard-wire SSE payload, derived by census:
          #   rg -ln 'Sse\.broadcast' lib bin           # direct hub callers
          #   rg -ln 'Mcp_server\.sse_broadcast' lib    # indirect via callback
          # plus the payload-shape owners lib/sse_event/ (atd SSOT),
          # lib/sse.ml (envelope/framing + bridge hook wiring), and the
          # payload-builder modules those callers delegate to
          # (keeper_event_bridge_error_json, dashboard_agent_core_bridge,
          # server_dashboard_http_core). Deliberately NOT lib/ wholesale:
          # the Dashboard job costs ~15min and most lib churn cannot move
          # the wire. Re-run the census above when adding a new emitter.
          if has_match '^(bin/main_eio\.ml$|lib/sse\.mli?$|lib/sse_jsonrpc_filter\.mli?$|lib/sse_event/|lib/progress\.ml$|lib/mcp_server\.ml$|lib/mcp_server_eio_call_tool\.ml$|lib/mcp_server_eio_protocol\.ml$|lib/mcp_tool_runtime_comm\.ml$|lib/mcp_tool_runtime_board\.ml$|lib/runtime/dashboard_agent_core_bridge\.ml$|lib/fusion/fusion_sink\.ml$|lib/server/(masc_grpc_service|server_bootstrap_loops|server_dashboard_http_core|server_dashboard_http_execution_surfaces|server_dashboard_http_keeper_api|server_dashboard_http_namespace_truth|server_ide_http|server_mcp_transport_ws|server_routes_http_routes_activity|server_routes_http_routes_dashboard|server_runtime_bootstrap)\.ml$|lib/keeper/(keeper_approval_queue|keeper_chat_broadcast|keeper_compact_policy|keeper_event_bridge|keeper_event_bridge_error_json|keeper_gate|keeper_heartbeat_loop_in_turn_pulse|keeper_heartbeat_snapshot|keeper_hooks_agent_core|keeper_registry|keeper_registry_broadcast|keeper_tool_composition_surface|keeper_tools_agent_core_handler_telemetry|keeper_unified_metrics_broadcast|keeper_waiting_inventory_broadcast)\.ml$)'; then
            dashboard=true
          fi

          if has_match '^(bin/|lib/|test/|proto/|config/|\.ci/health-baseline\.json$|dune-project$|.*\.opam$|scripts/health_snapshot\.sh$|scripts/anti-fake-audit\.sh$|scripts/base-policy-audit\.sh$)'; then
            health=true
          fi

          if has_match '^(bin/|lib/|test/|proto/|config/|\.ci/health-baseline\.json$|dune-project$|.*\.opam$|scripts/health_snapshot\.sh$|scripts/anti-fake-audit\.sh$|scripts/base-policy-audit\.sh$)'; then
            health_snapshot=true
          fi

          if has_match '^(\.github/workflows/ci\.yml|lib/|dune-project$|dune-workspace$|.*\.opam$|scripts/analyze_lib_deps\.py$|scripts/lib_dep_report\.py$|scripts/lib_dep_delta_ci\.sh$|scripts/audit-sublib-cycle\.py$)'; then
            lib_deps=true
          fi

          if has_match '^(docs/|README\.md$|ROADMAP\.md$|CHANGELOG\.md$|dune-project$|.*\.opam$|quickstart\.sh$|scripts/check-doc-truth\.sh$|scripts/check-version-truth\.sh$|scripts/quickstart-smoke\.sh$|scripts/release-binary-smoke\.sh$|scripts/release-evidence\.sh$|scripts/keeper-full-lifecycle-evidence\.py$|scripts/install\.sh$)'; then
            doc_truth=true
          fi

          if has_match '^(specs/.*\.(tla|cfg)$|specs/Makefile$|lib/keeper/|lib/keeper_registry/|Makefile$)'; then
            tla=true
          fi

          if has_match '^(\.github/workflows/ci\.yml$|packages/agent_core/|packages/(dune|dune-file|dune-project)$|lib/(.*/)?(dune|dune-file|[^/]+\.inc)$|lib/keeper/(keeper_event_bridge|keeper_execution_join|hitl_summary_worker|keeper_hooks_agent_core(_introspection)?|keeper_run_tools[^/]*)\.mli?$|scripts/(check-agent-core-boundary\.sh|audit-sublib-cycle\.py|ci-run-focused-tests\.sh)$|test/(dune|test_agent_core_boundary\.sh|test_keeper_execution_join\.ml|test_keeper_hooks_agent_core_introspection\.ml|test_hitl_summary_worker\.ml|stanzas/test_keeper_execution_join\.inc|stanzas/test_hitl_summary_worker\.inc)$|(dune|dune-file)$|dune-project$|dune-workspace$|.*\.opam$|masc\.opam\.locked$)'; then
            agent_core=true
          fi

          if has_match '^(specs/.*\.tla$|lib/.*\.mli?$|test/.*\.mli?$|src/.*\.mli?$|scripts/lint/spec-line-refs\.(sh|allowlist)$)'; then
            spec_refs=true
          fi

          if has_match '^(dashboard/src/config/navigation\.ts|dashboard/src/types/sse\.ts|lib/dashboard/dashboard_nav_event\.ml|scripts/check-dashboard-nav-event-parity\.sh)$'; then
            nav_event_parity=true
          fi

          if has_match '^(lib/|scripts/audit-shell-ir-consumption\.sh$|scripts/shell-ir-consumption-baseline\.json$|\.github/workflows/ci\.yml$)'; then
            shell_ir=true
          fi

          if has_match '^(lib/keeper/|scripts/keeper-cwd-leak-gate\.sh$|scripts/turn-path-provider-agnostic-gate\.sh$|\.github/workflows/ci\.yml$)'; then
            keeper_cwd=true
          fi


          # Agent Core owns non-source build inputs such as models.toml. Its
          # focused behavior suite and resolved graph must not be reported as
          # gate-skipped merely because the generic suffix classifier missed
          # one of those inputs.
          if [ "${agent_core}" = true ]; then
            build=true
          fi

          if [ "${ci_core}" = true ]; then
            # Local setup-action edits change the compiler environment and
            # therefore force compile proof. Workflow-only edits stay in the
            # blocking YAML/wiring lint lane instead of spending 15 minutes on
            # an OCaml graph that cannot validate YAML.
            build=true
            lint=true
            health=true
            health_snapshot=true
            lib_deps=true
            doc_truth=true
            agent_core=true
            shell_ir=true
            keeper_cwd=true
            # Note: dashboard/spec_refs/tla stay path-scoped. Pure CI
            # workflow/action edits should still validate the core OCaml/repo
            # guard lanes and Health, but they should not fan out into every
            # feature surface.
          fi


          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "lint=${lint}" >> "$GITHUB_OUTPUT"
          echo "dashboard=${dashboard}" >> "$GITHUB_OUTPUT"
          echo "health=${health}" >> "$GITHUB_OUTPUT"
          echo "health_snapshot=${health_snapshot}" >> "$GITHUB_OUTPUT"
          echo "lib_deps=${lib_deps}" >> "$GITHUB_OUTPUT"
          echo "doc_truth=${doc_truth}" >> "$GITHUB_OUTPUT"
          echo "tla=${tla}" >> "$GITHUB_OUTPUT"
          echo "agent_core=${agent_core}" >> "$GITHUB_OUTPUT"
          echo "spec_refs=${spec_refs}" >> "$GITHUB_OUTPUT"
          echo "nav_event_parity=${nav_event_parity}" >> "$GITHUB_OUTPUT"
          echo "shell_ir=${shell_ir}" >> "$GITHUB_OUTPUT"
          echo "keeper_cwd=${keeper_cwd}" >> "$GITHUB_OUTPUT"
          
          printf 'CI scope => build=%s lint=%s dashboard=%s health=%s health_snapshot=%s lib_deps=%s doc_truth=%s tla=%s agent_core=%s nav_event_parity=%s shell_ir=%s keeper_cwd=%s\n' \
            "${build}" "${lint}" "${dashboard}" "${health}" "${health_snapshot}" "${lib_deps}" "${doc_truth}" "${tla}" "${agent_core}" "${nav_event_parity}" "${shell_ir}" "${keeper_cwd}"

  meta:
    name: Meta Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # Repository-wide audits run only when full CI is requested manually.
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install meta shell dependencies
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq jq ripgrep

      - name: Check single OCaml compile authority
        run: bash scripts/ci/check-ocaml-compile-authority.sh

      - name: Run deploy preflight safety contract
        run: bash test/test_deploy_preflight.sh

      # Dashboard prompt keys must resolve to current prompt assets or registry
      # constants. Run this whenever either side of that contract changes.
      - name: Check dashboard prompt keys
        run: bash scripts/audit-dashboard-prompt-keys.sh

      # An odoc reference is not checked by the compiler, so a rename or a
      # deletion leaves {!foo} syntactically valid and silently wrong. One sweep
      # found nine: mcp_prompt_surface justified a concrete record with a
      # function that module does not have, server_mcp_transport_ws named an
      # absent read_inbound_message_frame three times as the reason ws_session
      # is exposed, and three files wrote {!Foo.ml}, which reads as a value
      # named ml inside Foo. Seconds, and the renaming PR sees it.
      - name: Check odoc references
        run: python3 scripts/audit-odoc-refs.py

      # Phase 4 of the TLA audit chain called for this wire-up and it never
      # landed, so the ratchet ran nowhere and its baseline drifted to 98
      # against a 47-file inventory — a floor no tree could meet (#27578).
      - name: Check TLA bug-model ratchet
        run: bash scripts/tla-bug-model-ratchet.sh

      # A route that authorizes against a tool name the catalog never registered
      # is closed to every credential, admin included, and the denial reads as a
      # role problem. POST /api/v1/prompts shipped that way with a working
      # dashboard editor in front of it (#29085).
      - name: Check route tool catalog registration
        run: bash scripts/audit-route-tool-catalog.sh

      # Repo-scanning audits that existed and never ran. scripts/ holds 182
      # scripts and ci.yml called 63 of them; these are the audit/check ones
      # that read only tracked files, so CI can run them as-is. The rest of
      # the unwired set either reads a live .masc runtime (credential and
      # fleet audits, meaningless on a runner), needs a tool the image lacks
      # (valgrind), or takes arguments a loop cannot pass, and stays out.
      #
      # Six more joined on 2026-08-28. Each exits non-zero on a violation and
      # each already passed on main, so nothing was blocking them — they were
      # simply never added here. Together they cost ~35s, most of it
      # audit-ocaml-spec-nav-line-refs (24s) and audit-code-smell (10s).
      # Its own step because it takes arguments, which the loop below cannot
      # pass. The walk used to descend into every worktree and never finish,
      # which is why an audit this specific sat unwired (#27386); at ~6s it is
      # cheaper than most steps here.
      - name: Run dead-surface ratchet
        run: python3 scripts/audit-dead-surface.py --exports --ratchet

      - name: Run repo audit scripts
        run: |
          # No `set -e`: every script runs and the failures are reported
          # together. Aborting on the first one hid the rest behind it and
          # skipped the twelve steps after this one, so a single stale string
          # cost a CI round per audit instead of one round for all of them.
          failed=()
          for s in \
            audit-unwired-audits.sh \
            verify-test-registration.py \
            audit-catchall.sh \
            audit-cross-module-exhaustive-match.sh \
            audit-path-ssot.sh \
            audit-tla-cfg-orphan.sh \
            audit-code-smell.sh \
            audit-ocaml-phase-count.sh \
            audit-ocaml-spec-nav-line-refs.sh \
            audit-tla-annotation-drift.sh \
            audit-tla-ml-line-refs.sh \
            audit-tla-phase-count.sh \
            check_silent_failure.sh \
            check-board-attention-exact-flow-boundary.sh \
            check-compaction-exact-flow-boundary.sh \
            check-keeper-turn-content-boundary.sh \
            check-opam-lock-covers-deps.sh \
            check-tool-error-format.sh \
            check-turn-records-envelope-parity.sh \
            check-variants.sh
          do
            echo "::group::$s"
            case "$s" in
              *.py) python3 "scripts/$s" || failed+=("$s") ;;
              *)    bash "scripts/$s" || failed+=("$s") ;;
            esac
            echo "::endgroup::"
          done
          if ((${#failed[@]} > 0)); then
            printf 'repo audit scripts failed: %s\n' "${failed[*]}" >&2
            exit 1
          fi

      - name: Check doc truth
        if: needs.changes.outputs.doc_truth == 'true'
        run: |
          chmod +x scripts/check-doc-truth.sh scripts/audit-keeper-tool-boundary-matrix.sh
          scripts/check-doc-truth.sh
          scripts/audit-keeper-tool-boundary-matrix.sh

      - name: Run report self-test
        if: needs.changes.outputs.lib_deps == 'true'
        run: python3 scripts/lib_dep_report.py --self-test

      - name: Check Execute async surface contract
        run: bash scripts/check-execute-async-surface.sh

      - name: Sublib boundary gate self-test (RFC-0056 G1)
        if: needs.changes.outputs.lib_deps == 'true'
        run: python3 scripts/audit-sublib-cycle.py --self-test

      - name: Generate lib dependency delta
        if: needs.changes.outputs.lib_deps == 'true'
        run: bash scripts/lib_dep_delta_ci.sh

      - name: Upload lib dependency reports
        if: needs.changes.outputs.lib_deps == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lib-dependency-delta
          path: |
            reports/lib-dependency-graph.json
            reports/lib-dependency-graph.baseline.json
            reports/lib-dependency-summary.md
            reports/lib-dependency-summary.json

      - name: Validate spec line refs
        if: needs.changes.outputs.spec_refs == 'true'
        run: bash scripts/lint/spec-line-refs.sh

      - name: Check dashboard nav-event allowlist parity
        if: needs.changes.outputs.nav_event_parity == 'true'
        run: |
          chmod +x scripts/check-dashboard-nav-event-parity.sh
          scripts/check-dashboard-nav-event-parity.sh --check

      - name: Check sandbox dune version alignment
        run: |
          chmod +x scripts/check-sandbox-dune-version.sh
          scripts/check-sandbox-dune-version.sh

      - name: Check agent core ownership boundary
        run: |
          bash scripts/check-agent-core-boundary.sh
          bash test/test_agent_core_boundary.sh

      - name: Meta bug-class gates (SSOT, SIL, STR, BND)
        run: |
          chmod +x scripts/ci/*.sh
          echo "=== Running meta bug-class gates (see #9516 #9517 #9519 #9521) ==="
          bash scripts/ci/check-ssot-spawn-drift.sh
          bash scripts/check-spec-truth.sh
          python3 scripts/ci/check-spec-file-refs.py
          bash scripts/ci/check-silent-failure-patterns.sh
          python3 scripts/ci/check_h2_route_auth_parity.py
          python3 scripts/ci/check_exact_field_decoder_preflight.py
          python3 scripts/ci/check_env_reads_below_config.py --self-test
          python3 scripts/ci/check_model_prefix_inheritance.py
          bash scripts/ci/check-enum-string-safety.sh
          python3 scripts/ci/check-env-snapshot-default-drift.py
          bash scripts/ci/check-publication-recovery-test-boundary.sh
          bash scripts/ci/check-tla-variant-sync.sh
          bash scripts/ci/check-tla-harness-coverage.sh
          bash scripts/ci/check-telemetry-coverage.sh
          bash scripts/ci/check-determinism-contract.sh
          bash scripts/ci/check-tui-render-purity.sh
          bash scripts/audit-hardcoding-truth.sh --fail-on-confirmed
          bash scripts/ci/check-credential-audits.sh
          bash scripts/ci/check-keeper-instructions-placeholders.sh
          bash scripts/ci/check-accept-fd-lifecycle.sh
          bash scripts/ci/check-actor-consumer-wired.sh
          bash scripts/ci/check-log-severity-anti-patterns.sh
          bash scripts/ci/check-stream-create-bounded.sh
          bash scripts/ci/check-drain-loop-yields.sh

      - name: Hardening ratchet (P0 evidence gate)
        run: |
          mkdir -p reports
          bash scripts/hardening-ratchet.sh \
            --check \
            --fail-on-critical \
            --json-out reports/hardening-ratchet.json

      - name: Upload hardening ratchet report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardening-ratchet
          path: reports/hardening-ratchet.json

  health:
    name: Health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.health == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install health shell dependencies
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq ripgrep bc

      - name: Fetch baseline for health ratchet
        if: needs.changes.outputs.health_snapshot == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_BEFORE}" ] && [ "${GITHUB_BEFORE}" != "${zero_sha}" ]; then
            bash scripts/ci/git-fetch-retry.sh origin "${GITHUB_BEFORE}" --depth=1
          else
            echo "No health baseline ref for ${GITHUB_EVENT_NAME}; snapshot will run without ratchet gating"
          fi

      - name: Run health snapshot
        if: needs.changes.outputs.health_snapshot == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          chmod +x scripts/health_snapshot.sh scripts/anti-fake-audit.sh scripts/base-policy-audit.sh
          zero_sha="0000000000000000000000000000000000000000"
          baseline_ref=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_BEFORE}" ] && [ "${GITHUB_BEFORE}" != "${zero_sha}" ]; then
            baseline_ref="${GITHUB_BEFORE}"
          fi

          if [ -n "${baseline_ref}" ]; then
            bash scripts/health_snapshot.sh \
              --skip-build \
              --json-out .health/health-snapshot.json \
              --baseline-ref "${baseline_ref}" \
              --fail-on-lib-regression
          else
            bash scripts/health_snapshot.sh \
              --skip-build \
              --json-out .health/health-snapshot.json \
              --baseline-file .ci/health-baseline.json
          fi

      - name: Upload health snapshot
        if: needs.changes.outputs.health_snapshot == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: health-snapshot
          path: .health/health-snapshot.json

  build:
    name: Full validation
    runs-on: ubuntu-latest
    # Focused group deadlines total 93 minutes when agent-core is selected
    # (paused-work 10, board-attention-worker 3, normal 20, newly-wired 5,
    # mcp-tool-matrix 15, agent-core 15, operator-control 10, sse 15).
    # Setup and the dune build take 12 minutes (run 32634585750: 10:45:48 to
    # 10:57:15), so a run where every group uses its full budget ends at
    # 105 minutes. The job timeout sits above that so scripts/ci-run-tests.sh
    # prints its timeout diagnostics before GitHub ends the job.
    # Build and full validation belong to the manual lane. PR authors and
    # agents provide their focused exact-head evidence before opening the PR;
    # repeating a cold 15-minute toolchain build on every synchronization cost
    # more runner time than the failures it prevented.
    timeout-minutes: 110
    needs: [changes]
    # Manual dispatch runs full validation so a
    # lib/ regression introduced by a non-build-path change (e.g. a dashboard-only
    # merge) is detected on the next timer run instead of persisting silently
    # behind a green "CI Gate" — ci-gate check() treats a skipped required job as
    # PASS. Tag pushes do not start this workflow because `on.push.branches`
    # excludes tags. PR events keep the build-scope gate (cost saving)
    # unchanged. The `needs.changes.result == 'success'` clause is intentional:
    # Build consumes `changes` outputs, so a failed/skipped changes job should
    # not synthesize default build inputs even though `always()` keeps this
    # condition evaluable.
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' }}
    # Test execution policy (hard-required focused suites):
    #   - `continue-on-error` is intentionally absent: compile failures and
    #     every focused test suite are merge-blocking.
    #   - Each suite runs exactly once. scripts/ci-run-tests.sh reports
    #     heartbeat, disk pressure, process state, and failure diagnostics.
    #   - Focused groups have explicit fail-closed deadlines; this job timeout
    #     is the final safety boundary for setup, compilation, and all suites.
    steps:
      - name: Free disk space
        # ubuntu-latest starts with roughly 14 GB free but preinstalls the
        # Android SDK (~9 GB), .NET (~1.6 GB), GHC/Haskell (~1 GB) and the
        # CodeQL bundle (~5 GB) that this OCaml build never uses. Removing them
        # reclaims about 15 GB and prevents the recurring "No space left on
        # device" failures in this job (heavy dune build, _build artifacts and
        # test runners exceed the default free space; runs 28638901622 /
        # 28644587505 / 28652695346 all died this way on 2026-07-03). This is a
        # preventive measure that complements the non-retryable repair guidance
        # emitted by scripts/ci-run-tests.sh. Alternative considered and
        # rejected for cost: a paid larger runner.
        # See: https://github.com/jeong-sik/masc/issues/22954
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-bisect

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep

      - name: Install grpcurl
        env:
          GRPCURL_VERSION: "1.9.3"
          GRPCURL_SHA256: "a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5"
        run: |
          set -euo pipefail

          asset="grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          url="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/${asset}"
          archive="${RUNNER_TEMP}/${asset}"
          bin_dir="${RUNNER_TEMP}/grpcurl-bin"

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors "${url}" -o "${archive}"
          (cd "${RUNNER_TEMP}" && printf '%s  %s\n' "${GRPCURL_SHA256}" "${asset}" | sha256sum -c -)

          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" grpcurl
          chmod +x "${bin_dir}/grpcurl"
          echo "${bin_dir}" >> "$GITHUB_PATH"
          "${bin_dir}/grpcurl" -version

      - name: Build
        id: build_step
        env:
          # Public ubuntu-latest runners provide four CPUs and 16 GB RAM. Use
          # all four for the compile-only graph; focused behavior suites below
          # remain serial because some own fixed ports and shared fixtures.
          # Disk pressure is handled by the cleanup step before checkout.
          DUNE_JOBS: "4"
        # NO continue-on-error: dune build is deterministic and must hard-fail.
        # Focused test execution steps below are also required: any failing
        # suite fails the Build and Test job and blocks merge via the CI Gate.
        # See: PR #11721 followup, memory feedback_admin_merge_can_bypass_build_ci.md.
        run: |
          set -euo pipefail

          # @default alone does not compile test dirs outside the executed
          # runtest subset, so a PR that breaks test compilation can land
          # green (#23196/#23211/#23353 landed that way on 2026-07-04~06).
          # @check compiles every library/executable/test without running.
          # @install adds the public package/install surface that Lint used to
          # compile independently. The root dune env is the warning-as-error
          # SSOT, so this one cacheable rule graph is authoritative for all
          # three surfaces.
          opam exec -- dune build --root . @default @check @install &
          build_pid=$!

          (
            elapsed=0
            while kill -0 "${build_pid}" 2>/dev/null; do
              sleep 60
              elapsed=$((elapsed + 60))
              if kill -0 "${build_pid}" 2>/dev/null; then
                echo "[ci-heartbeat] dune build still running (${elapsed}s elapsed)"
              fi
            done
          ) &
          heartbeat_pid=$!

          set +e
          wait "${build_pid}"
          build_status=$?
          set -e

          kill "${heartbeat_pid}" 2>/dev/null || true
          wait "${heartbeat_pid}" 2>/dev/null || true
          exit "${build_status}"

      # GitHub evicts repository caches LRU above 10 GB, so an untrimmed dune
      # cache would push out the opam and pnpm entries that make the other
      # jobs fast. Bounded before the post-job save, and never fatal: a
      # failure here costs cache size, not the build result.
      - name: Check direct environment reads against config floor
        # The checker derives the dependency floor from `dune describe`, so it
        # belongs in the sole job that installs the OCaml/Dune toolchain. Run
        # Python under `opam exec` because bare `dune` is not on PATH in CI.
        run: opam exec -- python3 scripts/ci/check_env_reads_below_config.py

      - name: Run source quickstart onboarding smoke
        run: scripts/quickstart-smoke.sh

      - name: Run typed functional-core boundary audit
        env:
          OCAML_BOUNDARY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'origin/main' || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            bash scripts/ci/git-fetch-retry.sh \
              origin \
              "+refs/heads/main:refs/remotes/origin/main"
          fi
          opam exec -- dune build --root . @tools/ocaml_boundary_audit/runtest
          bash scripts/ocaml-boundary-ratchet.sh

      - name: Run runtime deployment preflight self-test
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        env:
          MASC_DEPLOYMENT_PREFLIGHT_HELPER: ${{ github.workspace }}/_build/default/bin/deployment_preflight_helper.exe
        run: scripts/check-runtime-deployment-preflight.sh --self-test

      - name: Check keeper event queue projection boundary
        # This parser uses compiler-libs directly, so keep it beside the sole
        # OCaml toolchain instead of bootstrapping another toolchain in Lint.
        run: |
          chmod +x scripts/check-keeper-event-queue-projection-boundary.sh
          scripts/check-keeper-event-queue-projection-boundary.sh

      - name: Library boundaries against resolved Dune graphs
        # The self-test (in the Meta Guards job) only validates the checker
        # against synthetic fixtures. This step runs the SAME checker against
        # the REAL dependency graph emitted by `dune describe`, asserting that
        # the extracted leaf libraries (masc_goal, attribution, exec_policy,
        # keeper_state, masc_tool_dispatch) never re-acquire a transitive
        # `requires` edge back into the flat mega-library `masc`.
        #
        # Hard-fail (no continue-on-error): a future PR that re-couples a leaf
        # to the mega-lib via its dune (libraries ...) must block merge. As of
        # wiring (2026-06-04) the real graph is CLEAN, so --fail mode is safe.
        #
        # Why here and not next to the self-test (Meta Guards, ~L385): that job
        # is shell-only (ripgrep, no OCaml toolchain). `dune describe` requires
        # the toolchain that only this Build job sets up. We invoke dune through
        # `opam exec` (bare `dune` is not on PATH in CI) and feed the captured
        # describe sexp to the pure-python checker via --describe-file.
        # See: docs/rfc/RFC-0056-incremental-sublib-extraction.md G1, #19824.
        run: |
          opam exec -- dune describe workspace \
            --root . --format sexp --lang 0.1 \
            > "$RUNNER_TEMP/sublib-describe.sexp"
          python3 scripts/audit-sublib-cycle.py \
            --describe-file "$RUNNER_TEMP/sublib-describe.sexp"

          # Restrict Dune's project roots to Agent Core, then inspect the
          # resolved dependency closure. Installed dependencies are explicit
          # `local false` nodes; any `local true` library owned elsewhere in
          # the workspace is a reverse MASC dependency. --with-pps also places
          # compile-time PPX libraries in this restricted closure.
          opam exec -- dune describe workspace packages/agent_core \
            --root . --format sexp --lang 0.1 --with-pps \
            > "$RUNNER_TEMP/agent-core-describe.sexp"
          python3 scripts/audit-sublib-cycle.py \
            --describe-file "$RUNNER_TEMP/agent-core-describe.sexp" \
            --closed-source-root packages/agent_core \
            --required-local-library masc.agent_core

          # Every file below packages/agent_core already triggers this Build
          # proof. A Dune include could move a library stanza to an arbitrary
          # file outside that classifier, so use Dune's own parser/formatter
          # and keep the package plus active ancestor Dune files include-free.
          # Introducing the first include necessarily changes a classified
          # dune file, so this check closes the input set inductively.
          for control_file in packages dune-project dune-workspace packages/dune-project; do
            if [[ -L "$control_file" ]]; then
              echo "agent-core boundary: symlinked control input is forbidden: $control_file" >&2
              exit 1
            fi
          done
          while IFS= read -r dune_file; do
            if [[ -L "$dune_file" ]]; then
              echo "agent-core boundary: symlinked Dune input is forbidden: $dune_file" >&2
              exit 1
            fi
            if [[ "$(head -c 20 "$dune_file")" == '(* -*- tuareg -*- *)' ]]; then
              echo "agent-core boundary: OCaml-syntax Dune file is forbidden: $dune_file" >&2
              exit 1
            fi
            formatted="$RUNNER_TEMP/agent-core-formatted.dune"
            opam exec -- dune format-dune-file "$dune_file" > "$formatted"
            if rg -n '^[[:space:]]*\((dynamic_)?include([[:space:]]|$)' "$formatted"; then
              echo "agent-core boundary: Dune include stanza is forbidden: $dune_file" >&2
              exit 1
            fi
          done < <(
            {
              find packages/agent_core -type f \
                \( -name dune -o -name dune-file \) -print
              printf '%s\n' dune
              [[ ! -f packages/dune && ! -L packages/dune ]] \
                || printf '%s\n' packages/dune
              [[ ! -f dune-file && ! -L dune-file ]] \
                || printf '%s\n' dune-file
              [[ ! -f packages/dune-file && ! -L packages/dune-file ]] \
                || printf '%s\n' packages/dune-file
            } | LC_ALL=C sort -u
          )

      - name: Run workspace backlog revision ratchet
        # The backlog revision is stamped once at the commit point; this suite
        # pins exactly-one bump per commit (a surviving manual bump surfaces as
        # +2) and the decoder's absent-vs-corrupt split. An unwired ratchet does
        # not bite, so it runs here.
        # Runs the "revision" suite only: the rest of the coverage file
        # carries two latent reds on main (verdict-commit audit gap,
        # #26445) that predate this PR. Alcotest exits non-zero when
        # the name matches no suite, so a suite rename cannot silently
        # unwire this step.
        # claim_next is wired for the same reason: the single-claim refusal
        # carries its own correction hint (masc_transition action=release),
        # which keeper.md no longer restates. An unrun assertion would let
        # that hint rot back out of the message.
        run: |
          opam exec -- dune exec --root . test/test_workspace_coverage.exe -- test revision
          opam exec -- dune exec --root . test/test_workspace_coverage.exe -- test claim_next

      - name: SSE TypeScript codegen drift gate
        # RFC-0004 Phase A0.2 PR-2: dashboard/src/schemas/sse_event_generated.ts
        # is regenerated by atdts from lib/sse_event/sse_event.atd
        # (lib SSOT established in Phase A0.1).  If the .atd changes
        # without re-running the codegen script, the committed .ts
        # drifts and dashboard consumers parse against a stale schema.
        # See: dashboard/scripts/gen-sse-types.sh, RFC-0004 Phase A0.2.
        run: |
          chmod +x dashboard/scripts/gen-sse-types.sh
          opam exec -- dashboard/scripts/gen-sse-types.sh --check

      # Compile-only @check above and this runner form one authority: the
      # runner asks Dune for @test/runtest, which is every test stanza in
      # test/ that is not turned off by its own enabled_if, and compares what
      # fails against test/ci-known-failures.txt.
      #
      # It replaced 26 steps that named 894 aliases by hand plus a 1,000-line
      # script that named them again. A suite absent from those lists was not
      # run and nothing reported it: six suites rotted behind hard cuts that
      # way and were found in #29880, #29883 and #29887 only because someone
      # went looking for them. The default here is to run.
      - name: Run the OCaml test suite
        id: ocaml_test_suite
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        run: scripts/ci-run-test-suite.sh

      # The step prints the failed assertions; this keeps everything around
      # them. Without it the full output lived only in RUNNER_TEMP and went
      # with the runner, so a red suite could not be diagnosed after the fact
      # (#30117).
      - name: Upload the test suite log
        if: ${{ always() && steps.ocaml_test_suite.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-log
          path: ${{ runner.temp }}/test-suite.log
          if-no-files-found: warn

      - name: Run transport harness suite
        id: transport_harness_suite
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        env:
          ME_ROOT: /tmp/me
          CI_TEST_HEARTBEAT_SEC: 15
          DUNE_JOBS: 1
        run: |
          mkdir -p /tmp/me
          chmod +x scripts/ci-run-tests.sh
          chmod +x scripts/harness/transport/run_all.sh
          chmod +x scripts/harness/transport/verify_sse.sh
          chmod +x scripts/harness/transport/verify_grpc_subscribe.sh
          chmod +x scripts/harness/transport/verify_h2c_autodetect.sh
          chmod +x scripts/harness/transport/verify_ws.sh
          chmod +x scripts/harness/lib/server_bootstrap.sh
          scripts/ci-run-tests.sh "bash scripts/harness/transport/run_all.sh"

      - name: Run contract harness suite
        id: contract_harness_suite
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        env:
          ME_ROOT: /tmp/me
          CI_TEST_HEARTBEAT_SEC: 15
          DUNE_JOBS: 1
        run: |
          mkdir -p /tmp/me
          chmod +x scripts/ci-run-tests.sh
          chmod +x scripts/harness/contract/run_all.sh
          chmod +x scripts/harness/lib/server_bootstrap.sh
          scripts/ci-run-tests.sh "scripts/harness/contract/run_all.sh"

      - name: Generate main release evidence bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x scripts/release-evidence.sh
          mkdir -p .release-evidence
          scripts/release-evidence.sh \
            _build/default/bin/main_eio.exe \
            .release-evidence/main-release-evidence.md

      - name: Generate trusted-dispatch release evidence bundle
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.ref_protected == true
        run: |
          chmod +x scripts/release-evidence.sh
          mkdir -p .release-evidence
          scripts/release-evidence.sh \
            _build/default/bin/main_eio.exe \
            .release-evidence/trusted-dispatch-release-evidence.md

      - name: Verify Keeper full-lifecycle evidence bundle
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            github.ref_protected == true
          )
        run: |
          python3 scripts/keeper-full-lifecycle-evidence.py \
            --verify \
            --output-dir .release-evidence/keeper-full-lifecycle

      - name: Upload main release evidence
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build_step.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-main
          path: .release-evidence/
          include-hidden-files: true

      - name: Upload trusted-dispatch release evidence
        if: >-
          ${{
            always() &&
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            github.ref_protected == true &&
            steps.build_step.outcome == 'success'
          }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-evidence/
          include-hidden-files: true

      - name: Config diagnostic drift report
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -f _build/default/bin/main_eio.exe ]; then
            echo "::group::Config diagnostic report"
            _build/default/bin/main_eio.exe diagnostic config --json || true
            echo "::endgroup::"
          else
            echo "::notice::main_eio.exe not found, skipping config-diagnostic"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Source ratchets and proto drift are shell/Python-only after the product
    # compile authority moved to Build and Test.
    timeout-minutes: 20
    needs: [changes]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.lint == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install lint dependencies
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq jq ripgrep protobuf-compiler
          python -m pip install --quiet --upgrade pip pyyaml

      - name: Run consolidated blocking lints
        run: bash scripts/ci/run-lint-suite.sh blocking "${{ github.event.before }}"

      - name: Run #8605 family detector
        run: bash scripts/lint/no-unknown-permissive-default.sh

      - name: Run yojson option-field [@default None] lint
        run: python3 scripts/lint/yojson-option-default.py

      - name: Run OCaml docstring bare escape-quote lint
        run: bash scripts/lint/no-docstring-escape-quote.sh

      - name: Run dashboard hardcoded-color lint
        run: bash scripts/lint/no-hardcoded-colors-dashboard.sh

      - name: Run dashboard keeper-state SSOT lint (RFC-0135 §9)
        run: bash scripts/lint/dashboard-ssot-keeper-state.sh

      - name: Run dashboard agent-status SSOT lint (RFC-0139 §10)
        run: bash scripts/lint/dashboard-ssot-agent-status.sh

      - name: Check Eio conventions
        run: |
          chmod +x scripts/check-eio-conventions.sh
          scripts/check-eio-conventions.sh

      - name: Check feature flag consistency
        run: |
          chmod +x scripts/check-feature-flag-consistency.sh
          scripts/check-feature-flag-consistency.sh

      - name: Check Keeper runtime setting registry
        run: |
          chmod +x scripts/check-keeper-runtime-setting-registry.sh
          scripts/check-keeper-runtime-setting-registry.sh

      - name: Check TOML syntax
        run: |
          chmod +x scripts/check-toml-syntax.sh
          scripts/check-toml-syntax.sh

      - name: Check Ollama capability drift (RFC-0265)
        # Compares config/runtime.toml declared media caps against the committed
        # /api/show baseline (scripts/ollama-caps-baseline.json). No network:
        # refresh the baseline with --refresh (operator) when Ollama changes a model.
        run: python3 scripts/masc-sync-ollama-caps.py --check

      - name: Check YAML syntax
        run: python3 scripts/ci/check-yaml-syntax.py

      - name: Check keeper prompt paths drift (#6527 iter9)
        run: |
          chmod +x scripts/validate-prompt-paths.sh
          scripts/validate-prompt-paths.sh

      - name: Check Agent core boundary
        run: |
          chmod +x scripts/check-boundary-guard.sh
          scripts/check-boundary-guard.sh

      - name: Check boundary-guard .mli pairing (sweep-miss gate)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          chmod +x scripts/check-boundary-guard-mli-pairs.sh
          scripts/check-boundary-guard-mli-pairs.sh

      - name: Check SSOT bypass ratchet (#8462)
        run: |
          chmod +x scripts/check-ssot.sh
          scripts/check-ssot.sh

      - name: Check gRPC proto descriptor drift
        run: |
          chmod +x scripts/gen-grpc-descriptors.sh
          scripts/gen-grpc-descriptors.sh --check

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # Dashboard validation runs only when full CI is dispatched. It ignores
    # path scope and always runs, so a dashboard regression
    # introduced by a non-dashboard-path change (e.g. a shared-type refactor,
    # or a dashboard-touching PR merged via admin fast-track while
    # the dashboard job was red) is detectable in a requested full run
    # rather than persisting silently. Root cause:
    # keeper-fsm-specs.test.ts / keeper-composite.test.ts sat red on main
    # after #14252/#14380 because no main-push run re-checked them.
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The gate counts with ripgrep, and its counts swallowed a missing binary
      # as zero, so this job passed on a runner without rg while real drift sat
      # in the tree (#27965). The script now refuses to run without it; install
      # it so the refusal never triggers here.
      - name: Install ripgrep
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq ripgrep

      - name: Run drift gate
        run: scripts/dashboard-drift-check.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack and install pnpm
        run: corepack enable && corepack prepare pnpm@10.31.0 --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        working-directory: dashboard
        run: pnpm run typecheck

      # Nothing ran pnpm lint before this, which is how three
      # no-nested-ternary errors reached main and stayed there (#29054).
      - name: ESLint
        working-directory: dashboard
        run: pnpm lint

      - name: Run dashboard tests
        working-directory: dashboard
        run: pnpm test

      - name: Install Playwright Chromium
        working-directory: dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Keeper queued-stream Playwright E2E
        id: keeper_queued_stream_e2e
        working-directory: dashboard
        env:
          KEEPER_QUEUED_STREAM_ARTIFACT_DIR: ${{ runner.temp }}/keeper-queued-stream
        run: pnpm test:e2e:queued-stream

      - name: Upload Keeper queued-stream screenshots
        if: ${{ always() && !cancelled() && steps.keeper_queued_stream_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: keeper-queued-stream-screenshots
          path: ${{ runner.temp }}/keeper-queued-stream/*.png
          if-no-files-found: warn

      - name: Run Keeper lane-timeline Playwright E2E
        id: keeper_lane_timeline_e2e
        working-directory: dashboard
        env:
          KEEPER_LANE_TIMELINE_ARTIFACT_DIR: ${{ runner.temp }}/keeper-lane-timeline
        run: pnpm test:e2e:keeper-lane

      - name: Upload Keeper lane-timeline screenshots
        if: ${{ always() && !cancelled() && steps.keeper_lane_timeline_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: keeper-lane-timeline-screenshots
          path: ${{ runner.temp }}/keeper-lane-timeline/*.png
          if-no-files-found: warn

  structure-ratchet:
    name: OCaml Structure Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.keeper_cwd == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep
        run: sudo apt-get install -y -qq ripgrep

      - name: Run OCaml structure ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/ocaml-structure-ratchet.sh

      - name: Run stringly boundary ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/stringly-boundary-ratchet.sh

      - name: Run model-prose scanner self-test
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: python3 scripts/model-prose-scan.py --self-test

      - name: Run model-prose ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/model-prose-ratchet.sh

      - name: Run exact-flow boundary checks
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true' || needs.changes.outputs.dashboard == 'true'
        run: |
          scripts/check-hitl-exact-flow-boundary.sh --self-test
          scripts/check-hitl-exact-flow-boundary.sh --check

      - name: Run keeper tool boundary matrix ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/audit-keeper-tool-boundary-matrix.sh

      - name: Run silent-failure ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/silent-failure-ratchet.sh

      - name: Run checkpoint installation legacy purge ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/check-checkpoint-installation-legacy-purge.sh

      - name: Run keeper cwd leak gate
        if: needs.changes.outputs.keeper_cwd == 'true'
        run: scripts/keeper-cwd-leak-gate.sh

      # Self-test first: a gate that cannot fail would pass silently forever.
      - name: Run turn-path provider-agnostic gate self-test
        if: needs.changes.outputs.keeper_cwd == 'true'
        run: scripts/turn-path-provider-agnostic-gate.sh --self-test

      - name: Run turn-path provider-agnostic gate
        if: needs.changes.outputs.keeper_cwd == 'true'
        run: scripts/turn-path-provider-agnostic-gate.sh

  shell-ir-ratchet:
    name: Shell IR Consumption Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.shell_ir == 'true' || needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep and jq
        run: |
          sudo apt-get install -y -qq ripgrep
          sudo apt-get install -y -qq jq

      - name: Run Shell IR consumption ratchet
        run: scripts/audit-shell-ir-consumption.sh --baseline scripts/shell-ir-consumption-baseline.json

  ci-gate:
    # Named for the one required check in main's branch protection. A second
    # job used to carry that name and do nothing but copy this job's result:
    # it existed to merge two authorities, and #29458 removed the other one
    # (the Keeper real-world lane) without collapsing the wrapper. Every run
    # then spent a runner restating a verdict, and every failure was reported
    # twice.
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, meta, build, lint, dashboard, health, structure-ratchet, shell-ir-ratchet]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Aggregate required check status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          META_RESULT: ${{ needs.meta.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          HEALTH_RESULT: ${{ needs.health.result }}
          STRUCTURE_RATCHET_RESULT: ${{ needs.structure-ratchet.result }}
          SHELL_IR_RATCHET_RESULT: ${{ needs.shell-ir-ratchet.result }}
        run: |
          set -euo pipefail
          fail=0
          # mode=required (default): fail → block merge
          # mode=advisory: fail → log a WARN line, do not block
          #
          # Product tests, transport/contract harnesses, lifecycle evidence,
          # ratchets, Dashboard, and TLA run only when explicitly dispatched.
          # A cancelled job did not fail — it did not run. Both block, because
          # a check that never ran cannot be evidence of anything, but they are
          # printed apart: over the last 20 CI runs the job conclusions were 110
          # success, 45 cancelled and 4 failure, so "FAIL dashboard cancelled"
          # was the line a reader met eleven times more often than a real
          # failure, and it sends them looking for a defect in the diff.
          check() {
            local name=$1
            local result=$2
            local mode=${3:-required}
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              printf 'PASS  %-20s %s\n' "$name" "$result"
            elif [[ "$mode" == "advisory" ]]; then
              printf 'WARN  %-20s %s (advisory, not blocking)\n' "$name" "$result"
            elif [[ "$result" == "cancelled" ]]; then
              printf 'STOP  %-20s cancelled — never ran, re-run to decide\n' "$name"
              fail=1
            else
              printf 'FAIL  %-20s %s\n' "$name" "$result"
              fail=1
            fi
          }
          check "changes"         "$CHANGES_RESULT"
          check "meta"            "$META_RESULT"
          check "build"           "$BUILD_RESULT"
          check "lint"            "$LINT_RESULT"
          check "dashboard"       "$DASHBOARD_RESULT"
          check "health"          "$HEALTH_RESULT"
          check "structure-ratchet" "$STRUCTURE_RATCHET_RESULT"
          check "shell-ir-ratchet" "$SHELL_IR_RATCHET_RESULT"
          [ "$fail" -eq 0 ]
