\* Buggy model: the carrier hook may switch a run back to inline, so a run
\* can trade one refused form for the other forever.
\* Expected: RunEnds VIOLATED (liveness).
SPECIFICATION SpecSwitchBack

CONSTANTS
    Window       = 100
    FixedSizes   = {40, 98}
    ReceiptBytes = 10
    AddressBytes = 15
    MaxReceipts  = 8
    HistoryBytes = 64

INVARIANTS
    TypeOK

PROPERTIES
    RunEnds

CHECK_DEADLOCK FALSE
