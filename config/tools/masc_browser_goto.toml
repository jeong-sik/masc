name = "masc_browser_goto"
description = """
Navigate a managed tab to an absolute HTTP(S) URL.
Returns the landing URL and title, and on a failed load where the tab is now. Needs the tab's clientId and tabId. A tab the operator opened (egoPage.label null) is refused before any effect: adopt it with BrowserAct/masc_browser_act adopt_tab first."""
additional_properties = false

[[params]]
name = "url"
type = "string"
required = true
description = "Absolute HTTP(S) URL."

[[params]]
name = "tabId"
type = "integer"
description = "Required: observed tab ID."
minimum = 0

[[params]]
name = "clientId"
type = "string"
description = "Required: observed connection UUID that lists tabId."
