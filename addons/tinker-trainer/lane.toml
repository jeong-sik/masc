id = "tinker-trainer"
revision = "0.1.0"
title = "Tinker post-training datasets, runs and checkpoints"
ui_category = "analysis"
contributions = ["observe", "derive", "act"]
image = "masc-lane-tinker-trainer:0.1.0"
command = ["python3", "server.py", "--state", "/state"]

[world.actions]
tool = "lane_act"

[world.state]
mode = "persistent"

[world.outputs.datasets]
lanes = ["tinker/datasets"]

[world.outputs.runs]
lanes = ["tinker/runs"]

[world.outputs.checkpoints]
lanes = ["tinker/checkpoints", "tinker/readiness"]

[world.outputs.training]
lanes = ["tinker/checkpoints", "tinker/datasets", "tinker/readiness", "tinker/runs"]

[resources]
cpus = 0.5
memory_bytes = 268435456
pids = 32
max_reply_bytes = 4194304

[interface]
refresh_policy = "source_changes"
binding_schema = '''
{
  "type": "object",
  "required": [
    "base_model",
    "target_loss",
    "sources"
  ],
  "additionalProperties": false,
  "properties": {
    "base_model": {
      "type": "string",
      "minLength": 1
    },
    "target_loss": {
      "type": "string",
      "enum": [
        "cross_entropy",
        "importance_sampling",
        "ppo",
        "cispo",
        "dro",
        "gspo",
        "stable_reinforce"
      ]
    },
    "optimizer": {
      "type": "string",
      "enum": [
        "adamw",
        "dimuon"
      ]
    },
    "default_effort": {
      "type": "number",
      "minimum": 0.0,
      "exclusiveMaximum": 1.0
    },
    "min_eval_gain": {
      "type": "number",
      "minimum": 0.0,
      "maximum": 1.0
    },
    "sources": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "object",
        "required": [
          "source_id",
          "kind"
        ],
        "additionalProperties": false,
        "properties": {
          "source_id": {
            "type": "string",
            "minLength": 1
          },
          "kind": {
            "type": "string",
            "enum": [
              "snapshot_file",
              "lane_output"
            ]
          },
          "path": {
            "type": "string",
            "minLength": 1
          },
          "installation_id": {
            "type": "string",
            "minLength": 1
          },
          "output_id": {
            "type": "string",
            "minLength": 1
          },
          "selection": {
            "type": "string",
            "enum": [
              "latest_completed"
            ]
          }
        }
      }
    }
  }
}
'''
presentation = '''
{
  "lanes": [
    {
      "lane_id": "tinker/datasets",
      "title": "Post-training datasets",
      "view": "table",
      "columns": [
        {"key": "dataset_id", "label": "Dataset"},
        {"key": "loss_fn", "label": "Loss"},
        {"key": "base_model", "label": "Base model"},
        {"key": "datum_count", "label": "Datums"},
        {"key": "positive_count", "label": "Positive"},
        {"key": "negative_count", "label": "Negative"}
      ]
    },
    {
      "lane_id": "tinker/runs",
      "title": "Training runs",
      "view": "table",
      "columns": [
        {"key": "run_id", "label": "Run"},
        {"key": "base_model", "label": "Base model"},
        {"key": "loss_fn", "label": "Loss"},
        {"key": "step", "label": "Step"},
        {"key": "mean_loss", "label": "Mean loss"},
        {"key": "status", "label": "Status"}
      ]
    },
    {
      "lane_id": "tinker/checkpoints",
      "title": "Sampler checkpoints",
      "view": "table",
      "columns": [
        {"key": "checkpoint_id", "label": "Checkpoint"},
        {"key": "sampler_path", "label": "Sampler path"},
        {"key": "step", "label": "Step"},
        {"key": "eval_pass_rate", "label": "Eval pass rate"},
        {"key": "baseline_pass_rate", "label": "Baseline"}
      ]
    },
    {
      "lane_id": "tinker/readiness",
      "title": "Promotion readiness",
      "view": "table",
      "columns": [
        {"key": "checkpoint_id", "label": "Checkpoint"},
        {"key": "verdict", "label": "Verdict"},
        {"key": "eval_gain", "label": "Eval gain"},
        {"key": "runtime_api_name", "label": "Runtime api-name"}
      ]
    }
  ],
  "actions": [
    {
      "label": "Prepare SFT bundle",
      "description": "Derive a cross-entropy SFT dataset from verified Keeper trajectories and Karma signals.",
      "payload": {"kind": "prepare_sft", "dataset_id": "sft-latest"}
    },
    {
      "label": "Prepare RLVR bundle",
      "description": "Derive an RLVR dataset with verifiable rewards (+1.0 / -1.0) and advantage weights.",
      "payload": {"kind": "prepare_rlvr", "dataset_id": "rlvr-latest", "loss_fn": "cispo"}
    },
    {
      "label": "Export dataset JSONL",
      "description": "Export the latest prepared dataset as a retained NDJSON artifact.",
      "payload": {"kind": "export_bundle", "dataset_id": "rlvr-latest"}
    }
  ]
}
'''
