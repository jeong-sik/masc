# Flagsmith's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.flagsmith.com/.well-known/oauth-protected-resource,
# authorization server (https://api.flagsmith.com/) offers S256 PKCE and dynamic
# client registration (HTTP 201). Scopes: mcp, admin-api.

id = "flagsmith"
label = "Flagsmith"
mcp_url = "https://mcp.flagsmith.com/mcp"

# Seen 2026-11-03: the authorize step here goes to sign-in before it looks at
# the redirect, so nothing short of a real login tells whether it takes this
# server's public callback. Atlassian and Datadog behave the same way, and
# both refused the public callback after sign-in while logins through the
# loopback form completed. A client registered here on 2026-11-03 with the
# loopback form was accepted. So a login here names the loopback callback, and
# the browser that consents has to reach this server on 127.0.0.1.
callback = "loopback"

access_token_env = "FLAGSMITH_ACCESS_TOKEN"
expires_at_env = "FLAGSMITH_EXPIRES_AT"
refresh_token_file = "/home/keeper/.flagsmith/refresh_token"
renew_before_sec = 300
