\* One commit releases the width instead of an emptied backlog, so the pass
\* after it offers more than the last refusal showed would fit.
\* Expected: LearnedWidthHolds violated.
SPECIFICATION SpecReleaseOnCommit
CONSTANTS
    Backlog = 8
    Capacity = 2
INVARIANT TypeOK
INVARIANT LearnedWidthHolds
CHECK_DEADLOCK FALSE
