name = "keeper_library_search"
description = """
Search the knowledge library by keyword.

Returns matching document titles, \
relevance scores (0-1), and text snippets. Use to discover relevant docs before \
reading full content with keeper_library_read."""

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 9 times in 6 turns, 415 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 6 extra requests over the same week.
defer_loading = true

[[params]]
name = "query"
type = "string"
description = """
Search query string; empty or missing returns a workflow error"""
