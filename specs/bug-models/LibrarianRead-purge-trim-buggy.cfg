\* Buggy model: a recovery from a broken transcript drops the tail and keeps
\* the read position where it was, past the new end.
\* NoAtomPassedUnread MUST be violated; if every invariant holds under
\* SpecPurgeTrim, a recovery need not move the position after all.
SPECIFICATION SpecPurgeTrim
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
