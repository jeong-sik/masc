\* Buggy model: every run starts inline, so the run that takes the place of
\* a session a size refusal closed after an effect sends again the receipts
\* that turn carried and added (RFC section 5.5; 38 of 47 fresh Claude Code
\* starts of 700 KB or more, 2026-11-25 to 11-28, were such runs).
\* Expected: SupersedingRunStartsShort VIOLATED.
SPECIFICATION SpecInlineAfterClose

CONSTANTS
    Window       = 100
    FixedSizes   = {40, 98}
    ReceiptBytes = 10
    AddressBytes = 15
    MaxReceipts  = 8
    HistoryBytes = 64
    TurnBytes    = 30

INVARIANTS
    TypeOK

PROPERTIES
    SupersedingRunStartsShort

CHECK_DEADLOCK FALSE
