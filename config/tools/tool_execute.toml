[[params]]
name = "then"
type = "array"
description = """
Programs to run after this one, each guarded by how the one before it ended, \
the typed form of '&&' and '||'. Use this instead of putting those operators \
in argv, where nothing reads them. Guards apply left to right."""

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
name = "on"
type = "string"
required = true
enum = ["success", "failure"]

[[params.items.params]]
name = "argv"
type = "array"
items = { type = "string" }
min_items = 1
description = """
Same shape as the top-level argv. Still no shell: '|', '&&' and '>' are \
data, and wildcards are not expanded."""

