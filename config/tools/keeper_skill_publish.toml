defer_loading = true
name = "keeper_skill_publish"
description = """
Publish a new Skill package into the workspace's project-agents Skill source. \
The SKILL.md is checked by the same parser as the operator Skill editor and \
keeper_skill_validate, then the catalog is republished; a Keeper that lists its \
skills sees it once listed. Never overwrites: an existing package is refused. Operators \
can delete it afterwards. After a write or an uncertain write, an audit row with \
your identity, evidence and the known reference or attempted package is attempted. \
audit_status=unconfirmed means the row may or may not \
exist; audit_call_returned means only the audit call returned. Neither proves durable \
recording. Use the publication status and reference for the write outcome; do not \
republish solely to repair an audit. Before publishing, recheck the evidence for each reusable \
claim and preserve its applicability and limits. Keep case-specific instructions \
scoped to their case; a Skill does not override current authoritative state or \
later explicit instructions. Pass source_text or draft_sha256 from a prepare \
that froze skill metadata; the latter publishes those exact bytes after owner \
and frozen-contract revalidation. Where completion authority is relevant, distinguish \
Task verdicts from Goal human confirmation and allow explicitly reopened work. \
Inline Read/Edit Skills may overlap independent supported Keeper-owned files \
when their inputs are already resolved. Declare data/order dependencies with \
after and use input templates for upstream values."""
additional_properties = false

[[params]]
name = "package_id"
type = "string"
required = true
description = "New Skill package directory name. Must match the SKILL.md name."

[[params]]
name = "source_text"
type = "string"
description = "The complete SKILL.md text, frontmatter included."

[[params]]
name = "draft_sha256"
type = "string"
description = "Exact digest of the prepared composition draft whose frozen SKILL.md is being published; replaces source_text."

[[params]]
name = "evidence"
type = "array"
required = true
items = { type = "string" }
min_items = 1
description = "Where this procedure worked: Memory fact ids, turn references, or tool call references. Check what each reference supports, including later correction or retraction; listing a reference alone does not establish a reusable rule. Recorded for operators to review later."

[[one_of]]
required = ["source_text"]
forbidden = ["draft_sha256"]
description = "Publish authored SKILL.md bytes."

[[one_of]]
required = ["draft_sha256"]
forbidden = ["source_text"]
description = "Publish the exact Skill source frozen in a composition draft."
