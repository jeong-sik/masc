name = "keeper_composition_prepare"
description = """
Validate and inspect a task-specific composition without publishing a Skill. \
Use canonical tool names, explicit dependencies and tagged literal/output/object/array \
input templates, or child nodes {id, skill_reference, args, after?} with an exact \
admitted reference copied from Skill inventory and fixed args checked against \
that child's parameter schema. Inline children must share the parent's failure \
policy. Read child exports with /export-name/subpath; dependencies wait for the \
whole child. Select final fields with exports. Returns a durable draft reference \
bound to this Keeper, execution mode, inputs and frozen tool/Skill contracts; pass \
its sha256 to keeper_composition_run. No node executes or activates during prepare. \
Static read-only leaves and keeper_job_start are admitted. A job launch retains \
durable isolated ownership and Serial execution. Feed its /job_id output into \
keeper_job_result, then use the complete original artifacts in dependent nodes. \
Child definitions require inline mode; the enclosing draft may be inline or async. \
Nested drafts omit publication metadata. Choose async \
for independent work or an original job-result wait while the Keeper continues \
other work. Optional skill metadata freezes the \
reusable SKILL.md in this same draft. Validate and publish it by draft_sha256 \
after checking execution evidence; omit skill for a task-only composition."""
additional_properties = false
defer_loading = true

[[params]]
name = "execution"
type = "string"
enum = ["inline", "async"]
required = true
description = "Execution mode bound into the prepared draft."

[[params]]
name = "nodes"
type = "array"
items = { type = "object" }
min_items = 1
required = true
description = "Ordinary Tool nodes or exact admitted inline Skill child nodes. A node input is a tagged template: {kind:literal,value}, {kind:output,node,pointer}, {kind:object,fields:[{name,value}]} or {kind:array,items:[template]}; each value and item is itself a template. The advertised schema is not recursive; the grammar and exact child references are validated when the plan is prepared."

[[params]]
name = "exports"
type = "array"
items = { type = "object" }
description = "Optional named node-output JSON pointers, checked against producer schemas."

[[params]]
name = "branch_failure_policy"
type = "string"
enum = ["fail_fast", "continue_independent"]
description = "Explicit failure policy; absent means fail_fast."

[[params]]
name = "skill"
type = "object"
additional_properties = false
description = "Optional reusable Skill identity and description, frozen with the exact plan. No package is published during prepare."

[[params.params]]
name = "package_id"
type = "string"
required = true

[[params.params]]
name = "description"
type = "string"
required = true
