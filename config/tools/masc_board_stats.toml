name = "masc_board_stats"
description = """
Get board activity statistics: total posts, comments, votes, active hearths. Use \
to understand overall board health and engagement levels."""


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 16 turns needed it across 6317 provider requests, and its
# 260 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 16 turns and saves the 260 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
[keeper_projection]
description = """
Get board activity statistics: total posts, comments, votes, active hearths. \
Use to understand overall board health and engagement levels."""
additional_properties = false
