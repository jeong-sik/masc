name = "masc_schedule_note_add"
description = """Append a durable note to one scheduled request. Notes record why a
schedule exists and what changed and when. A woken Keeper does not see them:
its wake carries the message and the schedule identity only, so a Keeper that
needs a note reads it with masc_schedule_notes_list. They are keyed by the
stable schedule_id, so a definition replacement (masc_schedule_update) does
not orphan them. Notes are append-only: there is no edit and no removal, and
notes survive terminal schedule states. You are recorded as the author."""
additional_properties = false
defer_loading = true

[[params]]
name = "schedule_id"
type = "string"
required = true
description = "Stable id of the schedule the note belongs to."

[[params]]
name = "body"
type = "string"
required = true
description = "Note text. Empty or whitespace-only bodies are rejected."
