# GitBook's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.gitbook.com/.well-known/oauth-protected-resource,
# authorization server (https://oauth.gitbook.com) offers S256 PKCE and dynamic
# client registration (HTTP 201). Scopes include space:read, space:write, etc.

id = "gitbook"
label = "GitBook"
mcp_url = "https://mcp.gitbook.com/mcp"

access_token_env = "GITBOOK_ACCESS_TOKEN"
expires_at_env = "GITBOOK_EXPIRES_AT"
refresh_token_file = "gitbook_refresh_token"
renew_before_sec = 300
