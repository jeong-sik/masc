\* A round that cannot read a line no longer stops for good. A later turn that
\* started on a non-empty history carries its start position (RFC 4.6), which
\* settles the refused line before it: the round goes back to atom zero and
\* reads the atoms the refused line may have renumbered (masc#37061).
\* This cfg ran as LibrarianRead-stop-forever-buggy.cfg while the stall was
\* open, where it violated in eight steps. It is the live reader now, so it
\* must NOT violate; if it does, the stall is back. The property excuses a log
\* whose last line is refused (the round waits for a settling line, 4.10's
\* visible halt); what it forbids is a round that had a settling line in front
\* of it and did not come back. Reverting the fix makes this cfg violate again.
\* Expected: no violation.
SPECIFICATION SpecLive
CONSTANTS
    MaxTurns = 2
    MaxSaves = 1
    MaxClears = 0
    MaxBad = 1
INVARIANT TypeOK
PROPERTY EveryReachableAtomEventuallyRead
