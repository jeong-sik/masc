# Square's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-08-27: the protected-resource document answers at the path
# this URL implies, the authorization server it names offers S256 and a
# registration endpoint, the token endpoint accepts a client that
# authenticates with nothing, and an MCP initialize is refused with 401
# rather than 404. It names no scopes, so none are asked for.

id = "square"
label = "Square"
mcp_url = "https://mcp.squareup.com/mcp"

# Measured 2026-11-02: registration refuses a redirect URI on a public https
# host and accepts the RFC 8252 loopback form,
# http://127.0.0.1:<port>/api/v1/keepers/oauth/callback. With the loopback
# client the authorize step goes on to consent, while an unregistered
# loopback URI is refused there. So a login here names the loopback
# callback, and the browser that consents has to reach this server on
# 127.0.0.1.
callback = "loopback"

access_token_env = "SQUARE_ACCESS_TOKEN"
expires_at_env = "SQUARE_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.square/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
