name = "keeper_memory_search"
description = """
Search durable Memory OS facts or raw conversation history, case-insensitively. \
Complete-query substrings rank first. Fallback requires every ASCII-whitespace \
fragment to appear as a substring, in any order. Both tiers run across \
stores; each tier keeps store order. The default reads only current facts; \
source='all' adds absorbed originals and history. History requires a non-empty \
query. Fact results name their store and original basis; current facts \
include exact memory_id and category. Use a memory_id as a derived \
conclusion's premise_id only for store='current_memory_snapshot'. \
source='absorbed' finds facts merged into a newer claim: into names that \
claim, and into_current=false means it is not current."""
additional_properties = false

[[params]]
name = "query"
type = "string"
required = true
description = "case-insensitive text; fallback fragments split on ASCII whitespace"

[[params]]
name = "limit"
type = "integer"
description = """
max results (1-10, default 5). Must be a bare integer (e.g. 5); a quoted \
value is rejected."""

[[params]]
name = "source"
type = "string"
enum = ["current", "absorbed", "history", "all"]
description = """
Search scope: current (default, ordinary and source-bound current facts), \
absorbed (facts \
merged into a newer claim), history (raw messages), or all"""
