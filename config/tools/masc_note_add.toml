name = "masc_note_add"
description = """
Add a note/observation to the planning context. Notes are timestamped and \
appended."""
additional_properties = false

[[params]]
name = "task_id"
type = "string"
required = true
description = "Task ID"

[[params]]
name = "note"
type = "string"
required = true
description = "Note content"
