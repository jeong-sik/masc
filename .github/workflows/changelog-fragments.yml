name: Changelog fragments

# The whole directory is checked only when explicitly requested:
# scripts/bump-version.sh runs the same check before it assembles a release.
# The fragments a pull request changes are checked by the required `changes`
# job of pr-type-check.yml, where a failure blocks the merge. A pull request
# that touches the release bump script runs only that script's test here.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/bump-version.sh"
      - "scripts/tests/test_bump_version_fold_base.py"

permissions:
  contents: read

jobs:
  check:
    name: Changelog fragment format
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every fragment cites its own pull request
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/changelog-fragments.py check --dir changelog.d
      - name: Check the release bump scans from the last release's fold
        run: python3 -m unittest scripts.tests.test_bump_version_fold_base
