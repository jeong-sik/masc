name = "masc_keeper_up"
description = """
Create or update a durable keeper. Keepers auto-start on server boot and are \
reconciled back into live presence. Each call snapshots the keeper manifest \
and commits compare-and-swap: if another writer commits first, the call \
fails with keeper_manifest_revision_conflict and no side effects. Retry the \
same call — it re-snapshots the current manifest and applies only the \
fields you pass, so a retry cannot revert another writer's change."""
additional_properties = false

[[params]]
name = "name"
type = "string"
required = true
description = "Keeper handle (stable). Example: 'keeper-helper'"

[[params]]
name = "instructions"
type = "string"
description = """
Complete Keeper instructions, written to the keeper TOML declaration (kept \
across handoff)."""

[[params]]
name = "mention_targets"
type = "array"
items = { type = "string" }
description = """
Exact direct-mention tokens that can wake the keeper in workspace traffic \
(for example ['alpha'])."""

[[params]]
name = "sandbox_profile"
type = "string"
enum = ["docker", "microvm", "remote_ssh"]
description = """
Sandbox isolation profile. Pass explicitly: \"docker\" for containerized \
execution. \"microvm\" runs each guest as a lightweight VM behind a \
hypervisor; which runtime supplies it is the keeper TOML's \
microvm_backend (apple_container, microsandbox, or nerdctl_kata), and the \
host needs that runtime's CLI and sandbox image already present. Naming a \
backend is not something this tool does: on a host with no assumed one, a \
microvm keeper is refused at boot rather than handed a different isolation \
than it declared. Network defaults to none like docker. \"remote_ssh\" targets the \
SSH remote execution lane (Phase 1; requires remote_endpoint in the \
keeper TOML, runner lands with the lane). There is no host profile: every \
keeper runs under one of these three. Creating a keeper without this field \
is rejected; updating one that already declares it may leave it out. That \
split is why the field is not marked required here, and why it carries no \
default: nothing fills it in for you."""

[[params]]
name = "network_mode"
type = "string"
enum = ["none", "inherit"]
description = """
Whether the sandbox guest reaches the network. \"none\" gives it none: a web \
search, a git push, or any HTTP call inside the guest fails. \"inherit\" \
gives it the host's network. Omitted on create, the keeper takes its sandbox \
profile's default, and docker and microvm both default to \"none\", so a \
keeper whose work is web search or repository traffic has to pass \
\"inherit\" here. remote_ssh accepts only \"inherit\": the Phase 1 SSH lane \
carries transport only, and \"none\" on it is refused when the keeper config \
loads."""

[[params]]
name = "remote_endpoint"
type = "string"
description = """
Endpoint registry name under [exec.ssh.endpoints.<name>] in runtime.toml. \
Required with sandbox_profile = "remote_ssh"; pass null to clear it when \
switching the keeper to another sandbox profile."""

[[params]]
name = "autoboot_enabled"
type = "boolean"
description = """
If false, persist the keeper but skip auto-start on future server boots."""

[[params]]
name = "max_context_override"
type = "integer"
description = """
Optional: absolute context token limit override for this keeper. Use 0 to \
clear the override."""

[[params]]
name = "proactive_enabled"
type = "boolean"
description = """
If true, scheduled keeper cycles may produce proactive responses."""

[[params]]
name = "runtime_id"
type = "string"
description = """
Optional opaque runtime id. Writes the keeper assignment to runtime.toml."""

[[params]]
name = "skills"
type = "object"
additional_properties = false
description = "Profile-only exact Keeper Skill name selection. Omit to keep it unchanged; skills={} selects all; names=[] selects none."

[[params.params]]
name = "names"
type = "array"
items = { type = "string" }
description = "Exact canonical Skill names. Unknown names remain observable and do not block known names."
