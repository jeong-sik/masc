name = "masc_dos_restore"
description = """
Resume a saved DOS machine, or list the saved ones.

Replaces the current machine with the named checkpoint only after it reads; \
you then hold the controller. Needs the controller free or yours, like \
masc_dos_load. The key ledger continues from the checkpoint; the game's \
saves folder is left as it is. No slot lists checkpoints. A worker that \
starts resumes the autosave by itself with the controller free; with no \
machine loaded, slot=autosave resumes the last autosave.

The resumed machine's first save copies the autosave to autosave-prev, \
replacing what autosave-prev held. When both are on disk, restoring any slot \
except autosave-prev is refused and names what would be lost; pass \
discard_previous_autosave=true to let it go. Restoring autosave-prev itself \
never asks."""
additional_properties = false

defer_loading = true

[[params]]
name = "slot"
type = "string"
description = "Checkpoint to restore. Omit to list them."

[[params]]
name = "discard_previous_autosave"
type = "boolean"
description = "Set true only after a refused restore showed what autosave-prev holds and you do not need it. The restored machine's first save then replaces it. Default false."
default = false
