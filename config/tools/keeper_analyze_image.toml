name = "keeper_analyze_image"
description = """
Read a stored image artifact and return a text description or answer. \
Delegates to a vision model in a sub-call; the image is never added to this \
conversation. Returns the extracted text, or a typed error (invalid_args | \
eio_context_unavailable | artifact_load_failed | invalid_timeout | \
image_too_large | invalid_media_type | invalid_request | no_capable_runtime \
| empty_extraction | truncated_extraction | timeout | provider_error)."""
additional_properties = false

[[params]]
name = "artifact"
type = "string"
required = true
description = """
Handle of a stored image artifact (the content-addressed id returned when \
the image was stored). The raw image is read in a vision sub-call and never \
enters this conversation."""

[[params]]
name = "query"
type = "string"
required = true
description = """
What to ask about the image, e.g. \"describe the chart\" or \"transcribe the \
text\"."""

[[params]]
name = "media_type"
type = "string"
enum = ["image/png", "image/jpeg", "image/gif", "image/webp"]
description = """
Optional image MIME type override (e.g. image/png, image/jpeg). Sniffed from \
the bytes when omitted."""
