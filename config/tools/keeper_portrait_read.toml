name = "keeper_portrait_read"
description = """
Browse portrait accessories and view the current Keeper's equipped portrait.

Returns a durable PNG artifact, starting and current equipment and the accessory catalog.
Without preview_item, mode is current. Pass an id from catalog as preview_item
to see that accessory on the current outfit of the same Keeper body; mode is then preview.
equipment describes the picture; current_equipment and starting_equipment
report the current outfit and name-derived starting outfit respectively.
Previewing an accessory does not buy or equip it. This read does not report
purchased inventory."""
additional_properties = false

defer_loading = true

[[params]]
name = "size"
type = "integer"
minimum = 48
maximum = 512
default = 160
description = "Portrait edge in pixels."

[[params]]
name = "preview_item"
type = "string"
description = "Optional accessory id from catalog to preview in the returned PNG."
