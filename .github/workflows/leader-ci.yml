name: Leader-selected CI
run-name: Leader-selected CI on ${{ inputs.candidate }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact combined candidate SHA; dispatch this workflow on main
        required: true
        type: string
      selection:
        description: JSON receipt from prepare-approved-batch.py
        required: true
        type: string
      compile:
        description: Bottom Core runtime library build
        type: boolean
        default: false
      tests:
        description: Explicit minimal behavior suites (required when selected)
        type: boolean
        default: false
      suites:
        description: Comma-separated suites for the behavior test runner
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: leader-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  selection:
    name: Recheck approved selection
    runs-on: ubuntu-24.04
    steps:
      # Source authority is read using the integrated main implementation,
      # not a script supplied by an unverified candidate.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate and selected scopes
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ inputs.selection }}
          SCOPES: ${{ toJSON(inputs) }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          scopes = json.loads(os.environ['SCOPES'])
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Dispatch leader CI on main')
          if not any(scopes[name] is True for name in ('compile', 'tests')):
              raise SystemExit('Select at least one CI scope')
          if scopes['tests'] and not scopes['suites'].strip():
              raise SystemExit('Ordinary behavior verification requires explicit suites')
          if scopes['suites'] and not scopes['tests']:
              raise SystemExit('Suites require the tests scope')
          Path('selection.json').write_text(os.environ['SELECTION'])
          PY
          python3 scripts/review/verify-approved-selection.py \
            --selection selection.json --repo "$REPOSITORY" \
            --candidate "$CANDIDATE" --git-dir . > verified-selection.json
      - uses: actions/upload-artifact@v7
        with:
          name: approved-selection-${{ inputs.candidate }}-${{ github.run_attempt }}
          path: verified-selection.json
          if-no-files-found: error
      - name: Pin selected member heads with a pending leader-selected-ci status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          members = json.loads(Path('verified-selection.json').read_text())['members']
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          url = os.environ['RUN_URL'] + '?pr='
          for member in members:
              head = member['head']
              target = os.environ['RUN_URL']
              body = json.dumps({
                  'state': 'pending',
                  'context': 'leader-selected-ci',
                  'target_url': url,
                  'description': 'leader-selected CI in progress (run ' +
                                 os.environ['GITHUB_RUN_ID'] + ')'}).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/commits/{head}/statuses',
                  data=body, method='POST',
                  headers={'Authorization': f'token {token}',
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f'status answer failed for {head}: {response.status}')
                  print(f'pinned {member["pr"]}@{head[:12]}')
          PY

  compile:
    needs: selection
    if: inputs.compile
    uses: ./.github/workflows/ci.yml
    with:
      candidate_verification: true
      candidate_sha: ${{ inputs.candidate }}

  tests:
    needs: selection
    if: inputs.tests
    uses: ./.github/workflows/test.yml
    with:
      candidate_verification: true
      candidate_sha: ${{ inputs.candidate }}
      suite: ${{ inputs.suites }}
      minimal: true

  evidence:
    name: Record selected CI results
    needs: [selection, compile, tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified selection
        uses: actions/download-artifact@v7
        with:
          name: approved-selection-${{ inputs.candidate }}-${{ github.run_attempt }}
          path: selection-evidence
        continue-on-error: true
      - name: Record scope and results
        env:
          SCOPES: ${{ toJSON(inputs) }}
          RESULTS: ${{ toJSON(needs) }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          scopes = json.loads(os.environ['SCOPES'])
          needs = json.loads(os.environ['RESULTS'])
          keys = {'compile': 'compile', 'tests': 'tests'}
          chosen = {job: needs[job]['result'] for option, job in keys.items() if scopes[option] is True}
          passed = bool(chosen) and needs['selection']['result'] == 'success' and all(v == 'success' for v in chosen.values())
          receipt = {'schema_version': 1, 'candidate': os.environ['CANDIDATE'],
                     'actor': os.environ['GITHUB_ACTOR'], 'selection': json.loads(scopes['selection']),
                     'suites': scopes['suites'], 'results': chosen, 'checks_passed': passed,
                     'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'merge_authorized': False}
          Path('leader-ci-results.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Candidate: `' + receipt['candidate'] + '`\n\n')
              for job, result in chosen.items():
                  out.write('- ' + job + ': ' + result + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: leader-ci-results-${{ inputs.candidate }}-${{ github.run_attempt }}
          path: leader-ci-results.json
          if-no-files-found: error
      - name: Require selected checks to pass
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          raise SystemExit(0 if json.loads(Path('leader-ci-results.json').read_text())['checks_passed'] else 1)
          PY
      - name: Settle the leader-selected-ci statuses on member heads
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          # The run has finished by definition here (this job runs with
          # if: always()), so the pending pin is resolved either way: a
          # failed or cancelled run must not leave a pending status that
          # would block merging forever.
          members_path = Path('selection-evidence') / 'verified-selection.json'
          if members_path.exists():
              members = json.loads(members_path.read_text())['members']
          else:
              # The selection evidence download can fail (artifact expiry,
              # lost run). Never leave a pending status pinned forever: a
              # run whose member list is unrecoverable can only settle to
              # failure via an explicit recheck, so unpin with failure only
              # when this job itself determined the run outcome is final.
              # Prefer failing loudly instead of guessing heads here.
              raise SystemExit('verified-selection.json unavailable; statuses not settled')
          receipt_path = Path('leader-ci-results.json')
          if receipt_path.exists():
              checks_passed = json.loads(receipt_path.read_text())['checks_passed']
          else:
              checks_passed = False
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          state = 'success' if checks_passed else 'failure'
          for member in members:
              head = member['head']
              body = json.dumps({
                  'state': state,
                  'context': 'leader-selected-ci',
                  'target_url': os.environ['RUN_URL'],
                  'description': 'leader-selected CI ' + state + ' (run ' +
                                 os.environ['GITHUB_RUN_ID'] + ')'}).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/commits/{head}/statuses',
                  data=body, method='POST',
                  headers={'Authorization': f'token {token}',
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f'status settle failed for {head}: {response.status}')
                  print(f'settled {member["pr"]}@{head[:12]} -> {state}')
          PY
