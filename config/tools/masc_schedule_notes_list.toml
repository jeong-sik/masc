name = "masc_schedule_notes_list"
description = """List the durable notes of one scheduled request. Notes are
keyed by the stable schedule_id and survive definition replacements
(masc_schedule_update) and terminal schedule states. Use them to read why a
schedule exists and what changed and when. A wake does not carry the notes, so a
woken Keeper reads them here when it needs them. Each page is oldest first;
the first page is the newest window. A page holds at most limit notes, and
fewer when they would not fit in one result. When has_more_older is true, pass
next_before_note_id as before_note_id to read the preceding page. To look for
something, pass contains: only notes whose body has that text are returned, and
matched_count is how many notes of the whole schedule have it, so one read says
whether paging further is worth it. total_count and matched_count are the counts
at that read. If either changes between reads, a note was appended. Its timestamp
can be earlier than the newest note's, which puts it outside the newest page, so
read the pages again."""
additional_properties = false
defer_loading = true

[[params]]
name = "schedule_id"
type = "string"
required = true
description = "Stable id of the schedule whose notes are listed."

[[params]]
name = "limit"
type = "integer"
minimum = 1
maximum = 200
description = "Maximum notes per page (default 50). The newest eligible window is returned oldest first."

[[params]]
name = "before_note_id"
type = "string"
description = "Exclusive note id from this schedule; omit for the newest page. Use next_before_note_id to continue toward older notes."

[[params]]
name = "contains"
type = "string"
description = "Return only notes whose body contains this text, case sensitive. Pages, has_more_older and next_before_note_id then follow the matching notes, and matched_count is the number of matching notes in the whole schedule. Omit it to list every note."
