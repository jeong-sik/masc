name = "keeper_webmcp_list"
description = """
List the WebMCP tools a browser page has registered on document.modelContext.

\
Requires an operator-run headed Chrome with --enable-features=WebMCP and \
--remote-debugging-port, and the target page already open; when either is \
missing the call fails immediately with the reason instead of retrying. \
Returns JSON {surface, tools:[{name, description, origin}]}."""
additional_properties = false

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 2 times in 2 turns, 755 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 2 extra requests over the same week.
defer_loading = true

[[params]]
name = "page"
type = "string"
required = true
description = "Substring matched against open page URLs to pick the target page, for example 8935/dashboard."

[[params]]
name = "cdp_port"
type = "integer"
description = "Chrome DevTools port on 127.0.0.1. Defaults to 9222."
