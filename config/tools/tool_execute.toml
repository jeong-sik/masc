Send this stream into another of the stage's output descriptors, the typed \
form of '2>&1'. The two streams are captured separately and joined \
afterwards, so the merged text is grouped by stream, not ordered by time."""

[[params]]
name = "script"
type = "string"
min_length = 1
description = """
Shell form: one command line, run by a real shell inside your sandbox. Write \
whatever a shell takes -- pipes, '&&', ';', redirections, $(...), loops. Use \
this instead of putting a script in argv as 'bash -c'; that spelling is read \
as this field. Mutually exclusive with 'argv' and 'pipeline'. Prefer 'argv' \
or 'pipeline' when you do not need a shell: they run the program directly, so \
nothing is word-split or expanded."""

[[params]]
name = "shell"
type = "string"
enum = ["sh", "bash", "zsh", "dash", "ksh"]
default = "sh"
description = """
Which shell runs 'script'. Defaults to 'sh'. Name 'bash' when the script uses \
bash-only syntax; a container's 'sh' is often dash. Ignored unless 'script' \
is present."""

[[one_of]]
required = ["argv"]
forbidden = ["pipeline"]
description = """
Single-process form: include one non-empty 'argv'. DO NOT also include \
'pipeline' in the same call."""

[[one_of]]
required = ["pipeline"]
forbidden = ["argv"]
description = """
Pipeline form: include 'pipeline' array of exec stages.  DO NOT also include \
top-level 'argv' in the same call."""

[[one_of]]
required = ["script"]
forbidden = ["argv", "pipeline"]
description = """
Shell form: include 'script'.  DO NOT also include 'argv' or 'pipeline' in \
the same call."""
