# Isolated Item HTTP fixture: dead loopback transport, no model-call evidence.
[runtime]
default = "deepseek.smoke"

[runtime.exact_output_lanes.hitl_auto_judge]
slots = ["deepseek.smoke"]

[runtime.exact_output_lanes.board_attention_exact]
slots = ["deepseek.smoke"]

[providers.deepseek]
display-name = "Transport Harness Smoke"
protocol = "openai-compatible-http"
endpoint = "http://127.0.0.1:9/v1"
# Exact-output slots above run on this provider, and a slot whose provider
# declares no exact-body-timeout-s is left out at boot (#38779). Nothing here is
# ever answered, so the value only has to be a valid deadline.
exact-body-timeout-s = 1200.0

# Use only synthetic authorization; isolated boot must not depend on host tokens.
[providers.deepseek.credentials]
type = "inline"
value = "release-evidence-loopback"

[models.smoke]
# Keep the harness-local slot alias, with a real provider-scoped catalog model
# so exact-output lanes can publish. The loopback endpoint still answers no
# model requests; this fixture exercises startup and Item routes only.
api-name = "deepseek-v4-flash"
max-context = 32768
tools-support = true
streaming = true

[models.smoke.capabilities]
supports-tool-choice = true

[deepseek.smoke]
is-default = true
max-concurrent = 1

[runtime.exact_output_lanes.candle_appraiser]
slots = ["deepseek.smoke"]
