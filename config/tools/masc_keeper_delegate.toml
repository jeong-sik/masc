name = "masc_keeper_delegate"
description = """
Submit one typed Keeper chat operation and get its operation_id back.

The id is durable and returns without waiting for the turn. A Keeper that submits one is woken with a completion notice when that turn ends. The queued text is a preview and may be shortened. Use masc_keeper_delegate_status with the original target and operation_id to read state and, after completion, retrieve completed_reply with the original terminal text and rich blocks before acting on it. An unavailable reply is reported explicitly; do not re-delegate or relay through Board to retrieve the same answer."""
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 5 turns needed it across 6317 provider requests, and its
# 691 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 5 turns and saves the 691 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
[[params]]
name = "target"
type = "object"
required = true
additional_properties = false

[[params.params]]
name = "kind"
type = "string"
required = true
enum = ["keeper"]

[[params.params]]
name = "name"
type = "string"
required = true

[[params]]
name = "prompt"
type = "string"
required = true
description = "The request the receiving Keeper reads: goal, scope, inputs, expected output, and how you will check it."

[[params]]
name = "artifacts"
type = "array"
description = "Exact exported artifact objects from keeper_artifact_transfer. The receiver can materialize these bytes in its own sandbox."

[params.items]
type = "object"
