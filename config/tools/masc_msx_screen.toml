name = "masc_msx_screen"
description = """
Read the MSX frame without advancing time.

Returns mode, PC, text, a 64x24 ASCII view and tiles. Text is empty in \
bitmap modes; tile IDs depend on the game. The sprite attribute table rides \
only when sprites=true. Captures include a PNG stored in the unified attachment \
store (with attachment_id and url) plus an inline image block when the active \
runtime supports vision. Use keeper_image_read to re-read an attachment directly, \
or keeper_analyze_image when the active runtime lacks native vision input."""
additional_properties = false

defer_loading = true

[[params]]
name = "sprites"
type = "boolean"
description = "Include the sprite attribute table (up to 32 slots). Default false."
default = false
