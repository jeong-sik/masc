name: Approval merge request

# This stage has no write token and never checks out a PR. Reviews from forks
# can therefore wake the trusted default-branch worker as well.
#
# Every run here starts a worker run, and both share the Actions token's
# hourly API budget. In a sample of 60 worker runs on 2026-11-12, 48 held
# without doing anything (36 because the pull request was a draft or already
# closed), and 6 of 12 failed runs died on "API rate limit exceeded for
# installation" while downloading the request. The job below therefore skips
# the events that cannot change what the worker does; a skipped job starts no
# runner and its worker run skips too.
on:
  # A review edit changes only the review's text. The worker reads state,
  # account and reviewed commit, so an edit cannot change its verdict.
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]

permissions: {}

# One request per PR is enough: the consumer (Approval auto-merge) re-reads the
# PR's current state and ignores which event woke it, so only the newest
# request of a PR matters. Cancelling an older request makes its workflow_run
# "cancelled", which the consumer skips -- no artifact download, no API calls.
# The group is per PR (never repository-wide), so another PR's final approval
# is never replaced. "closed" keeps its own per-PR group: it is the only path
# that starts the main build for a merged PR and must not be cancelled by a
# later review event, of that PR or of a stack sibling.
#
# The layers of a native stack share one group. The worker resolves any
# layer's request to the stack's top pull request and reads the whole stack
# (top_pull and reservation_reads in scripts/review/approval-auto-merge.py),
# so the requests of one stack are interchangeable and only the newest one
# matters. Per layer, one push of the 84-layer stack #51256 left 83 requests
# queued here and 91 worker runs behind them (2026-11-12T05:03Z), each worker
# run reading every layer from the shared hourly API budget. GitHub adds
# `stack` to the pull_request payload of a stack member; a payload without it
# keeps the per-PR group.
#
# An event the job below skips gets a group of its own ("noop"). A run whose
# only job is skipped still enters its group, and its worker run skips, so in
# the "live" group it would cancel a pending request and leave nothing to wake
# the worker: a title edit on one layer would drop another layer's final
# approval. The middle condition here repeats the job's `if` for events other
# than "closed"; change the two together.
concurrency:
  group: >-
    approval-merge-request-${{
    github.event.action == 'closed'
    && format('{0}-closed', github.event.pull_request.number)
    || (github.event.action == 'converted_to_draft'
    || (github.event.pull_request.draft == false
    && github.event.pull_request.state == 'open'
    && (github.event_name != 'pull_request_target'
    || github.event.action != 'edited'
    || github.event.changes.base != null)))
    && format('{0}-live', github.event.pull_request.stack.number
    && format('stack-{0}', github.event.pull_request.stack.number)
    || github.event.pull_request.number)
    || format('{0}-noop', github.event.pull_request.number)
    }}
  cancel-in-progress: true

jobs:
  request:
    # Kept: a draft conversion (the worker drops the reservation), and any
    # event on an open, ready pull request. A closed pull request is kept
    # only when it merged (the worker wakes the main build, deletes the
    # branch and closes the linked issues). An edit is kept only when it
    # changed the base branch; title
    # and body edits change nothing the worker reads. A draft's reviews are
    # read again when it is marked ready.
    if: >-
      github.event.action == 'converted_to_draft' ||
      (github.event.pull_request.draft == false &&
       (github.event.pull_request.state == 'open' ||
        (github.event.action == 'closed' && github.event.pull_request.merged == true)) &&
       (github.event_name != 'pull_request_target' || github.event.action != 'edited' ||
        github.event.changes.base != null))
    runs-on: ubuntu-24.04
    steps:
      - name: Record the PR number as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Logged only. It shows which concurrency group this run took: with
          # no stack number in the payload the group above stays per PR.
          STACK_NUMBER: ${{ github.event.pull_request.stack.number }}
          REQUEST_FILE: ${{ runner.temp }}/approval-merge-request/request.json
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          number = int(os.environ['PR_NUMBER'])
          assert number > 0
          path = pathlib.Path(os.environ['REQUEST_FILE'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({'pr': number}))
          print('payload stack number:', os.environ['STACK_NUMBER'] or 'none')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approval-merge-request
          path: ${{ runner.temp }}/approval-merge-request/request.json
          retention-days: 1
          if-no-files-found: error
