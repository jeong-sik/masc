name = "masc_keeper_delegate_cancel"
description = """
Cancel one queued Keeper chat operation by exact target and operation_id."""
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 0 turns needed it across 6317 provider requests, and its
# 441 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 0 turns and saves the 441 B on the rest.
defer_loading = true
[[params]]
name = "target"
type = "object"
required = true
additional_properties = false

[[params.params]]
name = "kind"
type = "string"
required = true
enum = ["keeper"]

[[params.params]]
name = "name"
type = "string"
required = true

[[params]]
name = "operation_id"
type = "string"
required = true
