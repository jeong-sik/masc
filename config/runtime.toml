[models.opencode-go-deepseek-flash]
api-name = "deepseek-v4.1-flash"
# The DeepSeek V4 model cards (Flash and Pro) recommend temperature 1.0. This host
# honours temperature, so without this line the keeper default 0.4 is sent.
temperature = 1.0
max-context = 1000000
tools-support = true
thinking-support = true
streaming = true
# No effort ladder is expressible from runtime.toml (the adapter never sets
# accepted_reasoning_efforts), so a declared effort is rejected before
# dispatch. Uncontrolled: the gateway default decides.
reasoning-uncontrolled = true

[models.opencode-go-deepseek-flash.capabilities]
max-output-tokens = 384000
# No effort ladder is expressible from runtime.toml, and a bare
# enable_thinking has no encoding under the Reasoning_effort dialect, so no
# control is declared at all. Default-on reasoning verified by probe
# (reasoning_content without any effort param, 2026-11-04): the
# No_thinking_control + supports_reasoning admission arm passes.
thinking-control-format = "none"
# SSE streams reasoning under delta.reasoning_content (probed 2026-11-04).
reasoning-streaming-format = "delta:reasoning_content"

[opencode_go.opencode-go-deepseek-flash]

[models.openrouter-deepseek-v4-1-flash]
api-name = "deepseek/deepseek-v4.1-flash-1017"
