name: PR type-check (dune build @check)

# Why this exists: no workflow that runs on `pull_request` executed
# `dune build @check`. On 2026-11-03 three PRs merged with a green PR-stage
# check (changelog format only) and each then broke main's type-check:
# #47672 (e745acf9), #47639 (4845937b), #47661 (804372bf).
#
# 2026-11-10: the `paths:` filter moved from the workflow trigger into a
# `changes` job. A workflow-level filter produced no check context at all
# for PRs outside the filter (observed: #51107, changelog+toml only, no
# type-check check-run), and that absence is exactly what kept this check
# from being made required — a required check that never appears blocks
# those PRs forever. #50746 merged two minutes after its type-check went
# red because nothing required the result (10:45:48Z failure, 10:48:19Z
# merge). Operator decision (ask aske1aa44782fd05693, choice c1,
# 2026-11-10): adopt in two stages — first give every PR a check context
# (this change), verify the skip path, then require the check in the
# branch ruleset.
#
# The filter is deliberately fail-closed (review P2-1 on #51155): the file
# listing is captured with its exit status, so an API failure fails this
# job red instead of producing an empty list that would read as "no
# sources" and skip the check. A PR at the 3000-file listing cap cannot be
# filtered reliably and is checked in full.
on:
  # workflow_dispatch lets a maintainer re-check a branch on demand, and is the
  # only way to time this job without opening a throwaway source change.
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

# Supersede an older run of the same PR. A PR-stage check has no receipt to
# protect, so cancelling a stale head is safe and keeps the queue short.
concurrency:
  group: pr-type-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # GET /pulls/{n}/files needs Pull requests read; the repo's other
      # workflows declare the same permission for this call.
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      # No checkout: the PR file list comes from the API, so an out-of-scope
      # PR costs one short job instead of a toolchain build.
      - name: Match PR files against source patterns
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "workflow_dispatch — no PR to filter, running the check"
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files listing caps at 3000 entries; at or beyond the cap the
          # list is truncated and cannot prove "no sources". Fail toward
          # more checking, never less.
          if [ "${PR_CHANGED_FILES:-0}" -ge 3000 ]; then
            echo "PR lists ${PR_CHANGED_FILES} changed files (API cap 3000) — running the check"
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: command substitution propagates the API call's exit
          # status to set -e, so a 403/rate-limit/network failure fails this
          # job red rather than silently skipping the type-check.
          files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename')"
          src=false
          while IFS= read -r f; do
            case "$f" in
              # docs/evidence keeps .ml snapshots as data. No dune file under
              # docs/ builds them, so a docs-only PR needs no type-check.
              docs/*) continue ;;
              # The root `dune` file builds every tracked directory, so
              # sources are matched repository-wide (#48323).
              *.ml|*.mli|*.inc) src=true; break ;;
              dune|*/dune|dune-project) src=true; break ;;
              *.opam) src=true; break ;;
              # A change to the reusable actions or to this workflow itself
              # must be checked by this workflow.
              .github/actions/*) src=true; break ;;
              .github/workflows/pr-type-check.yml) src=true; break ;;
            esac
          done <<< "$files"
          echo "src=$src" >> "$GITHUB_OUTPUT"

  type-check:
    needs: [changes]
    # Skipped here rather than at the workflow level so the check context
    # always exists; a skipped conclusion satisfies a required status check.
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DUNE_JOBS: '4'
      DUNE_CACHE: enabled-except-user-rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dune build cache location
        shell: bash
        run: echo "DUNE_CACHE_ROOT=$RUNNER_TEMP/masc-dune-cache-pr" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-ocaml-toolchain
      - uses: ./.github/actions/pin-ocaml-deps
      # Test libraries must resolve: @check compiles the test tree.
      - uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test

      - name: Reuse Dune build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/masc-dune-cache-pr
          key: pr-dune-v1-${{ runner.os }}-${{ hashFiles('dune-project', '**/dune', '*.opam') }}-${{ github.sha }}
          restore-keys: |
            pr-dune-v1-${{ runner.os }}-${{ hashFiles('dune-project', '**/dune', '*.opam') }}-
            pr-dune-v1-${{ runner.os }}-

      - name: Type-check the tree (dune build @check)
        run: opam exec -- dune build --root . @check
