name: Terminal-Bench harness tests
# Run harness tests and source-pair comparisons only by explicit dispatch.
on:
  workflow_dispatch:
    inputs:
      compare_checkpoint_history:
        description: Compare checkpoint inventories with scheduler and runtime-events evidence
        type: boolean
        default: false
      compare_tui:
        description: Compare two verified Linux x64 manual probe artifacts
        type: boolean
        default: false
      compare_server:
        description: Compare two existing Linux x64 manual probe artifacts
        type: boolean
        default: false
      compare_vision:
        description: Measure vision artifact storage and load on the fixed source pair
        type: boolean
        default: false
      checkpoint_histories:
        type: string
        description: Matching checkpoint history files for the checkpoint comparison
        default: '128'
      checkpoint_noise:
        type: string
        description: Nonmatching directory entries for the checkpoint comparison
        default: '8192'
      baseline_run:
        type: string
        description: Baseline Linux probe workflow run ID
      baseline_artifact:
        type: string
        description: Baseline runtime-probe artifact ID
      baseline_commit:
        type: string
        description: Expected full baseline source commit
      candidate_run:
        type: string
        description: Candidate Linux probe workflow run ID
      candidate_artifact:
        type: string
        description: Candidate runtime-probe artifact ID
      candidate_commit:
        type: string
        description: Expected full candidate source commit
      repetitions:
        type: string
        description: Repetitions per binary, alternating order
        default: '3'
      input_cycles:
        type: string
        description: Repeated sets of ten individually acknowledged input transitions
        default: '1'
      keeper_metadata:
        type: string
        description: Optional checked-in alpha/beta JSON fixture path for both binaries
      retained_channels:
        type: string
        description: Synthetic alpha bindings loaded before Info scroll; zero skips this setup
        default: '0'
      server_tasks:
        type: string
        description: Synthetic initial task count for server comparison
        default: '250'
      server_workers:
        type: string
        description: Synthetic active agent records for server comparison (no Keeper processes)
        default: '0'
permissions:
  contents: read
concurrency:
  group: bench-tests-${{ inputs.compare_checkpoint_history && 'compare-checkpoint-history' || inputs.compare_vision && 'compare-vision' || inputs.compare_server && 'compare-server' || inputs.compare_tui && 'compare-tui' || 'pytest' }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject conflicting comparison modes
        env:
          TUI: ${{ inputs.compare_tui }}
          SERVER: ${{ inputs.compare_server }}
          VISION: ${{ inputs.compare_vision }}
          CHECKPOINT: ${{ inputs.compare_checkpoint_history }}
        run: |
          python3 - <<'PYVALIDATE'
          import os
          selected = [name for name in ('TUI', 'SERVER', 'VISION', 'CHECKPOINT') if os.environ[name] == 'true']
          if len(selected) > 1:
              raise SystemExit('Choose at most one comparison mode: ' + ', '.join(selected))
          PYVALIDATE
  pytest:
    needs: validate-inputs
    if: ${{ !inputs.compare_tui && !inputs.compare_server && !inputs.compare_vision && !inputs.compare_checkpoint_history }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmarks/terminal_bench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install harbor and pytest
        run: python -m pip install -r requirements.txt
      - name: Check TUI comparison receipt validation
        working-directory: ${{ github.workspace }}
        run: python3 test/test_tui_artifact_comparison.py
      - name: Run the bench tests
        run: python -m pytest tests -q -rs --junitxml="${RUNNER_TEMP}/bench-tests.xml"
      - name: Refuse skipped tests
        # Some tests skip when a tool such as jq is missing, which pytest
        # counts as a pass. Here every test must run.
        run: |
          python - "${RUNNER_TEMP}/bench-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          skipped = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in ET.parse(sys.argv[1]).iter("testcase")
              if case.find("skipped") is not None
          ]
          for name in skipped:
              print(f"::error::skipped in CI: {name}")
          sys.exit(1 if skipped else 0)
          PY
  compare-tui:
    needs: validate-inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_tui && !inputs.compare_server && !inputs.compare_vision && !inputs.compare_checkpoint_history }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install binary runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libffi8 libgmp10 libpq5 libssl3t64 libzstd1 zlib1g libncurses6 libtinfo6
      - name: Check TUI comparison receipt validation
        run: python3 test/test_tui_artifact_comparison.py
      - name: Verify identity and compare acknowledged frames
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPETITIONS: ${{ inputs.repetitions }}
          INPUT_CYCLES: ${{ inputs.input_cycles }}
          KEEPER_METADATA: ${{ inputs.keeper_metadata }}
          RETAINED_CHANNELS: ${{ inputs.retained_channels }}
        run: |
          fixture_args=()
          if [[ -n "$KEEPER_METADATA" ]]; then
            fixture_args=(--keeper-metadata "$KEEPER_METADATA")
          fi
          exec python3 scripts/harness/perf/compare_tui_artifacts.py \
            --baseline runtime-baseline --baseline-run "$BASELINE_RUN" \
            --baseline-artifact "$BASELINE_ARTIFACT" --baseline-commit "$BASELINE_COMMIT" \
            --candidate runtime-candidate --candidate-run "$CANDIDATE_RUN" \
            --candidate-artifact "$CANDIDATE_ARTIFACT" --candidate-commit "$CANDIDATE_COMMIT" \
            --repetitions "$REPETITIONS" --input-cycles "$INPUT_CYCLES" \
            --retained-channels "$RETAINED_CHANNELS" \
            "${fixture_args[@]}" \
            --output-dir comparison-results
      - name: Retain raw observations and identity receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-artifact-comparison-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: comparison-results/
          if-no-files-found: warn
  server-harness-tests:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s test -p test_server_artifact_comparison.py -v
      - run: python3 -m unittest discover -s scripts/harness/perf -p test_vision_artifact_compare.py -v
      - run: python3 test/test_checkpoint_history_comparison.py
  compare-server:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_server && !inputs.compare_tui && !inputs.compare_vision && !inputs.compare_checkpoint_history }}
    needs: [validate-inputs, server-harness-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require one comparison mode
        env:
          COMPARE_TUI: ${{ inputs.compare_tui }}
        run: test "$COMPARE_TUI" != true
      - name: Install the Linux release runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libffi8 libgmp10 libpq5 libssl3t64 libzstd1 zlib1g libncurses6 libtinfo6
      - name: Verify artifacts and compare isolated servers
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TASKS: ${{ inputs.server_tasks }}
          SERVER_WORKERS: ${{ inputs.server_workers }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          exec python3 scripts/harness/perf/compare_server_artifacts.py \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --baseline-run "$BASELINE_RUN" --baseline-artifact "$BASELINE_ARTIFACT" \
            --baseline-commit "$BASELINE_COMMIT" \
            --candidate-run "$CANDIDATE_RUN" --candidate-artifact "$CANDIDATE_ARTIFACT" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --repetitions "$REPETITIONS" --tasks "$SERVER_TASKS" --workers "$SERVER_WORKERS" \
            --output comparison-results
      - name: Retain complete or partial HTTP receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-artifact-comparison-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: comparison-results/
          if-no-files-found: warn

  compare-vision:
    needs: validate-inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_vision && !inputs.compare_server && !inputs.compare_tui && !inputs.compare_checkpoint_history }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ocaml-toolchain
      - uses: ./.github/actions/pin-ocaml-deps
      - uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep
      - name: Measure the same vision artifacts on both source commits
        env:
          DUNE_JOBS: "2"
        run: |
          python3 scripts/harness/perf/vision_artifact_compare.py \
            --output "${RUNNER_TEMP}/vision-results" --count 40 --seconds 90 --pairs 3
      - name: Retain identity, latency, scheduler and runtime-event receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vision-artifact-comparison-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vision-results/summary.json
            ${{ runner.temp }}/vision-results/fixture-sha256.txt
            ${{ runner.temp }}/vision-results/window-*/receipt.json
            ${{ runner.temp }}/vision-results/window-*/cleanup.json
            ${{ runner.temp }}/vision-results/window-*/failure.json
            ${{ runner.temp }}/vision-results/window-*/stdout.jsonl
            ${{ runner.temp }}/vision-results/window-*/stderr.txt
            ${{ runner.temp }}/vision-results/window-*/rtev_*.txt
            ${{ runner.temp }}/vision-results/window-*/rtev_*-control/ready
            ${{ runner.temp }}/vision-results/window-*/rtev_*-control/ended
            ${{ runner.temp }}/vision-results/window-*/state/window-start
            ${{ runner.temp }}/vision-results/window-*/state/window-complete
  compare-checkpoint-history:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_checkpoint_history && !inputs.compare_tui && !inputs.compare_server }}
    needs: [validate-inputs, server-harness-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Require one comparison mode
        env:
          TUI: ${{ inputs.compare_tui }}
          SERVER: ${{ inputs.compare_server }}
          VISION: ${{ inputs.compare_vision }}
        run: test "$TUI" != true && test "$SERVER" != true && test "$VISION" != true
      - uses: ./.github/actions/setup-ocaml-toolchain
      - name: Build only the runtime-events readers
        run: |
          # Resolve the reader dependency from the repository's dependency lock.
          reader_eio_version="$(python3 - <<'PYVERSION'
          import pathlib, re
          locked = pathlib.Path('masc.opam.locked').read_text()
          versions = re.findall(r'^\s*"eio"\s*\{=\s*"([0-9.]+)"\}\s*$', locked, re.M)
          if len(versions) != 1:
              raise SystemExit('expected one exact numeric eio version in masc.opam.locked')
          print(versions[0])
          PYVERSION
          )"
          opam install -y dune "eio.$reader_eio_version"
          mkdir -p "$RUNNER_TEMP/checkpoint-readers"
          cp tools/rtev_trace/*.ml tools/rtev_trace/dune "$RUNNER_TEMP/checkpoint-readers/"
          printf '(lang dune 3.17)\n' > "$RUNNER_TEMP/checkpoint-readers/dune-project"
          opam exec -- dune build --root "$RUNNER_TEMP/checkpoint-readers" ./rtev_fibers.exe ./rtev_watch.exe
      - name: Install Linux binary libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libffi8 libgmp10 libpq5 libssl3t64 libzstd1 zlib1g libncurses6 libtinfo6
      - name: Compare checkpoint workload on this runner
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_HISTORIES: ${{ inputs.checkpoint_histories }}
          CHECKPOINT_NOISE: ${{ inputs.checkpoint_noise }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          python3 scripts/harness/perf/compare_checkpoint_history.py \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --baseline-run "$BASELINE_RUN" --baseline-artifact "$BASELINE_ARTIFACT" \
            --baseline-commit "$BASELINE_COMMIT" \
            --candidate-run "$CANDIDATE_RUN" --candidate-artifact "$CANDIDATE_ARTIFACT" \
            --candidate-commit "$CANDIDATE_COMMIT" --repetitions "$REPETITIONS" \
            --histories "$CHECKPOINT_HISTORIES" --noise "$CHECKPOINT_NOISE" \
            --tracers "$RUNNER_TEMP/checkpoint-readers/_build/default" --output checkpoint-results
      - name: Retain raw measurements, including failed sessions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpoint-history-comparison-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: checkpoint-results/
          if-no-files-found: warn
