\* A refusal no smaller request would avoid narrows anyway, which is how a
\* quota storm walks the width down and leaves it there.
\* Expected: WidthHoldsOnOtherRefusal violated.
SPECIFICATION SpecNarrowOnOther
CONSTANTS
    Backlog = 8
    Capacity = 2
INVARIANT TypeOK
PROPERTY WidthHoldsOnOtherRefusal
CHECK_DEADLOCK FALSE
