name = "masc_browser_tabs"
description = """
Returns tabs with the selected clientId; carry this identity into BrowserRead/BrowserInteract when using a live browser.
List open tabs in live Firefox/Zen (operator extension) or isolated automation Firefox. Returns an array of {id, active, title, url}; live also includes index/windowId. Choose relevant titles/URLs, then pass the returned id and same lane to BrowserRead."""
additional_properties = false

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation"]
description = "Which browser lane to ask. Default: live."
default = "live"

[[params]]
name = "clientId"
type = "string"
description = "Live native connection UUID returned by BrowserTabs/Read or the browser clients endpoint. Required when multiple live browsers are connected. A stale ID never selects another browser. Omit for automation."
