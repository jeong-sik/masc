# Atlassian's remote MCP server (Jira, Confluence, Compass, Bitbucket).
#
# Only the server is named. Its endpoints, the scopes it publishes and
# whether a client has to be registered by hand all come from the two
# well-known documents it serves, so none of that can go stale in this file.
#
# https://www.atlassian.com/platform/remote-mcp-server

id = "atlassian"
label = "Atlassian"
mcp_url = "https://mcp.atlassian.com/v1/mcp/authv2"

# Where the two halves of the answer land in the Keeper's own secret
# projection. The access token is an env entry because that is what a tool
# call reads; the refresh token is a file entry because it outlives the
# access tokens it mints and an environment is read by everything a Keeper
# runs.
access_token_env = "ATLASSIAN_ACCESS_TOKEN"
refresh_token_file = "atlassian/refresh_token"

# Exchange again this long before the stated expiry. Atlassian's access
# tokens live one hour; ten minutes of margin covers a turn that starts just
# under the wire.
renew_before_sec = 600

# Parameters this server wants on the authorize call beyond what the OAuth
# and MCP specs define. `resource` is not here: it is RFC 8707 and comes from
# discovery, so every provider gets it without saying so.
[authorize_params]
audience = "api.atlassian.com"
