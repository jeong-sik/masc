name = "masc_msx_restore"
description = "Restore a named MSX checkpoint, replacing the current machine only after validation. Resumes the saved frame, mounted media and input ledger without rebooting."
additional_properties = false
defer_loading = true

[[params]]
name = "slot"
type = "string"
description = "Checkpoint name: 1..64 letters, digits, underscores or hyphens. Default quick."
default = "quick"
