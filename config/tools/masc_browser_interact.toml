name = "masc_browser_interact"
description = """
Click, fill, scroll, hover, drag, follow a link, activate a browser tab, set the page viewport size, or set actual browser zoom. tap_at and swipe send a touch pointer (not a mouse) on a live BiDi connection or the owned Firefox: tap_at presses and releases at an observed point, swipe holds the touch from one observed point to another; Stagehand and a connected WebExtension refuse them before any effect. set_viewport takes width and height together in CSS pixels (100–4096) on a live BiDi connection, an automation Firefox or Stagehand; on a live BiDi connection or an automation Firefox, giving neither restores the browser's own size. An automation Firefox resizes its window and keeps at least about 500 x 120 outer pixels, so a smaller request is refused with the size the page kept. Read scene/screenshot geometry again afterward. set_zoom requires an exact WebExtension client/tab, expectedUrl and factor 0.3–5. It measures the resulting zoomFactor and zoomScope; Firefox per-origin zoom can affect same-site tabs. Read scene/screenshot geometry again afterward. hover/drag_to accept observed elements (selector or scene reference) without guessing screenshot coordinates. On connections other than ego they resolve visible, unobstructed targets in the current viewport; scroll and re-read offscreen targets first. Ego selector hover uses SDK resolution and auto-scrolling. hover_at (no click) and drag move a trusted pointer. automation, Stagehand Chromium, live webdriver_bidi and ego task spaces serve these actions; Stagehand and ego support custom drag paths but require durationMs=0. activate_tab is live-only: WebExtension verifies active=true without window focus; live BiDi activates and focuses its browser window; Ego requires a native managed Page (including explicit adoption) and expectedUrl, uses native TaskSpace CDP to restore only a minimized window and activate the same target, and reports native active/window state without promising rendered UI or OS focus. Use Ego activation before hand_off, never during delegated control; after an unconfirmed response observe the same Space rather than replaying. A live request its connection cannot serve is refused before input as live_transport_unsupported; servingClients are the connected browsers that can. List that connection's tabs first: tab IDs are per connection.
On an ego task space action=workflow runs known native Page calls in steps, then returns a final native snapshot. Methods include click, dblclick, hover, fill, focus, press, selectOption, goto, reload, native URL/selector/load waits, and keyboard.type/insertText/paste/press. Focus an observed editor before keyboard input; paste accepts text and optional HTML, and the SDK restores the native clipboard. SDK methods own resolution and waits. A step failure stops the sequence and retains completed steps; inspect before continuing and never replay the workflow. expectedUrl guards the initial page only; later navigation is allowed. Use separate workflows when an intermediate observation requires new judgment. No host JavaScript is accepted. Receipt-less holding input (including the current SDK keyboard.type) stops before later steps and remains outside the completed prefix with release unconfirmed, even when Page.info has no dialog. Retain the original connection and use its private operator input-reset confirmation after the operator checks/resets that Space; never replay the input.
On an ego task space, selector click/fill/hover/double_click/select_option use ego native Page methods. The selector follows ego SDK syntax (snapshot refs, semantic locators, CSS, iframe/shadow traversal); ego owns target resolution, actionability and auto-scrolling. Prefer BrowserRead mode=snapshot and its refs. Ego selectOption follows native programmatic selection semantics, including disabled options. TUI documentId/nodeId actions retain their scene adapter.
The tab is explicit. Browser JavaScript is available only through workflow evaluate/waitForFunction on Ego, never through host execution. Native workflow fetch obeys browser CORS. These calls may change external state, so their failure is not replay permission. drag/drag_to issue trusted pointer input; a receipt does not prove the application accepted a drop. On an ego connection only a selector drag_to without via is answered by the SDK, and it frees the next input when its receipt has no dialog. Once they have sent input, a coordinate drag, a drag_to with via and a drag by scene node end as an unknown outcome and block the next input until the operator resets it; one refused before any input leaves input usable. HTML5 DataTransfer/drop is not guaranteed by Firefox and has no synthetic fallback. Read again after success or failure before retrying: page handlers can change external state. click/fill require an inspected target; ego applies its native actionability rules. On automation, Stagehand Chromium and live webdriver_bidi, click resolves an unobstructed selector or scene node and sends native pointerDown/pointerUp, supporting trusted pointerdown/mousedown menus; disabled and aria-disabled targets are refused. On those three connections click captures the current URL when expectedUrl is omitted, then checks it before input. Ego reads the URL before entering its SDK method, which can itself wait; this is not an atomic navigation guard. WebExtension retains DOM click. Ego fill follows its native SDK input behavior; other connections fill text inputs/textarea with input/change events. Fill does not press Enter or submit. scroll_at scrolls the pane under the point. follow_link bypasses click handlers for observed same-tab HTTP(S) HTML/SVG anchors (_self/_top/_parent); rejects downloads, new-window targets, noreferrer and explicit referrerpolicy. destinationUrl is intent, not loaded-page evidence."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 3,294 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 22개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름이 남고,
# 부르면 그 턴에 스키마가 붙는다. 한 줄 요약은 그 답에 한 번 나온다.
defer_loading = true

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation", "stagehand"]
description = "Optional advanced browser override. Omit only for initial discovery or opening a work browser; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "framePath"
type = "array"
items = { type = "string" }
description = "Observed outer-to-inner iframe selectors (preserve CSS escapes). Only for click, fill, select_option and scroll with a selector, on an automation Firefox or a live BiDi connection; the selector and expectedUrl then refer to the innermost frame document. Omit for the top document. An ego connection takes none: give target instead."

[[params]]
name = "expectedUrl"
type = "string"
description = "Observed URL guard; required for explicit pointer actions, hover/drag_to, follow_link and activate_tab. Required also for double_click/type_text/press_key/set_zoom/set_viewport. Semantic click may omit it. Ego then reports the URL read before SDK entry; other native backends capture and guard the resolved page URL."

[[params]]
name = "action"
type = "string"
required = true
enum = ["workflow", "set_zoom", "set_viewport", "tap_at", "swipe", "activate_tab", "follow_link", "double_click", "double_click_at", "type_text", "press_key", "click", "fill", "select_option", "scroll", "click_at", "scroll_at", "hover", "drag_to", "hover_at", "drag"]

[[params]]
name = "selector"
type = "string"
description = "click/double_click/fill/hover/select_option: observed selector; alternative to documentId/nodeId (select_option takes the selector only). Ego uses its native SDK locator syntax and actionability, including refs and iframe/shadow traversal. Other connections require one visible top-document CSS match."

[[params]]
name = "text"
type = "string"
description = "fill replaces the value of a text input or textarea, or the whole content of a contenteditable editor (typed in as insertText, so a rich editor sees input events); type_text sends native Unicode text to the currently focused enabled editable control. Empty fill clears. Control characters require explicit press_key, so text cannot navigate focus or submit. Text is never echoed."

[[params]]
name = "value"
type = "string"
description = "select_option only: exact option value. Ego passes {value} to native selectOption; it follows SDK selection semantics and may programmatically select disabled options. Other connections require one enabled matching option in a single-choice select and refuse ambiguous, disabled or multiple-select targets before any effect. The select gets input and change events; this is not a trusted click on the list."

[[params]]
name = "values"
type = "array"
items = { type = "string" }
description = "select_option only, instead of value: distinct option values; [] clears selection. Ego passes an array of {value} to native selectOption and returns its selected values; it permits disabled options and does not independently validate later page-handler changes. Other connections require a multiple select, check each value names exactly one enabled option before changing selection, and report selectedValues after handlers. This is programmatic selection, not trusted pointer input."

[[params]]
name = "x"
type = "integer"
description = "scroll/scroll_at horizontal CSS-pixel delta."

[[params]]
name = "y"
type = "integer"
description = "scroll/scroll_at vertical CSS-pixel delta."

[[params]]
name = "button"
type = "string"
enum = ["primary", "middle", "secondary"]
description = "click_at only: the mouse button, primary by default. middle and secondary need native pointer input: a live BiDi connection, the owned Firefox or Stagehand. A connected WebExtension refuses them before any effect."

[[params]]
name = "clientId"
type = "string"
description = "Retain the observed live clientId on every subsequent tab read/action; stale IDs fail. Omit for a work browser."

[[params]]
name = "target"
type = "object"
additional_properties = false
description = "click/fill/hover/double_click on an ego connection, with the observed top-level expectedUrl and without selector or documentId/nodeId: {ref} from the latest BrowserRead/masc_browser_read snapshot of the same page (12 for ref=12), {role, name} or {text}. Read a new snapshot after page changes/input or a stale/unknown ref refusal. A ref from an iframe's snapshot acts inside that frame; role and text also search frames when the top document has none; framePath is not combined with target. exact (default true) matches the whole name or text; false matches a part, any case."

[[params.params]]
name = "ref"
type = "integer"
minimum = 0

[[params.params]]
name = "role"
type = "string"

[[params.params]]
name = "name"
type = "string"

[[params.params]]
name = "text"
type = "string"

[[params.params]]
name = "exact"
type = "boolean"

[[params]]
name = "documentId"
type = "string"
description = "Scene document with nodeId; required for follow_link. type_text/press_key require the observed documentId with expectedUrl and retain current focus. Reload fails."

[[params]]
name = "nodeId"
type = "string"
description = "Scene node; survives reordering, fails on detach/replacement."

[[params]]
name = "point"
type = "object"
description = "click_at/hover_at/scroll_at/tap_at: normalized x/y in [0,1); copy screenshot viewport/expectedUrl."

additional_properties = false

