\* The second slot never speaks and the first is quiet twice; fair passes and ticks. Expected: no violation.
SPECIFICATION FairSpec
CONSTANTS
    Facts <- Facts3
    Order <- OrderAB
    Mute = {"b"}
    MaxGen = 2
    MaxQuiet = 2
    Bug = "none"
INVARIANT TypeOK
INVARIANT Shape
INVARIANT NoResendOfRefused
INVARIANT SetAsideOnlyWhenAllRefused
INVARIANT MemoryIsOfThisGeneration
INVARIANT ReaskOnlyOnTick
INVARIANT RefusalsWithinTwoNMinusOne
PROPERTY PassSettlesItsFacts
PROPERTY SizeOnlyFromSizedRefusals
PROPERTY ResetEmptiesMemory
PROPERTY Settles
CHECK_DEADLOCK FALSE
