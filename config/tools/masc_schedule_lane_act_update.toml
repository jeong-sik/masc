name = "masc_schedule_lane_act_update"
description = """
Atomically replace a scheduled or due schedule with this Lane action. Keep schedule_id; \
a new schedule_instance_id separates future evidence. Running and terminal \
requests cannot change. If both due inputs and recurrence_kind are omitted, \
the latest stored due time, recurrence and expiry are kept; installation_id \
and action are replaced by this call's arguments. A changed due time before \
the current second is refused with error_kind due_already_past. A named \
caller may replace only a schedule it made; another's is refused with \
error_kind not_schedule_owner. Requester and scheduler stay unchanged. The replacement is a Lane action whatever the stored \
schedule was. To replace a Keeper wake with a Keeper wake, use \
masc_schedule_update."""
additional_properties = false
defer_loading = true

[[params]]
name = "schedule_id"
type = "string"
required = true
description = "Stable id of the scheduled or due request to replace."

[[params]]
name = "due_in_sec"
type = "integer"
minimum = 1
description = "Seconds after the server runs this call."

[[params]]
name = "due_at_unix"
type = "number"
description = "Unix timestamp in seconds."

[[params]]
name = "due_at_iso"
type = "string"
description = """
RFC 3339 timestamp with Z or an explicit numeric offset, for example
2026-08-02T09:00:00+09:00. It is normalized to whole-second UTC."""

[[params]]
name = "installation_id"
type = "string"
required = true
description = """
The declared Lane Add-on installation (its declaration id) whose live worker \
runs action at each due time. Read the declared installations with \
masc_lane_inspect; a name that is not declared fails at the due time."""

[[params]]
name = "action"
type = "object"
required = true
description = """
The action object the installation's package schema accepts, such as \
{"kind": "compose", "questions": 5}. It is checked against the worker that \
runs it, at each due time."""

[[params]]
name = "requested_at_unix"
type = "number"
description = """
Optional replacement request timestamp for replay/tests. Recorded only; no
due time counts from it."""

[[params]]
name = "expires_at_unix"
type = "number"
description = "Optional expiry timestamp. A content edit that omits it keeps the stored expiry. An update that also sends a due input or recurrence_kind and omits it leaves the schedule without an expiry."

[[params]]
name = "recurrence_kind"
type = "string"
description = "Send one_shot to remove recurrence; omission keeps the stored recurrence."
enum = ["one_shot", "interval", "daily", "cron"]

[[params]]
name = "recurrence_interval_sec"
type = "integer"
description = "Required when recurrence_kind is interval."

[[params]]
name = "recurrence_hour"
type = "integer"
description = "Required when recurrence_kind is daily; local hour in 0..23."

[[params]]
name = "recurrence_minute"
type = "integer"
description = "Required when recurrence_kind is daily; local minute in 0..59."

[[params]]
name = "recurrence_second"
type = "integer"
description = "Optional when recurrence_kind is daily; local second in 0..59."

[[params]]
name = "recurrence_cron"
type = "string"
description = """
Required when recurrence_kind is cron. Standard 5-field cron expression."""

[[params]]
name = "recurrence_timezone"
type = "string"
description = """
Required for daily or cron. Fixed-offset only: UTC, Asia/Seoul/KST, or an
offset such as +09:00/UTC+09:00."""
