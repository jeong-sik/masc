    MaxMsgs = 3
    MaxLines = 6
    MaxOpen = 1
    MaxPurges = 0
    MaxResets = 1
    MaxFails = 1
    MaxCloseFails = 1
    MaxLate = 0
    MaxChgFails = 1
    MaxCrashes = 0
    MaxStops = 1
    MaxRemoves = 0
    MaxReplaces = 0
    MaxCuts = 0
    MaxBad = 0
    MaxRecreates = 0
    MaxBreaks = 0
    MaxHand = 0
