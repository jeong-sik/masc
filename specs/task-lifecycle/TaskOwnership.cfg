\* The target lifecycle. Two Tasks and two agents are the smallest model in
\* which one agent can end up holding two Tasks.

SPECIFICATION SpecClean

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    Safety

PROPERTIES
    VerdictNeverAssigns
    CancelNeedsStanding

CHECK_DEADLOCK
    FALSE
