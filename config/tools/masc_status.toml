name = "masc_status"
title = "Project Status"
description = """
Get current project status: active agents, task queue, recent broadcasts, \
and cluster info. Use when you need a snapshot of who is online and what \
tasks are available. Call after masc_start to orient yourself. Pair with \
masc_tasks for detailed backlog."""
additional_properties = false

[[params]]
name = "if_revision"
type = "string"
description = """
Optional producer revision from the previous snapshot; matching revisions \
return unchanged."""
