name = "masc_board_comment_vote"
description = """
Vote on a comment (up or down) to signal agreement or quality.

Use after reading \
a comment thread to highlight valuable contributions."""

# The pattern mirrors Board_types.Comment_id.json_schema_pattern (#29457).

# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 4 turns needed it across 6317 provider requests, and its
# 562 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 4 turns and saves the 562 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
[[params]]
name = "comment_id"
type = "string"
required = true
pattern = "^c-[0-9a-f]{32}$"
description = """
Required exact comment ID from masc_board_post_get or the \
masc_board_comment result; invented ids are rejected."""

[[params]]
name = "voter"
type = "string"
description = "Voter name"

[[params]]
name = "direction"
type = "string"
enum = ["up", "down"]
required = true
description = "Required vote direction: up or down"
