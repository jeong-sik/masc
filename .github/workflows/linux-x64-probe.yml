name: Manual probe artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifact to build (no provider calls)
        type: choice
        required: true
        default: linux-x64
        options:
          - linux-x64
          - macos-arm64
          - stagehand-model-macos-arm64
          - rc-pptx-trace
          - lane-fusion-container

      capture_item_http:
        description: Exercise Item TUI and isolated HTTP routes with the compiled binaries and production dashboard
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rc-pptx-trace:
    if: inputs.target == 'rc-pptx-trace'
    name: Trace the original RC PPTX case
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostic
      - uses: actions/checkout@v7
        with:
          ref: 2dd5e16b83683e8d2a025597205cbc2dfb02f41e
          path: source
      - name: Install original media tools and tracer
        run: |
          sudo apt-get update
          sudo apt-get install -y strace poppler-utils libreoffice-impress python3-venv libpq5 fonts-dejavu-core
      - name: Download and verify the original RC artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p evidence binary
          gh api repos/"$GH_REPO"/actions/artifacts/11155901156 > evidence/artifact.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("evidence/artifact.json").read_text())
          assert a["workflow_run"]["head_sha"] == "2dd5e16b83683e8d2a025597205cbc2dfb02f41e"
          assert a["workflow_run"]["id"] == 36847714318 and not a["expired"]
          PY
          gh api repos/"$GH_REPO"/actions/artifacts/11155901156/zip > artifact.zip
          echo "e124444f7389bed13d447fdf0e3c61d405db27edb0ba3dc99a69af30d746cfe3  artifact.zip" | sha256sum --check
          unzip -q artifact.zip -d binary
          chmod +x binary/masc-linux-x64
          sha256sum binary/masc-linux-x64 > evidence/binary.sha256
          binary/masc-linux-x64 build-commit | tee evidence/binary-commit.txt
          test "$(cat evidence/binary-commit.txt)" = 2dd5e16b83683e8d2a025597205cbc2dfb02f41e
      - name: Regenerate the exact-source fixture
        run: |
          set -euo pipefail
          python3 source/scripts/ci/prepare-presentation-verifier.py 2>&1 | tee evidence/prepare.log
          cp "$RUNNER_TEMP/masc-presentation-verifier/inputs/"* evidence/
          "$RUNNER_TEMP/masc-presentation-verifier/.masc/runtime-tools/presentation/bin/python3" -m pip freeze > evidence/python-packages.txt
          printf 'Fixture regenerated from exact source; original RC fixture bytes unavailable.\n' > evidence/fixture-provenance.txt
      - name: Trace one original test without changing its assertions or time limits
        run: |
          set -euo pipefail
          uname -a > evidence/environment.txt
          cat /proc/self/limits >> evidence/environment.txt
          dpkg-query -W strace poppler-utils libreoffice-impress fonts-dejavu-core >> evidence/environment.txt
          if [ -r /sys/fs/cgroup/memory.events ]; then
            cat /sys/fs/cgroup/memory.events > evidence/memory-before.txt
          else
            printf 'unavailable: /sys/fs/cgroup/memory.events\n' > evidence/memory-before.txt
          fi
          cat /proc/self/cgroup > evidence/cgroup-before.txt
          cat /proc/self/mountinfo > evidence/mountinfo-before.txt
          strace -ff -ttt -T -yy -s 256 -o evidence/media.trace -e trace=process,signal,desc,file,io_uring_setup,io_uring_enter,io_uring_register             python3 diagnostic/scripts/ci/run_pptx_case.py               --source-root source --expected-source 2dd5e16b83683e8d2a025597205cbc2dfb02f41e               --binary binary/masc-linux-x64 --presentation-base "$RUNNER_TEMP/masc-presentation-verifier"               --receipt evidence/receipt.json 2>&1 | tee evidence/test.log
      - name: Capture final memory counters
        if: always()
        run: |
          mkdir -p evidence
          if [ -r /sys/fs/cgroup/memory.events ]; then
            cat /sys/fs/cgroup/memory.events > evidence/memory-after.txt
          else
            printf 'unavailable: /sys/fs/cgroup/memory.events\n' > evidence/memory-after.txt
          fi
          cat /proc/self/cgroup > evidence/cgroup-after.txt
          cat /proc/self/mountinfo > evidence/mountinfo-after.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc-pptx-trace-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  linux-x64-probe:
    if: inputs.target == 'linux-x64' || (inputs.target == 'macos-arm64' && inputs.capture_item_http)
    name: Build ${{ inputs.target }} runtime probe
    runs-on: ${{ inputs.target == 'macos-arm64' && 'macos-14' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      PROBE_OUT: ${{ github.workspace }}/artifacts/runtime-probe

    steps:
      - uses: actions/checkout@v7

      - name: Setup OCaml for macOS runtime probe
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Install native macOS release dependencies
        if: runner.os == 'macOS'
        run: |
          brew install flock gmp libpq openssl@3 zstd ripgrep poppler ffmpeg
          openssl_prefix="$(brew --prefix openssl@3)"
          libpq_prefix="$(brew --prefix libpq)"
          {
            echo "$libpq_prefix/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"

      - name: Install OCaml release dependencies for macOS
        if: runner.os == 'macOS'
        run: |
          scripts/opam-pin-external-deps.sh --with-compact-protocol --with-bisect
          opam install ./masc.opam --deps-only --with-test --yes

      - name: Build release binaries for macOS arm64
        if: runner.os == 'macOS'
        run: |
          opam exec -- dune build --release bin/main_eio.exe bin/masc_tui.exe \
            bin/masc_browser_host.exe bin/deployment_preflight_helper.exe
          mkdir -p "$PROBE_OUT"
          cp _build/default/bin/{main_eio,masc_tui,masc_browser_host,deployment_preflight_helper}.exe "$PROBE_OUT/"
          test "$("$PROBE_OUT/main_eio.exe" build-commit)" = "$GITHUB_SHA"
          test "$("$PROBE_OUT/masc_tui.exe" --build-commit)" = "$GITHUB_SHA"
          otool -L "$PROBE_OUT/main_eio.exe" > "$PROBE_OUT/native-dependencies.txt"

      - name: Build release binaries for Linux x64
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-linux-release.sh
          scripts/build-linux-release.sh --out "$PROBE_OUT"

      - name: Write and verify SHA-256 manifest
        run: |
          set -euo pipefail
          cd "$PROBE_OUT"
          shasum -a 256 deployment_preflight_helper.exe main_eio.exe masc_browser_host.exe masc_tui.exe > SHA256SUMS
          shasum -a 256 --check SHA256SUMS

      - name: Upload runtime probe
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target == 'macos-arm64' && 'macos-arm64-item' || inputs.target }}-probe-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ env.PROBE_OUT }}/
          if-no-files-found: error
          retention-days: 7

      - name: Exercise Item TUI with the matching compiled binary
        if: inputs.capture_item_http
        shell: bash
        run: |
          test "$("$PROBE_OUT/masc_tui.exe" --build-commit)" = "$GITHUB_SHA"
          python3 -u test/test_tui_keeper_portrait_pty.py "$PROBE_OUT/masc_tui.exe" 2>&1 \
            | tee "$RUNNER_TEMP/keeper-items-tui.log"

      - name: Set up Node for Item HTTP acceptance
        if: inputs.capture_item_http
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build exact-source production dashboard for Item HTTP acceptance
        if: inputs.capture_item_http
        working-directory: dashboard
        run: |
          corepack enable && corepack prepare pnpm@10.31.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi

      - name: Exercise isolated Item HTTP routes
        if: inputs.capture_item_http
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/item-http-acceptance.py \
            --binary "$PROBE_OUT/main_eio.exe" \
            --dashboard assets/dashboard --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/item-http-evidence" --capture-browser

      - name: Upload Item HTTP evidence without workspace credentials
        if: always() && inputs.capture_item_http
        uses: actions/upload-artifact@v7
        with:
          name: item-http-${{ inputs.target }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/keeper-items-tui/manifest.json
            ${{ runner.temp }}/keeper-items-tui/*.txt
            ${{ runner.temp }}/keeper-items-tui/*.pty
            ${{ runner.temp }}/keeper-items-tui.log
            ${{ runner.temp }}/item-http-evidence/browser-evidence.json
            ${{ runner.temp }}/item-http-evidence/item-server-*.png
            ${{ runner.temp }}/item-http-evidence/http-evidence.json
            ${{ runner.temp }}/item-http-evidence/tool-calls.json
            ${{ runner.temp }}/item-http-evidence/paid-account*.json
            ${{ runner.temp }}/item-http-evidence/paid-portrait*.png
            ${{ runner.temp }}/item-http-evidence/ledger-*.jsonl
            ${{ runner.temp }}/item-http-evidence/account.json
            ${{ runner.temp }}/item-http-evidence/account-after.json
            ${{ runner.temp }}/item-http-evidence/account-restarted.json
            ${{ runner.temp }}/item-http-evidence/portrait.png
            ${{ runner.temp }}/item-http-evidence/portrait-equipped.png
            ${{ runner.temp }}/item-http-evidence/portrait-restarted.png
            ${{ runner.temp }}/item-http-evidence/server.log
          if-no-files-found: error
          retention-days: 14


  macos-arm64-probe:
    if: inputs.target == 'macos-arm64'
    name: Build manual macOS arm64 runtime probe
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ocaml-toolchain
      - name: Set isolated probe directories
        run: |
          echo "PROBE_OUT=$RUNNER_TEMP/masc-macos-arm64-probe" >> "$GITHUB_ENV"
          echo "PROBE_STAGE=$RUNNER_TEMP/masc-macos-arm64-stage" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          brew install flock gmp libpq openssl@3 zstd
          libpq_prefix="$(brew --prefix libpq)"
          openssl_prefix="$(brew --prefix openssl@3)"
          {
            echo "$libpq_prefix/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"
      - name: Pin and install OCaml dependencies
        run: |
          scripts/opam-pin-external-deps.sh --with-compact-protocol --with-bisect
          opam install ./masc.opam --deps-only --locked --with-test --yes
      - name: Build runtime companions
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          scripts/check-version-truth.sh
          opam exec -- dune build --release \
            bin/main_eio.exe bin/masc_tui.exe bin/masc_browser_host.exe \
            bin/deployment_preflight_helper.exe
      - name: Bundle relocatable runtime with release filenames
        run: |
          mkdir -p "$PROBE_OUT"
          cp _build/default/bin/main_eio.exe "$PROBE_OUT/masc-macos-arm64"
          cp _build/default/bin/masc_tui.exe "$PROBE_OUT/masc-tui-macos-arm64"
          cp _build/default/bin/masc_browser_host.exe "$PROBE_OUT/masc-browser-host-macos-arm64"
          cp _build/default/bin/deployment_preflight_helper.exe "$PROBE_OUT/masc-deployment-preflight-helper-macos-arm64"
          cp scripts/check-runtime-deployment-preflight.sh "$PROBE_OUT/masc-check-runtime-deployment-preflight-macos-arm64"
          python3 scripts/package-macos-runtime.py --dist "$PROBE_OUT" \
            --stage "$PROBE_STAGE" --platform macos-arm64 --source-commit "$GITHUB_SHA"
      - name: Validate packaged identity and record dependencies
        run: |
          set -euo pipefail
          # Identity flags exit before opening a TTY or contacting a server.
          "$PROBE_STAGE/masc-tui" --version | tee "$PROBE_OUT/tui-version.txt"
          "$PROBE_STAGE/masc-tui" --build-commit | tee "$PROBE_OUT/tui-build-commit.txt"
          test "$(cat "$PROBE_OUT/tui-build-commit.txt")" = "$GITHUB_SHA"
          test -s "$PROBE_OUT/tui-version.txt"
          # Both companions use the same linked dune-build-info version.
          "$PROBE_STAGE/masc" --version > "$PROBE_OUT/server-version.txt"
          cmp "$PROBE_OUT/tui-version.txt" "$PROBE_OUT/server-version.txt"
          test "$("$PROBE_STAGE/masc" build-commit)" = "$GITHUB_SHA"
          cp "$PROBE_STAGE/runtime-provenance.json" "$PROBE_OUT/"
          {
            uname -a
            opam exec -- ocamlc -version
            opam list --installed --columns=name,version
            brew list --versions
            for binary in "$PROBE_STAGE"/masc "$PROBE_STAGE"/masc-tui \
              "$PROBE_STAGE"/masc-browser-host "$PROBE_STAGE"/masc-deployment-preflight-helper \
              "$PROBE_STAGE"/lib/*; do
              otool -L "$binary"
            done
          } > "$PROBE_OUT/dependencies.txt"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          receipt = dict(source_commit=os.environ['GITHUB_SHA'], platform='macos-arm64',
                         run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         release_verified=False, published=False)
          (Path(os.environ['PROBE_OUT']) / 'probe.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE
          cd "$PROBE_OUT"
          shasum -a 256 ./* > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Upload macOS arm64 runtime probe
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-probe-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/masc-macos-arm64-probe/
          if-no-files-found: error
          retention-days: 7

  stagehand-model-probe:
    if: inputs.target == 'stagehand-model-macos-arm64'
    name: Build manual macOS arm64 model probe
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ocaml-toolchain
      - name: Install native build dependencies
        run: |
          brew install flock gmp libpq openssl@3 zstd
          openssl_prefix="$(brew --prefix openssl@3)"
          libpq_prefix="$(brew --prefix libpq)"
          # Match the release build: piaf's C stubs also need the keg-only
          # OpenSSL headers and libraries, beyond pkg-config discovery.
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"
      - name: Pin and install OCaml dependencies
        run: |
          scripts/opam-pin-external-deps.sh --with-bisect
          opam install ./masc.opam --deps-only --locked --with-test --yes
      - name: Build probe
        id: build
        run: |
          opam exec -- dune build --profile release bin/stagehand_model_probe.exe
      - name: Exercise offline setup and validator controls
        id: controls
        run: |
          # Synthetic local config: no provider credentials or model callbacks.
          python3 scripts/stagehand-probe-controls.py \
            --binary _build/default/bin/stagehand_model_probe.exe \
            --fixtures test/fixtures/stagehand/llm-generate-params.json \
            --config test/fixtures/stagehand/runtime-publication.toml \
            --output "$RUNNER_TEMP/stagehand-offline-controls.json"
      - name: Package executable and source evidence
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PROBE_OUT: ${{ runner.temp }}/stagehand-model-probe
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$PROBE_OUT"
          cp _build/default/bin/stagehand_model_probe.exe "$PROBE_OUT/"
          cp test/fixtures/stagehand/llm-generate-params.json "$PROBE_OUT/"
          cp test/fixtures/stagehand/runtime-publication.toml "$PROBE_OUT/"
          cp docs/runbooks/stagehand-real-model-probe.md "$PROBE_OUT/README.md"
          cp "$RUNNER_TEMP/stagehand-offline-controls.json" "$PROBE_OUT/offline-controls.json"
          otool -L "$PROBE_OUT/stagehand_model_probe.exe" > "$PROBE_OUT/native-dependencies.txt"
          python3 scripts/stagehand-probe-manifest.py --directory "$PROBE_OUT" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: stagehand-model-probe-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/stagehand-model-probe/
          if-no-files-found: error
          retention-days: 7

  lane-fusion-ref:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'lane-fusion-container'
    name: Validate Fusion qualification ref
    runs-on: ubuntu-24.04
    steps:
      - name: Require a release branch or tag
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/v*|refs/tags/v*) ;;
            *) echo "Native Fusion qualification belongs to a Release/Tag candidate" >&2; exit 1 ;;
          esac

  lane-fusion-container-probe:
    needs: lane-fusion-ref
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'lane-fusion-container'
    name: Qualify isolated Fusion containers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize attempt evidence
        run: |
          set -euo pipefail
          PROBE_OUT="$RUNNER_TEMP/lane-fusion-container"
          echo "PROBE_OUT=$PROBE_OUT" >> "$GITHUB_ENV"
          mkdir -p "$PROBE_OUT/evidence"
          printf '%s\n' "$GITHUB_SHA" > "$PROBE_OUT/requested-head.txt"
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ocaml-toolchain
      - name: Install Linux native dependencies
        run: |
          set -euo pipefail
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgmp-dev libssl-dev libzstd-dev \
            libsqlite3-dev libpq-dev libev-dev libffi-dev zlib1g-dev libncurses-dev \
            m4 libprotobuf-dev protobuf-compiler
      - name: Pin and install OCaml dependencies
        run: |
          set -euo pipefail
          scripts/opam-pin-external-deps.sh --with-compact-protocol --with-bisect
          opam install ./masc.opam --deps-only --with-test --yes
      - name: Build exact-head native qualification executable
        id: build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          scripts/check-version-truth.sh
          opam exec -- dune build --profile release bin/lane_fusion_container_probe.exe \
            2>&1 | tee "$PROBE_OUT/native-build.log"
          cp _build/default/bin/lane_fusion_container_probe.exe "$PROBE_OUT/"
          (cd "$PROBE_OUT" && sha256sum lane_fusion_container_probe.exe > SHA256SUMS)
      - name: Build the two manifest-declared worker images
        id: images
        run: |
          set -euo pipefail
          docker version > "$PROBE_OUT/docker-version.txt" 2>&1
          docker info > "$PROBE_OUT/docker-info.txt" 2>&1
          for package in fusion-compute fusion-report; do
            image=$(python3 - "$package" <<'PYIMAGE'
          import sys, tomllib
          from pathlib import Path
          manifest = Path("addons") / sys.argv[1] / "lane.toml"
          image = tomllib.loads(manifest.read_text())["image"]
          if not isinstance(image, str) or not image or image.startswith("-"):
              raise SystemExit("Invalid declared image")
          print(image)
          PYIMAGE
            )
            docker build --file "addons/$package/Dockerfile" --tag "$image" \
              --iidfile "$PROBE_OUT/$package.image-id" addons \
              2>&1 | tee "$PROBE_OUT/$package.build.log"
            docker image inspect "$image" > "$PROBE_OUT/$package.image.json"
            cp "addons/$package/lane.toml" "$PROBE_OUT/$package.lane.toml"
          done
      - name: Run actual Docker qualification with synthetic HTTP replies
        id: qualify
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          (cd "$PROBE_OUT" && sha256sum --check SHA256SUMS)
          opam exec -- "$PROBE_OUT/lane_fusion_container_probe.exe" \
            --repo-root "$GITHUB_WORKSPACE" --head-sha "$GITHUB_SHA" \
            --output-dir "$PROBE_OUT/evidence" \
            2>&1 | tee "$PROBE_OUT/qualification.log"
      - name: Record attempt outcome even on failure
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          IMAGE_OUTCOME: ${{ steps.images.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
        run: |
          python3 - <<'PYRECEIPT'
          import json, os
          from pathlib import Path
          output = Path(os.environ["PROBE_OUT"])
          output.mkdir(parents=True, exist_ok=True)
          receipt = {key: os.environ[key] for key in (
              "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
              "BUILD_OUTCOME", "IMAGE_OUTCOME", "QUALIFICATION_OUTCOME")}
          receipt.update(live_provider=False, production=False)
          (output / "attempt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PYRECEIPT
      - name: Upload exact-head attempt evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lane-fusion-container-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane-fusion-container/
          if-no-files-found: error
          retention-days: 7
