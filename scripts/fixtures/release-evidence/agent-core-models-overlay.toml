# Release-evidence install smoke exact-output catalog overlay.
#
# Copied into the isolated base path alongside runtime.toml by
# scripts/release-evidence.sh. Embedded_with_overlay applies sparse overlay
# precedence to the embedded AGENT_CORE catalog, so the embedded rows the runtime
# default depends on (deepseek-v4-flash) stay resolvable and this file only
# adds the fixture target the mandatory exact-output lanes point at.
#
# api_key_env is empty on purpose: with no credential env name to read, the
# target is admitted and resolves without any secret, which is what lets
# require_usable_mandatory_exact_output_lanes pass in a credential-less CI job.
# The base_url is an isolated dead port, and no request is ever issued from
# this fixture.

[[providers]]
id = "release_evidence"
kind = "openai_compat"
base_url = "http://127.0.0.1:9/v1"
request_path = "/chat/completions"
api_key_env = ""
capabilities_base = "openai_chat"

[[models]]
id_prefix = "release-evidence-smoke"
provider_name = "release_evidence"
base = "openai_chat"
max_context_tokens = 32768
max_output_tokens = 1024
supports_tools = true
supports_tool_choice = true
supports_response_format_json = true
supports_structured_output = false
supports_native_streaming = true

[[targets]]
id = "release_evidence.smoke"
provider_ref = "release_evidence"
model_id = "release-evidence-smoke"
