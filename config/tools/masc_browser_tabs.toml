name = "masc_browser_tabs"
description = """
List {clientId,tabs:[{id,active,title,url}]} and live index/windowId. Carry clientId/tabId into reads/actions. Ambiguous or stale live selection returns clients without dispatch: select explicitly and retry. Automation clientId is null."""
additional_properties = false

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation"]
default = "live"

[[params]]
name = "clientId"
type = "string"
description = "Live UUID from BrowserTabs/Read; required for multiple clients, stale fails. Omit on automation."
