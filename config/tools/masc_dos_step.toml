name = "masc_dos_step"
description = """
Let the DOS machine run with no key pressed.

Time is 8086 instructions. Returns when the machine is ready for input: the \
program asked for a key AND the screen stopped changing (asking alone comes \
mid-repaint). until_ready=false spends the whole budget, for a program that \
is computing. Returns settled, steps_run and input_requests."""
additional_properties = false

defer_loading = true

[[params]]
name = "steps"
type = "integer"
description = "Instruction budget. Default 4000000, about 170 ms."
minimum = 1
maximum = 4000000
default = 4000000

[[params]]
name = "until_ready"
type = "boolean"
description = "Stop when ready for input, as described above. Default true."
default = true
