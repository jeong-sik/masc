name = "masc_browser_goto"
description = """
Navigate a tab to HTTP(S); returns landing URL/title. An ego connection navigates only a managed Page in its task space: pass lane live, its clientId and that tabId. An unmanaged tab the operator opened is refused before any effect; adopt it with BrowserAct/masc_browser_act adopt_tab first."""
additional_properties = false

[[params]]
name = "url"
type = "string"
required = true
description = "HTTP(S) URL."

[[params]]
name = "lane"
type = "string"
enum = ["live"]
description = "Optional advanced browser override. Omit only for initial discovery; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "tabId"
type = "integer"
description = "BrowserTabs/masc_browser_tabs ID of the tab to navigate."
minimum = 0

[[params]]
name = "clientId"
type = "string"
description = "lane live: the exact observed clientId of the ego connection that manages tabId."
