name = "masc_dos_load"
description = """
Boot a DOS program on the shared machine.

Omit program to list the inventory. A name is an inventory entry, never a \
host path. A directory boots its executable with the files beside it \
mounted; boot names the executable when there are several. Runs until the \
program waits for a key or the boot budget ends, and returns the \
observation (see masc_dos_screen) -- read it to see where it got.

An autosave on disk is never moved by accident: with one present the load is \
refused and names it. Resume it with masc_dos_restore slot=autosave, or pass \
replace_autosave=true to start a new machine and move the autosave to \
autosave-prev (replacing what that slot holds)."""
additional_properties = false

defer_loading = true

[[params]]
name = "program"
type = "string"
description = "Name in the programs inventory. Omit to list what is there."

[[params]]
name = "boot"
type = "string"
description = "Executable inside a game directory, e.g. KOEI.COM. A file name, not a path."

[[params]]
name = "replace_autosave"
type = "boolean"
description = "Set true only after a refused load showed the waiting autosave and you do not need it. The autosave then moves to autosave-prev, replacing what that slot holds. Default false."
default = false
