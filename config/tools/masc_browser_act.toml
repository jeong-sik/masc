name = "masc_browser_act"
description = """
Run one action in an explicitly selected browser. Automation serves the listed actions; Stagehand serves only open_tab and top-level back/forward/reload/close_tab through native browser methods. open_window opens a new browser window holding one tab (automation Firefox and live BiDi only; it returns that tab's tabId). set_cookie and delete_cookie write one cookie for the tab's own page host on an automation Firefox only (never on a live or operator browser); the value is never returned. set_emulation sets a tab's reported location (latitude and longitude), locale and IANA timezone on an automation Firefox (reload the page to see new values); clear_emulation restores these overrides only and leaves permissions unchanged. A geolocation grant for the current origin persists until the owned browser session closes. Live BiDi serves open_tab, open_window, and top-level back/forward/reload/close_tab only for a tab this connection opened with open_tab. Omit identity only for initial open_tab discovery; otherwise retain the exact browserSelection lane/clientId and returned tabId. A failed navigation after creation retains a partial-effect receipt: inspect that created tab on the same browser before deciding what to do next; never open another automatically.
Read elements in the same tab/frame for selectors; preserve decoded CSS escapes exactly. After no match, re-read. Actions can change external state: observe again after success or failure before retrying."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 1,981 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 5개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름이 남고,
# 부르면 그 턴에 스키마가 붙는다. 한 줄 요약은 그 답에 한 번 나온다.
defer_loading = true

[[params]]
name = "action"
type = "string"
enum = ["open_tab", "open_window", "close_tab", "back", "forward", "reload", "upload", "accept_dialog", "dismiss_dialog", "set_cookie", "delete_cookie", "set_emulation", "clear_emulation"]
required = true
description = "Browser-level actions: tabs, history, JavaScript dialogs and file upload. Page input (click, fill, select, scroll, keys) is masc_browser_interact."

[[params]]
name = "lane"
type = "string"
enum = ["automation", "live", "stagehand"]
description = "Optional advanced browser override. Omit only for initial discovery or opening a work browser; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "tabId"
type = "integer"
minimum = 0
description = "Required except open_tab and open_window."

[[params]]
name = "selector"
type = "string"
description = "upload: one observed file input; preserve decoded CSS including > and escapes, not JSON escape notation."

[[params]]
name = "text"
type = "string"
description = "accept_dialog prompt text."

[[params]]
name = "url"
type = "string"
description = "open_tab and open_window HTTP(S) URL."

[[params]]
name = "framePath"
type = "array"
items = { type = "string" }
description = "Observed outer-to-inner frame selectors; preserve CSS escapes. Nonempty only for upload; omit for top-level."

[[params]]
name = "paths"
type = "array"
items = { type = "string" }
description = "Keeper-readable playground-relative or visible absolute files, privately staged via sandbox before replacing input selection. Max 16 MiB/file."

[[params]]
name = "clientId"
type = "string"
description = "Required with lane=live for open_tab and open_window: exact observed BiDi connection ID. Not valid on automation or stagehand."

[[params]]
name = "cookieName"
type = "string"
description = "set_cookie and delete_cookie: the cookie name, a token of at most 256 bytes (no space, comma, semicolon, equals sign or control character)."

[[params]]
name = "cookieValue"
type = "string"
description = "set_cookie: the cookie value, at most 4096 bytes, no control character or semicolon. It is a credential: it is sent to the browser and never returned."

[[params]]
name = "cookiePath"
type = "string"
description = "set_cookie: path scope starting with /; default /."

[[params]]
name = "cookieSecure"
type = "boolean"
description = "set_cookie: send only over HTTPS. Required with cookieSameSite None."

[[params]]
name = "cookieHttpOnly"
type = "boolean"
description = "set_cookie: hide the cookie from page scripts."

[[params]]
name = "cookieSameSite"
type = "string"
enum = ["Strict", "Lax", "None"]
description = "set_cookie: SameSite attribute; omit to leave it to the browser."

[[params]]
name = "cookieMaxAgeSec"
type = "integer"
minimum = 1
maximum = 604800
description = "set_cookie: lifetime in seconds, at most 7 days. Omit for a session cookie."

[[params]]
name = "latitude"
type = "number"
minimum = -90.0
maximum = 90.0
description = "set_emulation: reported latitude in degrees; needs longitude. Also grants the current origin geolocation permission for the owned browser session; clear_emulation leaves that grant unchanged."

[[params]]
name = "longitude"
type = "number"
minimum = -180.0
maximum = 180.0
description = "set_emulation: reported longitude in degrees; needs latitude."

[[params]]
name = "accuracyMeters"
type = "number"
minimum = 0.0
maximum = 10000.0
description = "set_emulation: reported location accuracy in meters, above 0; default 10."

[[params]]
name = "locale"
type = "string"
description = "set_emulation: a language tag such as ko-KR (navigator.language and Intl)."

[[params]]
name = "timezone"
type = "string"
description = "set_emulation: an IANA time zone name such as Asia/Seoul."
