# Substack's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.substack.com/.well-known/oauth-protected-resource/api/v1/mcp,
# authorization server (https://substack.com) offers S256 PKCE and dynamic
# client registration (HTTP 201). Scopes: mcp:read, notes.read, notes.write, offline_access.

id = "substack"
label = "Substack"
mcp_url = "https://mcp.substack.com/api/v1/mcp"

access_token_env = "SUBSTACK_ACCESS_TOKEN"
expires_at_env = "SUBSTACK_EXPIRES_AT"
refresh_token_file = "/home/keeper/.substack/refresh_token"
renew_before_sec = 300
