name = "keeper_artifact_read"
description = """
Restore a [masc:blob ...] ToolResult or a normalized _blob ToolUse input \
by its sha256. Completed tool-call arguments are stored as application/json; \
read and parse the original JSON to inspect, compare or reuse those arguments. \
The reference's bytes field is the artifact's total size.

Page: max_bytes defaults to the 16384 maximum, the largest page that never \
itself becomes an unreadable spilled file. If eof=false, continue from \
next_offset until eof=true. The last page starts at offset = bytes - 16384. \
Text pages use UTF-8; arbitrary bytes use base64.

Search: to find text, pass contains instead of paging. content holds one \
"<byte offset><TAB><line>" per matching line, up to max_matches. Page at a \
hit's offset to see around it. If eof=false the scan stopped early; call \
again with offset = next_offset. skipped_lines counts lines over 1 MiB that \
were not searched.

The runtime never re-inlines a stored artifact into model history; \
this tool is the only way to read one."""
additional_properties = false

[[params]]
name = "sha256"
type = "string"
required = true
description = "Exact sha256 from a [masc:blob ...] ToolResult or a ToolUse input _blob reference. A marker can carry a second hash, answer_sha256=; it fingerprints the answer and names no artifact, so pass the value written sha256=."

[[params]]
name = "offset"
type = "integer"
minimum = 0
default = 0
description = "Byte offset to start at. Continue a page read or a search at the returned next_offset."

[[params]]
name = "max_bytes"
type = "integer"
minimum = 1
maximum = 16384
default = 16384
description = "Maximum source bytes in this model-visible page. Defaults to the maximum; lower it only for a deliberate slice, not for paging. Not allowed with contains."

[[params]]
name = "contains"
type = "string"
min_length = 1
max_length = 512
description = "Search instead of paging: the exact text to find in a line. Case-sensitive unless ignore_case is true."

[[params]]
name = "ignore_case"
type = "boolean"
default = false
description = "With contains: match ASCII letters in either case."

[[params]]
name = "max_matches"
type = "integer"
minimum = 1
maximum = 100
default = 20
description = "With contains: the most matching lines to return."
