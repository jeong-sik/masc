\* Reachability guard on the clean model: a task waits, is claimed again with
\* its receipt and completes.
\* Expected: WaitThenSucceedUnreachable VIOLATED.
SPECIFICATION Spec

CONSTANTS
    T1 = t1
    T2 = t2
    R1 = r1
    R2 = r2
    MaxRestarts = 1
    MaxPatrols = 2

INVARIANTS
    WaitThenSucceedUnreachable

CHECK_DEADLOCK FALSE
