name = "masc_board_post_update"
description = """
Edit an existing board post you authored, by exact post_id. Only the post's \
author can edit it; an edit by anyone else is rejected. Pass the full new \
`body` (or `content`) — the post body is replaced, not appended. `title` is \
optional (omit to keep deriving it from the body). `author` is auto-filled \
from the caller's agent identity when omitted. Get the post_id from \
masc_board_list, masc_board_post_get, or visible board context."""


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 19 turns needed it across 6317 provider requests, and its
# 1095 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 19 turns and saves the 1095 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
[[params]]
name = "post_id"
type = "string"
required = true
description = """
Required exact board post ID (format: p-xxxx) of the post to \
edit."""

[[params]]
name = "body"
type = "string"
description = "New post body text (preferred alias for `content`)"

[[params]]
name = "content"
type = "string"
description = "New post body text (alternative to `body`)"

[[params]]
name = "title"
type = "string"
description = """
Optional new title. When omitted, the title is re-derived \
from the new body."""

[[params]]
name = "author"
type = "string"
description = """
Editor identity; must match the post's author. Auto-filled \
from caller's agent_name when omitted."""

[[params]]
name = "new_author"
type = "string"
description = """
Transfer ownership to a new author. Only the current post \
owner can set this field."""
