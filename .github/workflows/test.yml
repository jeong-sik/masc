name: Test
run-name: Schedule native proof | source ${{ inputs.source_sha }} | definition ${{ github.sha }}

# Disposable proof-branch definition of the already registered Test workflow.
# This branch is reviewed separately and is not proposed for product/main merge.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact F6 product source; only the reviewed source below is accepted
        required: true
        type: string
        default: '94b2df25abcdfe20c658322f4156ad63f5546c34'

permissions:
  contents: read

concurrency:
  group: schedule-native-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  macos-arm64-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/schedule-native-runtime-proof-20261026'
    name: F6 macOS ARM operator binaries and portable runtime
    runs-on: macos-14
    timeout-minutes: 90 # Existing release-build macOS build backstop.
    env:
      SOURCE_SHA: 94b2df25abcdfe20c658322f4156ad63f5546c34
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
      WORKFLOW_EVENT_SHA: ${{ github.sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      MASC_BIN_DIR: _build/default/bin
      PROOF_DIR: artifacts/schedule-native-proof
    steps:
      - name: Validate the exact source and runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SOURCE_SHA" = "$SOURCE_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Checkout the exact product source, independently of workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 94b2df25abcdfe20c658322f4156ad63f5546c34
          fetch-depth: 1

      - name: Record source selection before setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$PROOF_DIR"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          proof = pathlib.Path(os.environ['PROOF_DIR'])
          receipt = {
              'schema': 'masc.schedule-native-source-selection.v1',
              'workflow_definition_sha': os.environ['WORKFLOW_DEFINITION_SHA'],
              'workflow_event_sha': os.environ['WORKFLOW_EVENT_SHA'],
              'workflow_ref': os.environ['WORKFLOW_REF'],
              'product_source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'requested_source_sha': os.environ['REQUESTED_SOURCE_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'platform': 'macos-arm64',
              'build_completed': False,
              'release_validated': False,
              'production_installed': False,
          }
          (proof / 'source-selection.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE

      - name: Setup OCaml toolchain from the selected product source
        uses: ./.github/actions/setup-ocaml-toolchain

      # Same macOS build environment as release-build.yml; omit media/evidence
      # tools because this job builds only the five operator executables.
      - name: Install native macOS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install flock gmp libpq openssl@3 zstd
          libpq_prefix="$(brew --prefix libpq)"
          openssl_prefix="$(brew --prefix openssl@3)"
          {
            echo "$libpq_prefix/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"

      # release-build's macOS route invokes the same canonical pin script
      # without --install. The composite's forced --install also runs apt;
      # this job uses the macOS route and installs locked dependencies below.
      - name: Pin existing OCaml dependencies using the macOS release recipe
        shell: bash
        run: bash scripts/opam-pin-external-deps.sh --with-compact-protocol

      - name: Install locked build dependencies without test dependencies
        shell: bash
        run: |
          set -euo pipefail
          opam install ./masc.opam --locked --deps-only -y 2>&1 | tee "$PROOF_DIR/opam-install.log"

      - name: Build only the five operator executables
        shell: bash
        run: |
          set -euo pipefail
          opam exec -- dune build --release \
            bin/main_eio.exe \
            bin/masc_tui.exe \
            bin/masc_browser_host.exe \
            bin/deployment_preflight_helper.exe \
            bin/masc_exec_ssh_bootstrap.exe 2>&1 | tee "$PROOF_DIR/operator-build.log"
          test "$("$MASC_BIN_DIR/main_eio.exe" build-commit)" = "$SOURCE_SHA"
          "$MASC_BIN_DIR/main_eio.exe" build-commit > "$PROOF_DIR/embedded-source-before-package.txt"

      # The release distribution's existing file layout and shell wrapper.
      - name: Stage existing operator distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$MASC_BIN_DIR/main_eio.exe" dist/masc-macos-arm64
          cp "$MASC_BIN_DIR/masc_tui.exe" dist/masc-tui-macos-arm64
          cp "$MASC_BIN_DIR/masc_browser_host.exe" dist/masc-browser-host-macos-arm64
          cp "$MASC_BIN_DIR/deployment_preflight_helper.exe" dist/masc-deployment-preflight-helper-macos-arm64
          cp "$MASC_BIN_DIR/masc_exec_ssh_bootstrap.exe" dist/masc-exec-ssh-bootstrap-macos-arm64
          cp scripts/check-runtime-deployment-preflight.sh dist/masc-check-runtime-deployment-preflight-macos-arm64
          chmod +x dist/masc-*

      - name: Package with the unchanged macOS runtime packager
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-macos-runtime.py --dist dist \
            --stage "$RUNNER_TEMP/masc-portable-stage" --platform macos-arm64 \
            --source-commit "$SOURCE_SHA" 2>&1 | tee "$PROOF_DIR/portable-package.log"
          test "$("$RUNNER_TEMP/masc-portable-stage/masc" build-commit)" = "$SOURCE_SHA"
          "$RUNNER_TEMP/masc-portable-stage/masc" build-commit > "$PROOF_DIR/embedded-source-after-package.txt"
          cp "$RUNNER_TEMP/masc-portable-stage/runtime-provenance.json" "$PROOF_DIR/runtime-provenance.json"

      - name: Record completed artifact hashes and source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib
          proof = pathlib.Path(os.environ['PROOF_DIR'])
          selected = json.loads((proof / 'source-selection.json').read_text())
          source = selected['product_source_sha']
          embedded = (proof / 'embedded-source-after-package.txt').read_text().strip()
          portable = json.loads((proof / 'runtime-provenance.json').read_text())
          if embedded != source or portable['source_commit'] != source:
              raise SystemExit('artifact source differs from selected source')
          paths = sorted(pathlib.Path('dist').iterdir())
          selected.update({
              'schema': 'masc.schedule-native-artifact.v1',
              'build_completed': True,
              'embedded_source_sha': embedded,
              'portable_source_sha': portable['source_commit'],
              'verification_scope': 'five operator targets plus unchanged portable packager checks; no behavioral suites',
              'files': {path.name: {'bytes': path.stat().st_size,
                         'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in paths},
          })
          (proof / 'artifact-manifest.json').write_text(json.dumps(selected, indent=2) + '\n')
          PYCODE

      - name: Retain artifact and partial failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schedule-native-macos-arm64-source-${{ inputs.source_sha }}-definition-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/
            artifacts/schedule-native-proof/
          if-no-files-found: error
          retention-days: 7
