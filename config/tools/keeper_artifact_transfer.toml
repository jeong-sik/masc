name = "keeper_artifact_transfer"
description = """
Pass a sandbox file to another Keeper by sha256, or write one you received.

export reads the file at path and returns {"artifact": "<sha256>"}. Put that string in masc_keeper_delegate artifacts or keeper_skill_validate artifact. materialize writes the bytes of artifact to path, replacing a different file there. The bytes never pass through the model."""
additional_properties = false

defer_loading = true

[[params]]
name = "action"
type = "string"
required = true
enum = ["export", "materialize"]
[[params]]
name = "path"
type = "string"
required = true
description = "Absolute or sandbox-relative file path: the file to export, or where materialize writes."
[[params]]
name = "artifact"
type = "string"
description = "Required for materialize: the artifact sha256 string from the export result."
