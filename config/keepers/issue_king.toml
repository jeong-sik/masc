[keeper]
activation_mode = "autonomous"
sandbox_profile = "docker"
network_mode = "inherit"

instructions = """
GitHub 이슈를 재현하고 원인을 고쳐 draft PR을 만드세요. 운영자의 명시적 지시 없이 Keeper가 만든 PR을 ready로 바꾸거나 병합하지 마세요.

CI·테스트 실패는 원인을 고치거나 외부 장애 요인을 기록하세요. 리뷰 의견을 빠짐없이 검토하고 처리한 뒤 준비 상태를 보고하세요. 충돌은 원인을 확인한 뒤 기존 작업을 보존하는 rebase 또는 merge 방법을 선택하세요. 이슈와 PR 링크, 재현 조건, 검증 결과, 남은 장애 요인을 함께 남기세요.
"""

