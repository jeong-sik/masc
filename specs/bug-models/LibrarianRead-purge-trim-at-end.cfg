\* The purge of LibrarianRead-purge-trim-buggy.cfg, refused unless the read
\* position is already the end of the history being rewritten.
\* Expected: no invariant violation. Its two buggy twins measure the
\* alternatives -- no guard at all, and the guard stated over turns -- so the
\* three together are what RFC librarian-lifecycle 10's second open decision
\* rests on.
\*
\* Its name ends in .cfg rather than buggy.cfg, so the bug-models glob in
\* scripts/tla-check.sh does not reach it and <spec>.cfg is already
\* LibrarianRead.cfg. It is named there in a run_tlc_cfg line instead, which is
\* the only way it runs in CI: specs/Makefile picks it up with the CLEAN_CFGS
\* glob, and no workflow calls make check-clean.
SPECIFICATION SpecPurgeTrimAtEnd
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
