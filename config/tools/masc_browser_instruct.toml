name = "masc_browser_instruct"
description = """
Use the owned browser lane and tabId returned by BrowserTabs/masc_browser_tabs. observe finds matching elements: automation uses its installation-selected locate Exact Output and returns freshly checked node references; stagehand uses its observer. Model explanations are inference, not permission to click. act and extract require stagehand; act can change external state and extract returns data shaped by schema. No browser is substituted for the observed tab."""
additional_properties = false
# 2026-10-29 ~ 11-04 에 저장된 agent-core 요청 5,479개(Keeper 28명)가 이 정의 998 B 를
# 매번 실었다. 이 도구를 부른 서로 다른 Keeper 턴은 6개(8회)다. 지연의 손익은
# 호출 수가 아니라 필요했던 턴 수로 가른다(masc #32062): 실으면 5.5 MB, 지연하면
# 6턴 x 표면 91,483 B = 0.55 MB 라서 10.0배다. 같은 도구 묶음의 BrowserRead,
# BrowserAct, BrowserInteract 는 이미 지연돼 있다. 지연돼도 keeper_tool_search
# 목록에 이름이 남고, 부르면 그 턴에 스키마가 붙는다. 재측정 방법은
# docs/evidence/defer-loading-2026-11/README.md 에 있다.
defer_loading = true

[[params]]
name = "lane"
type = "string"
enum = ["automation", "stagehand"]
required = true
description = "The owned lane that supplied tabId."

[[params]]
name = "action"
type = "string"
enum = ["act", "observe", "extract"]
required = true

[[params]]
name = "instruction"
type = "string"
description = "Required for act and extract."

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "schema"
type = "string"
description = "extract only: JSON Schema text for the data."
