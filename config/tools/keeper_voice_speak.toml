name = "keeper_voice_speak"
description = """
Speak a short utterance via the voice bridge.

status='spoken' with played_seconds: this host played it and the user has \
heard it — do NOT repeat or rephrase the same content. status='synthesized': \
the clip was made and attached to the chat, but this host did not play it \
(local_playback_status and local_playback_reason say why) — do not tell the \
user it was played. Duplicate identical messages within 30s return \
status='dedup_skipped'. A TTS failure is an error (ok=false). Concurrent \
calls are serialized by a global lock."""

# Held back from the request until the model asks for it by name. Not
# called once on 2026-08-29 or 2026-08-30 across the fleet.
defer_loading = true

[[params]]
name = "message"
type = "string"
required = true
description = "Text to speak"

[[params]]
name = "provider"
type = "string"
description = "Optional voice provider override"

[[params]]
name = "priority"
type = "integer"
description = "Optional priority hint for the TTS endpoint"

[[params]]
name = "audio_device"
type = "string"
description = """
Optional target output device id/name for the dashboard/client"""
