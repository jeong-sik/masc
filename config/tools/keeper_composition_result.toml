name = "keeper_composition_result"
description = """
Read the final structured result and selected exports of the original named async Skill composition.
Pass the exact result_wait binding returned by its submission. Pending work
returns a typed result dependency; an async prepared parent can release its
worker and resume that same read after the canonical child result is ready.
This tool never submits, restarts, collects or cancels work. Only a successful
canonical result supplies result and a complete durable result_artifact. In a
prepared DAG bind /result_artifact/_blob/sha256 into keeper_artifact_read. The
full result preserves declared exports and their available/value or error fields.
Child failure or cancellation stays a failure; absent exports are not manufactured.
Original Task, invocation, Skill revision and run identity remain bound."""
additional_properties = false
defer_loading = true

[[params]]
name = "binding"
type = "object"
required = true
additional_properties = false

[[params.params]]
name = "request_id"
type = "string"
required = true
min_length = 1

