name = "masc_ask_status"
description = """
Read the questions you asked and their responses or status.

Answers arrive as separate wakes and are recorded in the durable log. Read \
this when returning to work that was waiting on an operator choice. Each row \
indicates whether a question is open, answered, or withdrawn, including choice \
ids."""
additional_properties = false
# RFC-0403 후속. 이 셋은 2026-08-03 ~ 09-02 31일간 fleet 전체에서 호출 0회이고,
# 그 사이 agent-core keeper 4곳의 요청마다 5,498 B 를 싣고 있었다. 지연의
# 손익은 호출 수가 아니라 "그 도구가 필요했던 서로 다른 턴 수"로 가르는데
# (masc #32062), 그 값이 0이므로 우변이 0이다 — 되는 쪽이 확정이다.
#
# 사라지는 게 아니다. agent-core 레인에서 지연된 도구는 keeper_tool_search
# 목록에 이름과 한 줄 요약으로 남고, 모델이 부르면 그 턴에 붙는다. 같은 선언을
# 가진 30종 중 27종이 이 창에서 실제로 호출됐다 (masc_schedule_create 412회,
# masc_goal_transition 89회) — 왕복이 도는 것은 관측된 사실이다.
defer_loading = true

[[params]]
name = "ask_id"
type = "string"
description = "Specific ask ID to inspect. Omit to list all open questions."

[[params]]
name = "include_resolved"
type = "boolean"
description = "Whether to include answered or withdrawn questions. Defaults to false."
