name: Test

# The PR gate (pr-check.yml) and the manual CI lane (ci.yml) both stop at
# `dune build @check`: they type-check test/ but link and run nothing. That
# is an explicit owner decision (2026-09-02, see the ci.yml header) — linking
# the ~296 test executables is this repo's slow step, so the gate stays fast.
#
# The hole that leaves: a test-only BEHAVIORAL regression — code that
# compiles fine but fails at runtime — reaches main silently. It happened
# with the test_keeper_owner actor-38 incident; nothing ran the suite before
# the breakage landed.
#
# This lane closes that hole on a schedule instead of in the PR gate. It
# runs the full behavioral suite nightly (02:43 KST, off-peak) and on
# manual dispatch, so a test-only regression surfaces within ~24h instead
# of never. The measured runtime of this lane is the evidence for any
# future proposal to move tests into the PR gate; until that proposal
# exists, the gate is unchanged by design.
#
# A red scheduled run used to reach nobody: GitHub emails only the last
# editor of the cron line, and a dispatched run notifies only the
# dispatcher. The last step of this job now files the failure as an issue
# labelled `nightly-test-lane`, reusing the open one so a run of red
# nights is one thread. A dispatch files nothing — its dispatcher is
# already told.
#
# See: https://github.com/jeong-sik/masc/issues/33008
#
# A dispatch can also name suites. With the `suite` input set, the Test
# step builds only those executables and runs each straight from
# _build/default/test under a per-suite timeout, outside dune's (test)
# action, with ALCOTEST_VERBOSE=1: every case prints its [OK] line as it
# finishes, so a hang names the case after the last [OK] instead of a
# suite after 90 minutes. Two suites hung past the full lane's deadline
# on 2026-09-05 (#33200); this is how to measure them in ten minutes
# rather than ninety, and with `eio_backend=posix` how to tell an Eio
# backend difference from a scheduling one.

on:
  schedule:
    # 17:43 UTC = 02:43 KST, off-peak for both GitHub runners and the team.
    - cron: "43 17 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          Comma-separated test executables under test/ to build and run on
          their own instead of the full runner, for example
          test_heartbeat_integration,test_hitl_summary_worker. A name with
          a test/<name>.py script runs its dune alias runtest-<name>
          instead (test_tui_keyboard_input). Empty runs the full suite.
        type: string
        default: ""
      eio_backend:
        description: >-
          EIO_BACKEND for a targeted run, for example posix. Empty leaves
          the Eio default, io_uring on Linux where available. Ignored
          when suite is empty.
        type: string
        default: ""

permissions:
  contents: read
  # The scheduled failure below files an issue. A dispatch never reaches
  # that step, so this scope is unused on every other path.
  issues: write

# Two lanes plus one per targeted run. Every full dispatch shares one
# lane, where a new dispatch cancels the run in flight instead of stacking
# a second 180-minute job, as before; the scheduled run has a lane of its
# own that no dispatch can reach. One group for the whole repo did reach
# it: on 2026-09-04 the scheduled run (17:43:56Z, 7aed1b696f) was
# cancelled within two seconds by a branch dispatch created the same
# second, and of this lane's first 13 runs none completed successfully.
# A dispatch that names suites runs beside the full lane, not instead of
# it, so it gets a group of its own keyed by run id: the first targeted
# dispatch (33951571973, 2026-09-05 07:05:06Z) shared the dispatch lane
# and cancelled a full run 82 minutes in (33947949528). On the schedule
# there are no inputs, and `inputs.suite` is null; GitHub compares a null
# with '' by coercing both to 0, so the test below is false and the
# scheduled run keeps its lane.
concurrency:
  group: ${{ inputs.suite != '' && format('test-targeted-{0}', github.run_id) || format('test-{0}', github.event_name) }}
  cancel-in-progress: true

jobs:
  test:
    name: test suite
    runs-on: ubuntu-latest
    # This cap counts from job start, not from the Test step. On an opam
    # cache miss the setup steps can consume 40-75 minutes (compiler
    # bootstrap plus up to three 20-minute install attempts), so 180 =
    # worst-case setup (~75 min) + the full 100-minute test budget with
    # margin. Whether a run is warm depends on where the cache came from:
    # GitHub restores a cache only from the run's own ref or the default
    # branch, and a cache written by a pull_request run belongs to its
    # merge ref, so pr-check.yml keeps nothing warm for this lane. A
    # branch dispatch restores what its own branch or main saved; the
    # scheduled run on main restores only what a run on main saved, and
    # actions/cache saves only when the job succeeds. Until a dispatch of
    # ci.yml or this workflow on main, or a nightly, has completed green,
    # the nightly pays the cold-cache setup every time.
    timeout-minutes: 180
    steps:
      - name: Free disk space
        # Same cleanup as ci.yml: linking the test executables is
        # disk-heavy, and ubuntu-latest preinstalls the Android SDK,
        # .NET, GHC and the CodeQL bundle this build never uses.
        # See: https://github.com/jeong-sik/masc/issues/22954
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check source text integrity
        run: scripts/ci/check-source-text-integrity.sh

      - name: Suite runner self-test
        # The reader's own fixtures, under this runner's awk and python3,
        # before any toolchain work: a header it cannot attribute or a
        # suite it cannot find at the deadline is a wrong verdict later.
        # scripts/ci/run-lint-suite.sh also runs this, but nothing runs
        # that script.
        run: bash scripts/ci-run-test-suite.sh --self-test

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-bisect

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          # --with-test is what ci.yml already passes, and it is what
          # running the suite needs: dune-project gates alcotest,
          # qcheck-core, qcheck-alcotest and bisect_ppx behind :with-test.
          install-flags: --with-test
          os-packages: jq ripgrep

      - name: Test
        env:
          # Public runners give four CPUs; use all four for the build
          # and the suite.
          DUNE_JOBS: "4"
          # Three nested deadlines, innermost first:
          # 1. MASC_TEST_SUITE_DEADLINE (90 min) bounds the suite itself;
          #    on expiry ci-run-test-suite.sh lists the executables still
          #    running under dune, then a log tail, before failing, so a
          #    hang leaves evidence that names it.
          # 2. CI_TEST_TIMEOUT_SEC (100 min) is the observer's fail-closed
          #    backstop -- reached only if the suite script cannot enforce
          #    its own deadline.
          # 3. timeout-minutes (180, from job start) is the last boundary;
          #    see the comment above it for the cold-cache arithmetic.
          MASC_TEST_SUITE_DEADLINE: "5400"
          CI_TEST_TIMEOUT_SEC: "6000"
          CI_TEST_HEARTBEAT_SEC: "30"
          # A fixed path so the step below can upload it. ci-run-tests.sh
          # otherwise names the file with mktemp and only its last 120
          # lines reach the step output. The targeted path appends to the
          # same file, so the upload step serves both.
          CI_TEST_LOG_FILE: ${{ runner.temp }}/ci-run-tests.log
          # The targeted path, from the dispatch inputs; both are empty on
          # the schedule and on a dispatch that names no suite.
          TARGET_SUITES: ${{ inputs.suite }}
          TARGET_EIO_BACKEND: ${{ inputs.eio_backend }}
          # One suite's budget on the targeted path, where none of the
          # three deadlines above applies: the run is not under
          # ci-run-tests.sh, and each suite is under timeout(1). The suites
          # #33200 is about ran past 5400s under the full lane; one that
          # needs more than ten minutes alone is the finding, not a run to
          # wait out. TERM first, KILL after the grace, in case the suite
          # handles TERM itself.
          TARGET_SUITE_TIMEOUT_SEC: "600"
          TARGET_SUITE_KILL_GRACE_SEC: "30"
        # The runner is scripts/ci-run-test-suite.sh, NOT raw dune test:
        # nine suites in test/ci-known-failures.txt fail today, so plain
        # dune test exits 1 on every run -- permanently red, zero signal.
        # The suite runner builds the root @runtest alias (test/, packages/,
        # lib/exec/test and tools/), compares what fails against that list
        # and fails only on the delta: an unlisted suite breaking, a listed
        # suite newly passing, or a failure header that names no suite.
        # ci-run-tests.sh wraps it as the heartbeat observer.
        #
        # The targeted path skips both scripts. Dune holds a (test) action's
        # output until the suite exits, so under dune a hang names nothing;
        # the executable run directly with ALCOTEST_VERBOSE=1 prints each
        # case as it finishes. The environment is what test/dune's (env)
        # block sets for every suite plus the setenv lines of the suite's
        # own stanza in test/stanzas/*.inc; a suite whose stanza sets more
        # needs a case below, and one that is missing gets the shared
        # environment only. DUNE_SOURCEROOT is what masc_test_deps reads
        # to find config/ and prompts/ from inside _build.
        run: |
          set -euo pipefail
          if [ -z "${TARGET_SUITES}" ]; then
            scripts/ci-run-tests.sh "scripts/ci-run-test-suite.sh"
            exit 0
          fi
          log() { printf '%s\n' "$*" | tee -a "${CI_TEST_LOG_FILE}"; }
          export DUNE_SOURCEROOT="$(pwd -P)"
          if [ -n "${TARGET_EIO_BACKEND}" ]; then
            export EIO_BACKEND="${TARGET_EIO_BACKEND}"
          fi
          suites=()
          exes=()
          aliases=()
          IFS=',' read -r -a requested <<< "${TARGET_SUITES}"
          for suite in "${requested[@]}"; do
            suite="${suite// /}"
            [ -n "${suite}" ] || continue
            # A suite that is a script under a dune alias rather than an
            # executable. Two spellings reach the same place: test/<suite>.py
            # for a script named after its file, and any name a test/ dune
            # file declares as (alias runtest-<suite>) — the PTY suite's
            # per-family lanes are named that way and have no file of their
            # own. Dune runs the script as the alias's action, so building
            # the alias is the run.
            if [ -f "test/${suite}.py" ] \
              || grep -Fqr "(alias runtest-${suite})" test/dune test/stanzas 2>/dev/null; then
              aliases+=("${suite}")
            else
              suites+=("${suite}")
              exes+=("test/${suite}.exe")
            fi
          done
          # dune build with no target builds everything; a suite input of
          # separators only must not turn into the full build.
          if [ "${#suites[@]}" -eq 0 ] && [ "${#aliases[@]}" -eq 0 ]; then
            log "[targeted] FAIL - the suite input names no executable: '${TARGET_SUITES}'"
            exit 2
          fi
          log "[targeted] EIO_BACKEND=${EIO_BACKEND:-<unset>} timeout=${TARGET_SUITE_TIMEOUT_SEC}s per suite"
          status=0
          for suite in ${aliases[@]+"${aliases[@]}"}; do
            log "[targeted] ${suite}: start $(date -u +%Y-%m-%dT%H:%M:%SZ) (dune alias)"
            started=$(date +%s)
            rc=0
            timeout -s TERM -k "${TARGET_SUITE_KILL_GRACE_SEC}" "${TARGET_SUITE_TIMEOUT_SEC}"               opam exec -- dune build --root . "@runtest-${suite}" 2>&1 | tee -a "${CI_TEST_LOG_FILE}" || rc=$?
            elapsed=$(( $(date +%s) - started ))
            case "${rc}" in
              0)   log "[targeted] ${suite}: OK in ${elapsed}s" ;;
              124|137)
                   log "[targeted] ${suite}: TIMEOUT exit ${rc} after ${elapsed}s"
                   status=1 ;;
              *)   log "[targeted] ${suite}: FAIL exit ${rc} in ${elapsed}s"
                   status=1 ;;
            esac
          done
          if [ "${#exes[@]}" -eq 0 ]; then
            exit "${status}"
          fi
          # A stanza's (setenv ...) belongs to dune's runtest action, so a run
          # of the executable does not get it, and 22 of the 346 stanzas
          # declare one. This file used to carry a case block that named
          # exactly one of them, so a dispatch naming any of the other 21 ran
          # that suite under the wrong environment and reported verdicts the
          # nightly lane would not agree with -- silently, since a missing
          # variable looks like a normal run. stanza_env.py reads the stanza.
          # Captured, not piped: a failing script inside a process
          # substitution leaves the loop's exit status at 0, and a suite that
          # runs with no environment because the reader broke is the exact
          # outcome this replaces.
          stanza_env_reader="${GITHUB_WORKSPACE}/scripts/ci/stanza_env.py"
          stanza_deps=()
          for suite in "${suites[@]}"; do
            dep_lines=$(python3 "${stanza_env_reader}" --deps "${suite}")
            while IFS= read -r dep; do
              if [ -n "${dep}" ]; then stanza_deps+=("${dep}"); fi
            done <<< "${dep_lines}"
          done
          log "[targeted] dune build ${exes[*]} ${stanza_deps[*]+${stanza_deps[*]}}"
          opam exec -- dune build --root . "${exes[@]}" \
            ${stanza_deps[@]+"${stanza_deps[@]}"} 2>&1 | tee -a "${CI_TEST_LOG_FILE}"
          cd _build/default/test
          for suite in "${suites[@]}"; do
            suite_env=()
            env_lines=$(python3 "${stanza_env_reader}" "${suite}")
            while IFS= read -r pair; do
              if [ -n "${pair}" ]; then suite_env+=("${pair}"); fi
            done <<< "${env_lines}"
            log "[targeted] ${suite}: stanza env ${suite_env[*]+${suite_env[*]}}"
            log "[targeted] ${suite}: start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            started=$(date +%s)
            rc=0
            # ${arr[@]+"${arr[@]}"} expands an empty array to nothing under
            # set -u on every bash, not only 4.4 and later.
            env MASC_BASE_PATH= GRAPHQL_API_KEY= ZAI_API_KEY= \
                MASC_KEEPER_SANDBOX_PREFLIGHT_ENABLED=false \
                MASC_KEEPER_DOCKER_PLAYGROUND=false \
                ALCOTEST_VERBOSE=1 ${suite_env[@]+"${suite_env[@]}"} \
                timeout -s TERM -k "${TARGET_SUITE_KILL_GRACE_SEC}" "${TARGET_SUITE_TIMEOUT_SEC}" \
                "./${suite}.exe" 2>&1 | tee -a "${CI_TEST_LOG_FILE}" || rc=$?
            elapsed=$(( $(date +%s) - started ))
            # timeout(1) exits 124 when TERM ended the command and 137
            # when it took the KILL after the grace.
            case "${rc}" in
              0)   log "[targeted] ${suite}: OK in ${elapsed}s" ;;
              124|137)
                   log "[targeted] ${suite}: TIMEOUT exit ${rc} after ${elapsed}s;" \
                       "the hung case is the one after the last [OK] line above"
                   status=1 ;;
              *)   log "[targeted] ${suite}: FAIL exit ${rc} in ${elapsed}s"
                   status=1 ;;
            esac
          done
          exit "${status}"

      # The step output carries the heartbeat and the last 120 lines of the
      # runner log; every per-suite verdict lives only in the file. The
      # first root @runtest run on 2026-09-05 named its two hung suites and
      # lost every other verdict with it (#33200). Uploaded on every
      # outcome, since a red run is when the file is read.
      - name: Upload the suite runner log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-runner-log
          path: ${{ runner.temp }}/ci-run-tests.log
          if-no-files-found: warn
          retention-days: 14

      # The lane's whole point is that a test-only regression surfaces
      # within ~24h. Without this step it surfaced only to whoever opened
      # the Actions tab, which is how the 2026-09-05 hang (#33200) sat
      # unread. Scheduled runs only: a dispatcher already sees their own
      # run. Cancellation counts as a failure here because the job-level
      # 180-minute cap is exactly what a hung suite hits.
      - name: File the scheduled failure as an issue
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh infers the repo from the checkout's git remote. This step also
          # runs when the job failed before Checkout, where there is no remote
          # to read, so name the repo outright.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          label=nightly-test-lane
          # --force is a no-op when the label already exists, so the first
          # red night does not fail on a label nobody created yet.
          gh label create "${label}" \
            --color B60205 \
            --description "야간 테스트 레인이 실패한 실행" \
            --force
          # The taxonomy workflow comments on any issue with no declaration
          # block, so this body carries one. A red lane is a ci defect that
          # degrades and whose root is that nothing said so.
          body=$(printf '%s\n\n%s\n%s\n\n%s\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "야간 테스트 레인이 \`${JOB_STATUS}\` 로 끝났습니다." \
            "- 실행: ${RUN_URL}" \
            "- 커밋: \`${GITHUB_SHA}\`" \
            "스위트별 판정은 그 실행의 \`suite-runner-log\` 아티팩트에 있습니다." \
            "단계 출력에는 마지막 120줄만 남습니다." \
            '```masc-triage' \
            "kind: defect" \
            "area: ci" \
            "impact: degrades" \
            "must-do: false" \
            '```')
          existing=$(gh issue list --state open --label "${label}" \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "commented on #${existing}"
          else
            gh issue create --label "${label}" \
              --title "야간 테스트 레인이 빨갛습니다" \
              --body "${body}"
          fi
