name = "keeper_composition_run"
description = """
Run the exact read-only draft returned by keeper_composition_prepare. Rechecks \
the preparing Keeper and frozen contracts before effects. Inline drafts return \
execution results; async drafts return a durable request id and deliver completion \
later. Read keeper_composition_status when explicitly retrieving the result; \
do not repeatedly poll while other useful work is available. Shared Skill \
publication is optional and separate."""
additional_properties = false
defer_loading = true

[[params]]
name = "sha256"
type = "string"
required = true
min_length = 64
max_length = 64
description = "Exact sha256 from the durable draft reference returned by prepare."
