# ── Runtime lanes (ordered failover) ─────────────────────────────────
# A lane is an ordered list of runtime candidates under a name you pick. When a
# keeper is assigned to a lane, the turn attempts candidates in order until one
# succeeds or the lane is exhausted. Lanes are resolved at config load; unknown
# candidate ids abort startup. Ordering is the only semantics; a lane table
# carries only [candidates].
#
# The name is yours: it does not have to be a runtime id, and two lanes may
# start at the same runtime under different names. A lane that no assignment
# names is never walked.
[runtime.lanes.coding]
candidates = [
  "ollama_cloud.deepseek-v4-flash",
  "deepseek.deepseek-v4-pro",
]

# ── Keeper assignments ──────────────────────────────────────────────
# Keepers are assigned to a model by provider.model key. Unassigned
# keepers fall back to [runtime].default. Per-keeper overrides in the
# live config (<base>/.masc/config/runtime.toml) take precedence.
#
# The public seed ships no keeper assignments: keeper names are
# deployment-local identities, so per-keeper routing belongs in the live
# config, not here (enforced by test_runtime_config_validity "public seed
# has no keeper assignments").
# Do not assign general keeper lanes to Pro here. Pro is reserved for explicit
# judge/evaluator lanes ([runtime.exact_output_lanes.verifier_exact] and
# [fusion].judge).
#
# An assignment names a [runtime.lanes] lane or a runtime id
# (<provider>.<model>). A lane of that name is taken first, so a lane named
# after a runtime still wins. A name that is neither is rejected at load — which
# is why a lane with a name of its own is worth more than one that copies a
# runtime id: delete it and the load fails instead of quietly walking that
# runtime alone.
[runtime.assignments]
# example: pin a test keeper to an explicit runtime
# canary = "deepseek.deepseek-v4-pro"

# ═══ Connectors ══════════════════════════════════════════════════════
# 어떤 인바운드 메시지가 턴을 시작하는지를 커넥터별로 정한다. 운영자가 적어두는
# 입장이라 설정 파일에서만 읽는다 — 환경변수 경로는 없다.
#
#   mention_or_thread  — 스레드에서 자동 응답, 일반 채널은 멘션 필요 (기본값)
#   mention_only       — @멘션된 메시지만 응답
#   all                — 모든 메시지에 응답
#   user_only:<id>     — 특정 사용자만 (discord=snowflake, slack=member id)
#
# 값을 잘못 적으면 게이트웨이가 뜨지 않는다. 오타를 기본값으로 바꿔 읽으면
# 운영자가 적지 않은 입장으로 봇이 돌기 때문이다 (masc#29078).
#
# 이 값은 서버가 부팅할 때 한 번 읽는다. TUI 의 Config → params 화면에서
# <connector>.trigger_policy 를 고르면 그 선택이 이 파일보다 앞서고, 재시작
# 없이 다음 메시지부터 적용된다. 그 선택을 지우면 다시 여기로 돌아온다.
# 우선순위: params 화면 선택 > 이 값 > mention_or_thread

[discord]
trigger_policy = "mention_or_thread"

[slack]
trigger_policy = "mention_or_thread"

# ── Fusion 패널+심판 심의 (RFC-0252) ─────────────────────────────────
# masc_fusion 도구의 out-of-band 심의 루프 설정. 개인 dev 카나리로 기본 ON.
# harness(RFC-0252 §11) 미검증 — 카나리 출력(panel 답 + judge 종합)으로 사후 판단.
# [fusion] 섹션이 없거나 enabled=false면 masc_fusion 호출은 게이트에서
# Deny로 즉시 반환되고 모델을 호출하지 않는다.
#
# 패널/심판 모델 문자열은 위의 <provider>.<model> 런타임 id를 그대로 쓴다.
# 패널은 하나 이상의 런타임으로 구성하고, 심판은 패널 답변을 종합한다.
[fusion]
enabled = true
default_preset = "trio"
# staged_judge_of_judges의 고정 reducer group 크기.
staged_judge_group_size = 3

# 패널 프리셋. 패널 답변은 free text다. 2026-07-01 사고(ollama.com cloud가 json_schema를
# 조용히 무시 → 패널 전멸) 이후 패널의 provider-native structured output 요구는 제거됐다
# (fusion_panel.ml). 따라서 패널 런타임은 supports-structured-output 선언이 필요 없다.
# 심판도 마찬가지다 — 출력 계약은 wire 가 아닌 프롬프트 asset(fusion.judge.output)과
# strict parser 가 진다(아래 judge 주석의 2026-08-29 재실측).
# 프롬프트는 행동을 정의하므로 코드 default가 아니라 여기서 받는다 (누락 시 로드
# 단계에서 fail-fast). 튜닝은 재컴파일 없이 이 값만 바꾸면 된다.
[fusion.presets.trio]
panel = [
  "ollama_cloud.minimax-m3",
  "ollama_cloud.ollama-cloud-deepseek-v4-pro",
]
# The judge output contract is carried by the prompt and the strict parser, not
# by the wire: fusion_judge.ml strips the response format before dispatch because
# ollama.com cloud accepts a json_schema and then ignores it. Re-probed
# 2026-08-29 on /api/chat — deepseek-v4-pro, kimi-k3 and minimax-m3 all returned
# keys the schema never named, while local Ollama honoured the same request. So
# a judge runtime does not need supports-structured-output; pick it for answer
# quality, and keep the judges on different models so the lenses stay independent.
judge = "ollama_cloud.minimax-m3"
panel_system_prompt = """
You are an expert panelist. Answer the user's question directly and concisely \
with your best independent analysis. Do not defer to other models; give your \
own view.
"""
judge_system_prompt = """
You are an impartial judge. You are given a panel of model answers to the same \
question. Synthesize them: identify points of consensus, contradictions, \
partial coverage, unique insights, and blind spots, then give one resolved \
answer. Respond with ONLY the requested JSON object, no prose and no code fences.
"""
# 패널/심판에 MASC web_search/web_fetch 도구를 주입할지 여부.
web_tools = false

# ── JoJ-capable preset (RFC-0283 judge-of-judges) ───────────────────────────
# masc_fusion topology="judge_of_judges"는 preset에 1차 심판 >= 2명을 요구한다
# (fusion_orchestrator.run_judge_of_judges). trio는 단일 judge라 JoJ 호출이 항상
# "requires >= 2 judges"로 fail-closed된다 → 키퍼가 JoJ topology를 쓸 수 없었다.
# quorum은 서로 다른 렌즈(evidence/coverage)의 1차 심판 2명을 두고, meta judge(judge=)가
# 두 종합을 재조정한다. 키퍼 사용: masc_fusion preset="quorum" topology="judge_of_judges".
# No panel or judge runtime below needs a supports-structured-output
# declaration: the wire carries no schema at all (fusion_judge.ml strips the
# response format before dispatch), and the output contract lives in the
# fusion.judge.output prompt asset plus the strict parser (2026-08-29
# re-probe: ollama.com cloud ignores json_schema on both /v1 and /api/chat).
# Distinct labels preserve lens identity; keep judges on different models so
# the lenses stay independent.
# staged_judge_of_judges는 [fusion].staged_judge_group_size(=3)의 정확한 배수
# 그룹을 요구하므로 quorum(2 judges)은 비대상 — 별도 preset 필요.
[fusion.presets.quorum]
panel = [
  "ollama_cloud.minimax-m3",
  "ollama_cloud.ollama-cloud-deepseek-v4-pro",
]
panel_system_prompt = """
You are an expert panelist. Answer the user's question directly and concisely \
with your best independent analysis. Do not defer to other models; give your \
own view.
"""
# meta judge: 1차 심판들의 종합을 재조정하는 최종 reducer (RFC-0283).
judge = "ollama_cloud.ollama-cloud-deepseek-v4-pro"
judge_system_prompt = """
You are the meta-judge. You are given several independent judge syntheses of the \
same panel of model answers, each produced through a different evaluative lens. \
Reconcile them: where the judges agree, state the consensus; where they diverge, \
adjudicate with reasons; surface any blind spot that a single lens missed. Produce \
one resolved answer. Respond with ONLY the requested JSON object, no prose and no code fences.
"""
web_tools = false

# 1차 심판 — 서로 다른 렌즈로 패널을 독립 종합한다 (JoJ requires >= 2; RFC-0283).
# label이 정체성을 주므로 distinct lens는 distinct identity가 된다 (Duplicate_judge 회피).
# Panel and judge runtimes need no structured-output declaration — see the
# preset comment above. Some model families overlap across panel and judge
# lanes; distinct labels still preserve lens identity for judge-of-judges
# routing.
[[fusion.presets.quorum.judges]]
model = "ollama_cloud.minimax-m3"
label = "evidence"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through an EVIDENCE lens: weigh each claim by how well it is supported, flag \
unsupported assertions, and prefer conclusions grounded in verifiable reasoning. \
Respond with ONLY the requested JSON object, no prose and no code fences.
"""

[[fusion.presets.quorum.judges]]
model = "ollama_cloud.ollama-cloud-deepseek-v4-pro"
label = "coverage"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through a COVERAGE lens: map what each answer addresses and omits, surface blind \
spots and unique insights, and prefer the most complete resolution. \
Respond with ONLY the requested JSON object, no prose and no code fences.
"""

# ── Staged-JoJ-capable preset (RFC-0283 staged_judge_of_judges) ──────────────
# staged_judge_of_judges는 judge 수가 [fusion].staged_judge_group_size(=3)의
# 정확한 배수이면서 group_size*2(=6) 이상이어야 한다 (fusion_policy.staged_judge_groups).
# 지금까지 충족 preset이 0이라 topology가 도구 스키마에 노출되고도 모든 호출이
# config 에러로 fail-closed되는 죽은 옵션이었다. council은 6개 lens 심판을
# 3개씩 2 stage로 나눈다: stage 1 = evidence/coverage/risk, stage 2 =
# feasibility/simplicity/adversarial. 각 stage meta가 그룹 종합을 만들고 최종
# meta judge(judge=)가 stage 종합들을 재조정한다. label이 정체성을 주므로
# 같은 모델이 다른 lens로 반복 등장해도 Duplicate_judge가 아니다 (quorum 주석과
# 동일 계약). 심판 런타임은 supports-structured-output 선언이 필요 없다 — wire 는
# schema 를 싣지 않고 계약은 프롬프트 asset(fusion.judge.output)과 strict parser 가
# 진다(2026-08-29 재실측).
# 비용/지연: LLM 호출 11회(panel 2 + 1차 심판 6 + stage meta 2 + 최종 meta 1).
# 실행은 4단 순차 파이프라인(panel → 1차 심판 병렬 → stage meta 병렬 → 최종
# meta, fusion_orchestrator run_staged_judge_of_judges)이며 각 단의 경과 시간은 관측된다.
# 키퍼 사용: masc_fusion preset="council" topology="staged_judge_of_judges"
# (judge_of_judges topology도 동일 preset으로 사용 가능 — 6 lens 병렬 후 meta).
[fusion.presets.council]
panel = [
  "ollama_cloud.minimax-m3",
  "ollama_cloud.ollama-cloud-deepseek-v4-pro",
]
panel_system_prompt = """
You are an expert panelist. Answer the user's question directly and concisely \
with your best independent analysis. Do not defer to other models; give your \
own view.
"""
judge = "ollama_cloud.ollama-cloud-deepseek-v4-pro"
judge_system_prompt = """
You are the meta-judge. You are given stage syntheses, each produced by a group \
of judges evaluating the same panel of model answers through different lenses. \
Reconcile them: where the stages agree, state the consensus; where they diverge, \
adjudicate with reasons; surface any blind spot that a single stage missed. \
Produce one resolved answer. Respond with ONLY the requested JSON object, no \
prose and no code fences.
"""
web_tools = false

[[fusion.presets.council.judges]]
model = "ollama_cloud.minimax-m3"
label = "evidence"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through an EVIDENCE lens: weigh each claim by how well it is supported, flag \
unsupported assertions, and prefer conclusions grounded in verifiable reasoning. \
Respond with ONLY the requested JSON object, no prose and no code fences.
"""

[[fusion.presets.council.judges]]
model = "ollama_cloud.ollama-cloud-deepseek-v4-pro"
label = "coverage"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through a COVERAGE lens: map what each answer addresses and omits, surface blind \
spots and unique insights, and prefer the most complete resolution. \
Respond with ONLY the requested JSON object, no prose and no code fences.
"""

[[fusion.presets.council.judges]]
model = "ollama_cloud.ollama-cloud-deepseek-v4-pro"
label = "risk"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through a RISK lens: identify failure modes, hidden assumptions, and worst-case \
consequences each answer implies, and prefer the resolution that degrades most \
gracefully. Respond with ONLY the requested JSON object, no prose and no code fences.
"""

[[fusion.presets.council.judges]]
model = "ollama_cloud.minimax-m3"
label = "feasibility"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through a FEASIBILITY lens: judge how implementable each proposal is with the \
stated constraints and resources, and prefer the most actionable resolution. \
Respond with ONLY the requested JSON object, no prose and no code fences.
"""

[[fusion.presets.council.judges]]
model = "ollama_cloud.ollama-cloud-deepseek-v4-pro"
label = "simplicity"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through a SIMPLICITY lens: prefer the resolution with the fewest moving parts \
that still answers the question fully, and flag accidental complexity. \
Respond with ONLY the requested JSON object, no prose and no code fences.
"""

[[fusion.presets.council.judges]]
model = "ollama_cloud.ollama-cloud-deepseek-v4-pro"
label = "adversarial"
system_prompt = """
You are an impartial first-pass judge. Synthesize the panel of model answers \
through an ADVERSARIAL lens: actively try to refute each answer's key claims, \
keep only what survives refutation, and prefer the most defensible resolution. \
Respond with ONLY the requested JSON object, no prose and no code fences.
"""

# ── OpenRouter ───────────────────────────────────────────────────────────────
# One OpenAI-compatible endpoint in front of many vendors. Per-model
# capabilities and prices live in the AGENT_CORE catalog as provider-scoped rows
# (packages/agent_core/models.toml, "OpenRouter Models"), so the model entries
# below carry only what the runtime layer owns and do not restate them.
[providers.openrouter]
display-name = "OpenRouter"
protocol = "openai-compatible-http"
endpoint = "https://openrouter.ai/api/v1"

[providers.openrouter.healthcheck]
path = "/models"

[providers.openrouter.credentials]
type = "env"
key = "OPENROUTER_API_KEY"

# OpenRouter identifies the calling app by these two headers and attributes
# usage to it. Both were accepted (HTTP 200) on all twelve probed models.
[providers.openrouter.headers]
HTTP-Referer = "https://github.com/jeong-sik/masc"
X-Title = "MASC"


# ── OpenRouter models ────────────────────────────────────────────────────────
# Twelve ids probed live on 2026-09-10; every one answered HTTP 200 on a plain
# completion and eleven of twelve on tool_choice=required (the exception,
# qwen3.8-max, is declared in the catalog row, not here). Evidence:
# evidence/task-openrouter-support/PROBE-SUMMARY.md.
#
# Each entry declares reasoning-effort because these rows resolve to the
# reasoning_effort thinking dialect, whose only wire control *is* the effort
# value. With the key absent an enable_thinking turn has nothing to encode and
# is refused as Enable_not_encodable — the same trap the ollama.com rows above
# avoid by declaring no dialect at all. "high" is the value probed live
# (probe4-*-effort-only.json: gpt-5.5 returned reasoning.summary +
# reasoning.encrypted, deepseek-v4-flash returned reasoning.text).
#
# The fleet default above is unchanged: these are dispatchable runtimes, not a
# new house model. One binding does claim wizard-default, because the install
# wizard refuses a provider with several enabled bindings and no default
# ("provider openrouter has 12 enabled bindings and no install wizard
# default") and then reports the provider as unknown - the provider would be
# uninstallable. A wizard choice also owes a seed overlay [[targets]] row, and
# an exact-output target wants thinking off so the answer lands in content
# rather than the reasoning field. That rules out the cheaper glm-5.3-flash:
# its endpoint refuses reasoning_effort "none" outright (HTTP 400, probe7), so
# a disable is not encodable there. deepseek-v4-flash takes the disable, and
# among the ids that do it is the cheapest on both axes ($0.0886/$0.177 per
# 1M).
#
# No entry pins max-context either: the catalog row already carries the
# window and resolve_max_context_of_runtime reads it when runtime.toml
# states none, so restating it here would only be a second copy to drift.

[models.openrouter-claude-opus-5]
api-name = "anthropic/claude-opus-5"
tools-support = true
thinking-support = true
streaming = true
reasoning-effort = "high"

[openrouter.openrouter-claude-opus-5]

