name = "masc_browser_act"
description = """
Run one action in an explicitly selected browser. Automation serves the listed actions; Stagehand serves only open_tab and top-level back/forward/reload/close_tab through native browser methods. Live BiDi serves open_tab, and top-level back/forward/reload/close_tab only for a tab this connection opened with open_tab. Omit identity only for initial open_tab discovery; otherwise retain the exact browserSelection lane/clientId and returned tabId. A failed navigation after creation retains a partial-effect receipt: inspect that created tab on the same browser before deciding what to do next; never open another automatically.
Read elements in the same tab/frame for selectors; preserve decoded CSS escapes exactly. After no match, re-read. Actions can change external state: observe again after success or failure before retrying."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 1,981 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 5개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름이 남고,
# 부르면 그 턴에 스키마가 붙는다. 한 줄 요약은 그 답에 한 번 나온다.
defer_loading = true

[[params]]
name = "action"
type = "string"
enum = ["open_tab", "close_tab", "back", "forward", "reload", "upload", "accept_dialog", "dismiss_dialog"]
required = true
description = "Browser-level actions: tabs, history, JavaScript dialogs and file upload. Page input (click, fill, select, scroll, keys) is masc_browser_interact."

[[params]]
name = "lane"
type = "string"
enum = ["automation", "live", "stagehand"]
description = "Optional advanced browser override. Omit only for initial discovery or opening a work browser; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "tabId"
type = "integer"
minimum = 0
description = "Required except open_tab."

[[params]]
name = "selector"
type = "string"
description = "upload: one observed file input; preserve decoded CSS including > and escapes, not JSON escape notation."

[[params]]
name = "text"
type = "string"
description = "accept_dialog prompt text."

[[params]]
name = "url"
type = "string"
description = "open_tab HTTP(S) URL."

[[params]]
name = "framePath"
type = "array"
items = { type = "string" }
description = "Observed outer-to-inner frame selectors; preserve CSS escapes. Nonempty only for upload; omit for top-level."

[[params]]
name = "paths"
type = "array"
items = { type = "string" }
description = "Keeper-readable playground-relative or visible absolute files, privately staged via sandbox before replacing input selection. Max 16 MiB/file."

[[params]]
name = "clientId"
type = "string"
description = "Required with lane=live for open_tab: exact observed BiDi connection ID. Not valid on automation or stagehand."
