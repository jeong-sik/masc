name: Linux x64 manual probe

on:
  workflow_dispatch:
    inputs:
      candle_appraiser_eval:
        description: Include the opt-in Candle semantic evaluation executable (no model calls in CI)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-x64-probe:
    name: Build Linux x64 probe
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Build release binaries for Linux x64
        env:
          PROBE_OUT: ${{ runner.temp }}/masc-linux-x64-probe
        run: |
          chmod +x scripts/build-linux-release.sh
          args=()
          if [ "${{ inputs.candle_appraiser_eval }}" = true ]; then
            args+=(--include-candle-appraiser-eval)
          fi
          scripts/build-linux-release.sh --out "$PROBE_OUT" "${args[@]}"

      - name: Write and verify SHA-256 manifest
        env:
          PROBE_OUT: ${{ runner.temp }}/masc-linux-x64-probe
        run: |
          set -euo pipefail
          cd "$PROBE_OUT"
          sha256sum deployment_preflight_helper.exe main_eio.exe masc_browser_host.exe masc_tui.exe > SHA256SUMS
          if [ -f candle_appraiser_eval_cli.exe ]; then
            sha256sum candle_appraiser_eval_cli.exe >> SHA256SUMS
          fi
          sha256sum --check SHA256SUMS

      - name: Upload Linux x64 probe
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-probe-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/masc-linux-x64-probe/
          if-no-files-found: error
          retention-days: 7
