name = "masc_browser_goto"
description = """
Navigate an isolated automation tab to HTTP(S); returns landing URL/title. Read afterwards. Live navigation is refused; use BrowserInteract for live-tab actions."""
additional_properties = false

[[params]]
name = "url"
type = "string"
required = true
description = "HTTP(S) URL."

[[params]]
name = "tabId"
type = "integer"
description = "BrowserTabs ID; default current tab."
minimum = 0
