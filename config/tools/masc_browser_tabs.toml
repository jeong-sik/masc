name = "masc_browser_tabs"
description = """
List a browser's tabs and the operations it implements.
For Task work call BrowserTabs {} first: with no mode, lane or clientId, MASC picks the browser, using the current Task's Goal binding when present. Keep browserSelection.clientId and tab ids for every later call. browserCapabilities lists implemented operations; a conditional row lists its constraints only when its operation is in requiredActions. A tab whose egoPage.label is null is unmanaged: adopt_tab before reading or acting on it. dialogObservation=unobserved is not proof that no dialog is open; read one with BrowserRead mode=dialog. An ambiguous or stale selection dispatches nothing: choose one listed client deliberately, never the first by default."""
additional_properties = false

[[params]]
name = "mode"
type = "string"
enum = ["connections"]
description = "connections: every observed live client with inventoryIssues and inventoryComplete; reads no Page and selects nothing. Give it alone. Not a substitute for BrowserTabs {} in Task work."

[[params]]
name = "lane"
type = "string"
enum = ["live"]
description = "Optional; live is the only lane, and clientId alone selects the browser."

[[params]]
name = "clientId"
type = "string"
description = "Observed connection UUID; selects that browser instead of the Goal binding. A stale ID fails."

[[params]]
name = "requiredActions"
type = "array"
items = { type = "string", enum = ["list_tabs", "open_tab", "close_tab", "activate_tab", "list_windows", "create_window", "close_window", "navigate", "follow_link", "back", "forward", "reload", "stop_loading", "read_text", "read_html", "read_elements", "read_scene", "read_regions", "read_snapshot", "screenshot", "native_workflow", "click_snapshot_target", "fill_snapshot_target", "hover_snapshot_target", "double_click_snapshot_target", "click", "double_click", "right_click", "middle_click", "pointer_down", "pointer_up", "hover", "pointer_drag", "html5_drop", "scroll_page", "scroll_at", "fill", "type_text", "press_key", "key_chord", "select_option", "read_frames", "frame_interaction", "read_dialog", "accept_dialog", "dismiss_dialog", "hand_off", "take_over", "space_status", "finish_space", "wait_for_control", "adopt_tab", "release_tab", "upload_file", "list_downloads", "page_zoom", "resize_viewport", "touch", "read_clipboard", "write_clipboard", "emulate_environment", "intercept_network", "read_storage", "read_network", "read_console", "write_storage"] }
description = "Operations the task needs; browserCapabilities then lists their constraints. Naming one no browser implements fails before any command."
