\* Buggy model: an offline purge rewrites the history shorter, writes no line,
\* and the read position taken against the old numbering is kept.
\* NoAtomPassedUnread MUST be violated; if every invariant holds under
\* SpecPurgeTrim, a purge needs no guard after all.
\*
\* scripts/tla-check.sh runs only <spec>-buggy.cfg, so until masc#37034 lands
\* this one runs from specs/Makefile (make check-buggy) and nowhere else.
SPECIFICATION SpecPurgeTrim
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
