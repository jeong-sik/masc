name = "masc_goal_upsert"
description = """
Create or update flat Goal metadata.

Creation requires a \
measurable success condition: metric and target_value (RFC-0387 B1). A changed \
effective criterion must keep title, metric and target_value non-blank; \
omitted fields retain their stored values. This checks input completeness, \
not semantic feasibility. Use masc_goal_transition for lifecycle changes."""
additional_properties = false

# Held back from the request until the model asks for it by name. Not
# called once on 2026-08-29 or 2026-08-30 across the fleet.
defer_loading = true

[[params]]
name = "id"
type = "string"

[[params]]
name = "title"
type = "string"

# B1 is NOT expressed as required = true on purpose: this one tool serves both
# create and update, and JSON Schema `required` is unconditional, so listing
# metric/target_value would reject every metadata update of an existing goal.
# The store checks creation and changed effective criteria inside the write
# lock. Omitted fields preserve stored values, so partial updates remain valid.
[[params]]
name = "metric"
type = "string"
description = """
What measures this goal, and where the completion judge reads it. From a \
Keeper, name a public http(s) URL or a board:<post-id> / fusion:<run-id> that \
request_complete submits in evidence_refs; a path in a Keeper's workspace is \
not one the judge can open. On the MASC host, a file under .masc/playground \
can also be named relative to that directory. The judge opens exactly what \
this names — it \
cannot list directories, search, or run a command, so a metric that names no \
observable is refused as unmeasurable rather than hunted for. Required \
(non-blank) when the upsert creates a new goal (RFC-0387 B1); optional on \
update, preserving its stored value when omitted. A changed effective \
criterion must keep title, metric and target_value non-blank."""

[[params]]
name = "target_value"
type = "string"
description = """
The value the metric has to reach, comparable against what the metric's source \
actually reads: a number, a count, a threshold. The judge approves only when \
it read the measurement and it reaches this. Required (non-blank) when the \
upsert creates a new goal (RFC-0387 B1); optional on update, \
preserving its stored value when omitted. A changed effective criterion must \
keep title, metric and target_value non-blank."""

[[params]]
name = "due_date"
type = "string"

[[params]]
name = "priority"
type = "integer"
