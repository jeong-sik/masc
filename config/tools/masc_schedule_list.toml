name = "masc_schedule_list"
description = """
List schedule summary rows; masc_schedule_get reads one in full. Rows follow \
schedule_id order: pass next_cursor as cursor, same filters, for the next page."""
additional_properties = false

[[params]]
name = "owner"
type = "string"
required = true
enum = ["self", "wake_target", "scheduled_by", "all"]
description = """
self: rows you scheduled or that wake you. Refused with error_kind \
caller_unidentified when the endpoint cannot name you."""

[[params]]
name = "owner_name"
type = "string"
description = "Required with wake_target or scheduled_by."

[[params]]
name = "status"
type = "string"
enum = ["scheduled", "due", "running", "succeeded", "failed", "cancelled", "expired", "active"]
description = "active: every status that is not terminal."

[[params]]
name = "limit"
type = "integer"
minimum = 1
maximum = 200
description = "Defaults to 50."

[[params]]
name = "cursor"
type = "string"
