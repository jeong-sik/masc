name = "tool_write_file"
description = """
Write or append a file. path and mode are required; an absent mode is \
rejected instead of defaulting to overwrite. content is required and \
non-empty. Good overwrite: path='lib/foo.ml', mode='overwrite', \
content='let x = 1'. Bad: path='', content=''. Creates parent dirs."""

[[params]]
name = "path"
type = "string"
required = true
description = "Relative or absolute file path to write"

[[params]]
name = "content"
type = "string"
required = true
description = "File content to write"

[[params]]
name = "mode"
type = "string"
required = true
enum = ["overwrite", "append"]
description = "Write mode; absence is rejected"
