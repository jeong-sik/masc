name = "masc_library_add"
description = """
Add a new document to the agent knowledge library. Use when recording a new \
finding, experiment result, or pattern that other agents should know about."""

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 2 times in 2 turns, 711 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 2 extra requests over the same week.
defer_loading = true

[[params]]
name = "title"
type = "string"
required = true
description = "Document title"

[[params]]
name = "source"
type = "string"
required = true
description = """
Source type: direct_experience, research, experiment, observation"""
enum = ["direct_experience", "research", "experiment", "observation"]

[[params]]
name = "tags"
type = "array"
items = { type = "string" }
description = "List of tags"

[[params]]
name = "content"
type = "string"
required = true
description = "Document body content (markdown)"
