name = "masc_web_fetch"
description = """
Fetch one web page for deeper reading. Use exact tool name WebFetch. Example \
input: \
{\"url\":\"https://ocaml.org/news\",\"extractMode\":\"markdown\",\"maxChars\":5000}. \
Returns text, title, final_url, http_status, truncated. Use after WebSearch \
when you need a citation or full article text. Do not use snake_case names \
like web_fetch."""
additional_properties = false

[[params]]
name = "url"
type = "string"
required = true
description = "Full URL to fetch. Example: \"https://ocaml.org/news\"."

[[params]]
name = "timeout"
type = "integer"
description = "Request timeout in seconds."
minimum = 1
maximum = 60
default = 15

[[params]]
name = "extractMode"
type = "string"
enum = ["markdown", "text"]
description = """
Output extraction mode. markdown (default) preserves headings/lists/links; \
text returns flattened plain text."""
default = "markdown"

[[params]]
name = "maxChars"
type = "integer"
description = """
Maximum extracted content characters to return. Longer pages come back as a \
head/tail window around a [TRUNCATED ...] marker whose full_text path holds \
the complete extraction."""
minimum = 1
maximum = 100000
default = 50000
