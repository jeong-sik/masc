# Better Stack's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.betterstack.com/.well-known/oauth-protected-resource,
# authorization server (https://betterstack.com) offers S256 PKCE and dynamic
# client registration (HTTP 201). It publishes 'read' and 'write' scopes.

id = "betterstack"
label = "Better Stack"
mcp_url = "https://mcp.betterstack.com"

access_token_env = "BETTERSTACK_ACCESS_TOKEN"
expires_at_env = "BETTERSTACK_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.betterstack/refresh_token"

renew_before_sec = 600
