\* Buggy model: on a refusal the floor's forms are written (the carrier
\* switched, memory deferred) before the floor is chosen, as the hooks do on
\* a Resume refusal before the RFC. A run that does not send the floor
\* keeps them.
\* Expected: WritesOnlyForTheFloor VIOLATED.
SPECIFICATION SpecCommitFirst

CONSTANTS
    TurnLimit       = 35
    WindowLimit     = 200
    FixedTurnSizes  = {20, 40}
    FixedSideSizes  = {30, 90, 190}
    ResumeTurnSizes = {30, 50}
    VendorSizes     = {20, 200}
    CarrierInline   = 40
    CarrierAddress  = 5
    MemoryFull      = 40
    MemoryDeferred  = 5
    HistoryFull     = 32
    HistoryFloor    = 4

INVARIANTS
    TypeOK
    WritesOnlyForTheFloor

CHECK_DEADLOCK FALSE
