[[params]]
name = "durationMs"
type = "integer"
minimum = 0
maximum = 9007199254740991
description = "drag/drag_to/swipe: duration of each intermediate and destination move in milliseconds; default 0. Requires automation or live webdriver_bidi when nonzero."

[[params]]
name = "key"
type = "string"
description = "press_key: Enter, Tab, Escape, Backspace, Delete, ArrowUp/Down/Left/Right, Home, End, or one Unicode scalar. Stagehand refuses supplementary scalar keys; use type_text for Unicode text. Sends native down/up to current focus; no guessed selector or synthetic events."

[[params]]
name = "modifiers"
type = "array"
items = { type = "string", enum = ["Control", "Meta", "Alt", "Shift"] }
description = "press_key: explicit distinct modifiers, e.g. [Meta] with key a selects all on macOS; [Control] on other systems. Native keys and double clicks require Stagehand, automation, or live webdriver_bidi. WebExtension does not serve native keyboard actions. set_zoom is a separate WebExtension-only action."

[[params]]
name = "width"
type = "integer"
minimum = 100
maximum = 4096
description = "set_viewport only: viewport width in CSS pixels, given together with height. Omit both on a live BiDi connection to restore the browser's own size."

[[params]]
name = "height"
type = "integer"
minimum = 100
maximum = 4096
description = "set_viewport only: viewport height in CSS pixels, given together with width."

[[params]]
name = "factor"
type = "number"
minimum = 0.3
maximum = 5.0
description = "set_zoom only: actual browser zoom factor (0.3–5), requires exact clientId/tabId and expectedUrl on a WebExtension >=0.8.0. Receipt measures zoomFactor and actual zoomScope; Firefox per-origin zoom can affect/persist for same-site tabs. Re-read scene/screenshot geometry afterward. Other adapters refuse before input."

[[params]]
name = "steps"
type = "array"
description = "workflow only: native Ego Page calls followed by one final snapshot. Each step uses only its method arguments and native options. click/dblclick/hover/focus take selector; dragAndDrop takes selector,destination; mouse.click/move/wheel take CSS x,y (wheel uses deltas and needs a move/click in this round first); fill takes selector,text; press takes selector,key; selectOption takes selector,selectionJson; goto takes an absolute HTTP(S) url; waitForURL takes exactly one string/glob url or native urlRegex {source,flags?}; waitForSelector takes selector,state; waitForLoadState state is optional. Keyboard methods take text or key; paste also accepts html. evaluate/waitForFunction take source and optional argumentJson. fetch takes an HTTP(S) or relative url and returns its structured response as the step receipt. options.saveAs is an artifact filename, never a host path; retrieve the returned downloadId with BrowserRead mode=downloads on the same client/tab without repeating fetch. download.cancel takes a canonical downloadId observed on this exact Page in this SDK process. It calls a pending native Download handle once; cancelReturned only means the SDK call returned, since completion can win the race. Re-read BrowserRead mode=downloads for actual status; never replay after a lost result. Fetch, completed, unknown and foreign-Page downloads are refused before cancellation. url/title/info return native Page state; snapshot returns native text with scope/root/action-mark/stable-locator options; events drains this SDK process's Page event buffer and is a non-replayable effect, not cross-process history. waitForTimeout takes nonnegative milliseconds and is not a page-readiness check. Native options use SDK names and are strictly validated for that method; omission uses SDK defaults. evaluate/keyboard.insertText/keyboard.paste/download.cancel/url/title/info/events/waitForTimeout accept no options. Source runs only in the browser; Page code and fetch may have effects even on failure. A failed pointer click/drag or lost key input result keeps release unconfirmed without synthetic cleanup. Paste can hold ControlOrMeta+V. Answering a dialog does not acknowledge button/key release; automatic continuation after interrupted input is unsupported. An unconfirmed release blocks further input. Choose the next action from current observations; no new judgment inside the call. There is no cumulative step/time limit."

