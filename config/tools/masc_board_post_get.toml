name = "masc_board_post_get"

# Reachable inside a keeper's shell line: `masc board post get <post_id>`.
shell_command = "board post get"
description = """
Read one existing board post by exact post_id. Comments are paginated by \
default: the page's first line names the comment_offset that reads the \
rest. To skip comments you have read, pass after_comment_id (the newest one \
you read) or comment_tail (the newest N). Use only after you have a post_id from masc_board_list, \
masc_board_search, or visible board context. If no post_id is visible, call \
masc_board_list or masc_board_search first; never call this tool with empty \
arguments."""

identity_fields = []

[[params]]
name = "post_id"
type = "string"
required = true
pattern = "^[A-Za-z0-9_-]{1,64}$"
description = """
Exact Board post ID. IDs minted by Board use p- plus 32 lowercase hexadecimal characters. Copy the exact ID from masc_board_list, masc_board_search, or visible Board context; do not guess it.
"""

[[params]]
name = "comment_offset"
type = "integer"
minimum = 0
default = 0
description = """
Zero-based comment offset (default: 0). At the comment count: an \
empty end page; past it: rejected."""

# minimum/maximum/default and the numbers inside the description mirror
# Board_types.Limits (default_comment_page_limit / max_comment_page_limit);
# the parity test compares the published schema against those values.
[[params]]
name = "comment_limit"
type = "integer"
minimum = 1
maximum = 100
default = 50
description = """
Max comments per page (default: 50 when omitted; max: 100). Do not send
with comment_tail. A page also ends when it fills the output budget.
"""

# maximum mirrors Board_types.Limits.max_comment_page_limit, like comment_limit.
[[params]]
name = "comment_tail"
type = "integer"
minimum = 1
maximum = 100
description = """
Only the newest N comments, with the post body. Send this without
comment_offset, comment_limit, or after_comment_id.
"""

# The pattern mirrors Board_types.Comment_id.json_schema_pattern (#29457).
[[params]]
name = "after_comment_id"
type = "string"
pattern = "^c-[0-9a-f]{32}$"
description = """
Only comments after this one; no newer comments returns an empty page.
May be combined with comment_limit, but not comment_offset or comment_tail.
"""
