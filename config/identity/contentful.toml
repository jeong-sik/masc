# Contentful's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.contentful.com/.well-known/oauth-protected-resource/mcp,
# authorization server (https://mcp.contentful.com) offers S256 PKCE and dynamic
# client registration (HTTP 201).

id = "contentful"
label = "Contentful"
mcp_url = "https://mcp.contentful.com/mcp"

access_token_env = "CONTENTFUL_ACCESS_TOKEN"
expires_at_env = "CONTENTFUL_EXPIRES_AT"
refresh_token_file = "/home/keeper/.contentful/refresh_token"
renew_before_sec = 300
