id = "fusion-results"
revision = "0.1.2"
title = "Fusion results and retained evidence"
contributions = ["observe", "derive"]
image = "masc-lane-fusion-results:0.1.2"
command = ["python3", "server.py"]

[world.outputs.status]
lanes = ["fusion/status"]

[world.outputs.result]
lanes = ["fusion/status", "fusion/result"]

[resources]
cpus = 0.5
memory_bytes = 134217728
pids = 16
max_reply_bytes = 4194304

[interface]
refresh_policy = "source_changes"
# The typed source decoder requires path for snapshot_file and run_id for fusion_run.
binding_schema = '''
{
  "type": "object",
  "required": [
    "sources"
  ],
  "additionalProperties": false,
  "properties": {
    "sources": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "object",
        "required": [
          "source_id",
          "kind"
        ],
        "additionalProperties": false,
        "properties": {
          "source_id": {
            "type": "string",
            "minLength": 1
          },
          "kind": {
            "type": "string",
            "enum": [
              "snapshot_file",
              "fusion_run"
            ]
          },
          "path": {
            "type": "string",
            "minLength": 1
          },
          "run_id": {
            "type": "string",
            "minLength": 1
          }
        }
      }
    }
  }
}
'''
