name = "keeper_ide_annotate"
description = """
Leave a memo above a line of a file, as a comment in the file's own syntax. The memo reads masc(<your name>): <text>, or masc(<your name>) <kind>: <text> with kind decision, question or bookmark; the TUI lists these and marks their lines, and they travel with the file into diffs and reviews. This edits the file: the comment is inserted above line, indented like it, through the same write path as Edit. file_path, line and text are required. The file's extension picks the comment syntax; a file no language here owns, or one with no comment syntax (JSON), is refused."""
additional_properties = false

# Held back from the request until the model asks for it by name.
defer_loading = true

[[params]]
name = "file_path"
type = "string"
required = true
description = "Absolute or sandbox-relative path of the file, as Edit takes it. The file must exist."

[[params]]
name = "line"
type = "integer"
required = true
minimum = 1
description = "1-based line the memo goes above"

[[params]]
name = "kind"
type = "string"
enum = ["comment", "decision", "question", "bookmark"]
description = "Memo kind; defaults to comment"

[[params]]
name = "text"
type = "string"
required = true
description = "One line of memo text"
