name: Native TUI artifact

# Called only by an explicit manual Minimal manual checks dispatch. Feature
# source and the workflow revision are recorded separately in the artifact.
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      scenario:
        required: false
        default: detail-ownership
        type: string

permissions:
  contents: read

jobs:
  macos-tui:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Validate exact source identity
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          PROOF_SCENARIO: ${{ inputs.scenario }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source-sha must be 40 lowercase hex characters' >&2; exit 1; }
          case "$PROOF_SCENARIO" in
            detail-ownership|workspace-files|rich-workspace|rich-chat-workspace|original-tool-result|code-references|resource-reading|addon-lifecycle|source-readers|code-drafts) ;;
            *) echo 'unsupported native proof scenario' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Bind the source tree
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-ocaml-toolchain
      - name: Install native dependencies
        run: |
          brew install flock gmp libpq openssl@3 zstd
          libpq_prefix="$(brew --prefix libpq)"
          openssl_prefix="$(brew --prefix openssl@3)"
          {
            echo "$libpq_prefix/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-compact-protocol --with-bisect
      - name: Install OCaml dependencies
        run: opam install ./masc.opam --deps-only --with-test -y
      - name: Build the selected native behavior scope
        id: native-build
        env:
          PROOF_SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          mkdir -p proof
          targets=(bin/masc_tui.exe bin/masc_tui_keys_doc_cli.exe)
          case "$PROOF_SCENARIO" in
            detail-ownership)
              targets+=(test/test_tui_detail_reading.exe test/test_tui_board_successor.exe test/test_tui_usage_scope.exe)
              ;;
            workspace-files|rich-workspace|rich-chat-workspace)
              targets+=(bin/main_eio.exe test/test_repo_git.exe test/test_tui_workspace_entries.exe test/test_workspace_file_confidentiality.exe)
              ;;
            resource-reading)
              targets+=(bin/main_eio.exe test/test_tui_published_reports.exe test/test_tui_resource_document_search.exe test/test_tui_resource_image_admission.exe test/test_tui_resource_images.exe)
              ;;
            addon-lifecycle)
              targets+=(bin/main_eio.exe test/test_tui_lane_addons.exe test/test_lane_addon_application.exe)
              ;;
            original-tool-result|source-readers)
              targets+=(bin/main_eio.exe test/test_keeper_tool_result_source.exe test/test_tool_output_washing_e2e.exe test/test_server_dashboard_http_keeper_tool_lookup.exe test/test_tui_chat_call_reader.exe)
              ;;
            code-references)
              command -v python3 >/dev/null
              targets+=(bin/main_eio.exe test/test_lsp_workspace_pool.exe test/test_lsp_questions.exe test/test_lsp_message_router.exe test/test_lsp_process_manager.exe test/test_server_ide_lsp_proxy.exe)
              ;;
            code-drafts)
              targets+=(bin/main_eio.exe test/test_tui_code_draft.exe test/test_tui_workspace_entries.exe test/test_workspace_file_confidentiality.exe test/test_tui_keys.exe test/test_tui_palette_matching.exe)
              ;;
            *) echo 'unsupported native proof scenario' >&2; exit 1 ;;
          esac
          if [ "$PROOF_SCENARIO" = source-readers ]; then
            targets+=(test/test_tui_workspace_entries.exe test/test_tui_keys.exe test/test_tui_palette_matching.exe)
          fi
          if [ "$PROOF_SCENARIO" = rich-workspace ] || [ "$PROOF_SCENARIO" = rich-chat-workspace ]; then
            targets+=(test/test_lsp_position.exe test/test_tui_music_launcher.exe test/test_tui_alphatex.exe)
          fi
          if [ "$PROOF_SCENARIO" = rich-chat-workspace ]; then
            targets+=(test/test_tui_chat_call_reader.exe)
          fi
          printf '%s\n' "${targets[@]}" > proof/build-targets.txt
          opam exec -- dune build "${targets[@]}" 2>&1 | tee proof/build.log
      - name: Verify candidate and ownership behavior
        run: |
          set -euo pipefail
          : > proof/executed-tests.txt
          : > proof/test-results.tsv
          failed=0
          while IFS= read -r target; do
            case "$target" in
              test/*)
                suite="$(basename "$target" .exe)"
                set +e
                "_build/default/$target" </dev/null 2>&1 | tee "proof/$suite.log"
                result=("${PIPESTATUS[@]}")
                set -e
                printf '%s\t%s\t%s\n' "$suite" "${result[0]}" "${result[1]}" >> proof/test-results.tsv
                printf '%s\n' "$suite" >> proof/executed-tests.txt
                if [ "${result[0]}" -ne 0 ] || [ "${result[1]}" -ne 0 ]; then
                  failed=1
                fi
                ;;
            esac
          done < proof/build-targets.txt
          exit "$failed"
      - name: Package exact compiled candidate and behavior results
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          PROOF_SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          test "$(_build/default/bin/masc_tui.exe --build-commit)" = "$SOURCE_SHA"
          _build/default/bin/masc_tui.exe --help </dev/null > proof/help.txt
          _build/default/bin/masc_tui_keys_doc_cli.exe </dev/null > proof/key-reference.md
          cp _build/default/bin/masc_tui.exe proof/masc-tui
          chmod +x proof/masc-tui
          otool -L proof/masc-tui > proof/native-dependencies.txt
          if [ "$PROOF_SCENARIO" = workspace-files ] || [ "$PROOF_SCENARIO" = rich-workspace ] || [ "$PROOF_SCENARIO" = rich-chat-workspace ] || [ "$PROOF_SCENARIO" = original-tool-result ] || [ "$PROOF_SCENARIO" = code-references ] || [ "$PROOF_SCENARIO" = resource-reading ] || [ "$PROOF_SCENARIO" = addon-lifecycle ] || [ "$PROOF_SCENARIO" = source-readers ] || [ "$PROOF_SCENARIO" = code-drafts ]; then
            test "$(_build/default/bin/main_eio.exe build-commit)" = "$SOURCE_SHA"
            cp _build/default/bin/main_eio.exe proof/masc
            chmod +x proof/masc
            otool -L proof/masc > proof/server-native-dependencies.txt
          fi
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          binary = Path('proof/masc-tui')
          results = [
              {'suite': suite, 'suite_exit_code': int(code), 'log_exit_code': int(log_code)}
              for suite, code, log_code in (
                  row.split('\t') for row in Path('proof/test-results.tsv').read_text().splitlines()
              )
          ]
          targets = Path('proof/build-targets.txt').read_text().splitlines()
          expected_tests = [Path(target).stem for target in targets if Path(target).parts[:1] == ('test',)]
          executed_tests = Path('proof/executed-tests.txt').read_text().splitlines()
          Path('proof/receipt.json').write_text(json.dumps({
              'source_sha': os.environ['SOURCE_SHA'],
              'workflow_sha': os.environ['WORKFLOW_SHA'],
              'scenario': os.environ['PROOF_SCENARIO'],
              'platform': 'macos-arm64',
              'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'key_reference': {
                  'path': 'key-reference.md',
                  'sha256': hashlib.sha256(Path('proof/key-reference.md').read_bytes()).hexdigest(),
                  'producer': 'bin/masc_tui_keys_doc_cli.exe',
              },
              'server_sha256': hashlib.sha256(Path('proof/masc').read_bytes()).hexdigest() if os.environ['PROOF_SCENARIO'] in ('workspace-files', 'rich-workspace', 'rich-chat-workspace', 'original-tool-result', 'code-references', 'resource-reading', 'addon-lifecycle', 'source-readers', 'code-drafts') else None,
              'build_targets': targets,
              'expected_tests': expected_tests,
              'executed_tests': executed_tests,
              'test_results': results,
              'behavior_passed': bool(expected_tests) and executed_tests == expected_tests and [result['suite'] for result in results] == expected_tests and all(result['suite_exit_code'] == 0 and result['log_exit_code'] == 0 for result in results),
              'installed_runtime_verified': False,
              'visible_ui_verified': False,
              'packaging': 'native executable; see native-dependencies.txt for dynamic libraries'
          }, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tui-macos-arm64-${{ inputs.source-sha }}-${{ github.run_id }}
          path: proof/
          if-no-files-found: warn
          retention-days: 7
