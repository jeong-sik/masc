\* Buggy model: a round takes a matching read position over a restart line it
\* has not counted, which is row 3c turned around.
\*
\* scripts/tla-check.sh runs only <spec>-buggy.cfg, so until masc#37033 this
\* one runs from specs/Makefile (make check-buggy) and nowhere else.
\* NoAtomPassedUnread MUST be violated; if every invariant holds under
\* SpecPositionFirst, the spec is too weak.
SPECIFICATION SpecPositionFirst
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 1
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
