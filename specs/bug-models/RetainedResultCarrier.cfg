\* Clean model: a size refusal switches the run's carrier to the address form
\* once, when that form is strictly shorter
\* (RFC-retained-results-carrier-shrinks-to-an-address).
\* With fixed = 98 even the address floor is over the window, so the model
\* also reaches the fence that stays the operator's.
\* Expected: no violation.
SPECIFICATION SpecClean

CONSTANTS
    Window       = 100
    FixedSizes   = {40, 98}
    ReceiptBytes = 10
    AddressBytes = 15
    MaxReceipts  = 8
    HistoryBytes = 64

INVARIANTS
    TypeOK
    NoLockWhileFloorFits
    SwitchBeforeShrink

PROPERTIES
    ReceiptsLeaveOnlyOnAccept
    RunEnds

CHECK_DEADLOCK FALSE
