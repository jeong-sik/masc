name: Minimal manual checks

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  syntax:
    name: Source and config syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Validate concrete source and configuration syntax
        run: |
          git diff --check origin/main...HEAD
          python3 - <<'PYCODE'
          from pathlib import Path
          import tomllib
          import xml.etree.ElementTree as ET
          import yaml
          ET.parse('docs/constitution.xml')
          for path in Path('config').rglob('*.toml'):
              tomllib.loads(path.read_text())
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text())
          PYCODE
      - name: Scan committed credentials
        run: python3 scripts/ci/check-committed-secrets.py
