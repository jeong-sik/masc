# Miro's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be made by hand come from what it serves, so none of that
# can go stale here.
#
# Measured 2026-08-27: an MCP initialize is refused with 401, it publishes its protected-resource document at the origin while
# serving MCP below it, so the location comes from the 401's
# WWW-Authenticate header, and the
# authorization server it names offers S256. It registers a client itself, so nothing has to be set up first. It names 4 scopes, all of which are asked for.

id = "miro"
label = "Miro"
mcp_url = "https://mcp.miro.com/mcp"

access_token_env = "MIRO_ACCESS_TOKEN"
expires_at_env = "MIRO_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.miro/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
