name = "keeper_skill"
description = "Read one frozen instruction Skill body by its canonical exact reference. When that body names a bundled file needed for the current work, call again with its relative `file` path. A file larger than the turn's configured `[skills].resource-read-max-bytes`, or content that cannot fit the provider's shared inline tool-result boundary, is rejected before activation is recorded. Use the exact reference projected by the current Task or this tool's Available list; names alone are never accepted."
additional_properties = false

[[params]]
name = "identity"
type = "object"
required = true
additional_properties = false
description = "Exact Skill identity from the frozen turn snapshot."

[[params.params]]
name = "source_id"
type = "string"
required = true
min_length = 1

[[params.params]]
name = "package_id"
type = "string"
required = true
min_length = 1

[[params.params]]
name = "name"
type = "string"
required = true
min_length = 1

# No length/pattern gate here: a caller that lacks the revision must reach
# the handler, whose refusal carries the exact references this keeper does
# carry. A schema-level gate answered those calls with a generic length
# error that could not name the catalog (task-828).
[[params]]
name = "content_revision"
type = "string"
required = true
description = "Canonical domain-separated SHA-256 content revision derived from the exact frozen SKILL.md bytes: 64 lowercase hex characters, copied verbatim from the Task skill reference or this tool's Available list."

[[params]]
name = "file"
type = "string"
required = false
min_length = 1
description = "Optional bundled resource path relative to the Skill root, exactly as SKILL.md names it. Omit it to read the frozen Skill body."
