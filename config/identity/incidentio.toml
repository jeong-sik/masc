# incident.io's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.incident.io/mcp/.well-known/oauth-protected-resource,
# authorization server (https://mcp.incident.io/mcp) offers S256 PKCE and dynamic
# client registration (HTTP 201).

id = "incidentio"
label = "incident.io"
mcp_url = "https://mcp.incident.io/mcp"

access_token_env = "INCIDENTIO_ACCESS_TOKEN"
expires_at_env = "INCIDENTIO_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.incidentio/refresh_token"

renew_before_sec = 600
