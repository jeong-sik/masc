# Netlify's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be made by hand come from what it serves, so none of that
# can go stale here.
#
# Measured 2026-08-27: an MCP initialize is refused with 401, its protected-resource document answers where RFC 9728 computes it, and the
# authorization server it names offers S256. It registers a client itself, so nothing has to be set up first. It names 4 scopes, all of which are asked for.

id = "netlify"
label = "Netlify"
mcp_url = "https://mcp.netlify.com/mcp"

# Seen 2026-11-03: the authorize step here goes to sign-in before it looks at
# the redirect, so nothing short of a real login tells whether it takes this
# server's public callback. Atlassian and Datadog behave the same way, and
# both refused the public callback after sign-in while logins through the
# loopback form completed. A client registered here in 2026-08 with the
# loopback form was accepted. So a login here names the loopback callback, and
# the browser that consents has to reach this server on 127.0.0.1.
callback = "loopback"

access_token_env = "NETLIFY_ACCESS_TOKEN"
expires_at_env = "NETLIFY_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.netlify/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
