name = "masc_dos_type"
description = """
Type text on the shared DOS machine.

Sends the characters in turn, the way masc_dos_press sends one-character \
keys. For a name or a number a program is asking for, not for menu \
navigation — a menu wants masc_dos_press so the arrows and enter have names. \
A character the US layout has no key for is refused before anything is \
typed."""
additional_properties = false

defer_loading = true

[[params]]
name = "text"
type = "string"
required = true
description = "The characters to type, e.g. \"SAVED\"."

[[params]]
name = "steps"
type = "integer"
description = "Instruction budget per character. Default 1000000."
minimum = 1
maximum = 4000000
default = 1000000
