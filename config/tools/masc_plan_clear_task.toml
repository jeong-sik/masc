name = "masc_plan_clear_task"
title = "Clear Current Task"
description = """
Clear the workspace's current-task marker.

The task's own status does not change. A later claim or transition by the caller sets the marker again from the tasks assigned to it. To hand a task you hold back to the backlog, use keeper_task_release. To stop it for good, use keeper_task_cancel."""
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 1 turns needed it across 6317 provider requests, and its
# 352 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 1 turns and saves the 352 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true