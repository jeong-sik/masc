name = "masc_board_post_get"

# Reachable inside a keeper's shell line: `masc board post get <post_id>`.
shell_command = "board post get"
description = """
Read one existing board post by exact post_id. The default read returns the \
post body and its newest comments (up to 20). The first line gives \
comment_offset and comment_limit for the preceding page; \
Repeat toward offset 0 for older comments. To skip comments \
you have read, pass after_comment_id (the \
newest one you read) or comment_tail (the newest N). If no post_id is visible, call masc_board_list or masc_board_search first; \
never call this tool with empty arguments."""

identity_fields = []

[[params]]
name = "post_id"
type = "string"
pattern = "^[a-zA-Z0-9_-]{1,64}$"
required = true
description = """
Required exact board post ID (format: p-xxxx). Get it from \
masc_board_list, masc_board_search, or visible board context \
before calling masc_board_post_get."""

[[params]]
name = "comment_offset"
type = "integer"
minimum = 0
description = """
Zero-based comment offset. Omit it to read the newest comments; pass 0 to \
read from the oldest. At the comment count: an empty end page; past it: \
rejected."""

# No machine-readable [default] on comment_offset or comment_limit: both are
# mutually exclusive with comment_tail and after_comment_id (Board_types
# request_of_args), so a client that filled a declared default would send a
# value that conflicts with the argument the caller actually chose. The
# server applies the default itself (bounded_limit None), and the description
# keeps it visible. minimum/maximum still mirror Board_types.Limits.
[[params]]
name = "comment_limit"
type = "integer"
minimum = 1
maximum = 100
description = """
Max comments per page (default: 20, max: 100). A page also \
ends when it fills the output budget."""

# maximum mirrors Board_types.Limits.max_comment_page_limit, like comment_limit.
[[params]]
name = "comment_tail"
type = "integer"
minimum = 1
maximum = 100
description = """
Only the newest N comments, with the post body. Send it alone."""

# The pattern mirrors Board_types.Comment_id.json_schema_pattern (#29457).
[[params]]
name = "after_comment_id"
type = "string"
pattern = "^c-[0-9a-f]{32}$"
description = """
Only the comments after this one; nothing new is an empty page. Not with \
comment_offset or comment_tail."""
