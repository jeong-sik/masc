defer_loading = true
name = "keeper_image_read"
description = """
Read an image's original pixels directly into the current model, without calling another \
model. Provide exactly one sandbox path or stored attachment/artifact handle (att_<sha256> \
or 64-character lowercase SHA-256) returned by an image or screenshot tool. An image \
already present in the model input needs no read call. Offered only when the active \
runtime natively supports vision input."""
additional_properties = false

[[params]]
name = "path"
type = "string"
role = "path"
description = "Image file in your own sandbox, resolved like Read."

[[params]]
name = "artifact"
type = "string"
description = "Exact Keeper-local image handle returned by a screenshot or image tool; not a tool-blob reference."
