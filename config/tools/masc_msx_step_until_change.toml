name = "masc_msx_step_until_change"
description = """
Advance MSX until the screen settles, without holding a key.

Samples every 6 frames; two near-equal coarse views stop it (cursor blink ignored).
Returns masc_msx_screen observation plus frames_run, changed versus the start,
and stable (false at max_frames). A settled unchanged screen may await a key.
Use for title/fade/level intros instead of repeated step and screen calls."""
additional_properties = false

defer_loading = true

[[params]]
name = "max_frames"
type = "integer"
minimum = 1
maximum = 300
default = 300
