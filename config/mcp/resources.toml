# MCP surface prose (RFC prompts-and-tool-definitions-outside-ocaml §3 item 8):
# the static resource catalogue advertised by resources/list and
# resources/templates/list, the server description carried in every initialize
# result, and the per-tool help-resource name suffix composed by
# resources/list. Decoded once at boot by Mcp_surface_toml; a file that does
# not decode refuses the boot.

[server]
description = "Multi-agent MCP server exposing MASC workspace state, tools, prompts, and resources."

[tool_help]
name_suffix = " Help"

[[resources]]
uri = "masc://status"
name = "MASC Status"
title = "Project Status"
description = "Current project status snapshot (same as masc_status)"
mime_type = "text/markdown"

[[resources]]
uri = "masc://status.json"
name = "MASC Status (JSON)"
title = "Project Status (JSON)"
description = "Current project status snapshot as JSON (for data collection)"
mime_type = "application/json"

[[resources]]
uri = "masc://tasks"
name = "Quest Board"
title = "Task Board"
description = "Task board snapshot (defaults to active tasks; same as masc_tasks)"
mime_type = "text/markdown"

[[resources]]
uri = "masc://tasks.json"
name = "Quest Board (JSON)"
title = "Task Board (JSON)"
description = "Task board snapshot as JSON (backlog.json; all statuses)"
mime_type = "application/json"

[[resources]]
uri = "masc://who"
name = "Active Agents"
title = "Online Agents"
description = "In-memory agent/session status"
mime_type = "text/markdown"

[[resources]]
uri = "masc://who.json"
name = "Active Agents (JSON)"
title = "Online Agents (JSON)"
description = "In-memory agent/session status as JSON"
mime_type = "application/json"

[[resources]]
uri = "masc://agents"
name = "Agents (Metadata)"
title = "Agent Registry"
description = "Agent registry snapshot (capabilities, tasks, last_seen)"
mime_type = "text/markdown"

[[resources]]
uri = "masc://agents.json"
name = "Agents (Metadata, JSON)"
title = "Agent Registry (JSON)"
description = "Agent registry snapshot as JSON"
mime_type = "application/json"

[[resources]]
uri = "masc://messages?since_seq=0&limit=10"
name = "Recent Messages"
title = "Recent Messages"
description = "Recent messages snapshot (same as masc_messages)"
mime_type = "text/markdown"

[[resources]]
uri = "masc://messages.json?since_seq=0&limit=10"
name = "Recent Messages (JSON)"
title = "Recent Messages (JSON)"
description = "Recent messages snapshot as JSON (for data collection)"
mime_type = "application/json"

[[resources]]
uri = "masc://events?limit=50"
name = "Recent Events"
title = "Event Log"
description = "Recent event log snapshot (task/agent transitions)"
mime_type = "text/markdown"

[[resources]]
uri = "masc://events.json?limit=50"
name = "Recent Events (JSON)"
title = "Event Log (JSON)"
description = "Recent event log snapshot as JSON"
mime_type = "application/json"

# Library - documents in <base_path>/docs/library
[[resources]]
uri = "masc://library"
name = "Library Index"
title = "Knowledge Library"
description = "Library documents with title, source, and tags. A document whose frontmatter does not read is listed by filename with the reason."
mime_type = "text/markdown"

[[resources]]
uri = "masc://library.json"
name = "Library Index (JSON)"
title = "Knowledge Library (JSON)"
description = "Library documents as JSON with title, source, author, created, and tags. A document whose frontmatter does not read carries the reason in unreadable instead."
mime_type = "application/json"

[[resources]]
uri = "masc://tool-help-index"
name = "Tool Help Index"
title = "Tool Help Index"
description = "Canonical help index for MCP-exposed MASC tools"
mime_type = "text/markdown"

[[resource_templates]]
uri_template = "masc://messages{?since_seq,limit}"
name = "Messages (range)"
title = "Messages by Range"
description = "Read messages with optional since_seq and limit"
mime_type = "text/markdown"

[[resource_templates]]
uri_template = "masc://messages.json{?since_seq,limit}"
name = "Messages (range, JSON)"
title = "Messages by Range (JSON)"
description = "Read messages as JSON with optional since_seq and limit"
mime_type = "application/json"

[[resource_templates]]
uri_template = "masc://events{?limit}"
name = "Events (range)"
title = "Events by Range"
description = "Read recent event log entries with optional limit"
mime_type = "text/markdown"

[[resource_templates]]
uri_template = "masc://events.json{?limit}"
name = "Events (range, JSON)"
title = "Events by Range (JSON)"
description = "Read recent event log entries as JSON with optional limit"
mime_type = "application/json"

[[resource_templates]]
uri_template = "masc://library/{topic}"
name = "Library Document"
title = "Library Document"
description = "Read a specific library document by topic name"
mime_type = "text/markdown"

[[resource_templates]]
uri_template = "masc://library/{topic}.json"
name = "Library Document (JSON)"
title = "Library Document (JSON)"
description = "Read a specific library document as JSON: its content with title, source, author, created, and tags, or with the reason in unreadable when its frontmatter does not read"
mime_type = "application/json"

[[resource_templates]]
uri_template = "masc://tool-help/{tool_name}"
name = "Tool Help"
title = "Tool Help"
description = "Read canonical help for a specific MCP tool"
mime_type = "text/markdown"
