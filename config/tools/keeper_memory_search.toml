name = "keeper_memory_search"
description = """
Search your durable Memory OS facts or conversation history. A fact matches \
when it holds the whole query, else every word of it; each store lists \
whole-query matches first, else in stored order. Results give exact \
memory_id, category, and basis. Use returned memory_id values as premise_ids \
when writing a derived conclusion only when store='current_memory_snapshot'; \
other results name their different store explicitly. Use source='absorbed' \
for facts a librarian merged into a newer claim: into names that claim's \
memory_id, and into_current=false means that claim is not current -- removed \
since, or never committed. Use source='history' for raw user messages, \
source='all' for every store."""
additional_properties = false

[[params]]
name = "query"
type = "string"
required = true
description = "words to search for"

[[params]]
name = "limit"
type = "integer"
description = """
max results (1-10, default 5). Must be a bare integer (e.g. 5); a quoted \
value is rejected."""

[[params]]
name = "source"
type = "string"
enum = ["memory", "absorbed", "history", "all"]
description = """
Search scope: memory (default, durable facts), absorbed (facts merged into a \
newer claim), history (raw messages), or all"""
