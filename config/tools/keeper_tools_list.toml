name = "keeper_tools_list"
description = """
List or search the tools currently available to you. Omit query to receive \
the complete descriptor surface grouped by category. Supply query for SQLite \
FTS5 lexical search over authorized tool names, descriptions, and categories. \
This is capability introspection, not connector content lookup. Use \
keeper_surface_read only for current conversation context."""
additional_properties = false

[[params]]
name = "query"
type = "string"
description = """
Optional FTS5 query. Ranking is SQLite BM25; no substring, regex, stop-word, \
or intent-expansion heuristic is applied."""
