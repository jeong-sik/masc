name = "masc_keeper_status"
description = """
Get keeper status (keepalive/live/reconcile state plus current context and \
monitoring tails)."""
additional_properties = false

[[params]]
name = "name"
type = "string"
min_length = 1
pattern = "\\S"
description = """
Non-blank Keeper handle. Optional; defaults to the caller only when omitted."""

[[params]]
name = "tail_turns"
type = "integer"
minimum = 0
maximum = 6553
description = """
How many recent turns to include from keeper metrics (default: 3; maximum: \
6553)."""

[[params]]
name = "tail_messages"
type = "integer"
minimum = 0
maximum = 65536
description = """
How many recent history messages to include (default: 5; maximum: 65536)."""

[[params]]
name = "tail_bytes"
type = "integer"
minimum = 1000
maximum = 65536
description = """
How many bytes from the end of files to scan for tails (default: 60000; \
range: 1000..65536)."""

[[params]]
name = "tail_order"
type = "string"
enum = ["oldest_first", "newest_first"]
description = """
Ordering for metrics/history tails and recent memory notes. Default: \
oldest_first."""

[[params]]
name = "fast"
type = "boolean"
description = """
Enable fast mode (skip heavy sections unless explicitly enabled)."""

[[params]]
name = "include_context"
type = "boolean"
description = "Include checkpoint-derived context stats (default: !fast)."

[[params]]
name = "include_metrics_overview"
type = "boolean"
description = """
Include metrics overview + skill route scan (default: !fast)."""

[[params]]
name = "include_history_tail"
type = "boolean"
description = """
Include recent history tail + fragment counters (default: !fast)."""
