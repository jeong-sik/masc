name = "masc_tasks"
title = "List Tasks"
description = """
List tasks in backlog with their status and assignee. Defaults to active \
tasks (todo/claimed/in_progress/awaiting_verification). Use \
include_done/include_cancelled or status to filter. awaiting_verification \
tasks are pending a completion-authority verdict and are not claimable agent \
work. Output includes task ID, title, priority, assignee, timestamps. Tip: \
Look for status='todo' tasks to claim."""

[[params]]
name = "status"
type = "string"
# Kept identical to Masc_domain.valid_task_status_strings, the values the tool
# accepts. test_task_tool_toml_parity pins this list against that value.
enum = ["todo", "claimed", "in_progress", "awaiting_verification", "done", "cancelled"]
description = "Optional status filter"

[[params]]
name = "include_done"
type = "boolean"
description = "Include done tasks (default: false)"
default = false

[[params]]
name = "include_cancelled"
type = "boolean"
description = "Include cancelled tasks (default: false)"
default = false

[[params]]
name = "creation_request_id"
type = "string"
min_length = 1
description = "Read durable Task creation facts for this exact client request identity. Returns a structured creation_receipt with state recorded, not_observed, or ambiguous and matching task_ids, independent of task-list status filters. Cannot be combined with status/include_done/include_cancelled. not_observed does not prove non-creation; recorded is creation evidence, not current Task status or completion. No mutation or replay."

[[params]]
name = "expected_workspace"
type = "object"
description = "Optional observed base_path and masc_root precondition, checked before reading the backlog."

[[params.params]]
name = "base_path"
type = "string"
required = true

[[params.params]]
name = "masc_root"
type = "string"
required = true
