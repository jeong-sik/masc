id = "fusion-results"
revision = "0.1.0"
title = "Fusion results and retained evidence"
contributions = ["observe", "derive"]
image = "masc-lane-fusion-results:0.1.0"
command = ["python3", "server.py"]

[world.outputs.status]
lanes = ["fusion/status"]

[world.outputs.result]
lanes = ["fusion/status", "fusion/result"]

[resources]
cpus = 0.5
memory_bytes = 134217728
pids = 16
max_reply_bytes = 4194304

[interface]
refresh_policy = "source_changes"
binding_schema = '''{
  "type": "object",
  "required": ["sources"],
  "additionalProperties": false,
  "properties": {
    "sources": {
      "type": "array", "minItems": 1,
      "items": {
        "type": "object",
        "required": ["source_id", "kind", "path"],
        "additionalProperties": false,
        "properties": {
          "source_id": {"type": "string", "minLength": 1},
          "kind": {"type": "string", "const": "snapshot_file"},
          "path": {"type": "string", "minLength": 1}
        }
      }
    }
  }
}'''
