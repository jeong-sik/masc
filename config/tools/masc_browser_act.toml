name = "masc_browser_act"
description = """
Act on a browser task space: tabs, hand_off, emulation, cookies, upload, finish.
Page input (click, fill, keys, scroll) is BrowserInteract/masc_browser_interact. Every action except open_tab needs the observed clientId; open_tab without it lets MASC pick the browser and report browserSelection.
open_tab: if navigation fails after the tab is created, the error carries the new tabId; inspect that tab, never open another.
hand_off gives the whole task space to the operator for a step only a person can take, such as a sign-in or a captcha; explain the step with masc_ask. Until take_over, every tab list, read and action except space_status is refused before any effect. Call take_over only after the operator says they are done, because nothing checks; it is refused while the agent holds the space. Its receipt may carry activeTabId and egoPage; label null means unmanaged: adopt_tab before reading it. space_status returns spaceId, spaceName, ownership (agent, agentDelegatedToUser, ...) and observedAt without touching a Page, also while the operator holds the space.
adopt_tab makes an observed unmanaged tab readable and actionable; release_tab unmanages an adopted Page without closing it. close_tab closes only Pages the agent opened.
set_emulation, its geolocation grant and block_requests last until the ego SDK process ends (sdkProcessStartedAt changes). Reload after set_emulation. A locale or time zone the page's Intl does not know is refused before any change. A location also grants the origin geolocation in every tab of it; clear_emulation leaves that grant. block_requests makes subresource requests (fetch, images) to the hosts fail, including from same-origin frames; navigations and frames of another site still load. Each call adds hosts; unblock_requests lifts all.
set_cookie sets one host-only cookie for the tab's http(s) top document; delete_cookie deletes every cookie of that name the page sees and lists their domain and path. Both change the operator's ego profile for all its tabs and persist after the SDK process: a set can replace a sign-in cookie (replaced), a delete can sign the operator out. Values are never returned.
stop_loading stops a managed tab stuck loading without reading the page; re-read it afterwards.
finish_space completes a successful task once; never on an error or a hand_off.
After any failure or lost receipt, list tabs or re-read before acting again; never repeat an effect blindly."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 1,981 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 5개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름이 남고,
# 부르면 그 턴에 스키마가 붙는다. 한 줄 요약은 그 답에 한 번 나온다.
defer_loading = true

[[params]]
name = "action"
type = "string"
enum = ["open_tab", "hand_off", "take_over", "space_status", "finish_space", "wait_for_control", "adopt_tab", "release_tab", "close_tab", "back", "forward", "reload", "stop_loading", "upload", "accept_dialog", "dismiss_dialog", "set_emulation", "clear_emulation", "block_requests", "unblock_requests", "set_cookie", "delete_cookie"]
required = true

[[params]]
name = "lane"
type = "string"
enum = ["live"]
description = "Optional; live is the only lane, and clientId alone selects the browser."

[[params]]
name = "tabId"
type = "integer"
minimum = 0
description = "Required by on-tab actions; refused by open_tab, hand_off, take_over, space_status, finish_space and wait_for_control."

[[params]]
name = "selector"
type = "string"
description = "upload: an observed file input as an ego locator or snapshot ref; a label or wrapper with one compatible input works."

[[params]]
name = "opener"
type = "string"
description = "upload, instead of selector: an observed locator or ref of the control whose click opens the file chooser. The click is the effect; chosen lists the files handed over."

[[params]]
name = "text"
type = "string"
description = "accept_dialog prompt text."

[[params]]
name = "url"
type = "string"
description = "open_tab HTTP(S) URL."

[[params]]
name = "paths"
type = "array"
items = { type = "string" }
description = "upload: files the Keeper can read (playground-relative or absolute), at most 16 MiB each; they replace the input's files."

[[params]]
name = "clientId"
type = "string"
description = "Observed connection UUID; required by every action except open_tab."

[[params]]
name = "cookieName"
type = "string"
description = "set_cookie and delete_cookie: the cookie name, a token of at most 256 bytes (no space, comma, semicolon, equals sign or control character)."

[[params]]
name = "cookieValue"
type = "string"
description = "set_cookie, required: no control character or semicolon, at most 4096 bytes together with cookieName."

[[params]]
name = "cookiePath"
type = "string"
description = "set_cookie: path scope starting with /, at most 1024 bytes; default /."

[[params]]
name = "cookieSecure"
type = "boolean"
description = "set_cookie: HTTPS only; required with cookieSameSite None."

[[params]]
name = "cookieHttpOnly"
type = "boolean"
description = "set_cookie only."

[[params]]
name = "cookieSameSite"
type = "string"
enum = ["Strict", "Lax", "None"]
description = "set_cookie; omit to leave it to the browser."

[[params]]
name = "cookieMaxAgeSec"
type = "integer"
minimum = 1
maximum = 604800
description = "set_cookie; omit for a session cookie."

[[params]]
name = "latitude"
type = "number"
minimum = -90.0
maximum = 90.0
description = "set_emulation, with longitude."

[[params]]
name = "longitude"
type = "number"
minimum = -180.0
maximum = 180.0
description = "set_emulation, with latitude."

[[params]]
name = "accuracyMeters"
type = "number"
exclusive_minimum = 0.0
maximum = 10000.0
description = "set_emulation: default 10; needs latitude and longitude."

[[params]]
name = "locale"
type = "string"
description = "set_emulation: a language tag such as ko-KR; changes Intl only, not navigator.language."

[[params]]
name = "timezone"
type = "string"
description = "set_emulation: an IANA name such as Asia/Seoul."

[[params]]
name = "hosts"
type = "array"
items = { type = "string" }
description = "block_requests: exact lowercase host names or IPv4 addresses such as ads.example.com, on any port; a subdomain is a host of its own."

[[params]]
name = "controlOptions"
type = "object"
additional_properties = false
description = "wait_for_control: SDK interval and timeout in milliseconds; an omitted one keeps its SDK default."

[[params.params]]
name = "interval"
type = "number"
exclusive_minimum = 0.0

[[params.params]]
name = "timeout"
type = "number"
exclusive_minimum = 0.0

[[params]]
name = "pageLabel"
type = "string"
description = "adopt_tab: optional permanent Page label; omitted, ego assigns one."

[[params]]
name = "keepPages"
description = "finish_space: \"all\" or the Page labels to keep open for the user; default none. Every label ends either way."
one_of = [{ type = "string", enum = ["all"] }, { type = "array", items = { type = "string" } }]
