name: Release

# DIAGNOSTIC BRANCH ONLY. Never merge: no tag trigger or publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build the unchanged release container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owner-diagnostic"
          git rev-parse HEAD | tee "$RUNNER_TEMP/owner-diagnostic/source-sha"
          bash scripts/build-linux-release.sh --keep --jobs 2 \
            --out "$RUNNER_TEMP/owner-binaries" 2>&1 | tee "$RUNNER_TEMP/owner-diagnostic/build.log"
      - name: Diagnose native Owner cases in the same container
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps --format '{{.Names}}' | grep -E '^masc-linux-release-build-[0-9]+$')
          test "${#containers[@]}" -eq 1
          container="${containers[0]}"
          printf '%s\n' "$container" > "$RUNNER_TEMP/owner-diagnostic/container-name"
          docker inspect --format '{{.Id}} {{.Config.Image}} {{.Config.User}}' "$container" \
            | tee "$RUNNER_TEMP/owner-diagnostic/container-identity"
          build_timestamp=$(git show -s --format=%ct HEAD)
          docker exec -e MASC_BUILD_COMMIT="$GITHUB_SHA" -e MASC_BUILD_COMMIT_UNIX_TS="$build_timestamp" \
            -e DUNE_SOURCEROOT=/src "$container" bash -lc '
            set -euo pipefail
            cd /src
            eval "$(opam env --switch=masc)"
            dune build --root . -j 2 test/test_keeper_owner.exe
            python3 scripts/ci/stanza_env.py --dir test --deps test_keeper_owner
            python3 scripts/ci/stanza_env.py --dir test test_keeper_owner
          ' 2>&1 | tee "$RUNNER_TEMP/owner-diagnostic/owner-build-and-env.log"
          set +e
          docker exec -e DUNE_SOURCEROOT=/src "$container" bash -lc '
            set -euo pipefail
            cd /src
            eval "$(opam env --switch=masc)"
            env_lines=$(python3 scripts/ci/stanza_env.py --dir test test_keeper_owner)
            suite_env=()
            while IFS= read -r pair; do
              [ -z "$pair" ] || suite_env+=("$pair")
            done <<< "$env_lines"
            cd /src/_build/default/test
            unset EIO_BACKEND
            printf "default backend: %s\n" "${EIO_BACKEND-<unset>}"
            set +e
            env ALCOTEST_VERBOSE=1 "${suite_env[@]}" \
              timeout -s TERM -k 30 600 ./test_keeper_owner.exe
            default_status=$?
            printf "default backend exit=%s\n" "$default_status"
            if [ "$default_status" -eq 124 ] || [ "$default_status" -eq 137 ]; then
              printf "contrast backend: posix\n"
              env ALCOTEST_VERBOSE=1 EIO_BACKEND=posix "${suite_env[@]}" \
                timeout -s TERM -k 30 600 ./test_keeper_owner.exe
              printf "posix backend exit=%s\n" "$?"
            fi
            exit "$default_status"
          ' 2>&1 | tee "$RUNNER_TEMP/owner-diagnostic/native-cases.log"
          result=${PIPESTATUS[0]}
          exit "$result"
      - name: Upload partial diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-diagnostic-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/owner-diagnostic/
          retention-days: 3
          if-no-files-found: warn
      - name: Remove only the retained diagnostic container
        if: always()
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps --format '{{.Names}}' | grep -E '^masc-linux-release-build-[0-9]+$')
          if [ "${#containers[@]}" -eq 1 ]; then
            docker rm -f "${containers[0]}"
          elif [ "${#containers[@]}" -gt 1 ]; then
            echo 'Multiple builder containers; refusing ambiguous cleanup' >&2
            exit 1
          fi
