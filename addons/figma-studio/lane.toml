id = "figma-studio"
revision = "0.2.0"
title = "Figma Studio"
contributions = ["observe"]
runtime = "apple_container"
image = "masc-lane-figma-studio:0.1.0"
command = ["python3", "server.py"]

[world.state]
mode = "persistent"

[world.tools]
invocation = "host_context"
export = ["masc_figma_status", "masc_figma_bind", "masc_figma_submit", "masc_figma_operation", "masc_figma_snapshot", "masc_figma_validate", "masc_figma_rest_capture", "masc_figma_rest_operation", "masc_figma_relay"]

[world.outputs.design]
lanes = ["figma/studio"]

[world.skills]
directory = "skills"

[resources]
cpus = 1
memory_bytes = 268435456
# Native JSON and a PNG share one response. Host namespacing also uses this envelope.
max_reply_bytes = 16777216

[interface]
binding_schema = '''{
  "type": "object",
  "properties": {
    "installation": {"type": "string", "minLength": 1},
    "keeper": {"type": "string", "minLength": 1},
    "relay_agent": {"type": "string", "minLength": 1},
    "sources": {"type": "array", "maxItems": 0, "items": {"type": "object", "properties": {}, "additionalProperties": false}}
  },
  "required": ["installation", "keeper", "relay_agent", "sources"],
  "additionalProperties": false
}'''
