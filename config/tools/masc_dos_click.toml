name = "masc_dos_click"
description = """
Set the mouse and run the shared DOS machine.

The mouse is state: cursor and buttons stay until the next call. buttons 1 \
or 2 clicks -- down, run, up, run, in one call, so the button is never left \
held; 0 only moves. x and y are pixels inside the frame size masc_dos_screen \
reports. A game that polls the mouse instead of asking for keys returns \
settled false with the budget spent; that is normal. Recorded in the ledger."""
additional_properties = false

defer_loading = true

[[params]]
name = "x"
type = "integer"
required = true
description = "Frame pixel column, 0 to width-1."
minimum = 0

[[params]]
name = "y"
type = "integer"
required = true
description = "Frame pixel row, 0 to height-1."
minimum = 0

[[params]]
name = "buttons"
type = "integer"
description = "0 move, 1 left click, 2 right click. Default 1."
minimum = 0
maximum = 2
default = 1

[[params]]
name = "steps"
type = "integer"
description = "Instruction budget for the whole call. Default 4000000."
minimum = 1
maximum = 4000000
default = 4000000
