<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','NanumGothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="700" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="bold" fill="#0f172a">기억 제안 판단 흐름 — synthetic-scenario 예시</text>
  <text x="40" y="68" font-size="12" fill="#475569">대상: 기억 제안 d0420c0c…3395f (status=model_proposed, semantic_verification=not_performed)</text>
  <text x="40" y="86" font-size="12" fill="#475569">예시 문구는 저장된 제안 원문의 번역 요약입니다. 그림만으로 판단하지 말고 원문을 대조하세요.</text>

  <!-- ① query -->
  <rect x="40" y="106" width="200" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="130" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 기억 제안 조회</text>
  <text x="140" y="150" font-size="10" fill="#475569" text-anchor="middle">keeper_workspace_memory_read</text>

  <line x1="240" y1="135" x2="288" y2="135" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decision -->
  <rect x="290" y="94" width="260" height="82" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="420" y="118" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">데이터 출처 확인</text>
  <text x="420" y="138" font-size="11" fill="#78350f" text-anchor="middle">origin.trace_id ==</text>
  <text x="420" y="156" font-size="11" font-family="monospace" fill="#78350f" text-anchor="middle">"synthetic-scenario" ?</text>

  <line x1="550" y1="118" x2="598" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="152" x2="598" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- yes -->
  <rect x="600" y="92" width="340" height="52" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="770" y="113" font-size="12.5" font-weight="bold" fill="#9a3412" text-anchor="middle">예 — 시나리오 데이터임을 명시</text>
  <text x="770" y="132" font-size="11" fill="#7c2d12" text-anchor="middle">운영 사실 아님 · 안내·연습 예시로만 사용</text>

  <!-- no -->
  <rect x="600" y="146" width="340" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="770" y="167" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">아니오 — 실제 관측으로 취급</text>
  <text x="770" y="186" font-size="11" fill="#3730a3" text-anchor="middle">출처·원문 신뢰성을 함께 확인</text>

  <!-- dashed return bus to ② -->
  <path d="M 770 144 L 770 198 M 770 198 L 135 198 L 135 226" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="452" y="192" font-size="10.5" fill="#64748b" text-anchor="middle">공통 진행</text>

  <!-- ② classify -->
  <rect x="40" y="228" width="200" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="252" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 항목 분류</text>
  <text x="140" y="272" font-size="10.5" fill="#475569" text-anchor="middle">conflicts / shared_claims / gaps</text>

  <!-- elbows to three branches -->
  <path d="M 140 286 L 140 310 L 185 310 L 185 332" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 140 286 L 140 310 L 490 310 L 490 332" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 140 286 L 140 310 L 795 310 L 795 332" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch: conflicts -->
  <rect x="40" y="334" width="290" height="132" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="334" width="290" height="26" rx="8" fill="#dbeafe"/>
  <text x="185" y="352" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">conflicts — 상충 관측</text>
  <text x="54" y="378" font-size="11" fill="#0f172a">• writer: “Report R가 PDF로 생성됨” (s1)</text>
  <text x="54" y="396" font-size="11" fill="#0f172a">• reviewer: “Markdown 바이트, PDF 생성</text>
  <text x="54" y="412" font-size="11" fill="#0f172a">  실패” (s2)</text>
  <text x="54" y="434" font-size="11" fill="#92400e">→ 병합하지 않고 상충으로 보존</text>
  <text x="54" y="452" font-size="11" font-weight="bold" fill="#b45309">→ 실제 파일 대조 전까지 판단 보류</text>

  <!-- branch: shared_claims -->
  <rect x="345" y="334" width="290" height="132" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="345" y="334" width="290" height="26" rx="8" fill="#dbeafe"/>
  <text x="490" y="352" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">shared_claims — 수치 정정</text>
  <text x="359" y="378" font-size="11" fill="#0f172a">• analyst: “M = 12초” (s3)</text>
  <text x="359" y="396" font-size="11" fill="#0f172a">• analyst: “정정 — 원본 로그는 21초” (s4)</text>
  <text x="359" y="414" font-size="11" fill="#0f172a">• 같은 스냅샷(snapshot3)의 정정 관계</text>
  <text x="359" y="436" font-size="11" fill="#92400e">→ “12초 → 21초로 정정”이 합의 후보</text>
  <text x="359" y="454" font-size="11" font-weight="bold" fill="#b45309">→ 정정 자체는 검증이 아님(제안)</text>

  <!-- branch: gaps -->
  <rect x="650" y="334" width="290" height="132" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="650" y="334" width="290" height="26" rx="8" fill="#dbeafe"/>
  <text x="795" y="352" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">gaps — 저장소별 누락</text>
  <text x="664" y="378" font-size="11" fill="#0f172a">• writer / reviewer / analyst 모두</text>
  <text x="664" y="396" font-size="11" fill="#0f172a">  source_bound 관측 없음(missing)</text>
  <text x="664" y="414" font-size="11" fill="#0f172a">• ordinary 스냅샷만 존재</text>
  <text x="664" y="436" font-size="11" fill="#92400e">→ 원문 파일 대조 근거 부재</text>
  <text x="664" y="454" font-size="11" font-weight="bold" fill="#b45309">→ “검증 불가”로 표시 (오류 아님)</text>

  <!-- bus into ③ -->
  <path d="M 185 466 L 185 486 L 490 486 M 490 466 L 490 486 M 795 466 L 795 486 L 490 486 M 490 486 L 490 504" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ③ -->
  <rect x="40" y="506" width="900" height="66" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="490" y="530" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">③ 저장된 주장과 독립 검증을 분리해 기록</text>
  <text x="490" y="550" font-size="11" fill="#064e3b" text-anchor="middle">저장된 주장 = 제안 원문에서 확인한 문구·구조 · 독립 검증 = 실제 파일·원본 로그 대조</text>
  <text x="490" y="566" font-size="11" fill="#064e3b" text-anchor="middle">본 예시에서 독립 검증은 미수행(semantic_verification=not_performed, 대상 파일 없음)</text>

  <line x1="490" y1="572" x2="490" y2="590" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- verdict -->
  <rect x="40" y="592" width="900" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="490" y="613" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">판단 기록: 채택 / 보류 + 이유 (검증 상태를 함께 남김)</text>
  <text x="490" y="631" font-size="11" fill="#047857" text-anchor="middle">본 예시의 권장 결론: 세 항목 모두 “보류” — 원문·원본 로그 대조 전 확정하지 않음</text>

  <!-- legend -->
  <text x="40" y="668" font-size="11" fill="#64748b">범례 · 파란 테두리 = 저장된 제안에서 직접 확인한 사실(구조·문구) · 주황 = 판단 필요/보류 · 초록 = 기록 행위 · 점선 = 공통 진행 경로</text>
  <text x="40" y="686" font-size="11" fill="#94a3b8">모든 예시 출처(s1–s4)의 origin.trace_id = "synthetic-scenario" — 실제 운영 데이터가 아닙니다.</text>
</svg>
