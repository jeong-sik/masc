name = "keeper_webmcp_list"
description = """
List WebMCP tools registered on document.modelContext in an open browser page.

Requires Chrome started with --enable-features=WebMCP and --remote-debugging-port."""
additional_properties = false

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 2 times in 2 turns, 755 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 2 extra requests over the same week.
defer_loading = true

[[params]]
name = "page"
type = "string"
required = true
description = "Substring matched against open page URLs to select the target page."

[[params]]
name = "cdp_port"
type = "integer"
description = "Chrome DevTools remote debugging port. Defaults to 9222."
