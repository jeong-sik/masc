name = "keeper_artifact_transfer"
description = """
Export your sandbox file as a durable binary artifact, or materialize one back.

Export returns the artifact's sha256. Pass it through masc_keeper_delegate artifacts. Bytes move inside the runtime, never through model base64. Materialize uses the existing filesystem write authority."""
additional_properties = false

defer_loading = true

[[params]]
name = "action"
type = "string"
required = true
enum = ["export", "materialize"]
[[params]]
name = "path"
type = "string"
required = true
[[params]]
name = "artifact"
type = "string"
description = "Required for materialize: the artifact sha256 string from the export result."
