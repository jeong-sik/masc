\* A cancel request that only the operator may answer must be caught as a kind
\* of submission the design does not have.

SPECIFICATION SpecBugCancelRequest

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    NoOperatorOnlySubmissionKind

CHECK_DEADLOCK
    FALSE
