\* The recovery of LibrarianRead-purge-trim-at-end-live.cfg with the position
\* moved to wherever the break left the end (masc #37772). The end may be one
\* no line states, a round reads from a position only with its line, and the
\* count of lines moves only with the position, so once the next turn ends
\* every round stops there.
\* EveryReachableAtomEventuallyRead MUST be violated. It needs a turn that
\* saves two atoms, so that an end inside it is one no line states.
SPECIFICATION SpecPurgeTrimAtEndAnywhereLive
CONSTANTS
    MaxTurns = 2
    MaxSaves = 2
    MaxClears = 0
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
PROPERTY EveryReachableAtomEventuallyRead
