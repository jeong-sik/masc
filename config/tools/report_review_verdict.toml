name = "report_review_verdict"
description = "Report your review verdict. You MUST call this tool with your assessment. verdict must be exactly APPROVE or REJECT."

[[params]]
name = "verdict"
type = "string"
required = true
enum = ["APPROVE", "REJECT"]
description = "APPROVE or REJECT."

[[params]]
name = "reason"
type = "string"
description = "Explain the evidence checked and the result for APPROVE or REJECT. If verification failed, name the missing evidence or lookup error. Always provide a concise reason."
