name = "masc_sandbox_volume_gc"
description = """
Report retired keepers' Apple sandbox volumes and, with execute, reclaim the \
build-only volumes of the keepers named in keepers that are still reclaim \
candidates. Work volumes with a missing or empty claims marker are kept \
because unrecorded owners may exist. The inventory does not fence concurrent \
boots. Default is report only."""
additional_properties = false
defer_loading = true

[[params]]
name = "image"
type = "string"
description = """
Image reference for the one-shot claims read helper, e.g. a promoted \
masc-sandbox tag from `masc sandbox-image`. Omit to judge without claim \
evidence: unowned keepers are then reported unverified and nothing is \
reclaimed."""

[[params]]
name = "execute"
type = "boolean"
description = """
Delete the build volumes of the keepers named in keepers that this call \
still judges reclaim candidates. Requires keepers. Omit or false to only \
report."""

[[params]]
name = "keepers"
type = "array"
items = { type = "string" }
min_items = 1
description = """
With execute, the keeper names a report listed as reclaim candidates. A \
keeper not named here is never reclaimed, and a named keeper that is no \
longer a candidate is kept. Omit for a report."""

[[params]]
name = "timeout_sec"
type = "number"
exclusive_minimum = 0.0
description = "Explicit CLI timeout in seconds."
