# Figma's remote MCP server.
#
# Figma's registration endpoint answers 403 to everyone, so this needs an
# app made by hand: create a Figma app, then POST its client id and secret to
# /api/v1/keepers/oauth/client.
#
# Measured 2026-08-27: the MCP endpoint refuses an initialize with 401, its
# protected-resource document answers where RFC 9728 computes it, and the
# authorization server offers S256 and asks for the secret in the form body.
#
# Not measured: a completed exchange.

id = "figma"
label = "Figma"
mcp_url = "https://mcp.figma.com/mcp"

access_token_env = "FIGMA_ACCESS_TOKEN"
expires_at_env = "FIGMA_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.figma/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
