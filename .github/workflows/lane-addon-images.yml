name: Lane Add-on package images
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full commit SHA to build; defaults to the workflow commit
        type: string
        required: false
      scope:
        description: Package set to build
        type: choice
        options: [all, machines]
        default: all
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      source_sha: ${{ steps.discover.outputs.source_sha }}
    steps:
      - name: Validate selected source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY_VALIDATE'
          import os, re
          value = os.environ['SOURCE_SHA']
          if value and re.fullmatch(r'[0-9a-fA-F]{40}', value) is None:
              raise SystemExit('source_sha must be a full Git commit SHA')
          PY_VALIDATE
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Test package protocols
        run: python3 -m unittest discover -s addons/tests -p 'test_*.py' -v
      - id: discover
        env:
          PACKAGE_SCOPE: ${{ inputs.scope }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          packages = [p.parent.name for p in sorted(Path('addons').glob('*/lane.toml'))
                      if (p.parent / 'Dockerfile').is_file()]
          workers = {
              'msx-machine': ('bin/masc_msx_addon_worker.exe', 'masc-msx-addon-worker'),
              'dos-machine': ('bin/masc_dos_addon_worker.exe', 'masc-dos-addon-worker'),
          }
          if os.environ['PACKAGE_SCOPE'] == 'machines':
              packages = [package for package in packages if package in workers]
              if set(packages) != set(workers):
                  raise SystemExit('selected source must contain both machine packages')
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          matrix = {'include': [dict(package=package, arch=arch, runner=runner,
              worker_target=workers.get(package, ('', ''))[0],
              worker_binary=workers.get(package, ('', ''))[1])
              for package in packages for arch, runner in
              [('amd64', 'ubuntu-24.04'), ('arm64', 'ubuntu-24.04-arm')]]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
              output.write('source_sha=' + source_sha + '\n')
          PY
  image:
    needs: packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.packages.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.packages.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ocaml-toolchain
        if: matrix.worker_target != ''
      - uses: ./.github/actions/pin-ocaml-deps
        if: matrix.worker_target != ''
      - uses: ./.github/actions/install-ocaml-deps
        if: matrix.worker_target != ''
      - name: Build the package's native worker
        if: matrix.worker_target != ''
        env:
          WORKER_TARGET: ${{ matrix.worker_target }}
          WORKER_BINARY: ${{ matrix.worker_binary }}
        run: |
          set -euo pipefail
          opam exec -- dune build "$WORKER_TARGET"
          install -m 755 "_build/default/$WORKER_TARGET" "addons/$WORKER_BINARY"
      - name: Build package image and retain identity
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          WORKER_BINARY: ${{ matrix.worker_binary }}
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, os, shutil, subprocess, tomllib
          from pathlib import Path
          package = Path('addons') / os.environ['PACKAGE_NAME']
          manifest_bytes = (package / 'lane.toml').read_bytes()
          manifest = tomllib.loads(manifest_bytes.decode())
          image = manifest['image']
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          proof = Path('image-proof'); proof.mkdir()
          subprocess.run(['docker', 'build', '--label', 'org.opencontainers.image.revision=' + commit,
              '-f', str(package / 'Dockerfile'), '-t', image, 'addons'], check=True)
          raw = subprocess.check_output(['docker', 'image', 'inspect', image])
          (proof / 'image-inspect.json').write_bytes(raw)
          inspected, = json.loads(raw)
          assert inspected['Architecture'] == os.environ['PACKAGE_ARCH']
          worker_binary = os.environ['WORKER_BINARY']
          worker_receipt = None
          if worker_binary:
              binary = Path('addons') / worker_binary
              worker_receipt = {'binary': worker_binary,
                  'sha256': hashlib.sha256(binary.read_bytes()).hexdigest()}
              # Execute the packaged ELF in the final runtime image. This checks
              # its loader/libraries, not MCP behavior or emulator correctness.
              subprocess.run(['docker', 'run', '--rm', '--network', 'none',
                  image, '/usr/local/bin/' + worker_binary, '--help'], check=True)
          archive = proof / 'image.tar.gz'
          with gzip.open(archive, 'wb') as output:
              process = subprocess.Popen(['docker', 'save', image], stdout=subprocess.PIPE)
              try:
                  shutil.copyfileobj(process.stdout, output)
              finally:
                  process.stdout.close()
                  exit_code = process.wait()
              if exit_code != 0:
                  raise RuntimeError('docker save failed')
          with archive.open('rb') as archived:
              archive_sha256 = hashlib.file_digest(archived, 'sha256').hexdigest()
          receipt = {'source_commit': commit, 'package': manifest['id'], 'image': image,
              'image_id': inspected['Id'], 'architecture': inspected['Architecture'],
              'manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(),
              'archive_sha256': archive_sha256,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_commit': os.environ['GITHUB_SHA']}
          if worker_receipt is not None:
              receipt['worker'] = worker_receipt
          (proof / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: lane-addon-image-${{ matrix.package }}-${{ matrix.arch }}-${{ needs.packages.outputs.source_sha }}
          path: image-proof/
          compression-level: 0
          if-no-files-found: error
