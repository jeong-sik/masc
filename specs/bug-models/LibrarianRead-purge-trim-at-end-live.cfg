\* The purge guard RFC librarian-lifecycle 10's second decision recommends,
\* asked whether it also keeps the other promise: that a round comes back to
\* what it could not read. It does -- no loss and no stop. With MaxBad = 1 this
\* violates, but the counter-example holds no purge at all, so the stop is the
\* one masc#37061 names and not the purge's doing.
SPECIFICATION SpecPurgeTrimAtEndLive
CONSTANTS
    MaxTurns = 2
    MaxSaves = 1
    MaxClears = 0
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
PROPERTY EveryReachableAtomEventuallyRead
