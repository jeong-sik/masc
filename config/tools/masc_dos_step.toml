name = "masc_dos_step"
description = """
Let the DOS machine run, with no key pressed.

Time is 8086 instructions, not frames. Returns when the machine is ready for \
input: it asked the BIOS for a key AND the screen stopped changing. Asking \
alone is too early -- a game asks again a few hundred instructions after \
taking a key, mid-repaint. until_ready=false spends the whole budget instead, \
for a program that is computing rather than asking. Returns settled, \
steps_run and input_requests."""
additional_properties = false

defer_loading = true

[[params]]
name = "steps"
type = "integer"
description = "Instruction budget. Default 1000000, about 40 ms."
minimum = 1
maximum = 4000000
default = 1000000

[[params]]
name = "until_ready"
type = "boolean"
description = "Stop when ready for input, as described above. Default true."
default = true
