\* A counting, a typed, a silent and an unadmitted slot. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Slots <- SlotsB
    Kind <- KindB
    Verdict <- VerdictB
    Declared0 <- Declared0B
    MaxVersion = 2
    MaxDecl = 2
    MaxPulse = 2
    MaxResume = 1
    MaxSkip = 1
    MaxQuiet = 1
    E4Lane = "judged"
    Bug = "none"
INVARIANT TypeOK
INVARIANT BottomOnlyWhenAllSized
INVARIANT NoCallOnFact
INVARIANT E4Exact
PROPERTY DescendsOnlyOnInput
PROPERTY UnsizedLaneStaysAbove
PROPERTY StaleVerdictNeverUsed
PROPERTY E4Ends
CHECK_DEADLOCK FALSE
