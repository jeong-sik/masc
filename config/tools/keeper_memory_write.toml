name = "keeper_memory_write"
description = """
Record a durable claim that later turns read back. Your context resets \
between turns, so a conclusion you leave only in this turn's reasoning is \
gone. Task sequencing and operating constraints belong to their typed domain \
stores, not memory prose. The runtime records explicit typed provenance and \
returns validation or persistence failures directly. When source_path is set, \
the claim is recalled only while the exact source bytes still match. To record \
a conclusion rather than an observation, provide both rule_id and premise_ids; \
the conclusion remains current only while one complete support set remains current."""
additional_properties = false

[[params]]
name = "title"
type = "string"
description = "Short hook (≤120 chars). Optional; may be empty."

[[params]]
name = "content"
type = "string"
required = true
description = """
Body. Required, must be non-empty. For decisions, lead with the decision \
then **Why** and **How to apply** lines."""

[[params]]
name = "source_path"
type = "string"
description = "Optional keeper-visible regular file that makes this claim source-bound."

[[params]]
name = "rule_id"
type = "string"
description = "Opaque rule identity for a derived conclusion. Must be paired with premise_ids."

[[params]]
name = "premise_ids"
type = "array"
items = { type = "string" }
min_items = 1
unique_items = true
description = "Exact memory_id values supporting a derived conclusion. Must be paired with rule_id."

[help]
short_description = "Persist a durable keeper memory claim."
when_to_use = "Use when something from this turn must outlive it: every write is a durable claim later turns read back."
key_constraints = [
  "There is no kind argument; sending one is rejected.",
  "Do not use for transient scratch notes.",
  "A source-bound claim is discarded when its source bytes change or become unreadable.",
  "A derived claim cannot use source_path and is automatically retracted when no complete support set remains current.",
]
details_markdown = "Writes an observed or derived claim into the Memory OS fact store. An ordinary-current receipt returns memory_id and basis. A source-bound receipt instead returns source_path and source_sha256 and is not eligible as a derived premise in this slice. For a derived claim, pass the rule identity and exact ordinary-current premise memory ids; Memory OS maintains the least supported fixed point."
examples = ["title='region' content='The deployment region is eu-west-1.' source_path='config/deploy.env'", "content='The rollout is blocked.' rule_id='blocked_when_dependency_fails' premise_ids=['sha256:...']"]
