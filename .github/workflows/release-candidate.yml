name: Release Candidate Verification
run-name: Verify release candidate ${{ github.sha }}

on:
  workflow_dispatch: {}

# Called workflows cannot elevate the caller's permissions. Publication is a
# separate manual workflow and consumes this run's successful artifacts.
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

# Supersede older candidates on this branch as one unit. Child workflows use
# separate run-scoped groups so they cannot cancel their caller or other lanes.
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release candidate ref
    runs-on: ubuntu-24.04
    outputs:
      behavior_profile: ${{ steps.behavior.outputs.profile }}
    steps:
      - name: Require a release branch or tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/v*|refs/tags/v*) ;;
            *) echo "Full verification belongs to release/vX.Y.Z or a version tag" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7
      - name: Read reviewed release behavior selection
        id: behavior
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, 'scripts/ci')
          from release_behavior import load_profile
          profile = load_profile()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('profile=' + json.dumps(profile) + '\n')
          PYCODE

  # The tag is cut on this same frozen head, so the release body and its date are
  # known before any build starts. This check takes seconds, so it runs first and
  # the heavy jobs wait for it: a candidate that cannot publish is not built.
  release-body:
    needs: validate
    # The RC is the last run before the tag, and a tag push cannot be taken
    # back. So the RC measures the exact body the tag push would publish and
    # goes red when GitHub would cut it, before any tag exists.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the release body and its date before tagging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(sed -n 's/^(version \(.*\))$/\1/p' dune-project)"
          test -n "$ver"
          prev="$(TAG="v$ver" gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft | not) | .tag_name] | (index(env.TAG)) as $i | if $i == null then .[0] else .[$i + 1] end // empty')"
          test -n "$prev"
          printf '**Full changelog**: https://github.com/%s/compare/%s...v%s\n' \
            "${GITHUB_REPOSITORY}" "$prev" "$ver" > compare-link.md
          printf '\n**Verified candidate**: https://github.com/%s/actions/runs/%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" >> compare-link.md
          # The tag is cut on this same frozen head, so its committer date in
          # UTC is the day the release will carry. The heading was written
          # before that was known (#37425).
          tag_day="$(TZ=UTC git log -1 --date=format-local:%Y-%m-%d --format=%cd HEAD)"
          test -n "$tag_day"
          # The page lists what a reader acts on and counts the rest; the
          # counted entries come from the complete record when one is retained.
          counts_args=()
          details_path="docs/releases/v${ver}-full-changelog.md"
          if [[ -f "$details_path" ]]; then
            counts_args=(--counts-changelog "$details_path"
              --counts-changelog-url "https://github.com/${GITHUB_REPOSITORY}/blob/v${ver}/${details_path}")
          fi
          python3 scripts/ci/changelog-section.py "$ver" CHANGELOG.md release-body.md \
            --append compare-link.md --max-chars 125000 --expect-date "$tag_day" \
            --changelog-url "https://github.com/${GITHUB_REPOSITORY}/blob/v${ver}/CHANGELOG.md" \
            "${counts_args[@]}"

      - name: Retain the exact release body checked by this RC
        uses: actions/upload-artifact@v7
        with:
          name: rc-release-body-${{ github.sha }}-${{ github.run_id }}
          path: release-body.md
          overwrite: true
          if-no-files-found: error

  compile:
    needs: [validate, release-body]
    uses: ./.github/workflows/full-check.yml

  behavior:
    needs: [validate, release-body]
    uses: ./.github/workflows/release-behavior.yml

  installation:
    needs: [validate, release-body]
    uses: ./.github/workflows/release-build.yml

  evidence:
    name: Record candidate verification
    needs: [validate, release-body, compile, behavior, installation]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record results for this exact commit
        env:
          CANDIDATE_RESULTS: ${{ toJSON(needs) }}
          CANDIDATE_BEHAVIOR: ${{ needs.validate.outputs.behavior_profile }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          needs = json.loads(os.environ['CANDIDATE_RESULTS'])
          results = {name: needs[name]['result'] for name in ('compile', 'behavior', 'installation')}
          passed = all(result == 'success' for result in results.values())
          receipt = {
              'schema_version': 2,
              'commit': os.environ['CANDIDATE_COMMIT'],
              'ref': os.environ['CANDIDATE_REF'],
              'run_attempt': int(os.environ['CANDIDATE_ATTEMPT']),
              'run_url': os.environ['CANDIDATE_RUN'],
              'results': results,
              'checks_passed': passed,
              'behavior_scope': json.loads(os.environ['CANDIDATE_BEHAVIOR']),
              'published': False,
          }
          Path('candidate-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Candidate commit: `' + receipt['commit'] + '`\n\n')
              for name, result in results.items():
                  summary.write('- ' + name + ': ' + result + '\n')
              scope = receipt['behavior_scope']
              summary.write('\nBehavior profile: `' + scope['profile'] + '`\n')
              summary.write('Manifest SHA-256: `' + scope['manifest_sha256'] + '`\n')
              summary.write('Selected suites: ' + ', '.join(scope['suites']) + '\n')
              summary.write('Coverage is selected release behavior; full regression and production readiness are not established.\n')
              summary.write('\nPublication: not performed.\n')
          PYCODE

      - name: Preserve the checked release body with successful verification
        if: needs.release-body.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: rc-release-body-${{ github.sha }}-${{ github.run_id }}

      - name: Upload candidate receipt
        uses: actions/upload-artifact@v7
        with:
          name: candidate-verification-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            candidate-verification.json
            release-body.md
          if-no-files-found: error

      - name: Require all candidate checks to pass
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          receipt = json.loads(Path('candidate-verification.json').read_text())
          raise SystemExit(0 if receipt['checks_passed'] else 1)
          PYCODE
