name = "masc_board_post_update"
description = """
Edit an existing board post you authored, by exact post_id.

Only the author can edit. Send full replacement content; body is an alias
and wins if both are sent. Omit title to derive it from the body. author
defaults to caller identity. Get post_id from masc_board_list or
masc_board_post_get.
"""


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 19 turns needed it across 6317 provider requests, and its
# 1095 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 19 turns and saves the 1095 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
identity_fields = ["author"]

[[params]]
name = "post_id"
type = "string"
pattern = "^[a-zA-Z0-9_-]{1,64}$"
required = true
description = """
Exact post_id from masc_board_list or masc_board_post_get; do not guess. New IDs use p- plus 32 lowercase hex digits.
"""

[[params]]
name = "body"
type = "string"
description = "Alias for content; body wins if both are sent."

[[params]]
name = "content"
type = "string"
description = "Full replacement post body."

[[params]]
name = "title"
type = "string"
description = """
Optional new title. When omitted, the title is re-derived \
from the new body."""

[[params]]
name = "author"
type = "string"
description = """
Editor identity; must match the post's author. Auto-filled \
from caller's agent_name when omitted."""

[[params]]
name = "new_author"
type = "string"
description = """
Transfer ownership to a new author. Only the current post \
owner can set this field."""
