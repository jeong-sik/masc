name = "masc_browser_tabs"
description = """
List {clientId,transport,tabs:[{id,active,title,url}]} and live index/windowId. Carry clientId/tabId into reads/actions. Live transport says what that connection serves: webdriver_bidi takes hover_at and drag, web_extension takes activate_tab. Ambiguous or stale live selection returns clients without dispatch: select explicitly and retry. Automation and stagehand clientId is null, with no transport."""
additional_properties = false

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation", "stagehand"]
default = "live"

[[params]]
name = "clientId"
type = "string"
description = "Live UUID from BrowserTabs/Read; required for multiple clients, stale fails. Omit on automation."
