\* A source the pass could not read releases the width, as an emptied one
\* does, so the pass after it offers the whole backlog again.
\* Expected: LearnedWidthHolds violated.
SPECIFICATION SpecReleaseOnUnreadable
CONSTANTS
    Backlog = 8
    Capacity = 2
INVARIANT TypeOK
INVARIANT LearnedWidthHolds
CHECK_DEADLOCK FALSE
