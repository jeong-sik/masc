# --- agent-core boundary (v0.217.0) enable_thinking admission prep, 2026-07-20 ---
# The upstream ollama_cloud catalog rows declare thinking_control_format =
# "ollama_think", which only encodes on the native /api/chat wire. These lanes
# ride the OpenAI-compatible /v1 wire, where that format encodes nothing, so
# after the v0.217.0 pin bump an explicit enable_thinking=true keeper turn
# would be AcceptRejected(Enable_not_encodable) instead of silently dropped.
# Declare the /v1 truth: inherent reasoning, no wire control ("none" =>
# No_thinking_control + supports_reasoning=true => admission accepts as
# declared-inherent). Budget likewise has no /v1 control wire => false.
# Rows mirror agent_core models.toml verbatim otherwise (kimi-k2.6 @734, minimax-m3
# @821, deepseek-v4-pro @491). Audit: 2026-07-20 enable_thinking flip-risk.
[[models]]
id_prefix = "kimi-k2.6"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 262144
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = false
thinking_control_format = "none"
reasoning_replay = "preserve_always"
supports_multimodal_inputs = true
supports_image_input = true
modality_priority = "visual_first"
supports_response_format_json = false
supports_native_streaming = true
supports_structured_output = false

[[models]]
id_prefix = "minimax-m3"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 524288
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = false
thinking_control_format = "none"
reasoning_streaming_format = "delta:reasoning"
# Mirror repair: same dropped-key repair as the ollama_cloud_native row above
# (task-838). Value from the embedded base minimax-m3 row.
reasoning_replay = "preserve_always"
supports_multimodal_inputs = true
supports_image_input = true
modality_priority = "visual_first"
supports_response_format_json = false
supports_structured_output = false
supports_native_streaming = true

[[models]]
id_prefix = "deepseek-v4-pro"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 524288
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = false
thinking_control_format = "none"
# Mirror repair (task-838): value from the embedded base deepseek-v4-pro row.
reasoning_replay = "drop_without_tool_preserve_with_tool"
supports_multimodal_inputs = false
supports_image_input = false
supports_response_format_json = false
supports_native_streaming = true
supports_structured_output = false

# Same agent-core boundary /v1-truth remediation as the three rows above — this lane was
# missed by the 2026-07-20 audit (it covered deepseek-v4-pro but analyst is
# bound to deepseek-v4-flash via the deepseek-direct substitute,
# runtime.toml:492) and surfaced live as Enable_not_encodable on the first
# post-bump turn. Mirrors agent_core models.toml @476.
[[models]]
id_prefix = "deepseek-v4-flash"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 1048576
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = false
# See the runtime.toml capability block for why this is "none" and not
# "reasoning_effort": the dialect cannot move without a declared effort, or
# every enable_thinking=true turn is rejected before dispatch.
thinking_control_format = "none"
# The ladder the endpoint itself names when it rejects an unknown value
# (measured 2026-08-24; "minimal" and "xhigh" are refused). Kept declared so
# whoever supplies an effort does not have to re-probe for the legal set.
accepted_reasoning_efforts = ["none", "low", "medium", "high", "max"]
supports_multimodal_inputs = false
supports_image_input = false
supports_response_format_json = false
supports_structured_output = false
supports_native_streaming = true
# Mirror repair (task-838): value from the embedded base deepseek family and
# the declared deepseek-v4-flash:0731 sibling row below.
reasoning_replay = "drop_without_tool_preserve_with_tool"

# Provider-scoped model lookup is exact, so the tagged runtime model cannot
# inherit the untagged row above (#31062). Ollama's official registry config for
# deepseek-v4-flash:0731 reports context_length=1048576 and tools/thinking.
# The ollama_cloud_v1 provider base remains the wire-specific control authority.
[[models]]
id_prefix = "deepseek-v4-flash:0731"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 1048576
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = false
reasoning_streaming_format = "delta:reasoning"
reasoning_replay = "drop_without_tool_preserve_with_tool"
supports_multimodal_inputs = false
supports_image_input = false
supports_response_format_json = false
supports_structured_output = false
supports_native_streaming = true

# Ollama Cloud published glm-5.3-flash and glm-5.3 in the last week of August
# 2026. The embedded base catalog stops at glm-5.2, so these two rows are the
# catalog's only description of them and the seed's max-context would otherwise
# be capped to the provider default. /api/show 2026-08-29 reports
# context_length=1048576 and tools+thinking for both; only the flash tag adds
# vision. thinking_control_format is "none" for the same reason the four rows
# above carry it: the OpenAI-compatible /v1 wire has no enable_thinking control,
# so declaring one would reject an explicit enable_thinking turn before dispatch.
[[models]]
id_prefix = "glm-5.3"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 1048576
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = false
thinking_control_format = "none"
# /v1 streams reasoning under delta.reasoning, not delta.reasoning_content —
# measured 2026-08-29 against this endpoint. The glm-coding row for the same
# model carries reasoning_content because Z.AI's wire spells it that way.
reasoning_streaming_format = "delta:reasoning"
# The replay contract belongs to the model, not the wire: GLM keeps intermediate
# reasoning across the tool-call rounds of one user turn and drops it when a new
# user turn starts (bigmodel request-flow diagram, cited by the glm-coding rows).
reasoning_replay = "latest_user_turn_tool_calls"
supports_multimodal_inputs = false
supports_image_input = false
supports_response_format_json = false
supports_structured_output = false
supports_native_streaming = true

[[models]]
id_prefix = "glm-5.3-flash"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 1048576
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = false
thinking_control_format = "none"
reasoning_streaming_format = "delta:reasoning"
reasoning_replay = "latest_user_turn_tool_calls"
# Vision is measured, not inherited: a 64x64 probe PNG (white 44x20 rectangle on
# black) came back described correctly on this wire on 2026-08-29.
supports_multimodal_inputs = true
supports_image_input = true
modality_priority = "visual_first"
supports_response_format_json = false
supports_structured_output = false
supports_native_streaming = true

