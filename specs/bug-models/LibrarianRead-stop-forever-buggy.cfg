\* A round that cannot read a line stops, and nothing but a restart line ever
\* releases it (row 2c'). A turn that continues an existing history writes no
\* restart line, so one unreadable line stops every later round for good while
\* NoAtomPassedUnread stays true: a round that delivers nothing passes nothing
\* over. This cfg is not a mistake someone could make. It runs the reader as it
\* stands, and the property it asserts is what the design promises -- that a
\* round comes back to what it could not read.
\* Expected: violated, in eight steps. masc#37061.
\* When the stall is closed this stops violating, the harness fails, and the cfg
\* is promoted to LibrarianRead-live.cfg.
SPECIFICATION SpecLive
CONSTANTS
    MaxTurns = 2
    MaxSaves = 1
    MaxClears = 0
    MaxBad = 1
INVARIANT TypeOK
PROPERTY EveryReachableAtomEventuallyRead
