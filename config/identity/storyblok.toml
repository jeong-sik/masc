# Storyblok's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-09-05: unauthenticated requests answer 401 with WWW-Authenticate
# naming https://mcp.storyblok.com/.well-known/oauth-protected-resource/mcp,
# authorization server (https://mcp.storyblok.com) offers S256 PKCE and dynamic
# client registration (HTTP 201). Scopes: stories:read, stories:write, offline_access.

id = "storyblok"
label = "Storyblok"
mcp_url = "https://mcp.storyblok.com/mcp"

# Measured 2026-11-02: a client registered for a public https redirect URI
# is refused at the authorize step; a client registered for the RFC 8252
# loopback form, http://127.0.0.1:<port>/api/v1/keepers/oauth/callback, is
# not. With the loopback client the authorize step sends the browser on to
# sign-in, which is as far as a probe without consent goes. So a login here
# names the loopback callback, and the browser that consents has to reach
# this server on 127.0.0.1.
callback = "loopback"

access_token_env = "STORYBLOK_ACCESS_TOKEN"
expires_at_env = "STORYBLOK_EXPIRES_AT"
refresh_token_file = "/home/keeper/.storyblok/refresh_token"
renew_before_sec = 300
