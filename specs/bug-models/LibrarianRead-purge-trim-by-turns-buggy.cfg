\* The purge of LibrarianRead-purge-trim-buggy.cfg under the guard RFC
\* librarian-lifecycle 10 recommends: refuse while a turn is unread, and make
\* the end of the rewritten history the new baseline.
\* NoAtomPassedUnread MUST be violated: the guard asks about turns while atoms are what a purge puts at risk. Its buggy twin measures what happens
\* without the guard, so this pair is what the open decision rests on.
\*
\* scripts/tla-check.sh runs only <spec>.cfg as the clean model, so this one
\* runs from specs/Makefile (make check-buggy) and from a line that names it there.
SPECIFICATION SpecPurgeTrimGuardedByTurns
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
