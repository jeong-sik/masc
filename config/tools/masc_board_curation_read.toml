name = "masc_board_curation_read"
description = """
Read the latest AI curation snapshot for the board.

It holds the TL;DR summary, post ordering, highlights, tag suggestions, answer matches, rationale, and operator-auditable provenance. Returns null when no snapshot has been submitted yet."""

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 3 times in 2 turns, 372 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 2 extra requests over the same week.
defer_loading = true

[keeper_projection]
description = """
Read the latest AI curation snapshot for the board, including summary, \
recommended ordering, highlights, tag suggestions, answer matches, health \
score, rationale, and provenance. Returns null when no snapshot has been \
submitted yet."""
additional_properties = false
