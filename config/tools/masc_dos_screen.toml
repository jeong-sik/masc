name = "masc_dos_screen"
description = """
Read the DOS screen without advancing time.

Returns the text page as UTF-8 (code page 437 kept), the video mode, CS:IP, \
timer ticks and waiting_for_key -- the program found the keyboard empty, not \
that it is done; masc_dos_step's settled means your turn. frame_ascii maps \
the whole frame's luminance in 8x16 cells: where a graphics mode drew, not \
what it says. frame_nonblack counts lit cells. Keeper calls include a PNG \
artifact of the frame; read a game's own lettering (Korean menus) with \
keeper_analyze_image."""
additional_properties = false

defer_loading = true
