name = "masc_ask"
description = """
Ask the operator a question with named choices.

Records the question and returns; continue independent work while waiting. Recorded answers
arrive in a separate wake with the original questions, context and supplied
Task/Goal IDs and the calling execution when observed by the host. Use for missing external decisions. Tool approvals use the Gate."""
additional_properties = false
# RFC-0403 후속. 이 셋은 2026-08-03 ~ 09-02 31일간 fleet 전체에서 호출 0회이고,
# 그 사이 agent-core keeper 4곳의 요청마다 5,498 B 를 싣고 있었다. 지연의
# 손익은 호출 수가 아니라 "그 도구가 필요했던 서로 다른 턴 수"로 가르는데
# (masc #32062), 그 값이 0이므로 우변이 0이다 — 되는 쪽이 확정이다.
#
# 사라지는 게 아니다. agent-core 레인에서 지연된 도구는 keeper_tool_search
# 목록에 이름으로 남고, 모델이 부르면 그 턴에 붙는다. 같은 선언을
# 가진 30종 중 27종이 이 창에서 실제로 호출됐다 (masc_schedule_create 412회,
# masc_goal_transition 89회) — 왕복이 도는 것은 관측된 사실이다.
# (#43566: 원문 질문·맥락·Task/Goal/실행 결속 안내로 스키마 설명이 ~400 B 늘었지만,
# defer_loading = true 이므로 도구를 실제로 부른 턴에만 적재된다.)
defer_loading = true

[[params]]
name = "questions"
type = "array"
required = true
description = "Questions to ask together."

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
name = "header"
type = "string"
required = true
description = "Short decision title."

[[params.items.params]]
name = "prompt"
type = "string"
required = true
description = "Complete decision question. It returns with the answer so the decision remains understandable after other work."

[[params.items.params]]
name = "mode"
type = "string"
required = true
enum = ["single", "multi"]
description = "Mode: single or multi."

[[params.items.params]]
name = "free_text"
type = "boolean"
description = "Offer a free-text input prompt. Operators can always write an alternative answer."

[[params.items.params]]
name = "free_text_hint"
type = "string"
description = "Placeholder for free text."

[[params.items.params]]
name = "choices"
type = "array"
description = "Named choices (required unless free_text is true)."

[params.items.params.items]
type = "object"
additional_properties = false

[[params.items.params.items.params]]
name = "label"
type = "string"
required = true
description = "Operator visible label."

[[params.items.params.items.params]]
name = "description"
type = "string"
description = "Commitment of choice."

[[params]]
name = "context"
type = "string"
description = "Why this decision is needed and which work depends on it. Retained with the original question when the answer arrives."

[[params]]
name = "task_id"
type = "string"
description = "Exact Task this decision concerns, when known. Retained as the original binding even if the Keeper later works on another Task."

[[params]]
name = "goal_id"
type = "string"
description = "Exact Goal this decision concerns, when known. Retained with the original question; omitted means no Goal binding was recorded."
