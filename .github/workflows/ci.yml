name: CI

# Compile the exact manually selected ref; reusable by leader-selected CI.

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        default: ''
      candidate_verification:
        type: boolean
        default: false

permissions:
  contents: read

# Each explicit invocation has its own group; selections do not cancel each other.
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: dune build @check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free disk space
        # ubuntu-24.04 preinstalls the Android SDK (~9 GB), .NET (~1.6 GB),
        # GHC (~1 GB) and the CodeQL bundle (~5 GB) this OCaml build never
        # uses; removing them prevents the "No space left on device" failures
        # seen on 2026-07-03 (runs 28638901622 / 28644587505 / 28652695346).
        # See: https://github.com/jeong-sik/masc/issues/22954
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - name: Check source text integrity
        run: scripts/ci/check-source-text-integrity.sh

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-bisect

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep

      - name: Build
        env:
          # Public runners give four CPUs; use all four for the
          # compile-only graph.
          DUNE_JOBS: "4"
        # NO continue-on-error: the build is deterministic and must hard-fail.
        run: |
          set -euo pipefail
          dune build @check
