\* A line that withdraws a Reset, decided by a count: after a clear that was made, a turn with no Opened regrows the head to before and the next unit starts above its message. This is why no line withdraws a Reset. Expected: NoSilentSkip violated.
SPECIFICATION Spec
CONSTANTS
    MaxMsgs = 3
    MaxLines = 6
    MaxOpen = 1
    MaxPurges = 0
    MaxResets = 1
    MaxFails = 1
    MaxCloseFails = 1
    MaxLate = 0
    MaxChgFails = 1
    MaxCrashes = 0
    MaxStops = 1
    MaxRemoves = 0
    MaxReplaces = 0
    MaxCuts = 0
    MaxBad = 0
    MaxRecreates = 0
    MaxBreaks = 0
    MaxHand = 0
    LockShared = TRUE
    ClearKeeps = FALSE
    Unseen = FALSE
    RegrowAligned = FALSE
    OwnAfterReset = "unattributed"
    Bug = "withdrawn_by_count"
INVARIANT NoSilentSkip
CHECK_DEADLOCK FALSE
