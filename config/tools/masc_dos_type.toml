name = "masc_dos_type"
description = """
Type text on the shared DOS machine.

Sends the characters in turn. For a name or a number a program is asking for; \
a menu wants masc_dos_press, where the arrows and enter have names. A \
character the US layout has no key for is refused before anything is typed. \
By default each character runs to an empty-poll/unchanged-screen observation, \
which does not prove a final prompt. until_ready=false injects only the first \
character and runs the requested steps unless the program exits. The call \
stops at 4000000 machine steps in total; keys_pressed says how many entered \
the BIOS ring, and the remaining suffix is unsent."""
additional_properties = false

defer_loading = true

[[params]]
name = "text"
type = "string"
required = true
description = "The characters to type, e.g. \"SAVED\"."
max_length = 256

[[params]]
name = "steps"
type = "integer"
description = "Machine-step budget per character. Default 4000000."
minimum = 1
maximum = 4000000
default = 4000000

[[params]]
name = "until_ready"
type = "boolean"
description = "Stop at the empty-poll/unchanged-screen observation. False sends only the first character, then runs steps without early settling. Default true."
default = true
