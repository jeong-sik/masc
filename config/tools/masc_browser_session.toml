name = "masc_browser_session"
description = """
Manage the isolated automation Gecko browser; operator live sessions are not managed. Configure browser.webdriver_url and optional browser.binary (e.g. Zen). After open, use BrowserGoto/Read with lane=automation."""
additional_properties = false

[[params]]
name = "action"
type = "string"
enum = ["open", "close", "status"]
required = true
description = "open launches; close stops; status observes tab count/download readiness."

[[params]]
name = "headless"
type = "boolean"
default = true
