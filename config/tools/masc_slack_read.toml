name = "masc_slack_read"
description = """
Read the slack-lane buffer: the messages the in-process poll fiber \
collected from bound Slack channels. action=messages with channel_id \
returns that channel's recent messages (newest first); without \
channel_id it returns the per-channel summary. The buffer is memory: \
it holds what was collected since the fiber last started, not full \
history. Thread reading arrives with the write increment."""
additional_properties = false

[[params]]
name = "action"
type = "string"
enum = ["messages"]
description = "What to read. Default: messages."
default = "messages"

[[params]]
name = "channel_id"
type = "string"
description = "Slack channel id (C...), as the per-channel summary lists. Omit for the summary."

[[params]]
name = "limit"
type = "integer"
description = "Max messages to return, newest first."
minimum = 1
maximum = 200
default = 50
