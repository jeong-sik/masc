name = "keeper_workspace_memory_read"
description = """
Read the current shared workspace memory ledger from its curator.

Without id, list claim and conflict summaries with member references. With a claim or conflict id, resolve only that entry's member facts against current Keeper memory. An unavailable current claim is a read gap, not proof that the fact vanished. These are model classifications, not verified truths. This read does not promote claims or modify Keeper memory."""
additional_properties = false

defer_loading = true

[[params]]
name = "id"
type = "string"
description = "Claim or conflict id from the summary. Omit to list bounded summaries."
