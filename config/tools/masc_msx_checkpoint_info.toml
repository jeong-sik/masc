name = "masc_msx_checkpoint_info"
description = """
Read a checkpoint slot's metadata without restoring it.

Read-only. Restoring replaces the shared machine every spectator watches, so asking what a slot holds must not restore. Returns the format version, saved-at time, the core digest that saved it, media names, the saved input edge count, the file's byte length and the SHA-256 of its bytes. `core_sha` is null for checkpoints saved before the field existed — an unknown core, not a wrong one."""
additional_properties = false
defer_loading = true

[[params]]
name = "slot"
type = "string"
description = "Checkpoint name: 1..64 letters, digits, underscores or hyphens. Default quick."
default = "quick"
