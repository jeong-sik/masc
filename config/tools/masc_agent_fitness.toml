name = "masc_agent_fitness"
description = """
Get fitness scores for agents based on completion rate, reliability, and \
speed metrics."""
additional_properties = false

# Held back from the request until the model asks for it by name.
# Called 13 times across the whole fleet over 2026-08-25..08-31, against
# a schema charged to every provider request of every turn.
defer_loading = true

[[params]]
name = "agent_name"
type = "string"
description = """
Optional: Get fitness for specific agent. If omitted, returns all agents."""

[[params]]
name = "days"
type = "integer"
description = "Number of days to analyze (default: 7)"
default = 7
