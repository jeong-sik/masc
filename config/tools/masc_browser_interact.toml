type = "array"
description = "swipe: intermediate points in [0,1), in order; omitted, the swipe passes the midpoint."

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.items.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "durationMs"
type = "integer"
minimum = 0
maximum = 9007199254740991
description = "swipe: milliseconds per move segment, default 0."

[[params]]
name = "key"
type = "string"
description = "press_key: Enter, Tab, Escape, Backspace, Delete, ArrowUp/Down/Left/Right, Home, End, or one printable ASCII character. Acts on current focus."

[[params]]
name = "modifiers"
type = "array"
items = { type = "string", enum = ["Control", "Meta", "Alt", "Shift"] }
description = "press_key: distinct modifiers, e.g. [Meta] with key a selects all on macOS; [Control] elsewhere."

[[params]]
