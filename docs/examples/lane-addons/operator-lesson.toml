# Adjust manifest_path when copying this declaration outside this directory.
# Bind both outputs in runtime.toml before the first compose
# ([runtime.addon_exact_lanes.operator-lesson.outline] and
# [runtime.addon_exact_lanes.operator-lesson.scene]).
id = "operator-lesson"
run_id = "operator-lesson"
manifest_path = "../../../addons/operator-lesson/lane.toml"

[binding]
sources = []
language = "ko"
# Unix time in seconds: the first lesson reads records made from then on.
# 1794441600 is 2026-11-12T00:00:00Z. Write the time you want to start from.
since = 1794441600

[[binding.records]]
source_id = "board"
kind = "board"
visibilities = ["public", "unlisted"]

[[binding.records]]
source_id = "masc-repo"
kind = "repository"
repository_id = "masc"
paths = ["changelog.d/"]

# More records a lesson can quote (docs/guides/operator-lesson.md):
#
# [[binding.records]]
# source_id = "wiki"
# kind = "wiki"
#
# A github_pulls read waits until [repositories] pr_reader can read GitHub,
# and the lesson waits with it.
# [[binding.records]]
# source_id = "masc-prs"
# kind = "github_pulls"
# repository_id = "masc"
