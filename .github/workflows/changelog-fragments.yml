name: Changelog fragments

# Check the fragments of the selected ref only when explicitly requested.
# scripts/bump-version.sh runs the same check before it assembles a release.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Changelog fragment format
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check every fragment cites its own pull request
        run: python3 scripts/changelog-fragments.py check --dir changelog.d
