name = "keeper_skill"
description = "Read one frozen instruction Skill body. Every row in the Available list below is something this workspace wrote down about work that recurs here — a failure that repeats, a convention and the reason for it, a sequence whose order matters. Open the row whose one-line description names the work you are about to start, before starting it. The common error is not opening one that applied: a body that turns out not to apply costs a single call. A row that also appears as a `keeper_compose_<name>` tool performs its readings in one call — use that tool when the readings are all you need.\n\n Pass the `identity` exactly as the Available list prints it. `content_revision` is optional: omit it and this turn's frozen list decides which revision is read, or pass one to pin it. When that body names a bundled file needed for the current work, call again with its relative `file` path. A file larger than the turn's configured `[skills].resource-read-max-bytes`, or content that cannot fit the provider's shared inline tool-result boundary, is rejected before activation is recorded."
additional_properties = false
# Keep discovery resident: this schema carries the Available Skill list.
# The shared Keeper prompt also directs task-based selection without a user
# naming a Skill; bodies and relevant resources are still read on demand.
defer_loading = false

[[params]]
name = "identity"
type = "object"
required = true
additional_properties = false
description = "Exact Skill identity from the frozen turn snapshot."

[[params.params]]
name = "source_id"
type = "string"
required = true
min_length = 1

[[params.params]]
name = "package_id"
type = "string"
required = true
min_length = 1

[[params.params]]
name = "name"
type = "string"
required = true
min_length = 1

# No length/pattern gate here: a caller that lacks the revision must reach
# the handler, whose refusal carries the exact references this keeper does
# carry. A schema-level gate answered those calls with a generic length
# error that could not name the catalog (task-828).
#
# Optional since RFC-0411 §4.2. Omitted, the turn's frozen Skill list decides
# which body is read — the same list a spelled-out revision is matched against,
# so leaving it out reaches nothing new. Spelled out, it is still matched
# exactly and refused on a mismatch: a revision the caller named is never
# quietly replaced.
#
# It was required because the call was meant to pin what it read. That pin also
# has to be typed, and nothing hands it to the caller outside this tool's own
# Available list — of 292 tasks recorded on this workspace, 0 named a Skill,
# and 126 of those were made through masc_add_task, which has carried a skills
# parameter all along.
[[params]]
name = "content_revision"
type = "string"
required = false
description = "Optional canonical domain-separated SHA-256 content revision of the exact frozen SKILL.md bytes: 64 lowercase hex characters. Omit it to read whichever revision this turn's Skill list carries under that identity; pass it to pin one, copied verbatim from the Task skill reference or this tool's Available list."

[[params]]
name = "file"
type = "string"
required = false
min_length = 1
description = "Optional bundled resource path relative to the Skill root, exactly as SKILL.md names it. Omit it to read the frozen Skill body."
