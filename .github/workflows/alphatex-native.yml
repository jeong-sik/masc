name: Alphatex native harnesses

# Measurement branch for #45224 only. This branch is never merged; main keeps
# its own version of this workflow. Here the job runs only the close-ordering
# measurement (tools/alphatex/native/measure/midi-close) on the same macOS
# image as the native harnesses, once idle and once with every core busy.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: alphatex-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Measure CoreMIDI delivery around port/client dispose (#45224)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain and host
        run: |
          xcrun swiftc --version
          sw_vers
          sysctl -n hw.model hw.ncpu machdep.cpu.brand_string
      - name: Measure idle
        run: bash tools/alphatex/native/measure/midi-close/run.sh "$RUNNER_TEMP/measure" ci-idle --trials 400
      - name: Measure with every core busy
        run: |
          set -euo pipefail
          pids=()
          for _ in $(seq "$(sysctl -n hw.ncpu)"); do yes > /dev/null & pids+=("$!"); done
          trap 'kill "${pids[@]}" 2>/dev/null || true' EXIT
          bash tools/alphatex/native/measure/midi-close/run.sh "$RUNNER_TEMP/measure" ci-loaded --trials 400
      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: midi-close-measure-45224
          path: |
            ${{ runner.temp }}/measure/*.json
            ${{ runner.temp }}/measure/*.txt
