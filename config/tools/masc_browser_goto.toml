name = "masc_browser_goto"
description = """
Navigate the automation lane's browser to one http(s) URL and answer with \
the landing url, title and status. The automation browser keeps its own \
profile with no operator logins. The live lane refuses navigation verbs — \
it is read-only. Read the page afterwards with masc_browser_read \
lane=automation."""
additional_properties = false

[[params]]
name = "url"
type = "string"
required = true
description = "Full http or https URL. Example: \"https://ocaml.org\"."

[[params]]
name = "tabId"
type = "integer"
description = "Page index from masc_browser_tabs to navigate. Default: the newest page."
minimum = 0
