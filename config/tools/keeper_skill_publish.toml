name = "keeper_skill_publish"
description = """
Publish a new Skill package into the workspace's project-agents Skill source. \
The SKILL.md is checked by the same parser as the operator Skill editor and \
keeper_skill_validate, then the catalog is republished; a Keeper that lists its \
skills sees it once listed. Never overwrites: an existing package is refused. Operators \
can delete it afterwards. The audit log records you, the \
reference and evidence. Before publishing, recheck the evidence for each reusable \
claim and preserve its applicability and limits. Keep case-specific instructions \
scoped to their case; a Skill does not override current authoritative state or \
later explicit instructions. Where completion authority is relevant, distinguish \
Task verdicts from Goal human confirmation and allow explicitly reopened work."""
additional_properties = false

[[params]]
name = "package_id"
type = "string"
required = true
description = "New Skill package directory name. Must match the SKILL.md name."

[[params]]
name = "source_text"
type = "string"
required = true
description = "The complete SKILL.md text, frontmatter included."

[[params]]
name = "evidence"
type = "array"
required = true
items = { type = "string" }
min_items = 1
description = "Where this procedure worked: Memory fact ids, turn references, or tool call references. Check what each reference supports, including later correction or retraction; listing a reference alone does not establish a reusable rule. Recorded for operators to review later."
