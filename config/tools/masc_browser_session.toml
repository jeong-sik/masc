name = "masc_browser_session"
description = """
Bind an observed Ego Space to a shared Goal. Goal Space binding is experimental: it has no measured Keeper production run yet. action=bind_goal requires goalId, lane=live and the observed Ego clientId; it stores metadata without browser input or taking control. action=goal_status with goalId reads only the stored binding. The same binding is idempotent; reassignment or sharing a Space across distinct Goals is refused. action=unbind_goal with goalId removes the Goal's binding so a wrong one can be bound again; it changes no browser or Space. Keeper initial automatic discovery consults its current Task Goal binding; retain the resulting lane/clientId for subsequent calls. A bound Ego Space is already open: use BrowserTabs to discover its pages. A missing bound connection does not select another browser."""
additional_properties = false
# 2026-10-29 ~ 11-04 에 저장된 agent-core 요청 5,479개(Keeper 28명)가 이 정의 4,611 B 를
# 매번 실었다. 이 도구를 부른 서로 다른 Keeper 턴은 24개(44회)다. 지연의 손익은
# 호출 수가 아니라 필요했던 턴 수로 가른다(masc #32062): 실으면 25.5 MB, 지연하면
# 24턴 x 표면 91,483 B = 2.2 MB 라서 11.6배다. 같은 도구 묶음의 BrowserRead,
# BrowserAct, BrowserInteract 는 이미 지연돼 있다. 지연돼도 keeper_tool_search
# 목록에 이름이 남고, 부르면 그 턴에 스키마가 붙는다. 재측정 방법은
# docs/evidence/defer-loading-2026-11/README.md 에 있다.
defer_loading = true

[[params]]
name = "action"
type = "string"
enum = ["bind_goal", "goal_status", "unbind_goal"]
required = true
description = "bind_goal stores an observed Ego Space for goalId (lane=live and clientId required). goal_status reads the stored binding only (goalId required; no other options). unbind_goal removes that binding (goalId required; no other options)."

[[params]]
name = "lane"
type = "string"
enum = ["live"]
description = "Required for bind_goal: the lane of the observed Ego connection."

[[params]]
name = "clientId"
type = "string"
description = "Exact observed live connection UUID. Required for bind_goal; it is never a numeric Space ID."

[[params]]
name = "goalId"
type = "string"
description = "Shared workspace Goal ID, required for bind_goal, goal_status and unbind_goal. bind_goal and goal_status require an existing Goal; unbind_goal also accepts a deleted Goal's ID to release its stored binding."

