name = "masc_keeper_list"
description = """
List known keepers from persisted keeper metadata. The response carries \
total (keepers known before limit), limit (the value applied) and truncated, \
so a short answer is distinguishable from a complete one."""
additional_properties = false

[[params]]
name = "limit"
type = "integer"
description = """
Max keepers to return (default: 50). Names are sorted and cut from the end, \
so a low limit hides whatever sorts last; check truncated in the response."""

[[params]]
name = "detailed"
type = "boolean"
description = """
Return keeper summaries (model/context) instead of names \
only."""

[[params]]
name = "fresh"
type = "boolean"
description = """
Recompute the roster without using or updating the short-lived list cache. \
Successful responses carry projection_cache_bypassed=true. Use after receiving \
a change notification; inputs are not one atomic snapshot."""

[[params]]
name = "name"
type = "string"
description = """
Return only this keeper's row (or its error row), or no row when it is not \
listed. total counts the matched names. The answer is never served from the \
list cache and carries projection_cache_bypassed=true."""
