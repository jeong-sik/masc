min_length = 1
pattern = "^/.*$"
description = "Absolute path to replace, the typed form of '>'."

[[params.params]]
name = "append"
type = "string"
min_length = 1
pattern = "^/.*$"
description = "Absolute path to add to, the typed form of '>>'."

[[params.params]]
name = "fd"
type = "integer"
enum = [1, 2]
description = """
Send this stream into another of the stage's output descriptors, the typed \
form of '2>&1'. The two streams are captured separately and joined \
afterwards, so the merged text is grouped by stream, not ordered by time."""

