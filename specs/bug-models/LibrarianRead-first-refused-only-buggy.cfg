\* Buggy model: the round asks whether the first refused line still matters and,
\* when a restart settles that one, goes on without looking at the rest.
\* NoAtomPassedUnread MUST be violated. Two refused lines are needed for the
\* case to exist at all, which is why the other cfgs cannot find it.
\*
\* scripts/tla-check.sh runs only <spec>-buggy.cfg, so until masc#37034 lands
\* this one runs from specs/Makefile (make check-buggy) and nowhere else.
SPECIFICATION SpecFirstRefusedOnly
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 0
    MaxBad = 2
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
