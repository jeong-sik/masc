\* Claiming a returned Task without clearing the returned mark leaves it held
\* and returned at once, so the operator list would keep offering work that
\* somebody already took.

SPECIFICATION SpecBugClaimKeepsReturned

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    RejectedIsOpenAndUnheld

CHECK_DEADLOCK
    FALSE
