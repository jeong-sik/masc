# HubSpot's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be made by hand come from what it serves, so none of that
# can go stale here.
#
# Measured 2026-08-27: an MCP initialize is refused with 401, its protected-resource document answers where RFC 9728 computes it, and the
# authorization server it names offers S256. It publishes no registration endpoint, so this needs an app made by
# hand: create one, then post its client id and secret to
# /api/v1/keepers/oauth/client. It names no scopes, so none are asked for.

id = "hubspot"
label = "HubSpot"
mcp_url = "https://mcp.hubspot.com"

access_token_env = "HUBSPOT_ACCESS_TOKEN"
expires_at_env = "HUBSPOT_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.hubspot/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
