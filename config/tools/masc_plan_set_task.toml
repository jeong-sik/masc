name = "masc_plan_set_task"
title = "Bind Current Task"
description = """
Set the current task for your session so you can omit task_id in subsequent \
planning calls. Use when starting work on a task after claiming it. After \
keeper_task_claim; auto-cleared on session end."""
additional_properties = false

[[params]]
name = "task_id"
type = "string"
required = true
description = "Task ID to set as current"

[help]
short_description = "Set or update the plan-of-record for a claimed task."
when_to_use = "Use after masc_claim to record the high-level plan (1-5 bullet outline) before doing significant work. Future-you and reviewers read this to understand intent without rerunning your reasoning."
key_constraints = [
  "Caller must own a claim on the target task_id.",
  "Plan body should be short prose, not a runbook — it is a commitment, not a script.",
]
details_markdown = "Replaces any prior plan on the task; history is preserved in the audit log."
examples = ["task_id='task-123' plan='1) Extend tool_help_registry record  2) Backfill 6 manual entries  3) Add regression tests.'"]
