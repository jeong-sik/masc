name = "masc_msx_peek"
description = """
Read the machine's memory at a logical address and refresh the snapshot \
that masc_msx_ram_diff compares against. Read-only: writing memory is the \
cheat this lane refuses. Address is a hex string like \"e000\" or \
\"0xE000\" (decimal parses too); length is bytes, 1..256, default 16. The \
result is hex pairs in byte order. Cheap enough to call before and after \
one action to find what that action changed."""
additional_properties = false

defer_loading = true

[[params]]
name = "address"
type = "string"
required = true
description = "Logical address to read from, hex (\"e000\") or decimal."

[[params]]
name = "length"
type = "integer"
description = "Bytes to read, 1..256. Default 16."
minimum = 1
maximum = 256
default = 16
