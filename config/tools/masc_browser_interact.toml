name = "masc_browser_interact"
description = """
Interact with one explicit Firefox/Zen tab: click one uniquely matched CSS selector, fill a text input/textarea without Enter or submit, or scroll by x/y CSS pixels. Works on live and automation lanes. Use documentId and nodeId from BrowserRead mode=scene, or a selector known from page inspection; BrowserRead text is not a full DOM inventory. Set expectedUrl from the last read to reject intervening navigation. Fill emits input/change events; page handlers can react. Use scroll_at with screenshot point and viewport to scroll the nested pane under that point (native wheel on automation, scrollable DOM ancestor on live). Returns the current URL and document scroll position; read/capture again to verify the resulting page. Screenshot click_at uses normalized viewport coordinates and requires the observed viewport and expectedUrl. Drag uses trusted pointer actions on the automation lane. follow_link navigates directly to an observed same-tab HTTP(S) anchor href, bypassing page click handlers. Supports HTML/SVG anchors and top-document _self/_top/_parent targets. Rejects new-window targets, downloads, rel=noreferrer and explicit referrerpolicy before navigation because direct navigation cannot preserve link-specific referrer policy; requires documentId/nodeId and expectedUrl. destinationUrl is the intended URL, not a loaded-page receipt. On the live lane, activate_tab selects only the explicit tab, requires expectedUrl, and verifies active=true without window focus or navigation. Requires extension 0.6.0 or newer. Automation already selects tabs during observation and rejects this action. No arbitrary JavaScript."""
additional_properties = false

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation"]
default = "live"

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "expectedUrl"
type = "string"
description = "Reject if the tab URL changed since this observation."

[[params]]
name = "action"
type = "string"
required = true
enum = ["activate_tab", "follow_link", "click", "fill", "scroll", "click_at", "scroll_at", "drag"]

[[params]]
name = "selector"
type = "string"
description = "Required for click/fill unless documentId/nodeId are provided. Must identify exactly one visible element in the top document."

[[params]]
name = "text"
type = "string"
description = "Required for fill; empty text clears the input. Never returned in the result."

[[params]]
name = "x"
type = "integer"
description = "Required for scroll/scroll_at: horizontal CSS-pixel delta."

[[params]]
name = "y"
type = "integer"
description = "Required for scroll/scroll_at: vertical CSS-pixel delta."

[[params]]
name = "clientId"
type = "string"
description = "Live native connection UUID returned by BrowserTabs/Read or the browser clients endpoint. Required when multiple live browsers are connected. A stale ID never selects another browser. Omit for automation."

[[params]]
name = "documentId"
type = "string"
description = "Document identity from BrowserRead mode=scene. Supply with nodeId instead of selector; rejects navigation/reload."

[[params]]
name = "nodeId"
type = "string"
description = "Observed element identity from scene. Survives reordering; detached/replaced nodes fail rather than targeting a replacement."

[[params]]
name = "point"
type = "object"
description = "For click_at/scroll_at: {x,y} normalized viewport coordinates, each >=0 and <1. Copy viewport and expectedUrl from the screenshot."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
description = "Normalized viewport fraction; must be less than 1."

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
description = "Normalized viewport fraction; must be less than 1."

[[params]]
name = "from"
type = "object"
description = "For drag: starting {x,y} normalized viewport coordinates. Drag requires the automation lane."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
description = "Normalized viewport fraction; must be less than 1."

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
description = "Normalized viewport fraction; must be less than 1."

[[params]]
name = "to"
type = "object"
description = "For drag: ending {x,y} normalized viewport coordinates. Each coordinate must be >=0 and <1."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
description = "Normalized viewport fraction; must be less than 1."

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
description = "Normalized viewport fraction; must be less than 1."

[[params]]
name = "viewport"
type = "object"
description = "Required for click_at/scroll_at/drag. Copy screenshot viewport exactly: documentId, width, height, scrollX, scrollY. Rejects changed documents, dimensions or scroll positions."

additional_properties = false

[[params.params]]
name = "documentId"
type = "string"
required = true
description = "Observed document identity."

[[params.params]]
name = "width"
type = "number"
required = true
exclusive_minimum = 0.0
description = "Observed viewport width in CSS pixels; positive."

[[params.params]]
name = "height"
type = "number"
required = true
exclusive_minimum = 0.0
description = "Observed viewport height in CSS pixels; positive."

[[params.params]]
name = "scrollX"
type = "number"
required = true
description = "Observed horizontal scroll position in CSS pixels."

[[params.params]]
name = "scrollY"
type = "number"
required = true
description = "Observed vertical scroll position in CSS pixels."

# follow_link uses documentId/nodeId and expectedUrl already declared above.
