\* Sending a rejected Task to Todo drops the name of the agent whose
\* submission was refused, which is what the Rejected state exists to keep.

SPECIFICATION SpecBugRejectedForgetsProducer

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    RejectedNamesItsProducer

CHECK_DEADLOCK
    FALSE
