name = "masc_browser_session"
description = """
Manage a browser the server owns. lane=automation: the isolated Gecko browser (configure browser.geckodriver, the server starts and stops it, and optional browser.binary, e.g. Zen). lane=stagehand: a Chromium with the Stagehand runtime (configure [browser.stagehand]). Operator live sessions are not managed. After open, use BrowserGoto with the same lane."""
additional_properties = false

[[params]]
name = "action"
type = "string"
enum = ["open", "close", "status"]
required = true
description = "open launches; close stops; status observes the session. With none open, status adds driver.ready (true: open can start one now; false: driver.message says why, e.g. \"Session already started\") or driver.error (the driver did not answer)."

[[params]]
name = "lane"
type = "string"
enum = ["automation", "stagehand"]
default = "automation"

[[params]]
name = "headless"
type = "boolean"
default = true
