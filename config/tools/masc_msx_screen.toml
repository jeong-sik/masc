name = "masc_msx_screen"
description = """
Read the current MSX frame without advancing time: mode, PC, screen_text, screen_view, tiles and sprites. screen_view is a 64x24 ASCII picture of the screen, readable in any mode, so a keeper with no vision runtime can recognise the layout (a title, a menu, a map). screen_text only reads text-mode text and is noise in bitmap modes; tile numbers are game-specific. Keeper calls also return a PNG artifact and dimensions; a keeper with a vision runtime can use keeper_analyze_image on it."""
additional_properties = false

defer_loading = true
