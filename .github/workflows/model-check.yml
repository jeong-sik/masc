name: TLA model checks

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tla:
    name: TLA model check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Run all TLC models
      run: bash scripts/tla-check.sh
