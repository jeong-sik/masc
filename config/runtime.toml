# characters of one word ("cryptic", "crowded") after a normal opening sentence
# -- and turn records put the wall-clock at a 252s median, 7.09h across one day.
#
# Output tokens over the same 1516 turns: 1392 at <= 2048, 38 in 2048..8192,
# then 86 at exactly 65536. The 8192..65535 band is empty, so this budget sits
# between the two populations: it cannot truncate anything healthy that was
# observed, and it bounds a collapse to a quarter of its former length -- both
# the wall-clock and the garbage that a truncated turn leaves in the history the
# next turn replays.
