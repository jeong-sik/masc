\* A rejection that hands the Task back to its producer must break the
\* one-Task rule: submit t1, claim t2, t1 is rejected, and a1 holds both.
\* Each bug model has its own cfg naming one property, so that property has to
\* catch it alone; bundled, TLC reports only the shortest counterexample.

SPECIFICATION SpecBugVerdictReturns

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    OneTaskPerAgent

CHECK_DEADLOCK
    FALSE
