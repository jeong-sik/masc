name: Dead tool report

# Weekly unused-tool report for #49174. The report itself is never a gate
# (`must-do: false` on the issue): it prints, it uploads an artifact, and a
# human reads the list. What it must never do is call a tool unused because a
# source that cannot see that tool family returned zero — that false positive
# is the whole reason #49174 exists.
#
# GitHub-hosted runners have no MASC runtime state, so the scheduled run
# reports every tool as "판정 불가" with the reason attached. A real fleet
# report comes from a machine that has `<base>/.masc`, passed as `data_dir` on
# a workflow_dispatch run or mounted on a self-hosted runner. Do not point
# `data_dir` at a stale committed snapshot and call it a 30-day count.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      data_dir:
        description: Directory holding MASC runtime state (tool_calls/, tool-metrics.sqlite3)
        type: string
        default: .masc
      days:
        description: Trailing window in days
        type: string
        default: '30'

permissions:
  contents: read

concurrency:
  group: dead-tool-report
  cancel-in-progress: false

jobs:
  report:
    name: Unused tool report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the registry the report counts
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          # With both runtime sources skipped this is a registry-only run:
          # every tool lands in "판정 불가" and the warnings section is the
          # only signal. It still proves the denominator parses — a TOML
          # without `name = "..."` silently shrinks the count, and a shrunken
          # denominator makes every later "0회" number wrong.
          python3 scripts/audit-dead-tools.py \
            --registry-dir config/tools \
            --no-ledger --no-metrics \
            --format json > "$RUNNER_TEMP/registry.json"
          python3 - <<'PY'
          import json, os, pathlib
          payload = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'registry.json').read_text())
          registry = payload['registry']
          print(f"registry files: {registry['files']}")
          print(f"registered tools: {registry['count']}")
          problems = list(registry['errors']) + [f"duplicate: {d}" for d in registry['duplicates']]
          if problems:
              for problem in problems:
                  print(f"WARNING: {problem}")
              raise SystemExit(1)
          PY

      - name: Build the unused tool report
        id: report
        env:
          DATA_DIR: ${{ inputs.data_dir || '.masc' }}
          DAYS: ${{ inputs.days || '30' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dead-tool-report"
          # Exit status stays 0 even with unused tools; --strict is not passed
          # because the issue is a report, not a gate.
          python3 scripts/audit-dead-tools.py \
            --registry-dir config/tools \
            --data-dir "$DATA_DIR" \
            --days "$DAYS" \
            --format md > "$RUNNER_TEMP/dead-tool-report/report.md"
          python3 scripts/audit-dead-tools.py \
            --registry-dir config/tools \
            --data-dir "$DATA_DIR" \
            --days "$DAYS" \
            --format json > "$RUNNER_TEMP/dead-tool-report/report.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          payload = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'dead-tool-report', 'report.json').read_text())
          available = [s for s in payload['sources'] if s['available']]
          print(f"available_sources={len(available)}")
          print(f"unused={payload['counts']['unused']}")
          print(f"unverified={payload['counts']['unverified']}")
          PY

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## Dead tool report"
            echo ""
            echo "- checked SHA: \`$GITHUB_SHA\`"
            echo "- data dir: \`${{ inputs.data_dir || '.masc' }}\`"
            echo "- window: ${{ inputs.days || '30' }} days"
            echo "- sources available: ${{ steps.report.outputs.available_sources }}"
            echo "- unused: ${{ steps.report.outputs.unused }} / unverified: ${{ steps.report.outputs.unverified }}"
            echo ""
            if [ "${{ steps.report.outputs.available_sources }}" = "0" ]; then
              echo '> 이 러너에는 MASC 런타임 상태가 없어 전 도구가 "판정 불가"입니다. 0회 목록이 아닙니다.'
              echo '> 실제 함대 리포트는 `.masc` 가 있는 머신에서 `workflow_dispatch` 의 `data_dir` 로 받습니다.'
              echo ""
            fi
            if [ -s "$RUNNER_TEMP/dead-tool-report/report.md" ]; then
              cat "$RUNNER_TEMP/dead-tool-report/report.md"
            else
              echo '(report not produced; see the job log.)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dead-tool-report-${{ github.run_id }}
          path: ${{ runner.temp }}/dead-tool-report
          if-no-files-found: warn
          retention-days: 90
