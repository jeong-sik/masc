\* Reachability guard on the clean model: a task waits and is claimed with its
\* receipt, a restart returns it to the queue with what it owns, and it is
\* claimed again and completes.
\* Expected: RestartRequeueThenSucceedUnreachable VIOLATED.
SPECIFICATION Spec

CONSTANTS
    T1 = t1
    T2 = t2
    R1 = r1
    R2 = r2
    MaxRestarts = 1
    MaxPatrols = 2

INVARIANTS
    RestartRequeueThenSucceedUnreachable

CHECK_DEADLOCK FALSE
