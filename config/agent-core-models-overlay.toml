# MASC deployment capability overlay (Agent Core contract / RFC-0342 D1).
#
# This file contains only deployment-local serving aliases and locally probed
# model builds. AGENT_CORE owns the embedded base catalog; copying upstream rows here
# would recreate the full-catalog fork this overlay replaces.

# Exact-output GLM targets use the public MASC runtime credential contract.
# This exact-only provider deliberately has no credential aliases or fallback.
[[providers]]
id = "glm-coding-sb-exact"
kind = "glm"
base_url = "https://api.z.ai/api/coding/paas/v4"
request_path = "/chat/completions"
api_key_env = "ZAI_API_KEY_SB"
capabilities_base = "glm"

# Z.AI coding-plan runtime capability rows.
[[models]]
id_prefix = "GLM-5-Turbo"
provider_name = "glm-coding"
base = "glm"
max_context_tokens = 200000
max_output_tokens = 128000
supports_tools = true
supports_tool_choice = true
supports_named_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_response_format_json = true
supports_native_streaming = true
reasoning_streaming_format = "delta:reasoning_content"
# GLM thinking with tool calls keeps the intermediate reasoning inside the
# current user turn's tool-call rounds and drops it when a new user turn
# starts (bigmodel.cn official request-flow diagram, checked 2026-08-24).
# Undeclared, the row fell back to No_replay and the model re-derived its
# plan on every tool round. #30015 keeps the synthetic extra-context
# carrier out of the latest-user boundary, so this policy is effective on
# keeper turns.
reasoning_replay = "latest_user_turn_tool_calls"
input_per_million = 1.2
output_per_million = 4.0
cache_write_multiplier = 1.0
cache_read_multiplier = 0.2

[[models]]
id_prefix = "glm-4.7"
provider_name = "glm-coding"
base = "glm"
max_context_tokens = 200000
max_output_tokens = 128000
supports_tools = true
supports_tool_choice = true
supports_named_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_response_format_json = true
supports_native_streaming = true
reasoning_streaming_format = "delta:reasoning_content"
input_per_million = 0.6
output_per_million = 2.2
cache_write_multiplier = 1.0
cache_read_multiplier = 0.18333333333333332

# Ollama Cloud does not admit structured JSON output. Keep the native transport
# model row for non-exact runtime use without inventing a JSON/schema guarantee.
[[models]]
id_prefix = "minimax-m3"
provider_name = "ollama_cloud_native"
base = "ollama_cloud"
max_context_tokens = 524288
max_output_tokens = 131072
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = true
thinking_control_format = "ollama_think"
supports_multimodal_inputs = true
supports_image_input = true
modality_priority = "visual_first"
supports_response_format_json = false
supports_structured_output = false
supports_native_streaming = true

# Kimi Code coding-plan gateway under [providers.kimi_code].
[[models]]
id_prefix = "kimi-for-coding"
provider_name = "kimi_code"
base = "kimi"
max_context_tokens = 256000
# The capability probe on 2026-08-13 sent 36 requests to the kimi_coding
# models (3 models x 6 tools x 2 attempts) and every one of the 36 came back
# carrying thinking. Nothing here declared it, so the default of false stood
# and each request logged Thinking_returned_but_declared_unsupported (#28457).
# Every other kimi row in the catalog declares reasoning; this one did not.
supports_reasoning = true
supports_extended_thinking = true
# Kimi returns reasoning it was not asked for and offers no field to turn it
# off, which is what "none" and an always-on stream mean here — the same shape
# kimi-k2.7-code carries in the base catalog.
thinking_control_format = "none"
supports_reasoning_budget = false
reasoning_streaming_format = "delta:reasoning"
ignored_sampling_parameters = ["temperature", "top_p"]
input_per_million = 0.0
output_per_million = 0.0

# Deployment transport alias for the vllm-qwen3-mtp serving contract.
[[models]]
id_prefix = "qwen36-35b-a3b-mtp"
provider_name = "runpod_mtp"
base = "openai_chat"
max_context_tokens = 131072
supports_tools = true
supports_tool_choice = true
supports_parallel_tool_calls = true
supports_reasoning = true
supports_extended_thinking = true
supports_reasoning_budget = true
thinking_control_format = "chat_template_kwargs"
preserve_thinking_control_format = "chat_template_kwargs_preserve_thinking"
reasoning_streaming_format = "delta:reasoning_content"
reasoning_replay = "drop_without_tool_preserve_with_tool"
supports_native_streaming = true

