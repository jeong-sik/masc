# Copy into the resolved config root's lane-addons directory. Paths are literal;
# set the manifest path to the installed package, and use the same host state
# directory passed to host.py. This declaration never starts the native app.
id = "ego-browser"
run_id = "ego-browser-work"
manifest_path = "../../../addons/ego-browser/lane.toml"

[[binding.sources]]
source_id = "ego-browser"
kind = "snapshot_file"
path = "/absolute/path/to/ego-companion-state/snapshot.json"
