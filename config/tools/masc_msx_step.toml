name = "masc_msx_step"
description = """
Advance the shared MSX machine by frames with no key held.

Returns the observation (see masc_msx_screen). Use it to let a title, a fade or a \
level intro play out. Frames are 1/60 s; at most 300 per call."""
additional_properties = false

defer_loading = true

[[params]]
name = "frames"
type = "integer"
description = "Frames to run. Default 60 (one second)."
minimum = 1
maximum = 300
default = 60

[[params]]
name = "include_frame"
type = "boolean"
default = false
description = "Return an atomic RGB frame and input-ledger summary after advancing."

[[params]]
name = "pixel_response"
type = "string"
enum = ["retained"]
description = "With include_frame=true, reuse exact known pixels or return inline pixels."

[[params]]
name = "known_pixels"
type = "object"
additional_properties = false
description = "Previously received pixel identity; requires pixel_response=retained."

[[params.params]]
name = "revision"
type = "string"
required = true
min_length = 64
max_length = 64

[[params.params]]
name = "width"
type = "integer"
required = true
minimum = 1

[[params.params]]
name = "height"
type = "integer"
required = true
minimum = 1
