name = "masc_ask"
description = """
Ask the operator a question that carries named choices, then keep working.

The question is recorded durably and appears on every surface the operator \
watches. Your turn does not stop and your lane is not held; the answer \
arrives as a separate wake.

Use this when the next step depends on a choice that is not yours to make. \
Do not use it to confirm work you could verify yourself, and do not use it \
to ask whether you may run a tool -- that is the approval gate's job. When \
weighing whether the choice is really yours, remember the asymmetry: a \
question costs one person one minute; a wrong silent guess burns hours \
unattended.

Several open questions is not an error, but a human answers the top one and \
leaves the rest -- ask what actually blocks your next step.

Put the reason in `context`: a reader who cannot see why you are asking \
cannot weigh the decision. Give a `choice_id` that still means the same \
thing after someone rewords its label: the answer names the id, never the \
label."""
additional_properties = false
# RFC-0403 후속. 이 셋은 2026-08-03 ~ 09-02 31일간 fleet 전체에서 호출 0회이고,
# 그 사이 agent-core keeper 4곳의 요청마다 5,498 B 를 싣고 있었다. 지연의
# 손익은 호출 수가 아니라 "그 도구가 필요했던 서로 다른 턴 수"로 가르는데
# (masc #32062), 그 값이 0이므로 우변이 0이다 — 되는 쪽이 확정이다.
#
# 사라지는 게 아니다. agent-core 레인에서 지연된 도구는 keeper_tool_search
# 목록에 이름과 한 줄 요약으로 남고, 모델이 부르면 그 턴에 붙는다. 같은 선언을
# 가진 30종 중 27종이 이 창에서 실제로 호출됐다 (masc_schedule_create 412회,
# masc_goal_transition 89회) — 왕복이 도는 것은 관측된 사실이다.
defer_loading = true

[[params]]
name = "questions"
type = "array"
required = true
description = """
One or more questions asked together. Ask together what the operator can \
decide together; a question that depends on the answer to another belongs \
in a later ask."""

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
name = "question_id"
type = "string"
required = true
description = "Stable id for this question within the ask. The answer names it."

[[params.items.params]]
name = "header"
type = "string"
required = true
description = """
Two or three words naming the decision. Narrow surfaces such as the TUI show \
this instead of the full prompt."""

[[params.items.params]]
name = "prompt"
type = "string"
required = true
description = "The question as the operator reads it."

[[params.items.params]]
name = "mode"
type = "string"
required = true
enum = ["single", "multi"]
description = "single takes one choice; multi takes several."

[[params.items.params]]
name = "free_text"
type = "boolean"
description = """
Whether the operator may type an answer instead of picking one. Defaults to \
false. A question with no choices requires this to be true, otherwise \
nothing could answer it and the ask is refused."""

[[params.items.params]]
name = "free_text_hint"
type = "string"
description = "Placeholder shown where free text is typed."

[[params.items.params]]
name = "choices"
type = "array"
description = "Named choices. May be omitted only when free_text is true."

[params.items.params.items]
type = "object"
additional_properties = false

[[params.items.params.items.params]]
name = "choice_id"
type = "string"
required = true
description = """
Stable id. The recorded answer names this and never the label, so rewording \
a label does not orphan answers already given."""

[[params.items.params.items.params]]
name = "label"
type = "string"
required = true
description = "What the operator reads on the choice."

[[params.items.params.items.params]]
name = "description"
type = "string"
description = "What picking this choice commits to."

[[params]]
name = "context"
type = "string"
description = """
Why you are asking, in your own words. Surfaces render this beside the \
prompt."""

[[params]]
name = "task_id"
type = "string"
description = "Task this question belongs to, when it belongs to one."

[[params]]
name = "goal_id"
type = "string"
description = "Goal this question belongs to, when it belongs to one."
