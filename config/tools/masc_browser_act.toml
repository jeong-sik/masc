name = "masc_browser_act"
description = """
Firefox/Zen automation only. Read elements in the same tab/frame for selectors; preserve decoded CSS escapes exactly. After no match, re-read. Actions can change external state: observe again after success or failure before retrying."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 1,981 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 5개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름과 한 줄
# 요약이 남고, 부르면 그 턴에 붙는다.
defer_loading = true

[[params]]
name = "action"
type = "string"
enum = ["open_tab", "close_tab", "click", "fill", "press", "select", "scroll", "back", "forward", "reload", "upload", "accept_dialog", "dismiss_dialog"]
required = true
description = "fill replaces text; select uses exact option value."

[[params]]
name = "lane"
type = "string"
enum = ["automation"]
default = "automation"

[[params]]
name = "tabId"
type = "integer"
minimum = 0
description = "Required except open_tab."

[[params]]
name = "selector"
type = "string"
description = "click/fill/press/select/upload: one observed element; preserve decoded CSS including > and escapes, not JSON escape notation."

[[params]]
name = "text"
type = "string"
description = "fill replacement (empty clears), or accept_dialog prompt."

[[params]]
name = "key"
type = "string"
enum = ["Enter", "Tab", "Escape", "Backspace", "Delete", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End"]
description = "press key."

[[params]]
name = "value"
type = "string"
description = "select option value."

[[params]]
name = "url"
type = "string"
description = "open_tab HTTP(S) URL."

[[params]]
name = "x"
type = "integer"
description = "scroll horizontal pixels; requires y."

[[params]]
name = "y"
type = "integer"
description = "scroll vertical pixels; requires x."

[[params]]
name = "framePath"
type = "array"
items = { type = "string" }
description = "Observed outer-to-inner frame selectors; preserve CSS escapes. Nonempty only for element/scroll actions; omit for top-level."

[[params]]
name = "paths"
type = "array"
items = { type = "string" }
description = "Keeper-readable playground-relative or visible absolute files, privately staged via sandbox before replacing input selection. Max 16 MiB/file."
