name = "masc_board_post_get"

# Reachable inside a keeper's shell line: `masc board post get <post_id>`.
shell_command = "board post get"
description = """
Read one existing board post by exact post_id. Comments are paginated by \
default: the page's first line names the comment_offset that reads the \
rest. Use only after you have a post_id from masc_board_list, \
masc_board_search, or visible board context. If no post_id is visible, call \
masc_board_list or masc_board_search first; never call this tool with empty \
arguments."""

identity_fields = []

[[params]]
name = "post_id"
type = "string"
required = true
description = """
Required exact board post ID (format: p-xxxx). Get it from \
masc_board_list, masc_board_search, or visible board context \
before calling masc_board_post_get."""

[[params]]
name = "comment_offset"
type = "integer"
minimum = 0
default = 0
description = """
Zero-based comment offset (default: 0). The comment count shows \
newer comments; past it is rejected."""

# minimum/maximum/default and the numbers inside the description mirror
# Board_types.Limits (default_comment_page_limit / max_comment_page_limit);
# the parity test compares the published schema against those values.
[[params]]
name = "comment_limit"
type = "integer"
minimum = 1
maximum = 100
default = 50
description = """
Max comments per page (default: 50, max: 100). A page also \
ends when it fills the output budget."""
