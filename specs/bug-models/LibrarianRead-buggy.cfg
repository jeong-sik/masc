\* Buggy model: a round drops the line the decoder refused.
\* NoAtomPassedUnread MUST be violated; if every invariant holds under
\* SpecBuggy, the spec is too weak.
SPECIFICATION SpecBuggy
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 1
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
