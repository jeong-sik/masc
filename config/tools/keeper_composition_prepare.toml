name = "keeper_composition_prepare"
description = """
Validate and inspect a task-specific read-only composition without publishing a Skill. \
Use canonical tool names, explicit dependencies and tagged literal/output/object/array \
input templates. Select final fields with exports. Returns a durable draft reference \
bound to this Keeper, execution mode, inputs and frozen tool/Skill contracts; pass \
its sha256 to keeper_composition_run. No node executes during prepare. Choose async \
for a long independent read that should let the Keeper continue other work; it \
does not speed up the underlying read. Save a reusable procedure separately \
with keeper_skill_publish after checking the execution evidence."""
additional_properties = false
defer_loading = true

[[params]]
name = "execution"
type = "string"
enum = ["inline", "async"]
required = true
description = "Execution mode bound into the prepared draft."

[[params]]
name = "nodes"
type = "array"
items = { type = "object" }
min_items = 1
required = true
description = "The canonical structured plan request grammar supplies the exact node and tagged template schema."

[[params]]
name = "exports"
type = "array"
items = { type = "object" }
description = "Optional named node-output JSON pointers, checked against producer schemas."

[[params]]
name = "branch_failure_policy"
type = "string"
enum = ["fail_fast", "continue_independent"]
description = "Explicit failure policy; absent means fail_fast."
