name = "masc_browser_goto"
description = """
Navigate a tab of a server-owned browser (lane automation or stagehand) to HTTP(S); returns landing URL/title. Live navigation is refused; use BrowserInteract for live-tab actions."""
additional_properties = false

[[params]]
name = "url"
type = "string"
required = true
description = "HTTP(S) URL."

[[params]]
name = "lane"
type = "string"
enum = ["automation", "stagehand"]
description = "Optional advanced browser override. Omit only for initial discovery or opening a work browser; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "tabId"
type = "integer"
description = "BrowserTabs ID; default current tab."
minimum = 0
