name = "masc_keeper_msg"
description = """
Send a direct message to a keeper. Submits the message as an async chat \
operation and returns operation_id immediately; poll \
masc_keeper_delegate_status with target {kind: \"keeper\", name} and this \
operation_id to observe the turn settle."""
additional_properties = false

[[params]]
name = "name"
type = "string"
required = true
description = "Keeper handle to message"

[[params]]
name = "message"
type = "string"
required = true
description = "Message text to send to the keeper"
