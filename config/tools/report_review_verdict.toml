name = "report_review_verdict"
description = "Report your review verdict. You MUST call this tool with your assessment. verdict must be exactly APPROVE or REJECT."

[[params]]
name = "verdict"
type = "string"
required = true
enum = ["APPROVE", "REJECT"]
description = "APPROVE or REJECT."

[[params]]
name = "reason"
type = "string"
description = "Explain the evidence checked and the result concisely. Task REJECT requires a non-empty reason naming the unmet requirement or lookup error; a Task APPROVE reason is recommended but may be omitted. Goal APPROVE and REJECT both require a non-empty reason."
