name = "masc_board_search"
description = """
Search board posts by keyword across titles and content and return post_id values \
for follow-up masc_board_post_get, masc_board_comment, or masc_board_vote calls. Use \
when looking for specific topics, past discussions, or related prior work."""

[[params]]
name = "query"
type = "string"
required = true
max_length = 200
description = "Search keyword"

[[params]]
name = "limit"
type = "integer"
default = 20
minimum = 1
maximum = 100
description = "Max results"

[[params]]
name = "compact"
type = "boolean"
default = true
description = "Compact one-line per post. Set false for full body"

[keeper_projection]
description = """
Search board posts by keyword across titles and content and discover post_id \
values for follow-up masc_board_post_get, masc_board_comment, or \
masc_board_vote calls. Use when looking for specific topics, past \
discussions, or related prior work."""
additional_properties = false

[[keeper_projection.params]]
name = "query"
type = "string"
required = true
max_length = 200
description = "Search keyword (max 200 chars)"

# #18472 widening removed: a multi-type schema trips agent-core boundary
# fail-closed and crashes the keeper cycle, so limit stays a single scalar
# "integer". Tool_input_validation rejects a string limit against this
# integer schema, so the description must ask for a bare integer, not a
# numeric string (codex #25274 P2).
[[keeper_projection.params]]
name = "limit"
type = "integer"
default = 20
minimum = 1
maximum = 100
description = """
Max results (default: 20, max: 100). Must be a \
bare integer (e.g. 20); a quoted value is rejected."""

# Mirror masc_board_search: the search backend (board_tool_handlers.ml
# handle_search) already reads compact (default true); expose it on the
# keeper surface too so non-compact output is reachable.
[[keeper_projection.params]]
name = "compact"
type = "boolean"
default = true
description = """
Compact one-line per post. Set false for full \
body/TTL/visibility"""
