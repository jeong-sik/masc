name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14  # Apple Silicon
            arch: macos-arm64
            may-fail: true   # upstream opam macOS arm64 binary missing (#7475)

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.may-fail }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Check version truth
        run: |
          chmod +x scripts/check-version-truth.sh
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            scripts/check-version-truth.sh --tag "${GITHUB_REF_NAME}"
          else
            scripts/check-version-truth.sh
          fi

      - name: Setup OCaml
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # ripgrep 은 evidence 번들의 Grep 도구 시나리오가 요구한다.
          # Linux 는 별도 스텝에서 apt 로 넣는다.
          brew install flock gmp libpq openssl@3 zstd ripgrep

          libpq_prefix="$(brew --prefix libpq)"
          openssl_prefix="$(brew --prefix openssl@3)"

          {
            echo "$libpq_prefix/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"

          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"

      - name: Pin private dependencies
        run: |
          chmod +x scripts/opam-pin-external-deps.sh
          # --with-bisect 는 --with-test 와 짝이다. bisect_ppx 의 opam 제약이
          # ocaml < 5.0 이라, pin 없이 테스트 의존성을 풀면 solver 가
          # OCaml 5.5.0 아래에서 해를 못 찾는다.
          scripts/opam-pin-external-deps.sh --with-compact-protocol --with-bisect

      - name: Refresh apt index
        if: runner.os == 'Linux'
        run: bash scripts/ci/apt-refresh.sh

      # release-evidence.sh 의 도구 표면 시나리오가 Grep 도구를 통해 rg 를
      # 호출한다. ci.yml 은 잡마다 설치하지만 release.yml 에는 없었고,
      # 러너 이미지에 rg 가 없으면 "rg executable not found" 로 번들이 깨진다.
      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq ripgrep

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            opam install . --deps-only --with-test -y && break
            if [ "$attempt" -eq 3 ]; then
              echo "opam install failed after ${attempt} attempts"
              exit 1
            fi
            echo "opam install failed (attempt ${attempt}); retrying in 15s..."
            sleep 15
          done

      # Bake SQLite into the release binaries instead of requiring
      # libsqlite3.so.0 at runtime. libsqlite3-dev ships the static archive
      # libsqlite3.a; removing the shared linker symlink makes the linker
      # resolve -lsqlite3 to that archive. Without this a bare Ubuntu cannot
      # start v0.27.0 until `apt-get install libsqlite3-0` is run first.
      - name: Prefer static SQLite (self-contained Linux binary)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq libsqlite3-dev
          sudo rm -f /usr/lib/*/libsqlite3.so /usr/lib/libsqlite3.so

      - name: Build
        run: |
          opam exec -- dune build --release \
            bin/main_eio.exe \
            bin/masc_tui.exe \
            bin/deployment_preflight_helper.exe

      # Evidence-only branch: preserve the successfully built TUI before
      # unrelated release packaging or installer diagnostics can fail.
      - name: Upload macOS TUI evidence immediately
        uses: actions/upload-artifact@v7
        with:
          name: masc-tui-evidence-${{ matrix.arch }}
          path: _build/default/bin/masc_tui.exe

      # Prove the self-contained claim: neither shipped binary may keep a
      # dynamic libsqlite3 dependency, or a bare Linux install breaks again.
      - name: Assert Linux binaries carry no dynamic SQLite
        if: runner.os == 'Linux'
        run: |
          for exe in main_eio masc_tui; do
            if ldd "_build/default/bin/$exe.exe" 2>/dev/null | grep -qi sqlite; then
              echo "$exe.exe still dynamically links sqlite3:"
              ldd "_build/default/bin/$exe.exe" | grep -i sqlite
              exit 1
            fi
          done
          echo "server and TUI binaries carry no dynamic sqlite dependency"

      # The Build step above compiles only the OCaml binaries. The server reads
      # the dashboard SPA from assets/dashboard/ at runtime, so without this the
      # freshly built server answers /dashboard with 503 and quickstart-smoke
      # fails on the required Linux platforms -- which is why the v0.26.0 and
      # v0.27.0 release builds failed at this step. Mirror ci.yml's dashboard
      # toolchain (node 22 + pnpm 10.31.0).
      - name: Set up Node for dashboard assets
        if: runner.os != 'macOS'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build dashboard assets
        if: runner.os != 'macOS'
        run: |
          corepack enable && corepack prepare pnpm@10.31.0 --activate
          (cd dashboard && pnpm install --frozen-lockfile)
          scripts/build-dashboard-if-needed.sh --force

      - name: Source quickstart onboarding smoke
        if: runner.os != 'macOS'
        run: scripts/quickstart-smoke.sh

      - name: Release binary smoke (boot + README drift)
        if: runner.os != 'macOS'
        run: |
          chmod +x scripts/release-binary-smoke.sh
          scripts/release-binary-smoke.sh _build/default/bin/main_eio.exe

      # masc-tui refuses to start without an interactive TTY, so a runner
      # cannot boot it the way the server binary is booted above. --help
      # returns before that check, which is enough to prove the shipped file
      # loads its dynamic libraries -- the one thing that differs between this
      # runner and the machine that downloads the asset. Rendering is covered
      # by test/test_tui_keyboard_input.py in CI, over a real PTY.
      - name: Terminal UI binary smoke (dynamic link)
        if: runner.os != 'macOS'
        run: |
          _build/default/bin/masc_tui.exe --help < /dev/null > /tmp/masc-tui-help.txt
          grep -q -- '--base-path' /tmp/masc-tui-help.txt

      - name: Generate release evidence bundle
        if: runner.os != 'macOS'
        run: |
          chmod +x scripts/release-evidence.sh
          mkdir -p dist
          scripts/release-evidence.sh \
            _build/default/bin/main_eio.exe \
            dist/release-evidence-${{ matrix.arch }}.md

      - name: Package binary
        if: runner.os != 'macOS'
        run: |
          mkdir -p dist
          cp _build/default/bin/main_eio.exe dist/masc-${{ matrix.arch }}
          cp _build/default/bin/masc_tui.exe dist/masc-tui-${{ matrix.arch }}
          cp _build/default/bin/deployment_preflight_helper.exe \
            dist/masc-deployment-preflight-helper-${{ matrix.arch }}
          cp scripts/check-runtime-deployment-preflight.sh \
            dist/masc-check-runtime-deployment-preflight-${{ matrix.arch }}
          chmod +x dist/masc-${{ matrix.arch }}
          chmod +x dist/masc-tui-${{ matrix.arch }}
          chmod +x \
            dist/masc-deployment-preflight-helper-${{ matrix.arch }} \
            dist/masc-check-runtime-deployment-preflight-${{ matrix.arch }}

      # Exercise scripts/install.sh end to end against the just-packaged
      # binaries: stage dist/ as a file:// release, install through the real
      # installer (detect_asset + SHA256SUMS verification + placement), boot
      # the installed server, and assert /health. This guards the installer's
      # asset-name and checksum contract -- the download path that nothing
      # else runs -- without any network access.
      - name: Installer smoke (offline)
        if: runner.os != 'macOS'
        run: |
          chmod +x scripts/install-smoke.sh
          scripts/install-smoke.sh dist ${{ matrix.arch }}

      - name: Upload artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: masc-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    steps:
      - name: Checkout repo for config seed hashes
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify advertised release assets
        run: |
          for arch in macos-arm64 linux-x64 linux-arm64; do
            for asset in \
              "masc-$arch" \
              "masc-tui-$arch" \
              "masc-deployment-preflight-helper-$arch" \
              "masc-check-runtime-deployment-preflight-$arch"; do
              if [ ! -f "dist/$asset" ]; then
                echo "required release asset missing: $asset"
                exit 1
              fi
            done
          done

      - name: Generate release checksums
        run: |
          cd dist
          artifact_count="$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l | tr -d ' ')"
          if [ "$artifact_count" -eq 0 ]; then
            echo "no release artifacts found in dist"
            exit 1
          fi
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          (cd ../config && sha256sum runtime.toml) >> SHA256SUMS
          (cd ../config && sha256sum agent-core-models-overlay.toml) >> SHA256SUMS
          # Team preset files, keyed by their repo-relative path so
          # `install.sh --team` can verify each seeded file (presets/<name>/...).
          (cd .. && for m in presets/*/manifest.txt; do
             [ -f "$m" ] || continue
             d="$(dirname "$m")"
             while IFS= read -r rel; do
               case "$rel" in ''|'#'*) continue ;; esac
               sha256sum "$d/$rel"
             done < "$m"
           done) >> SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
