name = "masc_msx_peek"
description = """
Read memory bytes and refresh the snapshot for masc_msx_ram_diff.

Read-only. Address is hex, 0000..FFFF, with or without a 0x prefix (e000, 0xE000); digits alone are hex too, so 4096 is 0x4096. Returns the address as four hex digits and the bytes as hex pairs."""
additional_properties = false

defer_loading = true

[[params]]
name = "address"
type = "string"
required = true
description = "Logical address to read from, hex 0000..FFFF, with or without 0x (\"e000\", \"0xE000\"). Digits alone are hex too: \"4096\" is 0x4096."

[[params]]
name = "length"
type = "integer"
description = "Bytes to read, 1..256. Default 16."
minimum = 1
maximum = 256
default = 16
