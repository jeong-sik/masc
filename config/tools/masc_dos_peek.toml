name = "masc_dos_peek"
description = """
Read the DOS machine's memory.

Physical addresses, 0x00000-0xFFFFF: the text page is at 0xB8000 (two bytes a \
cell, character then attribute), the BIOS data area at 0x00400, a loaded \
program's PSP in the observation's psp. Returns hex pairs. Read-only."""
additional_properties = false

defer_loading = true

[[params]]
name = "address"
type = "string"
required = true
description = "Physical address in hex, e.g. \"b8000\" or \"0xB8000\"."

[[params]]
name = "length"
type = "integer"
description = "Bytes to read. Default 16."
minimum = 1
maximum = 256
default = 16
