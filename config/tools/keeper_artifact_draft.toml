name = "keeper_artifact_draft"
defer_loading = true
description = """
Read and edit a shared artifact source together with dashboard editors. Open an
artifact revision to obtain its bound target, then select UTF-16 source indices
and copy the returned selection unchanged into edit with the exact expected
text and replacement. Other edits move relative positions; changed selected
text is refused. Read current source after a refused or uncertain write before
retrying. No CRDT state/base64 is exposed. Your actual Keeper turn owns the
visible editing position; leave or turn completion removes it. This changes
the shared draft; publishing a document revision is a separate operation.
For comments and proposals use discuss with target and request. Copy next_request_id
from the previous result into request.id once per new operation; reuse it only to
reconcile that exact operation. request.command.kind is comment/reply/resolve/
reopen/accept/reject. A comment binds position and exact quote from the shared
source, body is your comment, and optional proposal is replacement source text.
Accept applies a pending proposal only if the original quoted text still matches."""
additional_properties = false

[[params]]
name = "action"
type = "string"
enum = ["open", "read", "select", "resolve", "edit", "leave", "discuss"]
required = true

[[params]]
name = "artifact_id"
type = "string"
description = "open: existing published artifact id."
[[params]]
name = "revision"
type = "integer"
minimum = 1
description = "open: published revision used only when creating the shared draft."

[[params]]
name = "target"
type = "object"
additional_properties = false
description = "read/select/leave: exact target returned by open."
[[params.params]]
name = "artifact_id"
type = "string"
required = true
[[params.params]]
name = "generation"
type = "string"
required = true

[[params]]
name = "anchor"
type = "integer"
minimum = 0
description = "select: UTF-16 source index."
[[params]]
name = "head"
type = "integer"
minimum = 0
description = "select: UTF-16 source index."

[[params]]
name = "selection"
type = "object"
additional_properties = false
description = "resolve/edit: exact selection object returned by select."
[[params.params]]
name = "target"
type = "object"
required = true
additional_properties = false
[[params.params.params]]
name = "artifact_id"
type = "string"
required = true
[[params.params.params]]
name = "generation"
type = "string"
required = true
[[params.params]]
name = "position"
type = "object"
required = true
additional_properties = false
[[params.params.params]]
name = "anchor"
type = "array"
required = true
[params.params.params.items]
type = "integer"
minimum = 0
maximum = 255
[[params.params.params]]
name = "head"
type = "array"
required = true
[params.params.params.items]
type = "integer"
minimum = 0
maximum = 255

[[params]]
name = "expected"
type = "string"
description = "edit: exact text previously read in the selected range."
[[params]]
name = "replacement"
type = "string"
description = "edit: replacement source text."

[[params]]
name = "request"
type = "object"
additional_properties = false
description = "discuss: stable operation id plus a typed discussion command. Use next_request_id from the last result."
[[params.params]]
name = "id"
type = "string"
required = true
[[params.params]]
name = "command"
type = "object"
required = true
additional_properties = false
[[params.params.params]]
name = "kind"
type = "string"
enum = ["comment", "reply", "resolve", "reopen", "accept", "reject"]
required = true
[[params.params.params]]
name = "thread_id"
type = "string"
description = "All except comment: exact thread id from the result."
[[params.params.params]]
name = "body"
type = "string"
description = "comment/reply: nonblank message."
[[params.params.params]]
name = "quote"
type = "string"
description = "comment: exact selected source text."
[[params.params.params]]
name = "proposal"
type = "string"
description = "comment: optional replacement source. Empty string proposes deletion; omit for a comment without a proposal."
[[params.params.params]]
name = "position"
type = "object"
additional_properties = false
[[params.params.params.params]]
name = "anchor"
type = "array"
required = true
[params.params.params.params.items]
type = "integer"
minimum = 0
maximum = 255
[[params.params.params.params]]
name = "head"
type = "array"
required = true
[params.params.params.params.items]
type = "integer"
minimum = 0
maximum = 255

[[one_of]]
description = "Open a publication revision. Action-specific fields are validated by the producer."
required = ["artifact_id", "revision"]
forbidden = ["target", "selection", "anchor", "head", "expected", "replacement"]
[[one_of]]
description = "Read, select, leave, or discuss the exact shared draft target."
required = ["target"]
forbidden = ["artifact_id", "revision", "selection", "expected", "replacement"]
[[one_of]]
description = "Resolve or edit a previously selected source range."
required = ["selection"]
forbidden = ["artifact_id", "revision", "target", "anchor", "head"]
