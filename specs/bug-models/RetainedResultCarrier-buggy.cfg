\* Buggy model: a size refusal shrinks history alone, as before the RFC
\* (masc#49634: 248 receipts, the floor refused, the Keeper fenced).
\* Expected: NoLockWhileFloorFits VIOLATED once seven receipts ride inline
\* with fixed = 40, where the address floor (55) would fit.
SPECIFICATION SpecBuggy

CONSTANTS
    Window       = 100
    FixedSizes   = {40, 98}
    ReceiptBytes = 10
    AddressBytes = 15
    MaxReceipts  = 8
    HistoryBytes = 64

INVARIANTS
    TypeOK
    NoLockWhileFloorFits

CHECK_DEADLOCK FALSE
