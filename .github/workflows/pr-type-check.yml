name: PR type-check (dune build @check)

# Why this exists: no workflow that runs on `pull_request` executed
# `dune build @check`. On 2026-11-03 three PRs merged with a green PR-stage
# check (changelog format only) and each then broke main's type-check:
# #47672 (e745acf9), #47639 (4845937b), #47661 (804372bf).
#
# 2026-11-10: the `paths:` filter moved from the workflow trigger into a
# `changes` job. A workflow-level filter produced no check context at all
# for PRs outside the filter (observed: #51107, changelog+toml only, no
# type-check check-run), and that absence is exactly what kept this check
# from being made required — a required check that never appears blocks
# those PRs forever. #50746 merged two minutes after its type-check went
# red because nothing required the result (10:45:48Z failure, 10:48:19Z
# merge). Operator decision (ask aske1aa44782fd05693, choice c1,
# 2026-11-10): adopt in two stages — first give every PR a check context
# (this change), verify the skip path, then require the check in the
# branch ruleset.
#
# The filter is deliberately fail-closed (review P2-1 on #51155): the file
# list is read under `set -e`, so a failed fetch or diff fails this job red
# instead of producing an empty list that would read as "no sources" and
# skip the check. The list comes from git, not the REST listing, so it has
# no 3000-file cap and spends none of the Actions token's API budget.
#
# Stage-2 pairing: when this workflow's checks become required, `changes`
# must be required together with `type-check`. GitHub counts a skipped
# conclusion as satisfying a required check, so a red `changes` (the file
# listing failed) is what blocks the merge that a skipped `type-check`
# alone would still allow. Requiring only `type-check` would reopen the
# unchecked merge this PR exists to close.
on:
  # workflow_dispatch lets a maintainer re-check a branch on demand, and is the
  # only way to time this job without opening a throwaway source change.
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

# Supersede an older run of the same PR. A PR-stage check has no receipt to
# protect, so cancelling a stale head is safe and keeps the queue short.
concurrency:
  group: pr-type-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      # No checkout and no REST call. The file list is the difference between
      # the pull request's merge commit and its first parent (the base branch,
      # lower stack layers included), read with a blobless two-commit fetch:
      # about one second and one megabyte. A native stack is checked once, at
      # its top pull request: a lower layer answers false without reading a
      # diff, and the top reads the difference from the stack's base, one more
      # commit to fetch (scripts/ci/pr_source_changes.py; RFC
      # stack-type-check-runs-at-the-top). The REST listing this replaced
      # spent the Actions token's hourly budget on every push, and when that
      # budget ran out this required check went red on pull requests whose
      # code was fine (nine open pull requests on 2026-11-12T01:34Z).
      - name: Match PR files against source patterns
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # GitHub adds `stack` to the pull_request payload of a native
          # stack member, and its documentation does not list the fields. The
          # decision script reads number, position, size and base.sha from
          # it; a stack of any other shape is decided as if there were none.
          # The action and base.sha are logged only.
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_JSON: ${{ toJSON(github.event.pull_request.stack) }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'payload action: %s\n' "${EVENT_ACTION:-none}"
          printf 'payload base.sha: %s\n' "${BASE_SHA:-none}"
          printf 'payload stack: %s\n' "${STACK_JSON:-none}"
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "workflow_dispatch — no PR to filter, running the check"
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: a fetch, a diff or the decision script that fails
          # stops this script under set -e, so this job goes red rather than
          # skipping the type-check.
          work="$RUNNER_TEMP/pr-changes"
          git init -q "$work"
          git -C "$work" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # The environment carries the token to every git call below, the
          # decision script's included, and keeps it out of argument lists.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git -C "$work" fetch -q --depth=2 --filter=blob:none origin "$GITHUB_SHA"
          # The decision lives in a script so that it has tests
          # (scripts/ci/test_pr_source_changes.py). It is read from the merge
          # commit, as this workflow file is; the filtered fetch made origin a
          # promisor remote, so git fetches this one file's contents here.
          decide="$RUNNER_TEMP/pr_source_changes.py"
          git -C "$work" show "$GITHUB_SHA:scripts/ci/pr_source_changes.py" > "$decide"
          src="$(python3 -I "$decide" --git-dir "$work" --remote origin --merge "$GITHUB_SHA")"
          case "$src" in
            true|false) ;;
            *) echo "unexpected answer from the decision script: $src" >&2; exit 1 ;;
          esac
          echo "src=$src" >> "$GITHUB_OUTPUT"

  type-check:
    needs: [changes]
    # Skipped here rather than at the workflow level so the check context
    # always exists; a skipped conclusion satisfies a required status check —
    # which is exactly why `changes` must be required alongside this job
    # (see the header note): a red `changes` blocks the merge that a
    # skipped type-check alone would not.
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DUNE_JOBS: '4'
      # `enabled-except-user-rules` stored nothing, so every run compiled
      # from scratch (issue #51365).
      DUNE_CACHE: enabled
      # @check links nothing and runs nothing it builds, and no build rule
      # calls protoc (proto/dune), so a switch restored from the cache needs
      # no system package. Without "skip", opam fetched conf-protoc's two apt
      # packages on every run and every PR's type-check failed for as long
      # as the apt mirror did not answer (issue #51372). The pin step and the
      # install step both read this (scripts/ci/opam-system-packages.sh).
      MASC_SYSTEM_PACKAGES_ON_RESTORED_SWITCH: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests of the script that decided to run this job. They run here
      # because this is the one pull request job with a checkout; the script
      # counts itself and these tests as sources, so a change to either
      # starts this job. About six seconds, before the toolchain is set up.
      - name: Test the type-check decision script
        run: python3 -I scripts/ci/test_pr_source_changes.py

      # The path and the key prefix are the ones main-minimal-build.yml
      # saves under; a different path would never match its cache entry.
      - name: Dune build cache location
        id: dune-cache
        shell: bash
        run: |
          echo "DUNE_CACHE_ROOT=$RUNNER_TEMP/masc-dune-cache" >> "$GITHUB_ENV"
          echo "prefix=main-dune-v2-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ocaml-toolchain
      - uses: ./.github/actions/pin-ocaml-deps
      # Test libraries must resolve: @check compiles the test tree.
      - uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test

      # Restore only. A pull request cannot read another pull request's
      # cache, and an entry is about 1.1 GB, so saving one per run would push
      # the toolchain caches out of the 10 GB repository limit. The newest
      # entry saved by the scheduled main build is used; modules that changed
      # since then are compiled again.
      - name: Reuse Dune build artifacts from main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/masc-dune-cache
          key: ${{ steps.dune-cache.outputs.prefix }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            ${{ steps.dune-cache.outputs.prefix }}-

      - name: Type-check the tree (dune build @check)
        run: opam exec -- dune build --root . @check
