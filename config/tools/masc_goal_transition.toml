name = "masc_goal_transition"
description = """
Apply an explicit Goal lifecycle transition (RFC-0387 stage 2 gate).

\
request_complete no longer completes the Goal directly: it moves executing -> \
verifying and persists a durable proof request. Verifier verdicts are \
application-owned typed commits and are deliberately not accepted by this MCP \
tool. A Goal whose criterion was judged unreachable is refused on \
request_complete."""
additional_properties = false

# Held back from the request until the model asks for it by name. Not
# called once on 2026-08-29 or 2026-08-30 across the fleet.
defer_loading = true

[[params]]
name = "goal_id"
type = "string"
required = true

# The enum mirrors Goal_phase.Public_action.all, which deliberately excludes
# the verifier verdict actions; test_enum_mirror_sync compares the published
# values against the variant.
[[params]]
name = "action"
type = "string"
required = true
enum = ["request_complete", "drop", "reopen"]

[[params]]
name = "note"
type = "string"
