# Adjust manifest_path when copying this declaration outside this directory.
# Bind the author output in runtime.toml before the first compose
# ([runtime.addon_exact_lanes.operator-quiz.author]), and the grade output
# ([runtime.addon_exact_lanes.operator-quiz.grade]) so written answers are graded.
id = "operator-quiz"
operator_authority = true
run_id = "operator-study"
manifest_path = "../../../addons/operator-quiz/lane.toml"

[binding]
language = "ko"
timezone = "Asia/Seoul"
# To ask only about records a lesson cited, remove this line and uncomment
# since and the source below. The operator-lesson installation must be in the
# same run, both declarations must give the same records the same source_id,
# and since is the lesson declaration's since.
sources = []
# since = 1794441600
#
# [[binding.sources]]
# source_id = "lesson"
# kind = "lane_output"
# installation_id = "operator-lesson"
# output_id = "scenes"
# selection = "latest_completed"

[[binding.records]]
source_id = "board"
kind = "board"
visibilities = ["public", "unlisted"]

[[binding.records]]
source_id = "masc-repo"
kind = "repository"
repository_id = "masc"
paths = ["changelog.d/"]

# More records the quiz can cite (docs/guides/operator-quiz.md):
#
# [[binding.records]]
# source_id = "wiki"
# kind = "wiki"
#
# A github_pulls read waits until [repositories] pr_reader can read GitHub,
# and the session waits with it.
# [[binding.records]]
# source_id = "masc-prs"
# kind = "github_pulls"
# repository_id = "masc"
