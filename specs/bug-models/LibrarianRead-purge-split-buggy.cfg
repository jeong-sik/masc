\* Buggy model: the turn-boundary file is deleted and the read position that
\* counted its lines is kept, which the purge plan does not allow.
\* NoAtomPassedUnread MUST be violated; if every invariant holds under
\* SpecPurgeSplit, the two files may be purged apart after all.
\*
\* scripts/tla-check.sh runs only <spec>-buggy.cfg, so until masc#37033 this
\* one runs from specs/Makefile (make check-buggy) and from a line that names it there.
SPECIFICATION SpecPurgeSplit
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
