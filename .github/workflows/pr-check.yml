name: Minimal manual checks

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  syntax:
    name: Source and config syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Validate concrete source and configuration syntax
        run: |
          git diff --check origin/main...HEAD
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('docs/constitution.xml')"
          bash scripts/lint/yaml-syntax.sh
          bash scripts/check-toml-syntax.sh
      - name: Scan committed credentials
        run: python3 scripts/ci/check-committed-secrets.py
