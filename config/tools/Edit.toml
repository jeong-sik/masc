name = "Edit"
description = """
Patch an existing file by replacing an exact string. Read the file \
first and copy old_string verbatim from its current bytes, including \
leading whitespace, indentation, and newlines; the match is exact and \
byte-sensitive. On 'old_string not found', re-Read the file to get the \
current text instead of retrying the same string."""

[[params]]
name = "file_path"
type = "string"
required = true
description = "Absolute or sandbox-relative file path to edit. The file must exist."

[[params]]
name = "old_string"
type = "string"
required = true
description = "Exact substring to replace. Must occur exactly once unless replace_all=true."

[[params]]
name = "new_string"
type = "string"
required = true
description = "Replacement substring. Pass an empty string to delete old_string."

[[params]]
name = "replace_all"
type = "boolean"
description = "Default false. When true, replaces every occurrence of old_string."
