\* The same property as LibrarianRead-stop-forever-buggy.cfg with MaxBad = 0:
\* no line is ever unreadable. It holds, which puts that stop where it belongs
\* -- on the unreadable line, not on anything else the reader does. masc#37061.
SPECIFICATION SpecLive
CONSTANTS
    MaxTurns = 2
    MaxSaves = 1
    MaxClears = 0
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
PROPERTY EveryReachableAtomEventuallyRead
