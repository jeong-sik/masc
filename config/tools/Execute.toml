name = "Execute"
description = """
Run one command inside the Keeper sandbox. Give exactly one of argv or \
command: argv is one non-empty argv process vector run without a shell, tokens \
verbatim, and command is one line handed to a real shell. cwd is a relative \
path inside the path jail, and MASC never interprets program or subcommand \
meaning. A call runs to completion or stops at timeout_sec, and a sleep loop holds \
the turn for the whole wait. With run_in_background true the call returns a \
request_id at once and the result arrives later as a tool-result receipt \
that wakes the Keeper; a server restart ends the run and the receipt says \
so. A GitHub Actions run, or every check of a commit, is waited for with \
masc_schedule_create until_github_run or until_github_checks, which wakes the \
Keeper when it ends. intent is one \
of auto (the default) or \
request_effect. In auto mode an observation-only run returns its \
actual exit status and output, including failed writes; auto never authorizes \
an effect. Use intent=request_effect when the command needs \
persistent writes or network effects: the configured Gate decides permission \
before effect execution. A nonzero exit alone is not a permission request. \
A completed tool call means the command ran: read ok and status for its result. \
For checks, prefer argv so the checked program supplies the exit status. \
Shell pipelines normally report the last stage; use bash with -o pipefail \
when an earlier stage's failure must survive a pipe to tail or tee. \
Do not repeat a write just because its output was truncated."""
additional_properties = false

[[params]]
name = "argv"
type = "array"
items = { type = "string" }
min_items = 1
description = "Direct process vector: executable and arguments passed verbatim without a shell."

[[params]]
name = "command"
type = "string"
min_length = 1
description = "Shell command line run by a shell. Use for pipes, redirections, and chained commands."

[[params]]
name = "shell"
type = "string"
enum = ["sh", "bash", "zsh", "dash", "ksh"]
default = "sh"
description = "Which shell runs command. Defaults to sh."

[[params]]
name = "cwd"
type = "string"
role = "path"
description = "Working directory for the command relative to workspace root. Defaults to '.'."

[[params]]
name = "timeout_sec"
type = "number"
exclusive_minimum = 0.0
description = "Subprocess timeout in seconds. Defaults to 600."

[[one_of]]
required = ["argv"]
forbidden = ["command"]
description = "Direct form with argv."

[[one_of]]
required = ["command"]
forbidden = ["argv"]
description = "Shell form with command."

[[params]]
name = "intent"
type = "string"
enum = ["auto", "request_effect"]
default = "auto"
description = "auto permits restricted execution as configured; request_effect asks the existing Gate for effect authorization, never grants permission by itself."

[[params]]
name = "run_in_background"
type = "boolean"
default = false
description = "true returns a request_id at once and runs the command on the server until it exits or reaches timeout_sec. Defaults to false."
