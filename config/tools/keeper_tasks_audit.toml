name = "keeper_tasks_audit"
description = """
Find tasks whose exact assignee identity is absent from active membership.

Returns the task status and assignee. This audit is read-only: it never releases or reassigns tasks."""

defer_loading = true

[[params]]
name = "limit"
type = "integer"
description = "Max orphans to return (default: 20)"
minimum = 1
maximum = 50
default = 20
