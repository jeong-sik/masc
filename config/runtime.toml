# MASC runtime seed.
#
# This file is copied into <base-path>/.masc/config/runtime.toml for new
# workspaces. Existing live config roots are preserved and must be edited
# explicitly through the dashboard/runtime config path.
#
# Local Gemma 4 QAT is a canary runtime, not the fleet default. Keep the
# default on the cloud runtime and pin only one keeper to local Ollama until
# sustained turns prove the local box can absorb more load. AGENT_CORE handles Gemma 4
# thinking through the chat-template control token path, not Ollama think:true.

[memory]
# Ordinary current working-set targets, including custom categories.
# Initial rollout: Librarian consolidation guidance and context-status reporting.
# Existing facts are preserved when targets are exceeded. Counts, not tokens.
category_cap = 30
facts_per_category_cap = 30

[wiki_contents]
# Each Keeper turn carries the wiki table of contents: one line per wiki page
# (title, file, summary), built from the pages at the start of the turn.
# false stops listing the wiki and drops the paragraph from every turn.
enabled = true

[maintenance]
# Day-file retention for the JSONL stores under .masc, shared by the startup
# prune and the periodic maintenance prune. Must be a positive integer.
# Precedence is MASC_JSONL_RETENTION_DAYS, then this key, then 30.
jsonl_retention_days = 30

[transport]
# Restart-scoped H2 listener resources. Both H2-only and Auto use these.
# Stream count is per connection; pending payload bytes are shared by all H2
# connections of one listener, including streaming queues. These do not limit
# process RSS, serialization temporaries, cache/source values or protocol frames.
# Slow consumers within capacity retain whole responses without an idle timeout.
h2_max_concurrent_streams = 100
h2_max_pending_response_bytes = 67108864
# h2 flow-control window each stream starts with, in bytes (RFC 9113 §6.9.2).
# The default is the h2 library's 2^27; request bodies are received against
# this credit. Change it only with a measurement.
h2_initial_window_size = 134217728
# HTTPS listener: TLS 1.3 with ALPN h2 and http/1.1 on one
# port. 0 turns the listener off. Without tls_cert_file and tls_key_file the
# server serves a self-signed pair from <base-path>/.masc/tls/ and makes a new
# one within 30 days of its expiry. Set both file keys or neither.
https_port = 8938
# tls_cert_file = "/path/to/server.crt"
# tls_key_file = "/path/to/server.key"

[skills]
# The Skill resource read bound is not configured here: it is the shared
# inline tool-result boundary (Common.max_tool_result_wire_bytes). An older
# runtime.toml that still sets resource-read-max-bytes logs a WARN and the
# key is ignored; the next version refuses it (#39284).

# Skill sources are searched in this declared order. The runtime has no hidden
# source roots; existing workspaces must add the sources they want explicitly.
[[skills.sources]]
id = "project-masc"
anchor = "base-path"
path = ".masc/skills"
access = "read-write"

[[skills.sources]]
id = "project-agents"
anchor = "base-path"
path = ".agents/skills"
access = "read-write"

[[skills.sources]]
id = "user-masc"
anchor = "user-home"
path = ".masc/skills"
access = "read-write"

[[skills.sources]]
id = "user-agents"
anchor = "user-home"
path = ".agents/skills"
access = "read-write"

[runtime]
# Fleet default keeper runtime. Moved deepseek-v4-flash -> glm-5.3-flash on the
# same ollama_cloud wire (no new credential): GLM-5.3-Flash is the newest flash
# coding model (Z.AI 2026-08-14, /api/show 2026-08-29), 1M context, tools+vision.
default = "ollama_cloud.ollama-cloud-glm-5-3-flash"
# Vision runtimes. When no runtime in a keeper's lane can take an
# image, the eager read and analyze_image read it with these, in order. They
# never take the keeper's turn. gemma4-31b (Gemma 4,
# strong OCR/vision) is a cloud runtime fast enough to be usable; a local 27B
# measured 5+ min per read under load, so it is deliberately not here.
# gemma4-31b declares image input and an explicit image payload limit below.
media_failover = ["ollama_cloud.ollama-cloud-gemma4-31b"]
# Anti-rationalization/completion-authority work uses a typed verdict tool call.
# Keep normal keeper turns on the fleet default flash runtime; reserve Pro for
# this explicit smart lane. The judgement call resolves the verifier_exact
# exact-output lane below — [runtime] carries no scalar
# binding for it.

# TypeSafe AI (System One Jev) opt-in integration: configure under [typesafeai]
# with destinations (endpoint, model, api_key_env) and per-gate flags.
# See docs/ for full [typesafeai] schema and privacy boundaries.

# Optional exact-output lane knobs: max_output_tokens (positive int), thinking (bool).
[runtime.exact_output_lanes.librarian_exact]
slots = ["glm-coding.glm-5-3", "ollama_cloud.ollama-cloud-deepseek-v4-1-flash"]
max_output_tokens = 8192

[runtime.exact_output_lanes.librarian_memory]
slots = ["glm-coding.glm-5-3", "ollama_cloud.ollama-cloud-deepseek-v4-1-flash"]
max_output_tokens = 8192

[runtime.exact_output_lanes.hitl_auto_judge]
slots = ["glm-coding.glm-5-3", "ollama_cloud.ollama-cloud-deepseek-v4-1-flash"]
max_output_tokens = 8192

[runtime.exact_output_lanes.board_attention_exact]
slots = ["glm-coding.glm-5-3", "ollama_cloud.ollama-cloud-deepseek-v4-1-flash"]
max_output_tokens = 8192

[runtime.exact_output_lanes.verifier_exact]
slots = ["glm-coding.glm-5-3", "ollama_cloud.ollama-cloud-deepseek-v4-1-flash"]
max_output_tokens = 8192

# SSH remote execution endpoint registry: configure under [exec.ssh.endpoints.<name>]
# (see docs/operations/ssh-endpoints-runbook.md).

# Ollama Cloud rows carry `reasoning-uncontrolled = true` (or explicit `reasoning-effort`).
[providers.ollama_cloud]
display-name = "Ollama Cloud"
protocol = "openai-compatible-http"
endpoint = "https://ollama.com/v1"
# Budget for the connection, the request and the first response headers, on
# every call to this provider, streaming or not. Ollama Cloud serving
# reasoning models (kimi-k2.7-code, minimax-m3) holds the first response
# header through cold start, admission queueing and long reasoning prefill;
# a 60 s budget once cut two of the Fusion panel's three models there (only
# deepseek-v4-pro answered within it). A streaming call runs this phase under
# the shorter of this budget and the first-event budget, a non-streaming
# call under the shorter of this budget and its body deadline. There is no
# default: omit it and no connect budget applies. Key spelling is mirrored by
# `Runtime_schema.connect_timeout_s_key`.
connect-timeout-s = 600.0
# `exact-body-timeout-s` is a positive finite float in seconds: the total
# HTTP request deadline for Exact-output lanes -- connection, response
# headers and the full response body. It does not change connect-timeout-s
# or ordinary Keeper per-call deadlines, and no value is inferred from the
# connect deadline. Every HTTP provider an Exact-output lane names must
# declare it: connect-timeout-s ends at the response headers and does not
# bound the body. Without this key such a slot is left out of its lane at
# boot and named in the startup report, and a save that adds one is refused,
# naming lane, slot and provider (#38779).
# Boot and every save through the server apply it to the AGENT_CORE targets
# derived from these bindings. The deployment operator owns the value in the
# resolved runtime.toml's [providers.<id>] table. A save rebuilds the Exact
# registry with the write, and its response says what happened under
# application.exact_output_registry: "applied" (rebuilt now), "unpublished"
# (no registry is running; the next boot publishes one), or "kept" (neither the
# saved text nor the file it replaced rebuilds one; the old registry keeps
# serving, and the next boot will not publish one until the file is fixed).
# Each visited Exact candidate retains its own deadline. Their HTTP wait can
# accumulate across sequential candidates; this is not a deadline for the
# whole Librarian pass, its CLI tail, or Memory processing.
# AGENT_CORE_MODEL_CATALOG replacements keep their own target body_timeout_s;
# this key does not set an official-client CLI timeout.
# 1200 s is the operator's chosen value; it matches the glm-coding
# connect-timeout-s below, which was sized from measured exact-output calls.
exact-body-timeout-s = 1200.0
[providers.ollama_cloud.healthcheck]
path = "/models"

[providers.ollama_cloud.credentials]
type = "env"
key = "OLLAMA_CLOUD_API_KEY"

# Usage windows for the operator view, read at server start with no model
# call, then again refresh-s seconds after each read. GET /api/balance
# (docs.ollama.com/api/balance) states legacy session/weekly windows or a
# credit plan's included allowance, plus the purchased Credit balance.
[providers.ollama_cloud.usage-read]
shape = "ollama-balance"
url = "https://ollama.com/api/balance"
refresh-s = 600.0

[providers.deepseek]
display-name = "DeepSeek API"
protocol = "openai-compatible-http"
endpoint = "https://api.deepseek.com"
# Setup can point the exact-output lanes at this provider. Without this key
# such a slot is left out at boot and reported, and a save adding one is
# refused (#38779).
# 1200 s is the value ollama_cloud and glm-coding use for their exact slots;
# see the ollama_cloud comment for what it bounds.
exact-body-timeout-s = 1200.0

[providers.deepseek.healthcheck]
path = "/models"

[providers.deepseek.credentials]
type = "env"
key = "DEEPSEEK_API_KEY"

[providers.glm-coding]
display-name = "GLM Coding Plan"
protocol = "openai-compatible-http"
endpoint = "https://api.z.ai/api/coding/paas/v4"
# Exact-output lanes lead with this provider. connect-timeout-s bounds only
# the phase before the response headers; a provider that sends headers and
# then holds the body open is bounded by exact-body-timeout-s below, not by
# this key -- measured at up to 13.3h on wkbl's curator lane without it
# (#36979). The value keeps headroom over the slowest healthy exact-output
# call observed on this endpoint (973s, wkbl 2026-09-13~16); narrow it per
# deployment.
connect-timeout-s = 1200.0
# 1200 s is the operator's chosen value for the whole Exact-output request;
# it matches the measured connect-timeout-s above. See the ollama_cloud
# comment for what the key bounds.
exact-body-timeout-s = 1200.0
# Judgment requests (verifier, board attention, hitl auto judge) take a freed
# admission permit ahead of Keeper turns, at most 3 in a row while a Keeper
# waits. Librarian memory work uses Background: at most 3 combined judgment
# and Keeper grants pass its oldest waiter. The limit orders the bindings
# below that declare max-concurrent.
admission-priority-run-limit = 3

[providers.glm-coding.healthcheck]
path = "/models"

[providers.glm-coding.credentials]
type = "env"
key = "ZAI_API_KEY"

# Usage windows for the operator view, read at server start with no model
# call, then again refresh-s seconds after each read. Undocumented
# endpoint; Z.AI's own coding plugin calls it.
[providers.glm-coding.usage-read]
shape = "zai-quota-limit"
url = "https://api.z.ai/api/monitor/usage/quota/limit"
refresh-s = 600.0

[providers.kimi_coding]
display-name = "Kimi For Coding Subscription"
protocol = "openai-compatible-http"
endpoint = "https://api.kimi.com/coding/v1"
# Setup can point the exact-output lanes at this provider. Without this key
# such a slot is left out at boot and reported, and a save adding one is
# refused (#38779).
# 1200 s is the value ollama_cloud and glm-coding use for their exact slots;
# see the ollama_cloud comment for what it bounds.
exact-body-timeout-s = 1200.0

[providers.kimi_coding.credentials]
type = "env"
key = "KIMI_API_KEY"

# Usage windows for the operator view, read at server start with no model
# call, then again refresh-s seconds after each read. Undocumented
# endpoint; Kimi's own CLI calls it.
[providers.kimi_coding.usage-read]
shape = "kimi-coding-usages"
url = "https://api.kimi.com/coding/v1/usages"
refresh-s = 600.0

[providers.kimi_coding_anthropic]
display-name = "Kimi For Coding (Anthropic Messages)"
protocol = "messages-http"
endpoint = "https://api.kimi.com/coding"
exact-body-timeout-s = 1200.0

[providers.kimi_coding_anthropic.credentials]
type = "env"
key = "KIMI_API_KEY"

[providers.kimi_coding_anthropic.usage-read]
shape = "kimi-coding-usages"
url = "https://api.kimi.com/coding/v1/usages"
refresh-s = 600.0

[providers.ollama]
display-name = "Local Ollama"
protocol = "ollama-http"
endpoint = "http://127.0.0.1:11434"
# Setup can point the exact-output lanes at this provider. Without this key
# such a slot is left out at boot and reported, and a save adding one is
# refused (#38779).
# 1200 s is the value ollama_cloud and glm-coding use for their exact slots;
# see the ollama_cloud comment for what it bounds.
exact-body-timeout-s = 1200.0

[providers.ollama.healthcheck]
path = "/api/tags"

