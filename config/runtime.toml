# MASC runtime seed.
#
# This file is copied into <base-path>/.masc/config/runtime.toml for new
# workspaces. Existing live config roots are preserved and must be edited
# explicitly through the dashboard/runtime config path.
#
# Local Gemma 4 QAT is a canary runtime, not the fleet default. Keep the
# default on the cloud runtime and pin only one keeper to local Ollama until
# sustained turns prove the local box can absorb more load. AGENT_CORE handles Gemma 4
# thinking through the chat-template control token path, not Ollama think:true.

[skills]
# keeper_skill returns raw resource bytes on the provider wire and carries
# reference/digest evidence as metadata, so this explicit bound aligns with the
# shared 64 KiB inline tool-result boundary without JSON-envelope expansion.
resource-read-max-bytes = 65536

# Skill sources are searched in this declared order. The runtime has no hidden
# source roots; existing workspaces must add the sources they want explicitly.
[[skills.sources]]
id = "project-masc"
anchor = "base-path"
path = ".masc/skills"
access = "read-write"

[[skills.sources]]
id = "project-agents"
anchor = "base-path"
path = ".agents/skills"
access = "read-write"

[[skills.sources]]
id = "user-masc"
anchor = "user-home"
path = ".masc/skills"
access = "read-write"

[[skills.sources]]
id = "user-agents"
anchor = "user-home"
path = ".agents/skills"
access = "read-write"

[runtime]
# Fleet default keeper runtime. Moved deepseek-v4-flash -> glm-5.3-flash on the
# same ollama_cloud wire (no new credential): GLM-5.3-Flash is the newest flash
# coding model (Z.AI 2026-08-14, /api/show 2026-08-29), 1M context, tools+vision.
default = "ollama_cloud.ollama-cloud-glm-5-3-flash"
# Vision read fleet (RFC-0414). When no runtime in a keeper's lane can take an
# image, the eager read and analyze_image read it with these, in order. They
# never take the keeper's turn. gemma4-31b (Gemma 4,
# strong OCR/vision) is a cloud runtime fast enough to be usable; a local 27B
# measured 5+ min per read under load, so it is deliberately not here.
# gemma4-31b declares image input and an explicit image payload limit below.
media_failover = ["ollama_cloud.ollama-cloud-gemma4-31b"]
# Anti-rationalization/completion-authority work uses a typed verdict tool call.
# Keep normal keeper turns on the fleet default flash runtime; reserve Pro for
# this explicit smart lane. The judgement call resolves the verifier_exact
# exact-output lane below (RFC-0361 D7(a)) — [runtime] carries no scalar
# binding for it.

# TypeSafe AI (System One Jev) Opt-in Integration
# Calibrated probabilistic decisions for the board_attention_exact lane and
# the librarian absorb gate (RFC-librarian-absorb-gate).
# A non-blank TYPESAFEAI_API_KEY in the environment (the one secret) turns it
# on. Everything else about the lane is the [typesafeai] table (sample at the
# end of this block; absent means the defaults shown there; a misspelt key is
# a load error): enabled = false turns the lane off even with a key and cannot
# turn it on without one; endpoint and model choose the route;
# board_attention is this gate; absorb_gate is the librarian absorb gate
# (off unless true); excluded_keepers names keepers that neither gate ever
# asks the vendor about, so their posts, context and memories never leave
# the machine (a name that is no keeper is reported at boot).
# When enabled, MASC POSTs the TYPESAFEAI_API_KEY as an Authorization bearer
# credential to the configured TypeSafe AI endpoint. The JSON body's top-level
# fields are model, state, and questions. state.items[0] contains candidate_id;
# signal fields kind, post_id, author, title, content, hearth, updated_at,
# reaction (target_type, target_id, user_id, emoji, reacted) and optional vote
# (target_kind, target_id, target_author, voter, direction); post fields id,
# author, title, body, post_kind, visibility, created_at, updated_at, expires_at,
# votes_up, votes_down, reply_count, pinned, and optional hearth, thread_id,
# origin, classification_reason, arbitrary meta; and every comment's id,
# post_id, parent_id, author, content, created_at, expires_at, votes_up,
# votes_down.
# state.keeper_context sends lane_keeper_name, keeper_record_id,
# keeper_runtime_uid, the Keeper's full instructions, current_task_id, and
# mention_keeper_ids. questions.relevance sends type=choice, the Keeper-naming
# instructions, and relevant/not_relevant criteria descriptions.
# When on, board attention asks Jev first. A relevant answer is kept; a
# not-relevant answer or a failed call is judged again by the
# board_attention_exact slots below. So only a relevant answer saves an
# LLM call, and every other candidate waits for Jev and then the LLM.
#
# [typesafeai]
# enabled = true
# endpoint = "https://api.typesafe.ai/v1/systemone"
# model = "jev-latest"
# board_attention = true
# absorb_gate = false
# excluded_keepers = []

[runtime.exact_output_lanes.librarian_exact]
slots = ["glm-coding.glm-5-3", "ollama_cloud.deepseek-v4-flash"]

[runtime.exact_output_lanes.hitl_auto_judge]
slots = ["glm-coding.glm-5-3", "ollama_cloud.deepseek-v4-flash"]

[runtime.exact_output_lanes.board_attention_exact]
slots = ["glm-coding.glm-5-3", "ollama_cloud.deepseek-v4-flash"]

[runtime.exact_output_lanes.verifier_exact]
slots = ["glm-coding.glm-5-3", "ollama_cloud.ollama-cloud-deepseek-v4-flash"]

# SSH remote execution endpoint registry (Phase 1 SSH lane, spec §4.2 in
# docs/superpowers/specs/2026-08-27-openssh-microvm-exec-design.md).
# A keeper opts in with sandbox_profile = "remote_ssh" + remote_endpoint =
# "<name>" in its keeper TOML; the name must resolve to one of these tables
# (unknown names are config-load errors, and unknown keys inside a table fail
# the load — the registry is fail-closed). No live endpoint ships in the seed;
# provision one with docs/operations/ssh-endpoints-runbook.md, then uncomment.
#
# [exec.ssh.endpoints.dev]
# host = "builder.local"              # required — remote host
# user = "masc-exec"                  # required — remote unix user
# remote_root = "/srv/masc/playground"  # required — remote playground root
# port = 22                           # ssh port (default 22)
# # Dedicated key — a path *reference*; key material lives at 0600 under
# # <base>/.masc/ssh/ (config/identity/ conventions). Defaults resolve
# # base-relative with the endpoint name substituted:
# #   identity_file    = ".masc/ssh/<name>.key"
# #   known_hosts_file = ".masc/ssh/known_hosts.d/<name>"  (pinned; public)
# connect_timeout_sec = 10            # -> ssh ConnectTimeout (default 10)
# max_concurrent_sessions = 8         # ControlMaster multiplex ceiling;
#                                     # sshd MaxSessions defaults to 10, so
#                                     # the ceiling must be explicit (default 8)
# env_allowlist = []                  # request env names allowed to cross the
#                                     # wire (default [] — no host secrets cross)
# capabilities = []                   # reserved Phase 2 markers: "kvm",
#                                     # "firecracker"; unknown values warn-and-ignore

# Every model row bound here carries `reasoning-uncontrolled = true`.
# ollama.com /v1 turns reasoning on when a request carries no control, so a
# reasoning-capable row that declares neither an effort nor this key is
# refused before dispatch (#36412). These rows sent no control before that
# refusal existed and their answers were the provider's own default; the key
# says that on purpose rather than picking an effort none of them was probed
# with. A row that should run at a named depth declares `reasoning-effort`
# instead -- the two together are refused when runtime.toml is read.
[providers.ollama_cloud]
display-name = "Ollama Cloud"
protocol = "openai-compatible-http"
endpoint = "https://ollama.com/v1"
# Budget for the connection, the request and the first response headers, on
# every call to this provider, streaming or not. Ollama Cloud serving
# reasoning models (kimi-k2.7-code, minimax-m3) holds the first response
# header through cold start, admission queueing and long reasoning prefill;
# a 60 s budget once cut two of the Fusion panel's three models there (only
# deepseek-v4-pro answered within it). A streaming call runs this phase under
# the shorter of this budget and the first-event budget, a non-streaming
# call under the shorter of this budget and its body deadline. There is no
# default: omit it and no connect budget applies. Key spelling is mirrored by
# `Runtime_schema.connect_timeout_s_key`.
connect-timeout-s = 600.0
# Providers may separately declare `exact-body-timeout-s` as a positive finite
# float in seconds. This is the caller-owned total HTTP request deadline for
# Exact-output lanes: connection, response headers and the full response body.
# It does not change connect-timeout-s or ordinary Keeper per-call deadlines.
# Omission remains None; no value is inferred from the connect deadline. A
# connect-only declaration still leaves an Exact response body unbounded.
# Bootstrap applies it to AGENT_CORE targets derived from these bindings.
# The deployment operator owns the value in the resolved runtime.toml's
# [providers.<id>] table. Saving that file does not rebuild existing Exact
# targets: the value takes effect when server bootstrap rebuilds the registry.
# This seed intentionally supplies no numeric body deadline.
# Each visited Exact candidate retains its own deadline. Their HTTP wait can
# accumulate across sequential candidates; this is not a deadline for the
# whole Librarian pass, its CLI tail, or Memory processing.
# AGENT_CORE_MODEL_CATALOG replacements keep their own target body_timeout_s;
# this key does not set an official-client CLI timeout.

[providers.ollama_cloud.healthcheck]
path = "/models"

[providers.ollama_cloud.credentials]
type = "env"
key = "OLLAMA_CLOUD_API_KEY"

[providers.deepseek]
display-name = "DeepSeek API"
protocol = "openai-compatible-http"
endpoint = "https://api.deepseek.com"

[providers.deepseek.healthcheck]
path = "/models"

[providers.deepseek.credentials]
type = "env"
key = "DEEPSEEK_API_KEY"

[providers.glm-coding]
display-name = "GLM Coding Plan"
protocol = "openai-compatible-http"
endpoint = "https://api.z.ai/api/coding/paas/v4"
# Exact-output lanes lead with this provider, and a plan whose wire carries
# no connect and no body budget is now rejected at admission (Missing_deadline,
# #36979): with both absent the measurement transport arms no deadline and a
# provider that holds the connection open hangs the request for the life of
# the connection — measured at up to 13.3h on wkbl's curator lane. The value
# keeps headroom over the slowest healthy exact-output call observed on this
# endpoint (973s, wkbl 2026-09-13~16); narrow it per deployment.
connect-timeout-s = 1200.0

[providers.glm-coding.healthcheck]
path = "/models"

[providers.glm-coding.credentials]
type = "env"
key = "ZAI_API_KEY"

[providers.kimi_coding]
display-name = "Kimi For Coding Subscription"
protocol = "openai-compatible-http"
endpoint = "https://api.kimi.com/coding/v1"

[providers.kimi_coding.credentials]
type = "env"
key = "KIMI_API_KEY"

[providers.ollama]
display-name = "Local Ollama"
protocol = "ollama-http"
endpoint = "http://localhost:11434"

[providers.ollama.healthcheck]
path = "/api/tags"

# ── Self-hosted OpenAI-compatible servers ───────────────────────────────────
# llama.cpp, vLLM and MLX all speak /v1/chat/completions, so they need no new
# protocol — only an honest capability row each, because the three disagree on
# exactly the features a keeper turn depends on.
#
# All three ship commented out, for the same reason the official-client examples
# below do: none of these servers exists on a fresh install. `enabled = false`
# is not an option here — the setup wizard walks every declared provider and
# refuses one whose bindings are all disabled ("has no concrete runtime
# binding"). Uncomment a stack once its server is up, point `endpoint` at it,
# and set `api-name` to whatever it reports at /v1/models. The
# self-hosted-server-templates gate in test_runtime_config_validity uncomments
# this block on every run, so these rows are parsed even while they sit here.
#
# llama.cpp llama-server. Probed 2026-08-29 against build 10180 (Homebrew)
# serving Qwen3.6-35B-A3B-UD-Q4_K_XL:
#
#   tools                        two calls in one turn (Seoul + Tokyo)
#   tool_choice {name}           honoured
#   tool_choice "required"       NOT honoured — answered in prose, no call.
#                                Qwen3.8-27B on the same server does honour it
#                                (measured 2026-08-30), so this one is the
#                                model's chat template, not llama.cpp's.
#   response_format json_schema  honoured exactly: asked for verdict+score,
#                                got {"verdict":"Excellent","score":5}
#   reasoning_content            populated under --reasoning-format deepseek
#   chat_template_kwargs         {"enable_thinking":false} left reasoning empty
#   seed 7 twice                 same answer both times, with top_k and min_p
#   image_url                    HTTP 500 "image input is not supported" —
#                                needs --mmproj, so this row keeps it off
#
# --jinja is on by default in this build, so tool calling needs no extra flag.
# The structured-output result is the interesting one: llama.cpp constrains
# generation with a real grammar, which ollama.com's cloud wire does not.
# [providers.llama_server]
# display-name = "llama.cpp llama-server"
# protocol = "openai-compatible-http"
# endpoint = "http://127.0.0.1:8080/v1"
#
# [providers.llama_server.healthcheck]
# path = "/models"
#
# vLLM. Declared from the official docs, not probed — vLLM does not run on
# Apple silicon, so nothing here was measured on this machine.
#
#   tool_choice                  auto | none | required | named function.
#                                "auto" needs --enable-auto-tool-choice and
#                                --tool-call-parser; "required" and named both
#                                go through the structured-outputs backend
#                                (docs.vllm.ai/en/latest/features/tool_calling/)
#   parallel tool calls          parser- and model-dependent, so this row
#                                leaves it off rather than claim it
#   reasoning                    field is `reasoning` — renamed from
#                                `reasoning_content` — behind --reasoning-parser
#                                (docs.vllm.ai/.../features/reasoning_outputs/)
#   thinking control             chat_template_kwargs {"enable_thinking": bool}
#                                or reasoning_effort low|medium|high|none
#   structured output            response_format json_schema; the guided_* body
#                                fields were removed in v0.12.0
#
# The overlay's runpod_mtp row serves vLLM too and its reasoning-streaming
# declaration still names the older field, `reasoning_content`. Check the
# version actually being served before copying either value.
# [providers.vllm]
# display-name = "vLLM OpenAI Server"
# protocol = "openai-compatible-http"
# endpoint = "http://127.0.0.1:8000/v1"
#
# [providers.vllm.healthcheck]
# path = "/models"
#
# MLX (mlx_lm.server). Declared from the upstream server docs, not probed.
# Its profile is the narrowest of the three and the reason these cannot share
# one row: the server accepts tools, seed, top_k, min_p and repetition_penalty,
# and detects reasoning between the tokenizer's think tokens — but it supports
# neither `tool_choice` nor response_format JSON-schema validation. Both stay
# false so the exact-output lanes never pick it as a judge.
#
# Upstream default is 127.0.0.1:8080, which collides with llama-server's
# default; the port here is moved so both templates can be enabled at once.
# [providers.mlx_server]
# display-name = "MLX mlx_lm.server"
# protocol = "openai-compatible-http"
# endpoint = "http://127.0.0.1:8081/v1"
#
# [providers.mlx_server.healthcheck]
# path = "/models"
#
# One row per stack, matching the three disabled providers above. api-name is
# what the server answers to at /v1/models: llama-server reports its --alias,
# vLLM and MLX report the model path they were started with. Change it to yours
# before enabling — a mismatched name reaches the wire verbatim.
#
# The build measured 2026-08-29. max-context is what llama-server was started
# with (-c); it is a launch flag, not a property of the weights, so raise or
# lower this row to match the server rather than the model card.
# [models.llama-server-local]
# api-name = "qwen3.6-35b-a3b"
# max-context = 262144
# tools-support = true
# thinking-support = true
# streaming = true
#
# [models.llama-server-local.capabilities]
# supports-tool-choice = true
# supports-named-tool-choice = true
# Measured false for this model: with tool_choice "required" it answered in
# prose. Re-measure after changing the served weights — Qwen3.8-27B honours the
# same request on the same build, so the value belongs to the model.
# supports-required-tool-choice = false
# supports-parallel-tool-calls = true
# thinking-control-format = "chat-template-kwargs"
# reasoning-streaming-format = "delta:reasoning_content"
# supports-response-format-json = true
# supports-structured-output = true
# Turn these on together with --mmproj on the server, not before.
# supports-image-input = false
# supports-multimodal-inputs = false
# supports-system-prompt = true
# supports-seed = true
# supports-top-k = true
# supports-min-p = true
#
# [llama_server.llama-server-local]
# max-concurrent = 1
#
# vLLM serves one model per process, so api-name is the --model it was started
# with. Parallel tool calls stay off because vLLM's own docs make them parser-
# and model-dependent rather than a property of the server.
# [models.vllm-served-model]
# api-name = "Qwen/Qwen3.6-35B-A3B"
# max-context = 262144
# tools-support = true
# thinking-support = true
# streaming = true
#
# [models.vllm-served-model.capabilities]
# supports-tool-choice = true
# supports-named-tool-choice = true
# supports-required-tool-choice = true
# supports-parallel-tool-calls = false
# thinking-control-format = "chat-template-kwargs"
# Current vLLM renamed this field to `reasoning`; older builds still send
# `reasoning_content`. Match the version actually being served.
# reasoning-streaming-format = "delta:reasoning"
# supports-response-format-json = true
# supports-structured-output = true
# supports-image-input = false
# supports-multimodal-inputs = false
# supports-system-prompt = true
# supports-seed = true
# supports-top-k = true
# supports-min-p = true
#
# [vllm.vllm-served-model]
# max-concurrent = 1
#
# MLX. thinking-support is off because the server has no request-side control
# over it — it only splits out whatever the tokenizer's think tokens produced —
# and a runtime that declares thinking makes the seed request enable_thinking,
# which this wire cannot encode.
# [models.mlx-served-model]
# api-name = "mlx-community/Qwen3.8-27B-4bit"
# max-context = 262144
# tools-support = true
# thinking-support = false
# streaming = true
#
# [models.mlx-served-model.capabilities]
# The server takes no tool_choice, so it cannot be forced onto a tool, and it
# validates no JSON schema. Both stay false to keep it out of exact-output lanes.
# supports-tool-choice = false
# supports-named-tool-choice = false
# supports-required-tool-choice = false
# supports-parallel-tool-calls = false
# thinking-control-format = "none"
# supports-response-format-json = false
# supports-structured-output = false
# supports-image-input = false
# supports-multimodal-inputs = false
# supports-system-prompt = true
# supports-seed = true
# supports-top-k = true
# supports-min-p = true
#
# [mlx_server.mlx-served-model]
# max-concurrent = 1

# ── Official client runtimes ──────────────────────────────────────────────────
# Claude Code, Codex and Antigravity are catalog entries like every provider
# above. A declaration says what the runtime is; it does not say the CLI is
# installed or logged in. Whether a keeper or a lane uses one is assignment
# ([runtime], a keeper's TOML, an exact-output slot list), and whether it can
# run is what `masc doctor` and a dispatch refusal report. Each CLI owns its
# stored login or supported API/token environment; MASC preserves declared
# client authentication and isolates unrelated settings.
#
# The interactive wizard lists every enabled binding. For scripted --provider
# selection with multiple models, set wizard-default on the binding to use.
[providers.claude_code]
display-name = "Claude Code"
protocol = "claude-code"
command = "claude"
is-non-interactive = true

# max-prompt-bytes: the history MASC seeds the client's first turn with. The
# client owns its own context window and refuses an oversized seed in a typed
# terminal; without this ceiling a keeper learned 524288 from that refusal one
# 29-minute attempt at a time (2026-08-24).
[models.claude-code-sonnet]
api-name = "claude-sonnet-5"
max-context = 1000000
max-prompt-bytes = 524288
tools-support = true
streaming = true

# Claude Code carries images over the stream-json content-block array, and Codex
# over its turn/start input list, so a model that reads them says so here. Both
# halves are required: without this key the turn's images are read by the
# analyze_image sub-call instead, which costs a provider round-trip and leaves
# later questions about the same image unanswerable.
[models.claude-code-sonnet.capabilities]
supports-image-input = true

# Two claude_code bindings ship, so scripted `--provider claude_code` needs one
# named as the wizard's pick; the interactive wizard still lists both.
[claude_code.claude-code-sonnet]
wizard-default = true

# Thinking depth on an official client is a model-level `reasoning-effort`, not
# a capability: the CLI owns the wire, so MASC selects a level rather than
# encoding a control. One model row per level is the whole mechanism — bind
# claude-opus-5 three times at low/high/max and assign keepers to the level the
# work deserves. Claude Code rejects "none" and "minimal"; Codex takes both.
[models.claude-code-opus-high]
api-name = "claude-opus-5"
max-context = 1000000
max-prompt-bytes = 524288
tools-support = true
streaming = true
reasoning-effort = "high"
turn-timeout-s = 600.0

[claude_code.claude-code-opus-high]

# Codex reads images from its turn/start input list, so the image capability
# key means the same thing here as it does above.
[providers.codex_subscription]
display-name = "Codex ChatGPT Subscription"
protocol = "codex-app-server"
command = "codex"
is-non-interactive = true

[models.codex-gpt-5-6]
api-name = "gpt-5.6-sol"
max-context = 272000
tools-support = true
streaming = true
reasoning-effort = "low"

[codex_subscription.codex-gpt-5-6]

# Antigravity is the one official client that needs a credentials table, and it
# is a file reference rather than an environment variable: the CLI writes an
# OAuth token to disk and MASC points at it. `timeout-s` is required on the
# provider — the CLI gives no progress signal to time a turn against, so the
# bound has to be declared rather than inferred.
[providers.antigravity_subscription]
display-name = "Antigravity Google Subscription"
protocol = "antigravity-cli"
command = "agy"
is-non-interactive = true
timeout-s = 180.0

# A leading "~/" is expanded to the home directory when runtime.toml is read,
# so this one path serves every workspace on the machine. The CLI writes its
# token here by default.
[providers.antigravity_subscription.credentials]
type = "file"
path = "~/.gemini/antigravity-cli/antigravity-oauth-token"

# The effort level is part of the model name on this CLI, not a separate knob:
# `agy --model gemini-3.7-flash-high` is one model to Antigravity. Probed
# 2026-08-29, all answering in 7-9s: gemini-3.7-flash-high, gemini-3.6-flash-high,
# gemini-3.1-pro-high, claude-opus-4-6-thinking, claude-sonnet-4-6.
[models.antigravity-gemini-3-7-flash-high]
api-name = "gemini-3.7-flash-high"
max-context = 1000000
# Last prompt size proven end to end with agy 1.2.6 on 2026-09-18. Long-lived
# Keepers later reached 21-48 MB and failed before their first turn (#37123).
# This conservative ceiling is a measured success point, not the CLI maximum
# or a tokenizer estimate; raise it only after a larger end-to-end probe.
max-prompt-bytes = 2078915
tools-support = true
streaming = true

[antigravity_subscription.antigravity-gemini-3-7-flash-high]

[models.deepseek-v4-pro]
api-name = "deepseek-v4-pro"
max-context = 1000000
tools-support = true
thinking-support = true
streaming = true

[models.deepseek-v4-pro.capabilities]
max-output-tokens = 384000
# DeepSeek Chat Completions toggles thinking.type; reasoning_effort is a
# separate effort control (https://api-docs.deepseek.com/guides/thinking_mode/).
thinking-control-format = "thinking-object"

[models.deepseek-v4-flash]
reasoning-uncontrolled = true
# Context comes from each provider's AGENT_CORE catalog binding.
api-name = "deepseek-v4-flash"
tools-support = true
thinking-support = true
streaming = true

[models.deepseek-v4-flash.capabilities]
max-output-tokens = 384000
thinking-control-format = "none"
# ollama.com /v1 streams the reasoning delta under "reasoning" (probe, #26788).
# thinking-control-format above is the request axis only; without this line the
# response axis resolves to reading no field and the reasoning is discarded.
reasoning-streaming-format = "delta:reasoning"
supports-image-input = false
supports-multimodal-inputs = false

[models.gemma4-26b-a4b-qat]
api-name = "hf.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL"
max-context = 262144
tools-support = true
# AGENT_CORE maps this to Gemma 4's <|think|> chat-template token and omits the
# generic Ollama top-level think field for this model family.
thinking-support = true
preserve-thinking = false
streaming = true

[models.gemma4-26b-a4b-qat.capabilities]
# This runtime rides AGENT_CORE native Ollama /api/chat, which does not serialize
