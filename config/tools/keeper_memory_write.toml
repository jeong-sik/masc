name = "keeper_memory_write"
description = """
Record a durable claim that later turns read back. Your context resets \
between turns, so a conclusion you leave only in this turn's reasoning is \
gone. Task sequencing and operating constraints belong to their typed domain \
stores, not memory prose. The runtime records explicit typed provenance and \
returns validation or persistence failures directly. When source_path is set, \
the claim is recalled only while the exact source bytes still match."""
additional_properties = false

[[params]]
name = "title"
type = "string"
description = "Short hook (≤120 chars). Optional; may be empty."

[[params]]
name = "content"
type = "string"
required = true
description = """
Body. Required, must be non-empty. For decisions, lead with the decision \
then **Why** and **How to apply** lines."""

[[params]]
name = "source_path"
type = "string"
description = "Optional keeper-visible regular file that makes this claim source-bound."

[help]
short_description = "Persist a durable keeper memory claim."
when_to_use = "Use when something from this turn must outlive it: every write is a durable claim later turns read back."
key_constraints = [
  "There is no kind argument; sending one is rejected.",
  "Do not use for transient scratch notes.",
  "A source-bound claim is discarded when its source bytes change or become unreadable.",
]
details_markdown = "Writes a bounded durable claim into the Memory OS fact store. Add source_path for claims that must be revalidated from a file before later recall."
examples = ["title='region' content='The deployment region is eu-west-1.' source_path='config/deploy.env'"]
