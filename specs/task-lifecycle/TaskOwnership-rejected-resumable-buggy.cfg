\* Expects a violation. Reaching the Rejected state is not enough: somebody has
\* to be able to take the Task afterwards, or the state is a graveyard. Adding
\* ~returned[t] to Claim makes this cfg go quiet while every other cfg stays
\* green, which is how that mutation passed before this file existed.

SPECIFICATION SpecClean

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

PROPERTIES
    RejectedNeverResumed

CHECK_DEADLOCK
    FALSE
