\* Expects a violation, which is what -buggy means to both harnesses:
\* scripts/tla-check.sh calls it through run_tlc_buggy and specs/Makefile
\* globs *-buggy*.cfg into BUGGY_CFGS. There is no bug model here. The spec is
\* clean and the cfg names the thing that must not hold, so a quiet run means
\* the clean model stopped reaching a returned Task and the two Rejected
\* invariants went back to checking nothing.

SPECIFICATION SpecClean

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    RejectedNeverHappens

CHECK_DEADLOCK
    FALSE
