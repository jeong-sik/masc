name = "masc_browser_tabs"
description = """
Discover a browser implementing optional requiredActions without opening one. For assigned Task work, start with BrowserTabs {} (omit mode, lane and clientId): automatic initial discovery consults the current Task's Goal binding when present. Retain the returned browserSelection.lane and clientId on subsequent calls, and preserve browserGoal when returned. Use mode=connections alone for global connection diagnostics; it lists observed live clients across visible browser workers without selecting the current Task's Goal. Never choose the first listed client as a substitute for Task-aware discovery. This metadata-only mode reports inventoryIssues/inventoryComplete and never reads Pages or creates a session. Incomplete observations refuse automatic selection. An intentional advanced lane/clientId override selects that browser instead of consulting the Task's Goal. Without mode, the receipt includes browserCapabilities, with implemented operations and invocation tools; a conditional operation lists its constraints only when it is in requiredActions. List {clientId,transport,tabs:[{id,active,title,url}]} and live index. Carry clientId/tabId into reads/actions. Ego inventory never waits for Page.info and reports dialogObservation=unobserved; this is not proof that no alert or prompt is open. Request native dialog metadata separately with BrowserRead mode=dialog and the same explicit clientId/tabId; unavailable dialog metadata does not invalidate the tab inventory. Ambiguous or stale live selection returns clients without dispatch: choose an intended explicit override before retrying; do not select an arbitrary client."""
additional_properties = false

[[params]]
name = "mode"
type = "string"
enum = ["connections"]
description = "Global read-only connection diagnostics, not current Task browser selection. Supply mode=connections alone, without lane, clientId, tabId or requiredActions. For assigned Task discovery use BrowserTabs {} instead; retain its browserSelection and browserGoal when returned."

[[params]]
name = "lane"
type = "string"
enum = ["live"]
description = "Optional advanced browser override. Omit only for initial discovery; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "clientId"
type = "string"
description = "Retain the observed live clientId on every subsequent tab read/action; stale IDs fail."

[[params]]
name = "requiredActions"
type = "array"
items = { type = "string", enum = ["list_tabs", "open_tab", "close_tab", "activate_tab", "list_windows", "create_window", "close_window", "navigate", "follow_link", "back", "forward", "reload", "stop_loading", "read_text", "read_html", "read_elements", "read_scene", "read_regions", "read_snapshot", "screenshot", "native_workflow", "click_snapshot_target", "fill_snapshot_target", "hover_snapshot_target", "double_click_snapshot_target", "click", "double_click", "right_click", "middle_click", "pointer_down", "pointer_up", "hover", "pointer_drag", "html5_drop", "scroll_page", "scroll_at", "fill", "type_text", "press_key", "key_chord", "select_option", "read_frames", "frame_interaction", "read_dialog", "accept_dialog", "dismiss_dialog", "hand_off", "take_over", "space_status", "finish_space", "wait_for_control", "adopt_tab", "release_tab", "upload_file", "list_downloads", "page_zoom", "resize_viewport", "touch", "read_clipboard", "write_clipboard", "emulate_environment", "intercept_network", "read_storage", "read_network", "read_console", "write_storage"] }
description = "Optional public operations needed by the task, only for initial discovery. Automatic choice requires one browser implementing all operations; impossible combinations fail before any browser command. Explicit browser owners never change. The browserCapabilities rows of these operations list their constraints. Retain browserSelection for later calls."
