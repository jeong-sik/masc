<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASC 초대</title>
<style nonce="c5d45c65cc6285a24d626f33a734bab8c2dccd3a240d66267e1db60ced81e8f5">/* The one style sheet of the pages the account server writes itself. A page
   sends it inline under the nonce of its policy and uses no style attribute,
   which a nonce does not cover. The colours follow the Dashboard's brass
   skin; the muted text and the field border are lighter than the Dashboard's
   so that text holds 4.5:1 and a field border 3:1 on the surfaces used here. */
:root {
  color-scheme: dark;
  --bg-deep: #08090d;
  --bg-panel: #0f1015;
  --bg-card: #1b1c25;
  --bg-field: #12131a;
  --line: #282a36;
  --line-field: #6b6f86;
  --text-bright: #f4ead4;
  --text: #d8c9ad;
  --text-muted: #a89c86;
  --accent: #e0b057;
  --accent-strong: #f0c570;
  --accent-ink: #1a1405;
  --warn-line: #c2a04a;
  --info-line: #46c6f0;
  --radius-m: 6px;
  --radius-l: 10px;
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-deep);
  color: var(--text);
  font: 1rem/1.6 var(--font);
  /* Korean breaks between words, and a long token still breaks. */
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-text-size-adjust: 100%;
}

/* The frame: every page starts with the same line that names the place. */
.site-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-panel);
}
.brand { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; }
.brand-sub { color: var(--text-muted); }

main { width: 100%; max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }

/* A page of one decision: sign in, take an invitation, read how a sign-in
   ended. Its card sits a little below the top on a tall window and near the
   top on a short one. */
.narrow { max-width: 440px; margin-inline: auto; padding-top: clamp(24px, 8vh, 96px); }
.card {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  background: var(--bg-card);
}
.hint { color: var(--text-muted); font-size: 0.875rem; }
.center { text-align: center; }
.notes { padding-left: 20px; color: var(--text-muted); font-size: 0.875rem; }
.callout {
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--warn-line);
  border-radius: var(--radius-m);
  background: var(--bg-panel);
}

/* One gap between the parts of a page. Both rules weigh nothing, so the
   second one wins by its place and any rule below can change a margin. */
:where(h1, h2, p, ul, pre) { margin: 0; }
:where(main, section, div) > * + * { margin-top: 16px; }

h1 { font-size: 1.5rem; line-height: 1.3; color: var(--text-bright); }
h2 { font-size: 1.125rem; line-height: 1.4; color: var(--text-bright); }
a { color: var(--accent-strong); text-underline-offset: 3px; }
a.button { color: var(--text-bright); }
:focus-visible { outline: 2px solid var(--info-line); outline-offset: 2px; }

section {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  background: var(--bg-card);
}

/* A label holds its field. Without a track size the column grows to the
   widest field and a narrow window scrolls sideways. */
label {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 6px;
  color: var(--text-bright);
  font-size: 0.875rem;
  font-weight: 600;
}

input, select, textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--line-field);
  border-radius: var(--radius-m);
  background: var(--bg-field);
  color: var(--text-bright);
  font: inherit;
  font-weight: 400;
}
textarea { min-height: 88px; resize: vertical; font-family: var(--mono); }

button, a.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line-field);
  border-radius: var(--radius-m);
  background: transparent;
  color: var(--text-bright);
  font: inherit;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
button:hover, a.button:hover { border-color: var(--text-bright); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary, a.button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
button.primary:hover, a.button.primary:hover { border-color: var(--accent-strong); background: var(--accent-strong); }
.block { width: 100%; }

/* What a route or a login tool answered. An empty one stays in the page with
   no height, so a screen reader hears it when it fills. */
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--text);
  font: 0.8125rem/1.6 var(--mono);
}
pre:not(:empty) {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  background: var(--bg-panel);
}
pre:empty { margin-top: 0; }
</style>
</head>
<body>
<header class="site-header"><span class="brand">MASC</span><span class="brand-sub">계정</span></header>
<main>
<div class="narrow">
<div class="card">
<h1 id="title">초대를 받았어요</h1>
<p id="note">GitHub 계정으로 로그인하면 초대를 수락하고 이 서버를 쓸 수 있어요.</p>
<div id="accept">
<form method="post" action="/auth/github/start">
<input type="hidden" id="invite" name="invite">
<input type="hidden" name="return_to" value="/">
<button id="go" class="primary block">GitHub로 로그인하고 수락하기</button>
</form>

<ul class="notes">
<li>초대 링크는 한 번만 쓸 수 있어요.</li>
<li>기한이 지나면 쓸 수 없어요.</li>
</ul>
</div>
<p id="back" hidden><a class="button block" href="/">로그인 화면으로</a></p>
</div>
</div>
</main>
<script nonce="c5d45c65cc6285a24d626f33a734bab8c2dccd3a240d66267e1db60ced81e8f5">const token = location.hash.slice(1);
history.replaceState(null, "", location.pathname);
document.getElementById("invite").value = token;
if (token === "") {
  document.title = "이 주소에는 초대 정보가 없어요";
  document.getElementById("title").textContent = document.title;
  document.getElementById("note").textContent =
    "받은 초대 링크 전체를 그대로 다시 열어 주세요. 주소 끝의 # 뒤 글자까지 있어야 해요.";
  document.getElementById("accept").hidden = true;
  document.getElementById("back").hidden = false;
}</script>
</body>
</html>
