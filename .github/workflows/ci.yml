name: CI

# Manual-dispatch contract is unchanged: this workflow starts only when
# dispatched. What changed on 2026-09-02 (owner decision) is the shape:
# the previous 9-job lane (changes / meta / health / build / lint /
# dashboard / structure-ratchet / shell-ir-ratchet / ci-gate) is now a
# single job that runs `dune build @install`.
#
# Scope caveat: `@install` compiles the installable libraries only. It
# does NOT compile test/ — a main breakage confined to test files (the
# 2026-09-02 incident was 3 of 4 errors in tests) stays invisible here.
# To include tests, change the one build line to `dune build .`.
# Lint, dashboard, ratchets, and the ci-gate no longer run anywhere.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

# One run at a time for the whole repo: a new dispatch cancels the run
# in flight instead of stacking a second one.
concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  build:
    name: dune build @install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        # ubuntu-latest preinstalls the Android SDK (~9 GB), .NET (~1.6 GB),
        # GHC (~1 GB) and the CodeQL bundle (~5 GB) this OCaml build never
        # uses; removing them prevents the "No space left on device" failures
        # seen on 2026-07-03 (runs 28638901622 / 28644587505 / 28652695346).
        # See: https://github.com/jeong-sik/masc/issues/22954
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-bisect

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep

      - name: Build
        env:
          # Public runners give four CPUs; use all four for the
          # compile-only graph.
          DUNE_JOBS: "4"
        # NO continue-on-error: the build is deterministic and must hard-fail.
        run: |
          set -euo pipefail
          dune build @install
