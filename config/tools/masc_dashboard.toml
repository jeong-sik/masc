name = "masc_dashboard"
description = """
Return a workspace dashboard summary for the current project.

The full view lists attention items, agents, keepers, tasks and messages.
Set compact to true for a four-line count summary instead."""
additional_properties = false

defer_loading = true

[[params]]
name = "compact"
type = "boolean"
default = false
description = "true returns the four-line count summary instead of the full dashboard. Defaults to false."
