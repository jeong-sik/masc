name = "masc_browser_interact"
description = """
Click, fill, scroll, hover, drag, follow a link, activate a browser tab, set the page viewport size, or set actual browser zoom. tap_at and swipe send a touch pointer (not a mouse) on a live BiDi connection or the owned Firefox: tap_at presses and releases at an observed point, swipe holds the touch from one observed point to another; Stagehand and a connected WebExtension refuse them before any effect. set_viewport takes width and height together in CSS pixels (100–4096) on a live BiDi connection or Stagehand; on a live BiDi connection, giving neither restores the browser's own size. Read scene/screenshot geometry again afterward. set_zoom requires an exact WebExtension client/tab, expectedUrl and factor 0.3–5. It measures the resulting zoomFactor and zoomScope; Firefox per-origin zoom can affect same-site tabs. Read scene/screenshot geometry again afterward. hover/drag_to accept observed elements (selector or scene reference) without guessing screenshot coordinates. They resolve visible, unobstructed targets in the current viewport; scroll and re-read offscreen targets first. hover_at (no click) and drag move a trusted pointer. automation, Stagehand Chromium and live webdriver_bidi serve these actions; Stagehand supports custom drag paths but requires durationMs=0. activate_tab is live-only, on a web_extension connection (>=0.6.0): it verifies active=true without window focus or navigation. A live request its connection cannot serve is refused before input as live_transport_unsupported; servingClients are the connected browsers that can. List that connection's tabs first: tab IDs are per connection.
The tab is explicit; no arbitrary JavaScript. drag/drag_to issue trusted pointer input; a receipt does not prove the application accepted a drop. HTML5 DataTransfer/drop is not guaranteed by Firefox and has no synthetic fallback. Read again after success or failure before retrying: page handlers can change external state. click/fill require one visible inspected element. On automation, Stagehand Chromium and live webdriver_bidi, click resolves an unobstructed selector or scene node and sends native pointerDown/pointerUp, supporting trusted pointerdown/mousedown menus; disabled and aria-disabled targets are refused. Click captures the current URL when expectedUrl is omitted, then checks it before input. WebExtension retains DOM click. fill targets text inputs/textarea and sends input/change without Enter or submit. scroll_at scrolls the pane under the point. follow_link bypasses click handlers for observed same-tab HTTP(S) HTML/SVG anchors (_self/_top/_parent); rejects downloads, new-window targets, noreferrer and explicit referrerpolicy. destinationUrl is intent, not loaded-page evidence."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 3,294 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 22개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름이 남고,
# 부르면 그 턴에 스키마가 붙는다. 한 줄 요약은 그 답에 한 번 나온다.
defer_loading = true

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation", "stagehand"]
description = "Optional advanced browser override. Omit only for initial discovery or opening a work browser; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "expectedUrl"
type = "string"
description = "Observed URL guard; required for explicit pointer actions, hover/drag_to, follow_link and activate_tab. Required also for double_click/type_text/press_key/set_zoom/set_viewport. Semantic click may omit it; the native backend captures and guards the resolved page URL."

[[params]]
name = "action"
type = "string"
required = true
enum = ["set_zoom", "set_viewport", "tap_at", "swipe", "activate_tab", "follow_link", "double_click", "double_click_at", "type_text", "press_key", "click", "fill", "scroll", "click_at", "scroll_at", "hover", "drag_to", "hover_at", "drag"]

[[params]]
name = "selector"
type = "string"
description = "click/double_click/fill/hover: one visible top-document element; alternative to documentId/nodeId."

[[params]]
name = "text"
type = "string"
description = "fill replaces; type_text sends native Unicode text to the currently focused enabled editable control. Empty fill clears. Control characters require explicit press_key, so text cannot navigate focus or submit. Text is never echoed."

[[params]]
name = "x"
type = "integer"
description = "scroll/scroll_at horizontal CSS-pixel delta."

[[params]]
name = "y"
type = "integer"
description = "scroll/scroll_at vertical CSS-pixel delta."

[[params]]
name = "button"
type = "string"
enum = ["primary", "middle", "secondary"]
description = "click_at only: the mouse button, primary by default. middle and secondary need native pointer input: a live BiDi connection, the owned Firefox or Stagehand. A connected WebExtension refuses them before any effect."

[[params]]
name = "clientId"
type = "string"
description = "Retain the observed live clientId on every subsequent tab read/action; stale IDs fail. Omit for a work browser."

[[params]]
name = "documentId"
type = "string"
description = "Scene document with nodeId; required for follow_link. type_text/press_key require the observed documentId with expectedUrl and retain current focus. Reload fails."

[[params]]
name = "nodeId"
type = "string"
description = "Scene node; survives reordering, fails on detach/replacement."

[[params]]
name = "point"
type = "object"
description = "click_at/hover_at/scroll_at/tap_at: normalized x/y in [0,1); copy screenshot viewport/expectedUrl."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "from"
type = "object"
description = "Native drag or swipe start; normalized x/y in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "to"
type = "object"
description = "Native drag or swipe end; normalized x/y in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "viewport"
type = "object"
description = "click_at/hover_at/scroll_at/drag: copy screenshot documentId, CSS dimensions and scroll offsets exactly; changes fail."

additional_properties = false

[[params.params]]
name = "documentId"
type = "string"
required = true

[[params.params]]
name = "width"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "height"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "scrollX"
type = "number"
required = true

[[params.params]]
name = "scrollY"
type = "number"
required = true

# follow_link uses documentId/nodeId and expectedUrl already declared above.

[[params]]
name = "source"
type = "object"
description = "drag_to source: one selector OR observed documentId/nodeId. Must be visible and unobstructed."
additional_properties = false

[[params.params]]
name = "selector"
type = "string"

[[params.params]]
name = "documentId"
type = "string"

[[params.params]]
name = "nodeId"
type = "string"

[[params]]
name = "destination"
type = "object"
description = "drag_to destination: one selector OR observed documentId/nodeId, in the same current document."
additional_properties = false

[[params.params]]
name = "selector"
type = "string"

[[params.params]]
name = "documentId"
type = "string"

[[params.params]]
name = "nodeId"
type = "string"

[[params]]
name = "via"
type = "array"
description = "drag/drag_to/swipe: observed intermediate viewport fractions, in order. Omit for a straight drag through its midpoint. Stagehand also supports these paths through native CSS-pixel runtime routes."

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.items.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "durationMs"
type = "integer"
minimum = 0
maximum = 9007199254740991
description = "drag/drag_to/swipe: duration of each intermediate and destination move in milliseconds; default 0. Requires automation or live webdriver_bidi when nonzero."

[[params]]
name = "key"
type = "string"
description = "press_key: Enter, Tab, Escape, Backspace, Delete, ArrowUp/Down/Left/Right, Home, End, or one Unicode scalar. Stagehand refuses supplementary scalar keys; use type_text for Unicode text. Sends native down/up to current focus; no guessed selector or synthetic events."

[[params]]
name = "modifiers"
type = "array"
items = { type = "string", enum = ["Control", "Meta", "Alt", "Shift"] }
description = "press_key: explicit distinct modifiers, e.g. [Meta] with key a selects all on macOS; [Control] on other systems. Native keys and double clicks require Stagehand, automation, or live webdriver_bidi. WebExtension does not serve native keyboard actions. set_zoom is a separate WebExtension-only action."

[[params]]
name = "width"
type = "integer"
minimum = 100
maximum = 4096
description = "set_viewport only: viewport width in CSS pixels, given together with height. Omit both on a live BiDi connection to restore the browser's own size."

[[params]]
name = "height"
type = "integer"
minimum = 100
maximum = 4096
description = "set_viewport only: viewport height in CSS pixels, given together with width."

[[params]]
name = "factor"
type = "number"
minimum = 0.3
maximum = 5.0
description = "set_zoom only: actual browser zoom factor (0.3–5), requires exact clientId/tabId and expectedUrl on a WebExtension >=0.8.0. Receipt measures zoomFactor and actual zoomScope; Firefox per-origin zoom can affect/persist for same-site tabs. Re-read scene/screenshot geometry afterward. Other adapters refuse before input."
