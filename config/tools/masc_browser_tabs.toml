name = "masc_browser_tabs"
description = """
Discover a browser implementing optional requiredActions without opening one. For assigned Task work, start with BrowserTabs {} (omit mode, lane and clientId): automatic initial discovery consults the current Task's Goal binding when present. Retain the returned browserSelection.lane and clientId on subsequent calls, and preserve browserGoal when returned. Use mode=connections alone for global connection diagnostics; it lists observed live clients across visible browser workers without selecting the current Task's Goal. Never choose the first listed client as a substitute for Task-aware discovery. This metadata-only mode reports inventoryIssues/inventoryComplete and never reads Pages or creates a session. Incomplete observations refuse automatic selection. An intentional advanced lane/clientId override selects that browser instead of consulting the Task's Goal. Without mode, the receipt includes browserCapabilities, with implemented operations, invocation tools and constraints. List {clientId,transport,tabs:[{id,active,title,url}]} and live index/windowId. Carry clientId/tabId into reads/actions. Ego inventory never waits for Page.info and reports dialogObservation=unobserved; this is not proof that no alert or prompt is open. Request native dialog metadata separately with BrowserRead mode=dialog and the same explicit clientId/tabId, without framePath; unavailable dialog metadata does not invalidate the tab inventory. A partial BiDi inventory sets complete=false and lists unavailableTabs with their IDs and errors; other tabs remain usable, and unavailable does not mean closed. Live transport says what that connection serves: webdriver_bidi takes hover_at and drag, web_extension takes set_zoom; both take activate_tab, and on webdriver_bidi it also focuses the browser window. Ambiguous or stale live selection returns clients without dispatch: choose an intended explicit override before retrying; do not select an arbitrary client. Automation and stagehand clientId is null, with no transport."""
additional_properties = false

[[params]]
name = "mode"
type = "string"
enum = ["connections"]
description = "Global read-only connection diagnostics, not current Task browser selection. Supply mode=connections alone, without lane, clientId, tabId or requiredActions. For assigned Task discovery use BrowserTabs {} instead; retain its browserSelection and browserGoal when returned."

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation", "stagehand"]
description = "Optional advanced browser override. Omit only for initial discovery or opening a work browser; MASC selects an eligible browser and reports browserSelection. For every observed tab, retain browserSelection.lane and its clientId on subsequent calls; tab IDs are local to a browser."

[[params]]
name = "clientId"
type = "string"
description = "Retain the observed live clientId on every subsequent tab read/action; stale IDs fail. Omit for a work browser."

[[params]]
name = "requiredActions"
type = "array"
items = { type = "string", enum = ["list_tabs", "open_tab", "close_tab", "activate_tab", "list_windows", "create_window", "close_window", "navigate", "follow_link", "back", "forward", "reload", "stop_loading", "session_lifecycle", "read_text", "read_html", "read_elements", "read_scene", "read_regions", "read_snapshot", "screenshot", "native_workflow", "click_snapshot_target", "fill_snapshot_target", "hover_snapshot_target", "double_click_snapshot_target", "click", "double_click", "right_click", "middle_click", "pointer_down", "pointer_up", "hover", "pointer_drag", "html5_drop", "scroll_page", "scroll_at", "fill", "type_text", "press_key", "key_chord", "select_option", "read_frames", "frame_interaction", "read_dialog", "accept_dialog", "dismiss_dialog", "hand_off", "take_over", "space_status", "release_input", "finish_space", "wait_for_control", "adopt_tab", "release_tab", "upload_file", "list_downloads", "page_zoom", "resize_viewport", "touch", "read_clipboard", "write_clipboard", "read_network", "intercept_network", "read_console", "read_storage", "write_storage", "emulate_environment", "sentence_action"] }
description = "Optional public operations needed by the task, only for initial discovery or action=open. Automatic choice requires one browser implementing all operations; impossible combinations fail before any browser command. Explicit browser owners never change. Inspect browserCapabilities constraints and retain browserSelection for later calls."
