name = "masc_run_init"
description = """
Create an execution memory directory (.masc/runs/{task_id}/) to track the \
run plan. Call when starting work on a claimed task to enable structured \
progress tracking. After init, use masc_run_plan to set approach and \
masc_run_get to review."""
additional_properties = false

[[params]]
name = "task_id"
type = "string"
required = true
description = "Task ID to track"

[[params]]
name = "agent_name"
type = "string"
required = true
description = "Agent working on the task"
