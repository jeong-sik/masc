id = "browser"
revision = "0.1.0"
title = "Browser connections"
runtime = "host_process"
service = "browser"
command = ["masc-browser-addon-worker"]
contributions = ["observe"]

[world.skills]
directory = "skills"

[world.tools]
export = ["browser_command"]
invocation = "host_context"
hooks = ["validate_input", "validate_output"]

[world.outputs.connections]
all_lanes = true

[world.exact_outputs.locate]
schema = "schemas/locate.json"

[world.exact_outputs.stagehand]
schema = "schemas/stagehand.json"
request_schema = true

[resources]
max_reply_bytes = 4194304

[interface]
binding_schema = '''{
  "type": "object",
  "properties": {"sources": {"type": "array", "maxItems": 0, "items": {"type": "string"}}},
  "required": ["sources"],
  "additionalProperties": false
}'''
