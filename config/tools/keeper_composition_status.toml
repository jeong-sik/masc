name = "keeper_composition_status"
description = "Read the exact durable status and structured result of one async Keeper composition request."
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 5 turns needed it across 6317 provider requests, and its
# 293 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 5 turns and saves the 293 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
[[params]]
name = "request_id"
type = "string"
required = true
min_length = 1
# The request_id param carries no description ON PURPOSE: its input schema
# must stay byte-identical to the request_id_input_schema this tool built
# inline before externalization, which test_composition_control_tool_toml
# pins. Adding `description = "..."` here would put a description in the
# property and break that pin — revert the addition, do not edit the test.
