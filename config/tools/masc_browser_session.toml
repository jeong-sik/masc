name = "masc_browser_session"
description = """
Bind an observed ego Space to a shared Goal for that Goal's Tasks.
BrowserTabs/masc_browser_tabs {} in a Task of that Goal then selects it. It stores metadata only: no browser input or control change. Binding the same pair again is a no-op; another Space for the Goal, or one Space for two Goals, is refused: unbind_goal first. If the bound Space is not connected, discovery fails instead of picking another browser. A bound Space is already open: list its pages with BrowserTabs."""
additional_properties = false
# 2026-10-29 ~ 11-04 에 저장된 agent-core 요청 5,479개(Keeper 28명)가 이 정의 4,611 B 를
# 매번 실었다. 이 도구를 부른 서로 다른 Keeper 턴은 24개(44회)다. 지연의 손익은
# 호출 수가 아니라 필요했던 턴 수로 가른다(masc #32062): 실으면 25.5 MB, 지연하면
# 24턴 x 표면 91,483 B = 2.2 MB 라서 11.6배다. 같은 도구 묶음의 BrowserRead,
# BrowserAct, BrowserInteract 는 이미 지연돼 있다. 지연돼도 keeper_tool_search
# 목록에 이름이 남고, 부르면 그 턴에 스키마가 붙는다. 재측정 방법은
# docs/evidence/defer-loading-2026-11/README.md 에 있다.
defer_loading = true

[[params]]
name = "action"
type = "string"
enum = ["bind_goal", "goal_status", "unbind_goal"]
required = true
description = "bind_goal needs goalId, lane=live and clientId. goal_status and unbind_goal take goalId only."

[[params]]
name = "lane"
type = "string"
enum = ["live"]
description = "bind_goal: required."

[[params]]
name = "clientId"
type = "string"
description = "bind_goal: observed connection UUID, never the numeric Space ID."

[[params]]
name = "goalId"
type = "string"
description = "Workspace Goal ID. bind_goal and goal_status need an existing Goal; unbind_goal also takes a deleted Goal's ID."

