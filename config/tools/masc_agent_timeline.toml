name = "masc_agent_timeline"
description = "Unified timeline of an agent's activity in the currently selected workspace across tasks, messages, and joins."

[[params]]
name = "agent_name"
type = "string"
required = true
description = "Agent name to query"

[[params]]
name = "since_hours"
type = "number"
description = "Look back N hours (default: 24)"

[[params]]
name = "limit"
type = "integer"
description = "Max events to return (default: 50)"

[[params]]
name = "include_tasks"
type = "boolean"
description = "Include task state changes (default: true)"

[[params]]
name = "include_board"
type = "boolean"
description = "Include board activity (default: false, reserved)"

[[params]]
name = "include_tool_calls"
type = "boolean"
description = "Include tool call events from Activity Graph (default: true)"
