# Canva's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-08-26: two-hop discovery answers, the token endpoint accepts a
# client that authenticates with nothing, S256 is offered, and an MCP
# initialize is refused with 401 rather than 404. Sixteen scopes, read and write across designs, folders, assets and comments.

id = "canva"
label = "Canva"
mcp_url = "https://mcp.canva.com/mcp"

# Measured 2026-11-02: a client registered for a public https redirect URI
# is refused at the authorize step; a client registered for the RFC 8252
# loopback form, http://127.0.0.1:<port>/api/v1/keepers/oauth/callback, is
# not. With the loopback client the authorize step goes on to consent, while
# an unregistered loopback URI is refused there. So a login here names the
# loopback callback, and the browser that consents has to reach this server
# on 127.0.0.1.
callback = "loopback"

access_token_env = "CANVA_ACCESS_TOKEN"
expires_at_env = "CANVA_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.canva/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
