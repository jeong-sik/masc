name = "masc_fusion_status"
description = """
Read Fusion run status and original deliberation evidence without starting one.

With no argument, lists tracked runs belonging to you. With run_id, reads that
exact run's original durable Board evidence: full panel answers, judge advice,
source context, original post/origin identities and evidence hash, alongside
separate Keeper decisions. The run metadata can be null when the registry entry
is not retained; available durable evidence remains readable by run_id. Registry
history is replayed at startup, while Board evidence follows Board retention.
Wait for the completion wake instead of polling. Once it arrives, use this tool
to inspect the full evidence before attributing panel positions or recording your
own choice with masc_fusion_decision. Unavailable evidence is reported explicitly;
it is not a finding that the post expired. Read-only."""
additional_properties = false

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 16 times in 11 turns, 907 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 11 extra requests over the same week.
defer_loading = true

[[params]]
name = "run_id"
type = "string"
description = """
Optional fusion run id (the run_id returned by masc_fusion). When given, \
returns that run's status and original durable evidence; when omitted, lists every tracked run \
(in-progress and recently completed)."""
