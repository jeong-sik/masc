id = "dos-world"
revision = "0.1.0"
title = "DOS input and guest state"
contributions = ["observe", "act"]
image = "masc-lane-dos-world:0.1.0"
command = ["node", "/opt/dos-world/server.mjs"]

[world.actions]
tool = "lane_act"

[world.skills]
directory = "skills"

[world.outputs.guest]
lanes = ["dos/guest"]

[resources]
# The image owns one WASM machine; these isolate its host load, not Keeper work.
cpus = 1.0
memory_bytes = 536870912
pids = 64
max_reply_bytes = 4194304

[interface]
# Installation bindings are checked against this contract before a worker starts.
# The binding is an empty source list: this worker owns its environment.
binding_schema = '''{
  "type": "object",
  "properties": {
    "sources": {
      "type": "array",
      "maxItems": 0,
      "description": "This package owns its DOS machine and takes no external source",
      "items": {
        "type": "object",
        "properties": {},
        "additionalProperties": false
      }
    }
  },
  "required": [
    "sources"
  ],
  "additionalProperties": false
}'''
