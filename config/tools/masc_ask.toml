name = "masc_ask"
description = """
Ask the operator questions with named choices; answers arrive in a separate wake. Use when blocked on an external choice."""
additional_properties = false
# RFC-0403 후속. 이 셋은 2026-08-03 ~ 09-02 31일간 fleet 전체에서 호출 0회이고,
# 그 사이 agent-core keeper 4곳의 요청마다 5,498 B 를 싣고 있었다. 지연의
# 손익은 호출 수가 아니라 "그 도구가 필요했던 서로 다른 턴 수"로 가르는데
# (masc #32062), 그 값이 0이므로 우변이 0이다 — 되는 쪽이 확정이다.
#
# 사라지는 게 아니다. agent-core 레인에서 지연된 도구는 keeper_tool_search
# 목록에 이름과 한 줄 요약으로 남고, 모델이 부르면 그 턴에 붙는다. 같은 선언을
# 가진 30종 중 27종이 이 창에서 실제로 호출됐다 (masc_schedule_create 412회,
# masc_goal_transition 89회) — 왕복이 도는 것은 관측된 사실이다.
defer_loading = true

[[params]]
name = "questions"
type = "array"
required = true
description = "Questions to ask together."

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
name = "question_id"
type = "string"
required = true
description = "Stable question id."

[[params.items.params]]
name = "header"
type = "string"
required = true
description = "Short decision title."

[[params.items.params]]
name = "prompt"
type = "string"
required = true
description = "Question prompt for operator."

[[params.items.params]]
name = "mode"
type = "string"
required = true
enum = ["single", "multi"]
description = "Mode: single or multi."

[[params.items.params]]
name = "free_text"
type = "boolean"
description = "Allow free text input."

[[params.items.params]]
name = "free_text_hint"
type = "string"
description = "Placeholder for free text."

[[params.items.params]]
name = "choices"
type = "array"
description = "Named choices (required unless free_text is true)."

[params.items.params.items]
type = "object"
additional_properties = false

[[params.items.params.items.params]]
name = "choice_id"
type = "string"
required = true
description = "Stable choice id."

[[params.items.params.items.params]]
name = "label"
type = "string"
required = true
description = "Operator visible label."

[[params.items.params.items.params]]
name = "description"
type = "string"
description = "Commitment of choice."

[[params]]
name = "context"
type = "string"
description = "Context and reason for asking."

[[params]]
name = "task_id"
type = "string"
description = "Related task id."

[[params]]
name = "goal_id"
type = "string"
description = "Related goal id."
