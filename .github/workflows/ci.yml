name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # No base filter. The filter matches the *base* branch, so a stacked PR --
    # one opened against another PR's branch rather than main -- did not start
    # this workflow at all. Those PRs collected only the handful of checks other
    # workflows contribute and reached review with no compile or test evidence;
    # on 2026-08-14 five of them sat that way at once. A stack is how work over
    # 20k tokens is supposed to arrive here, so the shape that needs evidence
    # most was the one getting none.
    #
    # Drafts stay cheap through pr-live-gate. ready_for_review starts the exact
    # source and real-world product gates once the author asks for a verdict.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  # Branch/PR runs verify the current branch state: a newer push supersedes the
  # older run, so the older one cancels.
  #
  # Main pushes are keyed by commit instead, because a shared main group cannot
  # produce verdicts at this merge rate. Build and Test budgets 73 minutes of
  # focused groups under a 90-minute timeout, while merges land every 5.5
  # minutes on average and arrive 9 seconds apart in bursts. One slot for that
  # stream means a run needs 90 quiet minutes to finish, and there are none:
  # turning cancel-in-progress off does not help, because a main run sits
  # pending and is collapsed by the next merge before it dispatches a single
  # job. Measured 2026-08-16: main's last completed verdict of any kind was
  # 2026-08-13T14:07:47Z, and the 150 runs after it produced 148 cancellations
  # and zero verdicts; across 05:45-07:36 that day, 20 runs dispatched 0 jobs
  # between them. Keying on github.sha gives each commit its own group, so
  # nothing collapses. This is the scoping TLA+ Main Verification already uses.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number
      || (github.ref == 'refs/heads/main' && github.sha)
      || github.ref_name
      || github.run_id
    }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)) }}

jobs:
  pr-sync-check:
    name: PR Sync Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so origin/<base>, the PR head, and the synthetic merge
          # commit all exist locally for identity and version-truth checks.
          fetch-depth: 0

      - name: Verify PR sync
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: origin/${{ github.base_ref }}
          VERSION_REF: HEAD
        run: |
          chmod +x scripts/check-pr-sync.sh
          scripts/check-pr-sync.sh \
            --head-branch "$PR_HEAD_REF" \
            --pr-number "$PR_NUMBER" \
            --base-ref "$BASE_REF" \
            --version-ref "$VERSION_REF" \
            --expected-head-sha "$PR_HEAD_SHA"

  pr-live-gate:
    name: PR Live Gate
    runs-on: ubuntu-latest
    needs: [pr-sync-check]
    if: ${{ always() && !cancelled() && (needs.pr-sync-check.result == 'success' || needs.pr-sync-check.result == 'skipped') }}
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.live.outputs.run_heavy }}
      live_is_draft: ${{ steps.live.outputs.live_is_draft }}
      live_state: ${{ steps.live.outputs.live_state }}

    steps:
      - name: Resolve live PR state before heavy CI
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
            if [ "$EVENT_REF" != "refs/heads/main" ]; then
              echo "::error::Trusted dispatch requires refs/heads/main, got $EVENT_REF"
              exit 1
            fi
            if [ "$EVENT_REF_PROTECTED" != "true" ]; then
              echo "::error::Trusted dispatch requires a protected main ref"
              exit 1
            fi
            if [ "$WORKFLOW_REF" != "$expected_workflow_ref" ]; then
              echo "::error::Trusted dispatch workflow mismatch: expected=$expected_workflow_ref actual=$WORKFLOW_REF"
              exit 1
            fi
            if [ "$WORKFLOW_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::Trusted dispatch workflow/source mismatch: workflow=$WORKFLOW_SHA source=$SOURCE_SHA"
              exit 1
            fi
          fi

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            # This workflow only listens to branch pushes for main/develop
            # (`on.push.branches` above) plus workflow_dispatch. Tag pushes do
            # not start this workflow, so NON_PR here cannot force Build and
            # Test for tags.
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "live_is_draft=false" >> "$GITHUB_OUTPUT"
            echo "live_state=NON_PR" >> "$GITHUB_OUTPUT"
            echo "::notice::PR live gate: non-PR event=${GITHUB_EVENT_NAME}; run_heavy=true"
            exit 0
          fi

          # Retry-based PR state resolution: instead of a fixed sleep, poll
          # gh pr view with short intervals. This catches draft restoration
          # within ~3s on fast APIs while avoiding unnecessary delay on
          # non-PR events or already-settled states. Capture stderr from each
          # attempt so a persistent failure reports the underlying gh error
          # (a silent "after 3 attempts" is undebuggable).
          err_log="${RUNNER_TEMP:-/tmp}/live-pr-gate.err"
          : > "$err_log"
          for _attempt in 1 2 3; do
            if live_fields="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft --jq '.state + " " + (.isDraft | tostring)' 2>"$err_log")"; then
              break
            fi
            sleep 1
          done

          if [ -z "${live_fields:-}" ]; then
            echo "::error::Could not resolve live PR state for #${PR_NUMBER} after 3 attempts: $(cat "$err_log")"
            exit 1
          fi
          live_state="${live_fields%% *}"
          live_is_draft="${live_fields#* }"

          if [ -z "$live_state" ] || { [ "$live_is_draft" != "true" ] && [ "$live_is_draft" != "false" ]; }; then
            echo "::error::Could not resolve live PR state for #${PR_NUMBER}: ${live_fields}"
            exit 1
          fi

          # Heavy CI runs whenever the PR is live (OPEN), regardless of draft
          # status. Earlier we skipped draft PRs to save CI minutes, but the
          # masc fast-track pattern (open Draft → mark ready → admin-merge
          # within seconds) means the build/lint/test surfaces almost never
          # got a chance to run. Two visible failures from that gap this week:
          # - masc #15531 (Tool_args / Tool_result sub-lib extract) merged
          #   main in a non-building state; recovered by #15540.
          # Running heavy CI on draft PRs costs minutes but catches both
          # classes of regression *before* the admin-merge decision instead
          # of after, when the only remaining lever is fix-forward.
          # Closed/merged PRs still skip — there is nothing to verify there.
          run_heavy=true
          if [ "$live_state" != "OPEN" ]; then
            run_heavy=false
          fi

          echo "run_heavy=${run_heavy}" >> "$GITHUB_OUTPUT"
          echo "live_is_draft=${live_is_draft}" >> "$GITHUB_OUTPUT"
          echo "live_state=${live_state}" >> "$GITHUB_OUTPUT"
          echo "::notice::PR live gate: state=${live_state:-unknown} draft=${live_is_draft:-unknown} run_heavy=${run_heavy}"

  changes:
    name: Detect Changed Surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pr-live-gate]
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' }}
    outputs:
      build: ${{ steps.scope.outputs.build }}
      lint: ${{ steps.scope.outputs.lint }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      health: ${{ steps.scope.outputs.health }}
      health_snapshot: ${{ steps.scope.outputs.health_snapshot }}
      lib_deps: ${{ steps.scope.outputs.lib_deps }}
      doc_truth: ${{ steps.scope.outputs.doc_truth }}
      tla: ${{ steps.scope.outputs.tla }}
      agent_core: ${{ steps.scope.outputs.agent_core }}
      spec_refs: ${{ steps.scope.outputs.spec_refs }}
      nav_event_parity: ${{ steps.scope.outputs.nav_event_parity }}
      shell_ir: ${{ steps.scope.outputs.shell_ir }}
      keeper_cwd: ${{ steps.scope.outputs.keeper_cwd }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect scope
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit_all_true() {
            for key in build lint dashboard health health_snapshot lib_deps doc_truth tla agent_core spec_refs nav_event_parity shell_ir keeper_cwd; do
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            done
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            emit_all_true
            echo "::notice::workflow_dispatch forces every CI surface to run"
            exit 0
          fi

          changed_file_list="$(mktemp)"
          base_ref=""
          head_ref="${GITHUB_SHA}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            bash scripts/ci/git-fetch-retry.sh origin "${GITHUB_BASE_REF}" --depth=200
            head_ref="${GITHUB_HEAD_SHA}"
            base_branch_ref="origin/${GITHUB_BASE_REF}"
            if ! merge_base="$(git merge-base "${base_branch_ref}" "${head_ref}")"; then
              echo "::warning::Unable to resolve PR merge-base at depth=200; deepening ${GITHUB_BASE_REF} history"
              bash scripts/ci/git-fetch-retry.sh origin "${GITHUB_BASE_REF}" --deepen=1000
              merge_base="$(git merge-base "${base_branch_ref}" "${head_ref}")"
            fi
            base_ref="${merge_base}"
          elif [ -n "${GITHUB_BEFORE}" ] && [ "${GITHUB_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${GITHUB_BEFORE}"
          fi

          if [ -n "${base_ref}" ]; then
            git diff --name-only "${base_ref}" "${head_ref}" > "${changed_file_list}"
          else
            git ls-files > "${changed_file_list}"
          fi

          if [ ! -s "${changed_file_list}" ]; then
            git ls-files > "${changed_file_list}"
          fi

          echo "Changed files:"
          sed 's/^/  - /' "${changed_file_list}"

          has_match() {
            grep -Eq "$1" "${changed_file_list}"
          }

          ci_core=false
          build=false
          lint=false
          dashboard=false
          health=false
          health_snapshot=false
          lib_deps=false
          doc_truth=false
          tla=false
          agent_core=false
          spec_refs=false
          nav_event_parity=false
          shell_ir=false
          keeper_cwd=false

          if has_match '^(\.github/workflows/ci\.yml|\.github/actions/)'; then
            ci_core=true
          fi

          # The build trigger must stay a SUPERSET of the dune build graph.
          # ci-gate treats a skipped required job as PASS (see check() near
          # line 1206), so any code-bearing PR that does NOT set build=true
          # merges with a green "CI Gate" while the Build job (dune compile)
          # never ran. The prefix list below (bin/ lib/ test/ proto/ config/)
          # missed build-graph dirs ppx/ ppx_tla/ test_lib/ tools/
          # and the root dune file, so a PR touching only those compiled
          # nowhere yet reported success. Match any OCaml/dune source plus C
          # foreign stubs by suffix so new source dirs are covered without
          # editing this list, and keep explicit prefixes for Dune-declared
          # non-source deps (e.g. tools/tlc_test_gen/test/fixtures/*.tla).
          # Over-triggering on dune-excluded dirs (dashboard_bonsai/ per the
          # root dune (dirs ...) stanza) is harmless: the Build job runs but
          # dune build skips those dirs.
          # scripts/harness/ stays a prefix match (not suffix): the Build and
          # Test job executes scripts/harness/contract/run_all.sh, so any
          # harness file — including non-.sh/.json ones and future extensions —
          # must force build=true. ci_core is intentionally NOT OR-ed here:
          # the ci_core block below already forces build=true.
          # scripts/fixtures/ is a prefix for the same reason (#25726 moved the
          # release-evidence fixtures out of heredocs into files): test/dune
          # declares (source_tree ../scripts/fixtures) and
          # test_runtime_config_validity.ml discovers scripts/fixtures/<name>/
          # runtime.toml, so a fixture edit changes test input while matching
          # none of the suffixes above (.toml is not .ml/.json/.sh) and the
          # Build job would skip.
          if has_match '^(bin/|lib/|test/|proto/|config/|tools/|scripts/harness/|scripts/fixtures/|scripts/keeper-full-lifecycle-evidence\.py$|dune-project$|dune-workspace$|.*\.opam$|.*\.ml$|.*\.mli$|.*\.mll$|.*\.mly$|.*\.c$|.*\.h$|.*\.json$|.*\.sh$|(.*/)?dune$)'; then
            build=true
          fi

          # The lint trigger set must stay a superset of every path the Lint
          # job reads. scripts/check-ssot.sh R6 scans bin/ lib/ scripts/ docs/,
          # so docs/ and scripts/ (whole tree, not just the curated entries)
          # must trigger Lint — otherwise a docs-only or scripts-only PR can
          # merge gate-skipped while pushing an R6 count past its baseline,
          # breaking Lint for every subsequent PR (#20729: RFC docs #20717 /
          # #20718 landed bare ~/.masc paths and took main's Lint red).
          # scripts/ subsumes the previously enumerated scripts/* entries.
          if has_match '^(bin/|lib/|test/|proto/|config/|docs/|scripts/|dune-project$|dune-workspace$|.*\.opam$|dashboard/src/)'; then
            lint=true
          fi

          if has_match '^dashboard/'; then
            dashboard=true
          fi

          # SSE wire surface -> Dashboard coupling (#28925 audit, defect (a)).
          # A lib-only PR that changes an SSE payload shape used to skip the
          # Dashboard job entirely, so dashboard/src/schemas/sse.ts (a closed
          # event-type allowlist that silently drops unknown shapes) was never
          # exercised against the new wire — exactly the PR shape this gate
          # exists to catch. The list below is every file that constructs or
          # broadcasts a dashboard-wire SSE payload, derived by census:
          #   rg -ln 'Sse\.broadcast' lib bin           # direct hub callers
          #   rg -ln 'Mcp_server\.sse_broadcast' lib    # indirect via callback
          # plus the payload-shape owners lib/sse_event/ (atd SSOT),
          # lib/sse.ml (envelope/framing + bridge hook wiring), and the
          # payload-builder modules those callers delegate to
          # (keeper_event_bridge_error_json, dashboard_agent_core_bridge,
          # server_dashboard_http_core). Deliberately NOT lib/ wholesale:
          # the Dashboard job costs ~15min and most lib churn cannot move
          # the wire. Re-run the census above when adding a new emitter.
          if has_match '^(bin/main_eio\.ml$|lib/sse\.mli?$|lib/sse_jsonrpc_filter\.mli?$|lib/sse_event/|lib/progress\.ml$|lib/mcp_server\.ml$|lib/mcp_server_eio_call_tool\.ml$|lib/mcp_server_eio_protocol\.ml$|lib/mcp_tool_runtime_comm\.ml$|lib/mcp_tool_runtime_board\.ml$|lib/runtime/dashboard_agent_core_bridge\.ml$|lib/fusion/fusion_sink\.ml$|lib/server/(masc_grpc_service|server_bootstrap_loops|server_dashboard_http_core|server_dashboard_http_execution_surfaces|server_dashboard_http_keeper_api|server_dashboard_http_namespace_truth|server_ide_http|server_mcp_transport_ws|server_routes_http_routes_activity|server_routes_http_routes_dashboard|server_runtime_bootstrap)\.ml$|lib/keeper/(keeper_approval_queue|keeper_chat_broadcast|keeper_compact_policy|keeper_event_bridge|keeper_event_bridge_error_json|keeper_gate|keeper_heartbeat_loop_in_turn_pulse|keeper_heartbeat_snapshot|keeper_hooks_agent_core|keeper_registry|keeper_registry_broadcast|keeper_tool_composition_surface|keeper_tools_agent_core_handler_telemetry|keeper_unified_metrics_broadcast|keeper_waiting_inventory_broadcast)\.ml$)'; then
            dashboard=true
          fi

          if has_match '^(bin/|lib/|test/|proto/|config/|\.ci/health-baseline\.json$|dune-project$|.*\.opam$|scripts/health_snapshot\.sh$|scripts/anti-fake-audit\.sh$|scripts/base-policy-audit\.sh$)'; then
            health=true
          fi

          if has_match '^(bin/|lib/|test/|proto/|config/|\.ci/health-baseline\.json$|dune-project$|.*\.opam$|scripts/health_snapshot\.sh$|scripts/anti-fake-audit\.sh$|scripts/base-policy-audit\.sh$)'; then
            health_snapshot=true
          fi

          if has_match '^(\.github/workflows/ci\.yml|lib/|dune-project$|dune-workspace$|.*\.opam$|scripts/analyze_lib_deps\.py$|scripts/lib_dep_report\.py$|scripts/lib_dep_delta_ci\.sh$|scripts/audit-sublib-cycle\.py$)'; then
            lib_deps=true
          fi

          if has_match '^(docs/|README\.md$|ROADMAP\.md$|CHANGELOG\.md$|dune-project$|.*\.opam$|quickstart\.sh$|scripts/check-doc-truth\.sh$|scripts/check-version-truth\.sh$|scripts/quickstart-smoke\.sh$|scripts/release-binary-smoke\.sh$|scripts/release-evidence\.sh$|scripts/keeper-full-lifecycle-evidence\.py$|scripts/install\.sh$)'; then
            doc_truth=true
          fi

          if has_match '^(specs/.*\.(tla|cfg)$|specs/Makefile$|lib/keeper/|lib/keeper_registry/|Makefile$)'; then
            tla=true
          fi

          if has_match '^(\.github/workflows/ci\.yml$|packages/agent_core/|packages/(dune|dune-file|dune-project)$|lib/(.*/)?(dune|dune-file|[^/]+\.inc)$|lib/keeper/(keeper_event_bridge|keeper_execution_join|hitl_summary_worker|keeper_hooks_agent_core(_introspection)?|keeper_run_tools[^/]*)\.mli?$|scripts/(check-agent-core-boundary\.sh|audit-sublib-cycle\.py|ci-run-focused-tests\.sh)$|test/(dune|test_agent_core_boundary\.sh|test_keeper_execution_join\.ml|test_keeper_hooks_agent_core_introspection\.ml|test_hitl_summary_worker\.ml|stanzas/test_keeper_execution_join\.inc|stanzas/test_hitl_summary_worker\.inc)$|(dune|dune-file)$|dune-project$|dune-workspace$|.*\.opam$|masc\.opam\.locked$)'; then
            agent_core=true
          fi

          if has_match '^(specs/.*\.tla$|lib/.*\.mli?$|test/.*\.mli?$|src/.*\.mli?$|scripts/lint/spec-line-refs\.(sh|allowlist)$)'; then
            spec_refs=true
          fi

          if has_match '^(dashboard/src/config/navigation\.ts|dashboard/src/types/sse\.ts|lib/dashboard/dashboard_nav_event\.ml|scripts/check-dashboard-nav-event-parity\.sh)$'; then
            nav_event_parity=true
          fi

          if has_match '^(lib/|scripts/audit-shell-ir-consumption\.sh$|scripts/shell-ir-consumption-baseline\.json$|\.github/workflows/ci\.yml$)'; then
            shell_ir=true
          fi

          if has_match '^(lib/keeper/|scripts/keeper-cwd-leak-gate\.sh$|scripts/turn-path-provider-agnostic-gate\.sh$|\.github/workflows/ci\.yml$)'; then
            keeper_cwd=true
          fi


          # Agent Core owns non-source build inputs such as models.toml. Its
          # focused behavior suite and resolved graph must not be reported as
          # gate-skipped merely because the generic suffix classifier missed
          # one of those inputs.
          if [ "${agent_core}" = true ]; then
            build=true
          fi

          if [ "${ci_core}" = true ]; then
            # Self-reference guard: edits to this workflow or local actions
            # set ci_core=true above, then force the core CI surfaces below.
            # Therefore a PR changing ci.yml cannot avoid Build and Test via
            # the path classifier it is editing.
            build=true
            lint=true
            health=true
            health_snapshot=true
            lib_deps=true
            doc_truth=true
            agent_core=true
            shell_ir=true
            keeper_cwd=true
            # Note: dashboard/spec_refs/tla stay path-scoped. Pure CI
            # workflow/action edits should still validate the core OCaml/repo
            # guard lanes and Health, but they should not fan out into every
            # feature surface.
          fi


          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "lint=${lint}" >> "$GITHUB_OUTPUT"
          echo "dashboard=${dashboard}" >> "$GITHUB_OUTPUT"
          echo "health=${health}" >> "$GITHUB_OUTPUT"
          echo "health_snapshot=${health_snapshot}" >> "$GITHUB_OUTPUT"
          echo "lib_deps=${lib_deps}" >> "$GITHUB_OUTPUT"
          echo "doc_truth=${doc_truth}" >> "$GITHUB_OUTPUT"
          echo "tla=${tla}" >> "$GITHUB_OUTPUT"
          echo "agent_core=${agent_core}" >> "$GITHUB_OUTPUT"
          echo "spec_refs=${spec_refs}" >> "$GITHUB_OUTPUT"
          echo "nav_event_parity=${nav_event_parity}" >> "$GITHUB_OUTPUT"
          echo "shell_ir=${shell_ir}" >> "$GITHUB_OUTPUT"
          echo "keeper_cwd=${keeper_cwd}" >> "$GITHUB_OUTPUT"
          
          printf 'CI scope => build=%s lint=%s dashboard=%s health=%s health_snapshot=%s lib_deps=%s doc_truth=%s tla=%s agent_core=%s nav_event_parity=%s shell_ir=%s keeper_cwd=%s\n' \
            "${build}" "${lint}" "${dashboard}" "${health}" "${health_snapshot}" "${lib_deps}" "${doc_truth}" "${tla}" "${agent_core}" "${nav_event_parity}" "${shell_ir}" "${keeper_cwd}"

  meta:
    name: Meta Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pr-live-gate, changes]
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install meta shell dependencies
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq jq ripgrep

      - name: Check single OCaml compile authority
        run: bash scripts/ci/check-ocaml-compile-authority.sh

      - name: Guard pending release tag on main PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # actions/checkout checks out the pull request's synthetic merge
          # commit.  Release truth must be evaluated on that merge result:
          # an untouched stale head legitimately inherits dune-project from
          # current main, while a real downgrade remains present in HEAD.
          HEAD_REF: HEAD
        run: |
          chmod +x scripts/check-release-train-guard.sh
          # No --depth here. This guard only runs `git show` and `git tag`, so
          # it never needed one -- but `git fetch --depth=N` writes
          # .git/shallow, which is repository-global state. It ran first and
          # left the clone shallow for the hygiene step below, which does walk
          # ancestry. That is the trigger for #27365 / #26938 / #27384.
          bash scripts/ci/git-fetch-retry.sh origin "${{ github.base_ref }}" --tags
          scripts/check-release-train-guard.sh \
            --base "$BASE_REF" \
            --head "$HEAD_REF"

      - name: Run PR hygiene guards
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x scripts/check-pr-hygiene.sh
          # No --depth. `git fetch --depth=100` grafts origin/<base> at 100
          # commits, and rev-list then reports everything older than that graft
          # as reachable only from HEAD -- so a long-lived branch had hundreds
          # of main's own commits attributed to it (#27365, #26938, #27384).
          # merge-base still returns a real commit, so the shallow-boundary
          # recovery added in #27277 never engages. The checkout above already
          # fetched full history; truncating it here only removed information.
          bash scripts/ci/git-fetch-retry.sh origin "${{ github.base_ref }}"
          scripts/check-pr-hygiene.sh \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --recent-main 50 \
            --duplicate-policy warn

      - name: Run deploy preflight safety contract
        run: bash test/test_deploy_preflight.sh

      # Dashboard prompt keys must resolve to current prompt assets or registry
      # constants. Run this whenever either side of that contract changes.
      - name: Check dashboard prompt keys
        run: bash scripts/audit-dashboard-prompt-keys.sh

      # An odoc reference is not checked by the compiler, so a rename or a
      # deletion leaves {!foo} syntactically valid and silently wrong. One sweep
      # found nine: mcp_prompt_surface justified a concrete record with a
      # function that module does not have, server_mcp_transport_ws named an
      # absent read_inbound_message_frame three times as the reason ws_session
      # is exposed, and three files wrote {!Foo.ml}, which reads as a value
      # named ml inside Foo. Seconds, and the renaming PR sees it.
      - name: Check odoc references
        run: python3 scripts/audit-odoc-refs.py

      # Both directions of the hand-maintained CI test allowlist. A target
      # whose suite was deleted makes dune hard-fail after a full build
      # (#24352, and again today when config/prompts/behavior emptied), and a
      # suite nobody wired never executes at all, so its assertions can outlive
      # the code they pin. Seconds, and the deleting PR sees it.
      - name: Check CI test targets
        run: bash scripts/audit-ci-test-targets.sh

      # A route that authorizes against a tool name the catalog never registered
      # is closed to every credential, admin included, and the denial reads as a
      # role problem. POST /api/v1/prompts shipped that way with a working
      # dashboard editor in front of it (#29085).
      - name: Check route tool catalog registration
        run: bash scripts/audit-route-tool-catalog.sh

      # Eleven repo-scanning audits that existed and never ran. scripts/ holds
      # 182 scripts and ci.yml called 63 of them; these are the audit/check
      # ones that read only tracked files, so CI can run them as-is. The rest
      # of the unwired set either reads a live .masc runtime (credential and
      # fleet audits, meaningless on a runner) or needs a tool the image lacks
      # (valgrind), and stays out.
      # Its own step because it takes arguments, which the loop below cannot
      # pass. The walk used to descend into every worktree and never finish,
      # which is why an audit this specific sat unwired (#27386); at ~6s it is
      # cheaper than most steps here.
      - name: Run dead-surface ratchet
        run: python3 scripts/audit-dead-surface.py --exports --ratchet

      - name: Run repo audit scripts
        run: |
          set -e
          for s in \
            audit-unwired-audits.sh \
            verify-test-registration.py \
            audit-catchall.sh \
            audit-cross-module-exhaustive-match.sh \
            audit-path-ssot.sh \
            audit-tla-cfg-orphan.sh \
            check_silent_failure.sh \
            check-board-attention-exact-flow-boundary.sh \
            check-compaction-exact-flow-boundary.sh \
            check-doc-code-refs.sh \
            check-keeper-turn-content-boundary.sh \
            check-opam-lock-covers-deps.sh \
            check-tool-error-format.sh \
            check-turn-records-envelope-parity.sh \
            check-variants.sh
          do
            echo "::group::$s"
            case "$s" in
              *.py) python3 "scripts/$s" ;;
              *)    bash "scripts/$s" ;;
            esac
            echo "::endgroup::"
          done

      - name: Check doc truth
        if: needs.changes.outputs.doc_truth == 'true'
        run: |
          chmod +x scripts/check-doc-truth.sh scripts/audit-keeper-tool-boundary-matrix.sh
          scripts/check-doc-truth.sh
          scripts/audit-keeper-tool-boundary-matrix.sh

      - name: Run report self-test
        if: needs.changes.outputs.lib_deps == 'true'
        run: python3 scripts/lib_dep_report.py --self-test

      - name: Check Execute async surface contract
        run: bash scripts/check-execute-async-surface.sh

      - name: Sublib boundary gate self-test (RFC-0056 G1)
        if: needs.changes.outputs.lib_deps == 'true'
        run: python3 scripts/audit-sublib-cycle.py --self-test

      - name: Generate lib dependency delta
        if: needs.changes.outputs.lib_deps == 'true'
        run: bash scripts/lib_dep_delta_ci.sh

      - name: Upload lib dependency reports
        if: needs.changes.outputs.lib_deps == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lib-dependency-delta
          path: |
            reports/lib-dependency-graph.json
            reports/lib-dependency-graph.baseline.json
            reports/lib-dependency-summary.md
            reports/lib-dependency-summary.json

      - name: Validate spec line refs
        if: needs.changes.outputs.spec_refs == 'true'
        run: bash scripts/lint/spec-line-refs.sh

      - name: Check dashboard nav-event allowlist parity
        if: needs.changes.outputs.nav_event_parity == 'true'
        run: |
          chmod +x scripts/check-dashboard-nav-event-parity.sh
          scripts/check-dashboard-nav-event-parity.sh --check

      - name: Check sandbox dune version alignment
        run: |
          chmod +x scripts/check-sandbox-dune-version.sh
          scripts/check-sandbox-dune-version.sh

      - name: Check agent core ownership boundary
        run: |
          bash scripts/check-agent-core-boundary.sh
          bash test/test_agent_core_boundary.sh

      - name: Meta bug-class gates (SSOT, SIL, STR, BND)
        run: |
          chmod +x scripts/ci/*.sh
          echo "=== Running meta bug-class gates (see #9516 #9517 #9519 #9521) ==="
          bash scripts/ci/check-ssot-spawn-drift.sh
          bash scripts/check-spec-truth.sh
          python3 scripts/ci/check-spec-file-refs.py
          bash scripts/ci/check-silent-failure-patterns.sh
          python3 scripts/ci/check_h2_route_auth_parity.py
          bash scripts/ci/check-enum-string-safety.sh
          python3 scripts/ci/check-env-snapshot-default-drift.py
          bash scripts/ci/check-publication-recovery-test-boundary.sh
          bash scripts/ci/check-tla-variant-sync.sh
          bash scripts/ci/check-tla-harness-coverage.sh
          bash scripts/ci/check-telemetry-coverage.sh
          bash scripts/ci/check-determinism-contract.sh
          bash scripts/audit-hardcoding-truth.sh --fail-on-confirmed
          bash scripts/ci/check-credential-audits.sh
          bash scripts/ci/check-keeper-instructions-placeholders.sh
          bash scripts/ci/check-accept-fd-lifecycle.sh
          bash scripts/ci/check-actor-consumer-wired.sh
          bash scripts/ci/check-log-severity-anti-patterns.sh
          bash scripts/ci/check-stream-create-bounded.sh
          bash scripts/ci/check-drain-loop-yields.sh

      - name: Hardening ratchet (P0 evidence gate)
        run: |
          mkdir -p reports
          bash scripts/hardening-ratchet.sh \
            --check \
            --fail-on-critical \
            --json-out reports/hardening-ratchet.json

      - name: Upload hardening ratchet report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardening-ratchet
          path: reports/hardening-ratchet.json

  health:
    name: Health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-live-gate, changes]
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' && needs.changes.outputs.health == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install health shell dependencies
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq ripgrep bc

      - name: Fetch baseline for health ratchet
        if: needs.changes.outputs.health_snapshot == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            bash scripts/ci/git-fetch-retry.sh origin "${GITHUB_BASE_REF}" --depth=1
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_BEFORE}" ] && [ "${GITHUB_BEFORE}" != "${zero_sha}" ]; then
            bash scripts/ci/git-fetch-retry.sh origin "${GITHUB_BEFORE}" --depth=1
          else
            echo "No health baseline ref for ${GITHUB_EVENT_NAME}; snapshot will run without ratchet gating"
          fi

      - name: Run health snapshot
        if: needs.changes.outputs.health_snapshot == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          chmod +x scripts/health_snapshot.sh scripts/anti-fake-audit.sh scripts/base-policy-audit.sh
          zero_sha="0000000000000000000000000000000000000000"
          baseline_ref=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            baseline_ref="origin/${GITHUB_BASE_REF}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_BEFORE}" ] && [ "${GITHUB_BEFORE}" != "${zero_sha}" ]; then
            baseline_ref="${GITHUB_BEFORE}"
          fi

          if [ -n "${baseline_ref}" ]; then
            bash scripts/health_snapshot.sh \
              --skip-build \
              --json-out .health/health-snapshot.json \
              --baseline-ref "${baseline_ref}" \
              --fail-on-lib-regression
          else
            bash scripts/health_snapshot.sh \
              --skip-build \
              --json-out .health/health-snapshot.json \
              --baseline-file .ci/health-baseline.json
          fi

      - name: Upload health snapshot
        if: needs.changes.outputs.health_snapshot == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: health-snapshot
          path: .health/health-snapshot.json

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    # Focused group deadlines total 93 minutes when agent-core is selected
    # (paused-work 10, board-attention-worker 3, normal 20, newly-wired 5,
    # mcp-tool-matrix 15, agent-core 15, operator-control 10, sse 15).
    # Setup and the dune build take 12 minutes (run 32634585750: 10:45:48 to
    # 10:57:15), so a run where every group uses its full budget ends at
    # 105 minutes. The job timeout sits above that so scripts/ci-run-tests.sh
    # prints its timeout diagnostics before GitHub ends the job.
    timeout-minutes: 110
    needs: [pr-live-gate, changes]
    # Main-push safety-net (mirrors `dashboard` job below). Non-PR events
    # (branch push to main/develop, workflow_dispatch) always run Build and Test
    # so a lib/ regression introduced by a non-build-path change (e.g. a dashboard-only
    # merge) is detected on the next main push instead of persisting silently
    # behind a green "CI Gate" — ci-gate check() treats a skipped required job as
    # PASS. Tag pushes do not start this workflow because `on.push.branches`
    # excludes tags. PR events keep the build-scope gate (cost saving)
    # unchanged. The `needs.changes.result == 'success'` clause is intentional:
    # Build consumes `changes` outputs, so a failed/skipped changes job should
    # not synthesize default build inputs even though `always()` keeps this
    # condition evaluable.
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' && (needs.changes.outputs.build == 'true' || needs.pr-live-gate.outputs.live_state == 'NON_PR') }}
    # Test execution policy (hard-required focused suites):
    #   - `continue-on-error` is intentionally absent: compile failures and
    #     every focused test suite are merge-blocking.
    #   - Each suite runs exactly once. scripts/ci-run-tests.sh reports
    #     heartbeat, disk pressure, process state, and failure diagnostics.
    #   - Focused groups have explicit fail-closed deadlines; this job timeout
    #     is the final safety boundary for setup, compilation, and all suites.
    steps:
      - name: Free disk space
        # ubuntu-latest starts with roughly 14 GB free but preinstalls the
        # Android SDK (~9 GB), .NET (~1.6 GB), GHC/Haskell (~1 GB) and the
        # CodeQL bundle (~5 GB) that this OCaml build never uses. Removing them
        # reclaims about 15 GB and prevents the recurring "No space left on
        # device" failures in this job (heavy dune build, _build artifacts and
        # test runners exceed the default free space; runs 28638901622 /
        # 28644587505 / 28652695346 all died this way on 2026-07-03). This is a
        # preventive measure that complements the non-retryable repair guidance
        # emitted by scripts/ci-run-tests.sh. Alternative considered and
        # rejected for cost: a paid larger runner.
        # See: https://github.com/jeong-sik/masc/issues/22954
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-bisect

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep

      - name: Install grpcurl
        env:
          GRPCURL_VERSION: "1.9.3"
          GRPCURL_SHA256: "a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5"
        run: |
          set -euo pipefail

          asset="grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          url="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/${asset}"
          archive="${RUNNER_TEMP}/${asset}"
          bin_dir="${RUNNER_TEMP}/grpcurl-bin"

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors "${url}" -o "${archive}"
          (cd "${RUNNER_TEMP}" && printf '%s  %s\n' "${GRPCURL_SHA256}" "${asset}" | sha256sum -c -)

          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" grpcurl
          chmod +x "${bin_dir}/grpcurl"
          echo "${bin_dir}" >> "$GITHUB_PATH"
          "${bin_dir}/grpcurl" -version

      - name: Build
        id: build_step
        env:
          # Public ubuntu-latest runners provide four CPUs and 16 GB RAM. Use
          # all four for the compile-only graph; focused behavior suites below
          # remain serial because some own fixed ports and shared fixtures.
          # Disk pressure is handled by the cleanup step before checkout.
          DUNE_JOBS: "4"
        # NO continue-on-error: dune build is deterministic and must hard-fail.
        # Focused test execution steps below are also required: any failing
        # suite fails the Build and Test job and blocks merge via the CI Gate.
        # See: PR #11721 followup, memory feedback_admin_merge_can_bypass_build_ci.md.
        run: |
          set -euo pipefail

          # @default alone does not compile test dirs outside the executed
          # runtest subset, so a PR that breaks test compilation can land
          # green (#23196/#23211/#23353 landed that way on 2026-07-04~06).
          # @check compiles every library/executable/test without running.
          # @install adds the public package/install surface that Lint used to
          # compile independently. The root dune env is the warning-as-error
          # SSOT, so this one cacheable rule graph is authoritative for all
          # three surfaces.
          opam exec -- dune build --root . @default @check @install &
          build_pid=$!

          (
            elapsed=0
            while kill -0 "${build_pid}" 2>/dev/null; do
              sleep 60
              elapsed=$((elapsed + 60))
              if kill -0 "${build_pid}" 2>/dev/null; then
                echo "[ci-heartbeat] dune build still running (${elapsed}s elapsed)"
              fi
            done
          ) &
          heartbeat_pid=$!

          set +e
          wait "${build_pid}"
          build_status=$?
          set -e

          kill "${heartbeat_pid}" 2>/dev/null || true
          wait "${heartbeat_pid}" 2>/dev/null || true
          exit "${build_status}"

      - name: Run source quickstart onboarding smoke
        run: scripts/quickstart-smoke.sh

      - name: Run typed functional-core boundary audit
        env:
          OCAML_BOUNDARY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && 'origin/main' || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/ci/git-fetch-retry.sh origin "${{ github.base_ref }}"
            # This job checks out shallow (no fetch-depth), so fetching the
            # base branch brings its tip and nothing behind it. The ratchet
            # wants pull_request.base.sha, which is an ancestor of that tip on
            # a PR whose base branch has moved on, so it stays absent and the
            # ratchet hard-fails with "base revision is unavailable". Fetch the
            # exact commit; depth 1 is enough because the ratchet only reads
            # two files at that revision, never its history.
            if ! git cat-file -e "${OCAML_BOUNDARY_BASE_REF}^{commit}" 2>/dev/null; then
              bash scripts/ci/git-fetch-retry.sh \
                origin "${OCAML_BOUNDARY_BASE_REF}" --depth=1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            bash scripts/ci/git-fetch-retry.sh \
              origin \
              "+refs/heads/main:refs/remotes/origin/main"
          fi
          opam exec -- dune build --root . @tools/ocaml_boundary_audit/runtest
          bash scripts/ocaml-boundary-ratchet.sh

      - name: Run runtime deployment preflight self-test
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        env:
          MASC_DEPLOYMENT_PREFLIGHT_HELPER: ${{ github.workspace }}/_build/default/bin/deployment_preflight_helper.exe
        run: scripts/check-runtime-deployment-preflight.sh --self-test

      - name: Check keeper event queue projection boundary
        # This parser uses compiler-libs directly, so keep it beside the sole
        # OCaml toolchain instead of bootstrapping another toolchain in Lint.
        run: |
          chmod +x scripts/check-keeper-event-queue-projection-boundary.sh
          scripts/check-keeper-event-queue-projection-boundary.sh

      - name: Library boundaries against resolved Dune graphs
        # The self-test (in the Meta Guards job) only validates the checker
        # against synthetic fixtures. This step runs the SAME checker against
        # the REAL dependency graph emitted by `dune describe`, asserting that
        # the extracted leaf libraries (masc_goal, attribution, exec_policy,
        # keeper_state, masc_tool_dispatch) never re-acquire a transitive
        # `requires` edge back into the flat mega-library `masc`.
        #
        # Hard-fail (no continue-on-error): a future PR that re-couples a leaf
        # to the mega-lib via its dune (libraries ...) must block merge. As of
        # wiring (2026-06-04) the real graph is CLEAN, so --fail mode is safe.
        #
        # Why here and not next to the self-test (Meta Guards, ~L385): that job
        # is shell-only (ripgrep, no OCaml toolchain). `dune describe` requires
        # the toolchain that only this Build job sets up. We invoke dune through
        # `opam exec` (bare `dune` is not on PATH in CI) and feed the captured
        # describe sexp to the pure-python checker via --describe-file.
        # See: docs/rfc/RFC-0056-incremental-sublib-extraction.md G1, #19824.
        run: |
          opam exec -- dune describe workspace \
            --root . --format sexp --lang 0.1 \
            > "$RUNNER_TEMP/sublib-describe.sexp"
          python3 scripts/audit-sublib-cycle.py \
            --describe-file "$RUNNER_TEMP/sublib-describe.sexp"

          # Restrict Dune's project roots to Agent Core, then inspect the
          # resolved dependency closure. Installed dependencies are explicit
          # `local false` nodes; any `local true` library owned elsewhere in
          # the workspace is a reverse MASC dependency. --with-pps also places
          # compile-time PPX libraries in this restricted closure.
          opam exec -- dune describe workspace packages/agent_core \
            --root . --format sexp --lang 0.1 --with-pps \
            > "$RUNNER_TEMP/agent-core-describe.sexp"
          python3 scripts/audit-sublib-cycle.py \
            --describe-file "$RUNNER_TEMP/agent-core-describe.sexp" \
            --closed-source-root packages/agent_core \
            --required-local-library masc.agent_core

          # Every file below packages/agent_core already triggers this Build
          # proof. A Dune include could move a library stanza to an arbitrary
          # file outside that classifier, so use Dune's own parser/formatter
          # and keep the package plus active ancestor Dune files include-free.
          # Introducing the first include necessarily changes a classified
          # dune file, so this check closes the input set inductively.
          for control_file in packages dune-project dune-workspace packages/dune-project; do
            if [[ -L "$control_file" ]]; then
              echo "agent-core boundary: symlinked control input is forbidden: $control_file" >&2
              exit 1
            fi
          done
          while IFS= read -r dune_file; do
            if [[ -L "$dune_file" ]]; then
              echo "agent-core boundary: symlinked Dune input is forbidden: $dune_file" >&2
              exit 1
            fi
            if [[ "$(head -c 20 "$dune_file")" == '(* -*- tuareg -*- *)' ]]; then
              echo "agent-core boundary: OCaml-syntax Dune file is forbidden: $dune_file" >&2
              exit 1
            fi
            formatted="$RUNNER_TEMP/agent-core-formatted.dune"
            opam exec -- dune format-dune-file "$dune_file" > "$formatted"
            if rg -n '^[[:space:]]*\((dynamic_)?include([[:space:]]|$)' "$formatted"; then
              echo "agent-core boundary: Dune include stanza is forbidden: $dune_file" >&2
              exit 1
            fi
          done < <(
            {
              find packages/agent_core -type f \
                \( -name dune -o -name dune-file \) -print
              printf '%s\n' dune
              [[ ! -f packages/dune && ! -L packages/dune ]] \
                || printf '%s\n' packages/dune
              [[ ! -f dune-file && ! -L dune-file ]] \
                || printf '%s\n' dune-file
              [[ ! -f packages/dune-file && ! -L packages/dune-file ]] \
                || printf '%s\n' packages/dune-file
            } | LC_ALL=C sort -u
          )

      - name: Runtime TOML validity gate
        # RFC-0058 §9: config/keeper_runtime.toml is the authoring SSOT.
        # runtime.json is no longer generated or committed, so the old
        # runtime_materialize CLI is retired. This focused test renders
        # the TOML in memory, validates the declarative catalog, and
        # proves config/runtime.json has not reappeared as a tracked
        # second source of truth.
        # See: test/test_runtime_config_validity.ml.
        run: |
          opam exec -- dune build --root . @test/runtest-test_runtime_config_validity

      - name: Run workspace backlog revision ratchet
        # The backlog revision is stamped once at the commit point; this suite
        # pins exactly-one bump per commit (a surviving manual bump surfaces as
        # +2) and the decoder's absent-vs-corrupt split. An unwired ratchet does
        # not bite, so it runs here.
        # Runs the "revision" suite only: the rest of the coverage file
        # carries two latent reds on main (verdict-commit audit gap,
        # #26445) that predate this PR. Alcotest exits non-zero when
        # the name matches no suite, so a suite rename cannot silently
        # unwire this step.
        # claim_next is wired for the same reason: the single-claim refusal
        # carries its own correction hint (masc_transition action=release),
        # which keeper.md no longer restates. An unrun assertion would let
        # that hint rot back out of the message.
        run: |
          opam exec -- dune exec --root . test/test_workspace_coverage.exe -- test revision
          opam exec -- dune exec --root . test/test_workspace_coverage.exe -- test claim_next

      - name: Run fusion official-client panel routing suite
        # @check compiles this suite but never runs it, and its whole point is
        # a wiring assertion: the execution case spawns a stub client and fails
        # if the panelist never reached it. Compiled-but-unrun, it would keep
        # passing with the split deleted from fusion_panel.ml — which is the
        # regression it exists to catch.
        # See: test/test_fusion_official_client_panel.ml.
        run: |
          opam exec -- dune build --root . @test/runtest-test_fusion_official_client_panel

      - name: Run MCP authentication contract suites
        # @check compiles these suites but never runs them. Exercise both the
        # dual-auth admission path and the typed HTTP/JSON-RPC auth envelope so
        # a transport can neither lose the code nor pass with dead assertions.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_auth \
            @test/runtest-test_auth_oauth \
            @test/runtest-test_server_oauth_protocol \
            @test/runtest-test_server_auth_dashboard_actor_resolution \
            @test/runtest-test_caller_identity_credential_binding \
            @test/runtest-test_error_body_wire_shape \
            @test/runtest-test_mcp_error_code \
            @test/runtest-test_tool_registry_consistency \
            @test/runtest-test_tool_spec \
            @test/runtest-test_tool_shard_coverage \
            @test/runtest-test_tool_board_coverage \
            @test/runtest-test_tool_task_coverage \
            @test/runtest-test_tool_workspace_coverage \
            @test/runtest-test_tool_misc_coverage \
            @test/runtest-test_tool_misc_web_fetch

      - name: Run completion-authority lookup surface suite
        # The judge's lookup tools reach the filesystem and Git inside a
        # producer's root. @check compiles the containment cases but does not
        # run them, so "cannot read outside the root" and "a dirty tree is not
        # reported as clean" were assertions nothing executed — both compile
        # whether or not they hold.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_verification_authority_tools

      - name: Run invariant and SSOT guard suites
        # These assert on repository shape -- baselines, mirrors, vocabulary
        # parity, path SSOTs -- rather than on behaviour, so @check compiles
        # them and nothing runs them. A guard that never runs stops guarding:
        # test_masc_dirname_ssot sat red on main for a week for exactly this
        # reason (#27117), and #26075 found the same shape by tripping over it.
        #
        # Every suite here was executed against origin/main before being added.
        # Two more guards in this family are red today and are deliberately
        # NOT listed, so this step cannot go green by ignoring them:
        # test_keeper_identity_drift_counter,
        # test_keeper_supervisor_persona_drift_order (#26075 comment).
        # test_keeper_runtime_contract left this list by deletion: it only
        # covered the goal-scoped claim filter, which no longer exists.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_assertion_kind_mirror \
            @test/runtest-test_base_path_prod_guard \
            @test/runtest-test_bind_required_guard_counter \
            @test/runtest-test_board_persistence_load_contract \
            @test/runtest-test_clean_only_bug_mirrors \
            @test/runtest-test_contract_harness_auth_script \
            @test/runtest-test_eio_guard_yield_meter \
            @test/runtest-test_run_registry_concurrent_mutation \
            @test/runtest-test_event_bus_subscription_contract \
            @test/runtest-test_fs_compat_home_guard \
            @test/runtest-test_guarded_dispatch_telemetry \
            @test/runtest-test_owned_read_cwd \
            @test/runtest-test_keeper_capability_probe \
            @test/runtest-test_keeper_checkpoint_stale_guard \
            @test/runtest-test_keeper_contract_classifier_pure \
            @test/runtest-test_keeper_conditions_wire_parity \
            @test/runtest-test_keeper_fsm_guard_actions \
            @test/runtest-test_keeper_hitl_replay_delivery \
            @test/runtest-test_keeper_invariant \
            @test/runtest-test_keeper_invocation_contract_hints \
            @test/runtest-test_keeper_path_ssot \
            @test/runtest-test_keeper_phase_drift_contract \
            @test/runtest-test_keeper_tool_error_text_bounded \
            @test/runtest-test_keeper_transition_audit \
            @test/runtest-test_keeper_turn_fsm_tla_parity \
            @test/runtest-test_keepers_runtime_dir_ssot \
            @test/runtest-test_mcp_h1_h2_admission_parity \
            @test/runtest-test_masc_dirname_ssot \
            @test/runtest-test_masc_test_runtime \
            @test/runtest-test_nickname_words_ssot \
            @test/runtest-test_agent_core_message_constructor_contract \
            @test/runtest-test_otel_port_ssot \
            @test/runtest-test_prompt_asset_sync \
            @test/runtest-test_prompt_registry_defaults \
            @test/runtest-test_pr_sync_script \
            @test/runtest-test_release_train_guard_script \
            @test/runtest-test_rfc_0086_keeper_namespace_invariant \
            @test/runtest-test_server_base_path_guard \
            @test/runtest-test_sse_retry_ssot \
            @test/runtest-test_sse_stream \
            @test/runtest-test_task_cache_invariant_13397 \
            @test/runtest-test_task_status_vocabulary \
            @test/runtest-test_board_tool_toml_parity \
            @test/runtest-test_goal_tool_toml_parity \
            @test/runtest-test_tool_contract_truth \
            @test/runtest-test_tool_definition_toml \
            @test/runtest-test_voice_command_descriptor_parity

      - name: Run goal-scope terminal-phase suite
        # validate_active_goal_ids is where a keeper's declared goal scope meets
        # the live store, and everything downstream reads the list it returns.
        # The prompt and the world observation filter the same list by phase, so
        # a Completed goal left in scope makes the two disagree -- for 2.5 days
        # on the live workspace before this was closed.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_claimable_task_summaries

      - name: Run goal phase suite
        # decide_transition is a 6x11 matrix (RFC-0387 stage 2 added Verifying
        # and the four gate actions). Its exhaustive match proves every pair
        # has an arm, not that the arm gives the right answer -- so a matrix
        # edit could change what the Goal FSM admits without anything going
        # red. The suite states all 66 pairs.
        # test_goal_verification_gate pins the RFC-0387 surface around the
        # same lifecycle: B1 creation requires a declared success condition,
        # the verification ledger is strict/fail-closed/fail-loud, and the
        # stage-2 gate routes request_complete through Verifying with the
        # durable proof request persisted before the phase write.
        # test_goal_verification_agent drains the ledger's pending rows via
        # the verifier_exact lane: verdicts commit through the transition
        # handler, failures leave the row durable, and a wedged
        # Verifying/idle pair is re-armed before review.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_goal_phase_all \
            @test/runtest-test_goal_verification_gate \
            @test/runtest-test_goal_verification_agent \
            @test/runtest-test_goal_verification_run_registry

      - name: Run metric zero-cell declaration suite
        # A counter emitted as a bare string still compiles and still counts;
        # what it loses is the 0-cell, and only a running store shows that.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_metric_zero_cell_declaration

      - name: Run library resource topic resolution suite
        # The topic comes from the client's URI. Before the fix it was
        # concatenated onto docs/library and read, so library/../<name>
        # reached a file outside that directory, and the bare "library"
        # prefix plus a fixed offset of 8 read libraryfoo as topic "oo".
        # Both cases fail on the pre-fix tree.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_library_resource_topic

      - name: Run transport metrics snapshot suite
        # The health snapshot reads counters through metric_value_or_zero, so a
        # field naming a metric that does not exist is emitted as 0 rather than
        # failing. #27285 removed two such fields after they had reported 0/0
        # for their whole life. The suite asserts the counters advance, which is
        # what separates a live field from a dead one, and no transport suite
        # was wired into any target list -- @check compiled this and nothing
        # ran it. Green on this branch, 26/26.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_transport_metrics

      - name: Run websocket transport suite
        # test_ws_transport sat red for 17 days and nothing reported it: #25500
        # deleted the goal_loop_status -> "goals" mapping the delta-payload test
        # was written against, and no target list names this suite, so @check
        # compiled it and nothing ran it. It covers the delta/raw-forward split,
        # the shared-payload cache, and the slice vocabulary -- the surface
        # #27285 rewrote. Green on this branch, 64/64.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_ws_transport

      - name: Run connector observability label contract
        # These strings are metric label values, so a rename is a wire change
        # that compiles. @check cannot catch that, and test_discord_observability
        # was never wired into any target list, so nothing was running here at
        # all. It passes 8/8 on this branch, so it joins rather than staying in
        # the #26075 inventory.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_gate_connector_observability \
            @test/runtest-test_discord_observability

      - name: Run Discord API version pinning suites
        # The version now has one definition, and these two suites are what
        # holds it: test_discord_gateway_state asserts Open_wss carries
        # ?v=10, test_discord_rest_client asserts the /api/v10 paths. Both
        # already made those assertions and neither ran in CI, so a bump
        # could land with the assertions untouched. 33 + 118 pass here.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_discord_gateway_state \
            @test/runtest-test_discord_rest_client

      - name: Run repos relative-path suite
        # The stored default must stay relative: Repo_store.local_path concats
        # it onto the base path, so an absolute value resolves twice.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_repos_relative_path

      - name: Run RFC 3339 writer suite
        # @check compiles this one but never runs it, and its whole job is to
        # catch a silent divergence: a delegate drifting from the owner, or the
        # writer emitting something Time_codec.parse_rfc3339 cannot read back.
        # Neither shows up as a compile error.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_rfc3339_format_owner

      - name: Run JSONL day-key suite
        # The key and the writer's path have to name the same day. A reader
        # that drifts does not error -- it filters a layout the writer does
        # not produce and comes back empty, which @check cannot see.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_jsonl_day_key

      - name: Run memory journal projection suite
        # The librarian's failed passes reach the dashboard through this
        # projection. A torn line presented as a commit would make a damaged
        # journal read as a healthy shorter one, and that compiles either way.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_keeper_memory_journal_projection

      - name: Run operator note lifetime suite
        # RFC-0366. A note that renders twice is a standing rule the operator
        # never wrote — the #26729 shape. @check compiles "renders once then
        # never again" whether or not it holds, so the suite has to run.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_keeper_operator_note

      - name: Run prompt capture round-trip suite
        # The assembled extra system context reaches disk as text here. @check
        # compiles the cases but does not run them, and "an unknown block id
        # must not decode short" compiles whether or not it holds. The write
        # path also degrades to a warning by design, so a broken capture is
        # silent unless a test exercises it.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_keeper_prompt_capture

      - name: Run raw-trace reader containment suite
        # This surface takes a caller-supplied file name and reads inside a
        # keeper's directory. @check compiles the containment cases but does not
        # run them, and "../secret.jsonl must not resolve" compiles whether or
        # not it holds.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_keeper_raw_trace_reader

      - name: Run raw-trace sink retention suite
        # Retention deletes any trace no TurnRecord names, so the reference a
        # turn records decides whether its trace still exists when someone
        # goes looking. @check compiles those cases; only running them shows
        # whether a failed turn still names the run its sink closed.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_keeper_raw_trace_sink

      - name: Run env snapshot applied-default suite
        # Asserts through the JSON operators actually receive. The script gate
        # cannot cover this knob any more -- the fix removed the literals it
        # compares -- so the property moved here.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_env_snapshot_reports_applied_default

      - name: Run JSONL retention getter contract suite
        # Pins the digest fallback contract: the getter must report a
        # non-positive override as-is (that's how "pruning disabled" reaches
        # the caller) while the exported default stays positive (the bound a
        # caller substitutes instead). @check compiles this but does not run
        # it, and the PR that introduced the getter tripped this exact
        # failure mode once -- the getter silently swallowed the override and
        # returned the default instead.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_jsonl_retention_window

      - name: Run keeper lane launch-order AST suite
        # Asserts on lib/keeper sources through Ast_grep, so @check cannot run
        # it. It sat outside every target list while one of its counts was
        # already wrong, which is how the two lane-start paths drifted into
        # forking different sidecar sets.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_keeper_keepalive_launch_order_ast

      - name: Run Keeper owner and chat operation suites
        # #27962 put every Keeper mutation and chat turn behind one owner actor.
        # @check compiles the suites and runs neither, so one-running-turn and
        # restart settlement were assertions nothing executed. A gate that can
        # hold a fleet out of ready has to run where a red result blocks the
        # merge.
        #
        # The chat cutover preflight target left with the boot gate in #28007;
        # dune hard-fails on an alias it cannot resolve, so the retired target
        # cannot stay listed here.
        #
        # test_keeper_autoboot_single_owner is deliberately absent here: it is
        # already invoked from scripts/ci-run-focused-tests.sh, the second CI
        # target source, and audit-ci-test-targets.sh rejects a target that two
        # manifests run.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_keeper_owner \
            @test/runtest-test_keeper_chat_operation_http \
            @test/runtest-test_keeper_wire_terminal

      - name: Run memory journal suite
        # The journal is the only disk record of a librarian pass that produced
        # no snapshot. @check compiles this suite but does not run it, and an
        # unrun decoder guard is not a guard: the cases that matter here assert
        # that an unknown outcome or kind rejects rather than folding into a
        # permissive default, which compiles either way.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_librarian_journal_failures

      - name: Run enum mirror sync guard
        # This PR exists because the enum mirrors claimed a sync regression
        # test that no file implemented. Wiring the guard into a run step is
        # what makes it a guard instead of another compile-only citation.
        run: |
          opam exec -- dune build --root . \
            @test/runtest-test_enum_mirror_sync

      # NOTE: the "Shell IR differential-safety harness gate" step was removed
      # here. #24332 (nonhierarchical Gate refactor) retired the entire
      # shell_ir risk/typed subsystem (Shell_ir_risk, Shell_ir_typed,
      # checked_shell_ir — now zero consumers; exec risk moved to the Gate),
      # including lib/exec/test/test_shell_ir_differential.ml. The orphaned
      # gate built @lib/exec/test/runtest-test_shell_ir_differential, an empty
      # alias, hard-failing main (issue #24352). Restoring is infeasible (the
      # tested subsystem is gone); removing the dead gate completes #24332.
      - name: SSE TypeScript codegen drift gate
        # RFC-0004 Phase A0.2 PR-2: dashboard/src/schemas/sse_event_generated.ts
        # is regenerated by atdts from lib/sse_event/sse_event.atd
        # (lib SSOT established in Phase A0.1).  If the .atd changes
        # without re-running the codegen script, the committed .ts
        # drifts and dashboard consumers parse against a stale schema.
        # See: dashboard/scripts/gen-sse-types.sh, RFC-0004 Phase A0.2.
        run: |
          chmod +x dashboard/scripts/gen-sse-types.sh
          opam exec -- dashboard/scripts/gen-sse-types.sh --check

      # Compile-only @check above and this focused runner form one authority:
      # every listed behavior suite executes exactly once. The runner batches
      # aliases by environment contract so Dune loads the already-built graph
      # five times instead of once per suite.
      - name: Run focused OCaml behavior suites
        id: focused_ocaml_behavior_suites
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        env:
          RUN_AGENT_CORE: ${{ needs.changes.outputs.agent_core }}
        run: scripts/ci-run-focused-tests.sh

      - name: Run transport harness suite
        id: transport_harness_suite
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        env:
          ME_ROOT: /tmp/me
          CI_TEST_HEARTBEAT_SEC: 15
          DUNE_JOBS: 1
        run: |
          mkdir -p /tmp/me
          chmod +x scripts/ci-run-tests.sh
          chmod +x scripts/harness/transport/run_all.sh
          chmod +x scripts/harness/transport/verify_sse.sh
          chmod +x scripts/harness/transport/verify_grpc_subscribe.sh
          chmod +x scripts/harness/transport/verify_h2c_autodetect.sh
          chmod +x scripts/harness/transport/verify_ws.sh
          chmod +x scripts/harness/lib/server_bootstrap.sh
          scripts/ci-run-tests.sh "bash scripts/harness/transport/run_all.sh"

      - name: Run contract harness suite
        id: contract_harness_suite
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        env:
          ME_ROOT: /tmp/me
          CI_TEST_HEARTBEAT_SEC: 15
          DUNE_JOBS: 1
        run: |
          mkdir -p /tmp/me
          chmod +x scripts/ci-run-tests.sh
          chmod +x scripts/harness/contract/run_all.sh
          chmod +x scripts/harness/lib/server_bootstrap.sh
          scripts/ci-run-tests.sh "scripts/harness/contract/run_all.sh"

      # This smoke is the only gate that boots the installed binary against the
      # release-evidence config fixture. Running it solely on push-to-main made
      # it structurally invisible to review: #25671 added a mandatory
      # exact-output lane, every PR check was green, and main then failed on
      # every push for ~29 hours (#25663). Running it on pull_request too moves
      # that failure into the PR that causes it. It is a ~10s local boot against
      # a dead-port fixture with keeper bootstrap disabled, so it issues no
      # provider call and needs no credential.
      - name: Boot release evidence smoke (PR)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x scripts/release-evidence.sh
          mkdir -p .release-evidence
          scripts/release-evidence.sh \
            _build/default/bin/main_eio.exe \
            .release-evidence/pr-release-evidence.md

      - name: Generate main release evidence bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x scripts/release-evidence.sh
          mkdir -p .release-evidence
          scripts/release-evidence.sh \
            _build/default/bin/main_eio.exe \
            .release-evidence/main-release-evidence.md

      - name: Generate trusted-dispatch release evidence bundle
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.ref_protected == true
        run: |
          chmod +x scripts/release-evidence.sh
          mkdir -p .release-evidence
          scripts/release-evidence.sh \
            _build/default/bin/main_eio.exe \
            .release-evidence/trusted-dispatch-release-evidence.md

      - name: Verify Keeper full-lifecycle evidence bundle
        if: >-
          (github.event_name == 'pull_request') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            github.ref_protected == true
          )
        run: |
          python3 scripts/keeper-full-lifecycle-evidence.py \
            --verify \
            --output-dir .release-evidence/keeper-full-lifecycle

      - name: Upload PR release evidence
        if: ${{ always() && github.event_name == 'pull_request' && steps.build_step.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-pr-${{ github.event.pull_request.number }}
          path: .release-evidence/
          include-hidden-files: true

      - name: Upload main release evidence
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build_step.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-main
          path: .release-evidence/
          include-hidden-files: true

      - name: Upload trusted-dispatch release evidence
        if: >-
          ${{
            always() &&
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            github.ref_protected == true &&
            steps.build_step.outcome == 'success'
          }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-evidence/
          include-hidden-files: true

      - name: Config diagnostic drift report
        if: ${{ always() && steps.build_step.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -f _build/default/bin/main_eio.exe ]; then
            echo "::group::Config diagnostic report"
            _build/default/bin/main_eio.exe diagnostic config --json || true
            echo "::endgroup::"
          else
            echo "::notice::main_eio.exe not found, skipping config-diagnostic"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Source ratchets and proto drift are shell/Python-only after the product
    # compile authority moved to Build and Test.
    timeout-minutes: 20
    needs: [pr-live-gate, changes]
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' && needs.changes.outputs.lint == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install lint dependencies
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq ripgrep protobuf-compiler

      - name: Run #8605 family detector
        run: bash scripts/lint/no-unknown-permissive-default.sh

      - name: Run yojson option-field [@default None] lint
        run: python3 scripts/lint/yojson-option-default.py

      - name: Run OCaml docstring bare escape-quote lint
        run: bash scripts/lint/no-docstring-escape-quote.sh

      - name: Run dashboard hardcoded-color lint
        run: bash scripts/lint/no-hardcoded-colors-dashboard.sh

      - name: Run dashboard keeper-state SSOT lint (RFC-0135 §9)
        run: bash scripts/lint/dashboard-ssot-keeper-state.sh

      - name: Run dashboard agent-status SSOT lint (RFC-0139 §10)
        run: bash scripts/lint/dashboard-ssot-agent-status.sh

      - name: Check Eio conventions
        run: |
          chmod +x scripts/check-eio-conventions.sh
          scripts/check-eio-conventions.sh

      - name: Check feature flag consistency
        run: |
          chmod +x scripts/check-feature-flag-consistency.sh
          scripts/check-feature-flag-consistency.sh

      - name: Check Keeper runtime setting registry
        run: |
          chmod +x scripts/check-keeper-runtime-setting-registry.sh
          scripts/check-keeper-runtime-setting-registry.sh

      - name: Check TOML syntax
        run: |
          chmod +x scripts/check-toml-syntax.sh
          scripts/check-toml-syntax.sh

      - name: Check Ollama capability drift (RFC-0265)
        # Compares config/runtime.toml declared media caps against the committed
        # /api/show baseline (scripts/ollama-caps-baseline.json). No network:
        # refresh the baseline with --refresh (operator) when Ollama changes a model.
        run: python3 scripts/masc-sync-ollama-caps.py --check

      - name: Check YAML syntax
        run: python3 scripts/ci/check-yaml-syntax.py

      - name: Check keeper prompt paths drift (#6527 iter9)
        run: |
          chmod +x scripts/validate-prompt-paths.sh
          scripts/validate-prompt-paths.sh

      - name: Check Agent core boundary
        run: |
          chmod +x scripts/check-boundary-guard.sh
          scripts/check-boundary-guard.sh

      - name: Check boundary-guard .mli pairing (sweep-miss gate)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          chmod +x scripts/check-boundary-guard-mli-pairs.sh
          scripts/check-boundary-guard-mli-pairs.sh

      - name: Check SSOT bypass ratchet (#8462)
        run: |
          chmod +x scripts/check-ssot.sh
          scripts/check-ssot.sh

      - name: Check gRPC proto descriptor drift
        run: |
          chmod +x scripts/gen-grpc-descriptors.sh
          scripts/gen-grpc-descriptors.sh --check

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-live-gate, changes]
    # PR mode: stay path-scoped (dashboard=true when dashboard/ changes, or
    # when a lib-side SSE wire-surface file changes — see the wire-surface
    # census block in the `changes` job; #28925 audit defect (a)).
    # Non-PR events (push to main/develop, schedule, workflow_dispatch):
    # ignore path scope and always run, so a dashboard test regression
    # introduced by a non-dashboard-path change (e.g. a shared-type refactor,
    # or a dashboard-touching PR merged via admin fast-track while
    # the dashboard job was red) is detected on the next main/develop push
    # rather than persisting silently. Same main-push safety-net pattern as
    # tla-main.yml; root cause:
    # keeper-fsm-specs.test.ts / keeper-composite.test.ts sat red on main
    # after #14252/#14380 because no main-push run re-checked them.
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' && (needs.changes.outputs.dashboard == 'true' || needs.pr-live-gate.outputs.live_state == 'NON_PR') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The gate counts with ripgrep, and its counts swallowed a missing binary
      # as zero, so this job passed on a runner without rg while real drift sat
      # in the tree (#27965). The script now refuses to run without it; install
      # it so the refusal never triggers here.
      - name: Install ripgrep
        run: |
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y -qq ripgrep

      - name: Run drift gate
        run: scripts/dashboard-drift-check.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack and install pnpm
        run: corepack enable && corepack prepare pnpm@10.31.0 --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        working-directory: dashboard
        run: pnpm run typecheck

      # Nothing ran pnpm lint before this, which is how three
      # no-nested-ternary errors reached main and stayed there (#29054).
      - name: ESLint
        working-directory: dashboard
        run: pnpm lint

      - name: Run dashboard tests
        working-directory: dashboard
        run: pnpm test

      - name: Install Playwright Chromium
        working-directory: dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Keeper queued-stream Playwright E2E
        id: keeper_queued_stream_e2e
        working-directory: dashboard
        env:
          KEEPER_QUEUED_STREAM_ARTIFACT_DIR: ${{ runner.temp }}/keeper-queued-stream
        run: pnpm test:e2e:queued-stream

      - name: Upload Keeper queued-stream screenshots
        if: ${{ always() && !cancelled() && steps.keeper_queued_stream_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: keeper-queued-stream-screenshots
          path: ${{ runner.temp }}/keeper-queued-stream/*.png
          if-no-files-found: warn

      - name: Run Keeper lane-timeline Playwright E2E
        id: keeper_lane_timeline_e2e
        working-directory: dashboard
        env:
          KEEPER_LANE_TIMELINE_ARTIFACT_DIR: ${{ runner.temp }}/keeper-lane-timeline
        run: pnpm test:e2e:keeper-lane

      - name: Upload Keeper lane-timeline screenshots
        if: ${{ always() && !cancelled() && steps.keeper_lane_timeline_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: keeper-lane-timeline-screenshots
          path: ${{ runner.temp }}/keeper-lane-timeline/*.png
          if-no-files-found: warn

  structure-ratchet:
    name: OCaml Structure Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pr-live-gate, changes]
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' && (needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.keeper_cwd == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep
        run: sudo apt-get install -y -qq ripgrep

      - name: Run OCaml structure ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/ocaml-structure-ratchet.sh

      - name: Run stringly boundary ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/stringly-boundary-ratchet.sh

      - name: Run model-prose scanner self-test
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: python3 scripts/model-prose-scan.py --self-test

      - name: Run model-prose ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/model-prose-ratchet.sh

      - name: Run exact-flow boundary checks
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true' || needs.changes.outputs.dashboard == 'true'
        run: |
          scripts/check-hitl-exact-flow-boundary.sh --self-test
          scripts/check-hitl-exact-flow-boundary.sh --check

      - name: Run keeper tool boundary matrix ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/audit-keeper-tool-boundary-matrix.sh

      - name: Run silent-failure ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/silent-failure-ratchet.sh

      - name: Run checkpoint installation legacy purge ratchet
        if: needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true'
        run: scripts/check-checkpoint-installation-legacy-purge.sh

      - name: Run keeper cwd leak gate
        if: needs.changes.outputs.keeper_cwd == 'true'
        run: scripts/keeper-cwd-leak-gate.sh

      # Self-test first: a gate that cannot fail would pass silently forever.
      - name: Run turn-path provider-agnostic gate self-test
        if: needs.changes.outputs.keeper_cwd == 'true'
        run: scripts/turn-path-provider-agnostic-gate.sh --self-test

      - name: Run turn-path provider-agnostic gate
        if: needs.changes.outputs.keeper_cwd == 'true'
        run: scripts/turn-path-provider-agnostic-gate.sh

  shell-ir-ratchet:
    name: Shell IR Consumption Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pr-live-gate, changes]
    if: ${{ always() && !cancelled() && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' && (needs.changes.outputs.shell_ir == 'true' || needs.changes.outputs.lib_deps == 'true' || needs.changes.outputs.build == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep and jq
        run: |
          sudo apt-get install -y -qq ripgrep
          sudo apt-get install -y -qq jq

      - name: Run Shell IR consumption ratchet
        run: scripts/audit-shell-ir-consumption.sh --baseline scripts/shell-ir-consumption-baseline.json

  tla-specs:
    name: TLA+ Model Checking
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [pr-live-gate, changes]
    # PR-only required check: branch protection currently requires CI Gate,
    # so path-scoped PR TLA must remain inside ci.yml to keep failures
    # merge-blocking. Main push, schedule, and manual full-suite ownership live
    # in tla-main.yml.
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && needs.pr-live-gate.outputs.run_heavy == 'true' && needs.changes.result == 'success' && needs.changes.outputs.tla == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download tla2tools.jar (pinned v1.8.0)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o specs/keeper-state-machine/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      - name: Run PR-scoped TLA+ model checking
        run: |
          make -C specs check-clean
          make -C specs check-buggy

  ci-gate:
    # Named for the one required check in main's branch protection. A second
    # job used to carry that name and do nothing but copy this job's result:
    # it existed to merge two authorities, and #29458 removed the other one
    # (the Keeper real-world lane) without collapsing the wrapper. Every run
    # then spent a runner restating a verdict, and every failure was reported
    # twice.
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [pr-sync-check, pr-live-gate, changes, meta, build, lint, dashboard, health, structure-ratchet, shell-ir-ratchet, tla-specs]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Aggregate required check status
        env:
          PR_SYNC_RESULT: ${{ needs.pr-sync-check.result }}
          PR_LIVE_GATE_RESULT: ${{ needs.pr-live-gate.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          META_RESULT: ${{ needs.meta.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          HEALTH_RESULT: ${{ needs.health.result }}
          STRUCTURE_RATCHET_RESULT: ${{ needs.structure-ratchet.result }}
          SHELL_IR_RATCHET_RESULT: ${{ needs.shell-ir-ratchet.result }}
          TLA_RESULT: ${{ needs.tla-specs.result }}
        run: |
          set -euo pipefail
          fail=0
          # mode=required (default): fail → block merge
          # mode=advisory: fail → log a WARN line, do not block
          #
          # Build job policy (revised 2026-06-24 by PR-MASC-7):
          #   - dune build (compile-only) is HARD REQUIRED — Build step lacks
          #     continue-on-error, so a compile failure makes the job result =
          #     failure → check "build" required = block merge.
          #   - Focused operator-control, SSE, transport, and contract harness
          #     execution is HARD REQUIRED as well. Each test step lacks
          #     continue-on-error, so a test failure fails the Build and Test
          #     job and blocks merge.
          # A cancelled job did not fail — it did not run. Both block, because
          # a check that never ran cannot be evidence of anything, but they are
          # printed apart: over the last 20 CI runs the job conclusions were 110
          # success, 45 cancelled and 4 failure, so "FAIL dashboard cancelled"
          # was the line a reader met eleven times more often than a real
          # failure, and it sends them looking for a defect in the diff.
          check() {
            local name=$1
            local result=$2
            local mode=${3:-required}
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              printf 'PASS  %-20s %s\n' "$name" "$result"
            elif [[ "$mode" == "advisory" ]]; then
              printf 'WARN  %-20s %s (advisory, not blocking)\n' "$name" "$result"
            elif [[ "$result" == "cancelled" ]]; then
              printf 'STOP  %-20s cancelled — never ran, re-run to decide\n' "$name"
              fail=1
            else
              printf 'FAIL  %-20s %s\n' "$name" "$result"
              fail=1
            fi
          }
          check "pr-sync-check"   "$PR_SYNC_RESULT"
          # pr-live-gate folds skipped non-PR sync checks into run_heavy=true,
          # while failed live-state lookup remains a hard merge blocker.
          check "pr-live-gate"    "$PR_LIVE_GATE_RESULT"
          check "changes"         "$CHANGES_RESULT"
          check "meta"            "$META_RESULT"
          check "build"           "$BUILD_RESULT"
          check "lint"            "$LINT_RESULT"
          check "dashboard"       "$DASHBOARD_RESULT"
          check "health"          "$HEALTH_RESULT"
          check "structure-ratchet" "$STRUCTURE_RATCHET_RESULT"
          check "shell-ir-ratchet" "$SHELL_IR_RATCHET_RESULT"
          check "tla-specs"       "$TLA_RESULT"
          [ "$fail" -eq 0 ]

