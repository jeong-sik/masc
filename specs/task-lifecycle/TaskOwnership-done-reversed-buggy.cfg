\* Expects a violation. Whoever finished a Task flips their own Done to
\* Cancelled. Every clean action happens to forbid this through its own
\* outcome = "Open" guard, so the rule those guards share needs saying once.

SPECIFICATION SpecBugDoneReversed

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

PROPERTIES
    TerminalOutcomeIsFinal

CHECK_DEADLOCK
    FALSE
