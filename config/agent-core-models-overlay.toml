# Healthy fallback for the exact-output judgement lanes: a quota-independent
# provider (ollama.com) separate from the z.ai glm-coding primary and the kimi
# coding plan, so one provider's rate limit does not stall a whole lane.
# Mirrors the live deployment's target. enable_thinking=false is required --
# deepseek-v4-flash has thinking on by default, and without it the answer lands
# in the thinking field and content comes back empty. Probed 2026-08-30 on
# ollama.com/v1: json_object -> {"ok":true} with no fence.
[[targets]]
id = "ollama_cloud.deepseek-v4-flash"
provider_ref = "ollama_cloud"
model_id = "deepseek-v4-flash"
enable_thinking = false

# The install wizard's OpenRouter choice. A wizard-pickable HTTP runtime owes
# a row here, and thinking is off for the same reason as the ollama_cloud row
# above: this id reasons by default, and with reasoning on the answer arrives
# in the reasoning field with content empty. This id accepts the disable --
# reasoning_effort "none" answered 200 with 0 reasoning tokens billed, while
# five of the twelve OpenRouter ids refuse it with HTTP 400 (probe7,
# evidence/task-openrouter-support/).
[[targets]]
id = "openrouter.openrouter-deepseek-v4-flash"
provider_ref = "openrouter"
model_id = "deepseek/deepseek-v4-flash"
enable_thinking = false

# verifier_exact admits its slots through the exact-output registry but
# dispatches them by configured runtime id (Runtime.resolve_assignment), so a
# slot there must exist under the same string in both registries. This row
# mirrors the runtime.toml runtime of the same name so admission passes;
# dispatch goes through that runtime, so the settings here never reach the
# verifier call.
[[targets]]
id = "ollama_cloud.ollama-cloud-deepseek-v4-flash"
provider_ref = "ollama_cloud"
model_id = "deepseek-v4-flash"
enable_thinking = false

# Every runtime the install wizard can pick needs a target row here, because
# `runtime-default-set --setup-lanes` writes the chosen runtime id into the
# exact-output lanes' `slots`, and those admit against this catalog. A runtime
# binding in runtime.toml is not an Agent Core target declaration — the setup
# script writes both halves for the runtimes it creates (install-runtime-setup.py
# `render`), and these three rows are the same pair for the runtimes that ship
# in the seed. Without them, choosing the wizard's own default left the
# mandatory lanes with no admitted target and the server refused to boot.
[[targets]]
id = "ollama.gemma4-26b-a4b-qat"
provider_ref = "ollama"
model_id = "hf.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL"

