name = "masc_dos_screen"
description = """
Read the DOS screen without advancing time.

Returns the text page as UTF-8 with code page 437 kept, so box drawing and \
game glyphs survive, plus the video mode, CS:IP, timer ticks and \
waiting_for_key. waiting_for_key means the program asked the BIOS for a key \
and found none -- it read the keyboard, not that it is done. masc_dos_step's \
settled is the one that means your turn.

Graphics modes are read too: frame_ascii is the whole frame as a coarse \
luminance map (8x16 pixel cells, one character each), so a VGA game's title, \
map and menus are visible the way text programs are in screen_text; \
frame_nonblack counts lit cells for cheap change detection."""
additional_properties = false

defer_loading = true
