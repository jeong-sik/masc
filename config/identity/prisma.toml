# Prisma's remote MCP server.
#
# Only the server is named. Where its metadata lives, its endpoints and the
# scopes it publishes all come from the server itself, so none of that can go
# stale here.
#
# Measured 2026-08-27: this one publishes its protected-resource document at
# the origin while serving MCP below it, so the URL RFC 9728 3 computes
# misses it and the location comes from the 401's WWW-Authenticate header
# instead. The authorization server it names offers S256 and a registration
# endpoint, and accepts a client that authenticates with nothing. It names 2 scopes, all of which are asked for.

id = "prisma"
label = "Prisma"
mcp_url = "https://mcp.prisma.io/mcp"

# Seen 2026-11-03: the authorize step here goes to sign-in before it looks at
# the redirect, so nothing short of a real login tells whether it takes this
# server's public callback. Atlassian and Datadog behave the same way, and
# both refused the public callback after sign-in while logins through the
# loopback form completed. A client registered here in 2026-08 with the
# loopback form was accepted. So a login here names the loopback callback, and
# the browser that consents has to reach this server on 127.0.0.1.
callback = "loopback"

access_token_env = "PRISMA_ACCESS_TOKEN"
expires_at_env = "PRISMA_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.prisma/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
