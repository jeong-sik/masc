name = "masc_browser_session"
description = """
Open or close the automation lane's keeper-dedicated browser (a Playwright \
Firefox build with its own profile, separate from the operator's session). \
Action "open" launches it (headless by default), "close" shuts it down. \
The live lane has no session to manage — the operator's browser owns \
itself. After open, use masc_browser_goto and masc_browser_read with \
lane=automation."""
additional_properties = false

[[params]]
name = "action"
type = "string"
enum = ["open", "close"]
required = true
description = "open launches the automation browser; close shuts it down."

[[params]]
name = "headless"
type = "boolean"
description = "Run without a window. Default: true."
default = true
