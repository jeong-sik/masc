name = "masc_dos_screen"
description = """
Read the DOS screen without advancing time.

Returns the text page as UTF-8 (code page 437 kept), the video mode, CS:IP, \
timer ticks and waiting_for_key -- the program found the keyboard empty, not \
that it is done; settled also does not prove a game's final prompt. frame_ascii maps \
the whole frame's luminance in 8x16 cells: where a graphics mode drew, not \
what it says. frame_nonblack counts lit cells. Unless include_frame is false, \
the frame also comes as a PNG stored in the unified attachment store (with \
attachment_id and url) plus an inline image block when the active runtime \
supports vision. Use keeper_image_read to re-read an attachment directly, or \
keeper_analyze_image when the active runtime lacks native vision input."""
additional_properties = false

defer_loading = true

[[params]]
name = "include_pad"
type = "boolean"
default = false
description = "Include the current program's gamepad layout from worker-owned storage."

[[params]]
name = "include_frame"
type = "boolean"
default = true
description = "false skips the frame's RGB copy and PNG encode; the text page, frame_ascii, controller and saves name still come back."

[[params]]
name = "include_ints"
type = "boolean"
default = false
description = "Include the lane's recent INT-entry trail (last 64, oldest first): vector, AX, BX, CX, DX at each guest INT. Read after the fact -- which call a failing boot last made is the question this answers."
