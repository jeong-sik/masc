name: Manual probe artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifact to build (no provider calls)
        type: choice
        required: true
        default: linux-x64
        options:
          - linux-x64
          - macos-arm64
          - stagehand-model-macos-arm64

      capture_item_http:
        description: Exercise isolated Item HTTP routes with the compiled binary and production dashboard
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-x64-probe:
    if: inputs.target == 'linux-x64'
    name: Build Linux x64 probe
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Build release binaries for Linux x64
        env:
          PROBE_OUT: ${{ runner.temp }}/masc-linux-x64-probe
        run: |
          chmod +x scripts/build-linux-release.sh
          scripts/build-linux-release.sh --out "$PROBE_OUT"

      - name: Write and verify SHA-256 manifest
        env:
          PROBE_OUT: ${{ runner.temp }}/masc-linux-x64-probe
        run: |
          set -euo pipefail
          cd "$PROBE_OUT"
          sha256sum deployment_preflight_helper.exe main_eio.exe masc_browser_host.exe masc_tui.exe > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload Linux x64 probe
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-probe-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/masc-linux-x64-probe/
          if-no-files-found: error
          retention-days: 7

      - name: Set up Node for Item HTTP acceptance
        if: inputs.capture_item_http
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build exact-source production dashboard for Item HTTP acceptance
        if: inputs.capture_item_http
        working-directory: dashboard
        run: |
          corepack enable && corepack prepare pnpm@10.31.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium

      - name: Exercise isolated Item HTTP routes
        if: inputs.capture_item_http
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/item-http-acceptance.py \
            --binary "$RUNNER_TEMP/masc-linux-x64-probe/main_eio.exe" \
            --dashboard assets/dashboard --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/item-http-evidence" --capture-browser

      - name: Upload Item HTTP evidence without workspace credentials
        if: always() && inputs.capture_item_http
        uses: actions/upload-artifact@v7
        with:
          name: item-http-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/item-http-evidence/browser-evidence.json
            ${{ runner.temp }}/item-http-evidence/item-server-*.png
            ${{ runner.temp }}/item-http-evidence/http-evidence.json
            ${{ runner.temp }}/item-http-evidence/tool-calls.json
            ${{ runner.temp }}/item-http-evidence/account.json
            ${{ runner.temp }}/item-http-evidence/account-after.json
            ${{ runner.temp }}/item-http-evidence/account-restarted.json
            ${{ runner.temp }}/item-http-evidence/portrait.png
            ${{ runner.temp }}/item-http-evidence/portrait-equipped.png
            ${{ runner.temp }}/item-http-evidence/portrait-restarted.png
            ${{ runner.temp }}/item-http-evidence/server.log
          if-no-files-found: error
          retention-days: 14


  macos-arm64-probe:
    if: inputs.target == 'macos-arm64'
    name: Build manual macOS arm64 runtime probe
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ocaml-toolchain
      - name: Set isolated probe directories
        run: |
          echo "PROBE_OUT=$RUNNER_TEMP/masc-macos-arm64-probe" >> "$GITHUB_ENV"
          echo "PROBE_STAGE=$RUNNER_TEMP/masc-macos-arm64-stage" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          brew install flock gmp libpq openssl@3 zstd
          libpq_prefix="$(brew --prefix libpq)"
          openssl_prefix="$(brew --prefix openssl@3)"
          {
            echo "$libpq_prefix/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"
      - name: Pin and install OCaml dependencies
        run: |
          scripts/opam-pin-external-deps.sh --with-compact-protocol --with-bisect
          opam install ./masc.opam --deps-only --locked --with-test --yes
      - name: Build runtime companions
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          scripts/check-version-truth.sh
          opam exec -- dune build --release \
            bin/main_eio.exe bin/masc_tui.exe bin/masc_browser_host.exe \
            bin/deployment_preflight_helper.exe
      - name: Bundle relocatable runtime with release filenames
        run: |
          mkdir -p "$PROBE_OUT"
          cp _build/default/bin/main_eio.exe "$PROBE_OUT/masc-macos-arm64"
          cp _build/default/bin/masc_tui.exe "$PROBE_OUT/masc-tui-macos-arm64"
          cp _build/default/bin/masc_browser_host.exe "$PROBE_OUT/masc-browser-host-macos-arm64"
          cp _build/default/bin/deployment_preflight_helper.exe "$PROBE_OUT/masc-deployment-preflight-helper-macos-arm64"
          cp scripts/check-runtime-deployment-preflight.sh "$PROBE_OUT/masc-check-runtime-deployment-preflight-macos-arm64"
          python3 scripts/package-macos-runtime.py --dist "$PROBE_OUT" \
            --stage "$PROBE_STAGE" --platform macos-arm64 --source-commit "$GITHUB_SHA"
      - name: Validate packaged identity and record dependencies
        run: |
          set -euo pipefail
          # Identity flags exit before opening a TTY or contacting a server.
          "$PROBE_STAGE/masc-tui" --version | tee "$PROBE_OUT/tui-version.txt"
          "$PROBE_STAGE/masc-tui" --build-commit | tee "$PROBE_OUT/tui-build-commit.txt"
          test "$(cat "$PROBE_OUT/tui-build-commit.txt")" = "$GITHUB_SHA"
          test -s "$PROBE_OUT/tui-version.txt"
          # Both companions use the same linked dune-build-info version.
          "$PROBE_STAGE/masc" --version > "$PROBE_OUT/server-version.txt"
          cmp "$PROBE_OUT/tui-version.txt" "$PROBE_OUT/server-version.txt"
          test "$("$PROBE_STAGE/masc" build-commit)" = "$GITHUB_SHA"
          cp "$PROBE_STAGE/runtime-provenance.json" "$PROBE_OUT/"
          {
            uname -a
            opam exec -- ocamlc -version
            opam list --installed --columns=name,version
            brew list --versions
            for binary in "$PROBE_STAGE"/masc "$PROBE_STAGE"/masc-tui \
              "$PROBE_STAGE"/masc-browser-host "$PROBE_STAGE"/masc-deployment-preflight-helper \
              "$PROBE_STAGE"/lib/*; do
              otool -L "$binary"
            done
          } > "$PROBE_OUT/dependencies.txt"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          receipt = dict(source_commit=os.environ['GITHUB_SHA'], platform='macos-arm64',
                         run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         release_verified=False, published=False)
          (Path(os.environ['PROBE_OUT']) / 'probe.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE
          cd "$PROBE_OUT"
          shasum -a 256 ./* > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Upload macOS arm64 runtime probe
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-probe-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/masc-macos-arm64-probe/
          if-no-files-found: error
          retention-days: 7

  stagehand-model-probe:
    if: inputs.target == 'stagehand-model-macos-arm64'
    name: Build manual macOS arm64 model probe
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ocaml-toolchain
      - name: Install native build dependencies
        run: |
          brew install flock gmp libpq openssl@3 zstd
          openssl_prefix="$(brew --prefix openssl@3)"
          libpq_prefix="$(brew --prefix libpq)"
          # Match the release build: piaf's C stubs also need the keg-only
          # OpenSSL headers and libraries, beyond pkg-config discovery.
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"
      - name: Pin and install OCaml dependencies
        run: |
          scripts/opam-pin-external-deps.sh --with-bisect
          opam install ./masc.opam --deps-only --locked --with-test --yes
      - name: Build probe
        id: build
        run: |
          python3 scripts/test_stagehand_probe_controls.py
          opam exec -- dune build --profile release bin/stagehand_model_probe.exe
      - name: Exercise offline setup and validator controls
        id: controls
        run: |
          # Synthetic local config: no provider credentials or model callbacks.
          python3 scripts/stagehand-probe-controls.py \
            --binary _build/default/bin/stagehand_model_probe.exe \
            --fixtures test/fixtures/stagehand/llm-generate-params.json \
            --config test/fixtures/stagehand/runtime-publication.toml \
            --output "$RUNNER_TEMP/stagehand-offline-controls.json"
      - name: Package executable and source evidence
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PROBE_OUT: ${{ runner.temp }}/stagehand-model-probe
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$PROBE_OUT"
          cp _build/default/bin/stagehand_model_probe.exe "$PROBE_OUT/"
          cp test/fixtures/stagehand/llm-generate-params.json "$PROBE_OUT/"
          cp test/fixtures/stagehand/runtime-publication.toml "$PROBE_OUT/"
          cp docs/runbooks/stagehand-real-model-probe.md "$PROBE_OUT/README.md"
          cp "$RUNNER_TEMP/stagehand-offline-controls.json" "$PROBE_OUT/offline-controls.json"
          otool -L "$PROBE_OUT/stagehand_model_probe.exe" > "$PROBE_OUT/native-dependencies.txt"
          python3 scripts/stagehand-probe-manifest.py --directory "$PROBE_OUT" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: stagehand-model-probe-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/stagehand-model-probe/
          if-no-files-found: error
          retention-days: 7
