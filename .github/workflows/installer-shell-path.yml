name: Installer shell PATH
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test shell on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test new terminal and piped installer behavior
        run: python3 test/test_installer_shell_path.py
