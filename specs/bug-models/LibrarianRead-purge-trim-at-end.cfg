\* The recovery the code runs: with a position, refused unless it is the
\* history's end, and cut back to an end a counted line states; without one,
\* cut at the break. Expected: no invariant violation. Its buggy twins
\* measure what each part of that rule holds off.
\*
\* Its name ends in .cfg rather than buggy.cfg, so the bug-models glob in
\* scripts/tla-check.sh does not reach it and <spec>.cfg is already
\* LibrarianRead.cfg. It is named there in a run_tlc_cfg line instead, which is
\* the only way it runs in CI: specs/Makefile picks it up with the CLEAN_CFGS
\* glob, and no workflow calls make check-clean.
SPECIFICATION SpecPurgeTrimAtEnd
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
