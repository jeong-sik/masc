name = "masc_plan_set_task"
title = "Bind Current Task"
description = """
Point the workspace's current-task marker at task_id. A claim already sets \
the marker, and each later claim or transition by the same agent resets it \
to the first task assigned to that agent, or clears it when none is. A \
value set here lasts until then. masc_status reports a marker on a task \
that is not assigned to you as drift."""
additional_properties = false

[[params]]
name = "task_id"
type = "string"
required = true
description = "Task ID to set as current"

[help]
short_description = "Point the workspace's current-task marker at a task."
when_to_use = "A claim already sets the marker, so there is nothing to call after masc_transition(action='claim'). Call this only to point the marker at a different task."
key_constraints = [
  "Writes task_id as given. The task is not looked up and your claim on it is not checked.",
  "The marker is one value for the whole workspace. Ending a session does not clear it.",
]
details_markdown = "The next claim or transition by an agent that is not a Keeper resets the marker to the first task assigned to that agent, or clears it when none is. masc_status compares the marker with the tasks assigned to you and reports a mismatch as drift. Read the marker with masc_plan_get_task and clear it with masc_plan_clear_task. The task's own status never changes."
examples = ["task_id='task-123'"]
