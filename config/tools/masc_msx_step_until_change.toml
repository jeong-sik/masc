name = "masc_msx_step_until_change"
description = """
Advance the shared MSX machine until the screen settles, no key held.

Samples the coarse screen view every 6 frames; two near-equal samples in a row \
stop the run (a blinking cursor alone does not count as change). Returns the \
observation (see masc_msx_screen) plus frames_run, changed (the screen now \
differs from the start — false on a settled screen suggests the scene waits \
for a key) and stable (true when it settled, false when max_frames ran out). \
Cheaper than repeated masc_msx_step + masc_msx_screen: one call covers a \
title, fade or level intro."""
additional_properties = false

defer_loading = true

[[params]]
name = "max_frames"
type = "integer"
description = "Frame budget for the run. Default 300 (five seconds)."
minimum = 1
maximum = 300
default = 300
