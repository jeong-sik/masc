name: Native Browser Addon Proof

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact source commit containing the browser Add-on and probe'
        required: true
        type: string
      browser:
        description: 'Real browser to exercise through the installed native Addon'
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - gecko
          - webextension
        default: chromium
      firefox_version:
        description: 'Mozilla Firefox release fixture for firefox/gecko, isolated from the runner app'
        required: true
        type: string
        default: '158.0.1'
permissions:
  contents: read

concurrency:
  group: browser-addon-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  macos-stagehand:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PROBE_TARGET: ${{ inputs.browser == 'firefox' && 'browser_addon_firefox_probe' || inputs.browser == 'gecko' && 'browser_addon_gecko_transfer_probe' || inputs.browser == 'webextension' && 'browser_addon_webextension_probe' || 'stagehand_browser_probe' }}
    steps:
      - name: Require an exact browser source candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROOF_BROWSER: ${{ inputs.browser }}
          FIREFOX_FIXTURE_VERSION: ${{ inputs.firefox_version }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["CANDIDATE_SHA"]):
              raise SystemExit("candidate_sha must be a full 40-character source commit")
          if os.environ["PROOF_BROWSER"] not in ("chromium", "firefox", "gecko", "webextension"):
              raise SystemExit("browser must be chromium, firefox, gecko or webextension")
          if os.environ["PROOF_BROWSER"] in ("firefox", "gecko", "webextension") and not re.fullmatch(
              r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", os.environ["FIREFOX_FIXTURE_VERSION"]
          ):
              raise SystemExit("firefox_version must name a numeric Mozilla release")
          PYCODE

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Setup OCaml
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Install native dependencies
        run: |
          brew install flock gmp libpq openssl@3 zstd ripgrep
          libpq_prefix="$(brew --prefix libpq)"
          openssl_prefix="$(brew --prefix openssl@3)"
          {
            echo "$libpq_prefix/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$openssl_prefix/include:${CPATH:-}"
            echo "LIBRARY_PATH=$openssl_prefix/lib:${LIBRARY_PATH:-}"
            echo "CPPFLAGS=-I$openssl_prefix/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$openssl_prefix/lib ${LDFLAGS:-}"
          } >> "$GITHUB_ENV"

      - name: Pin dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-compact-protocol --with-bisect

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build the native browser Add-on proof inputs
        env:
          PROOF_BROWSER: ${{ inputs.browser }}
        run: |
          targets=("test/$PROBE_TARGET.exe" bin/masc_native_addon_launcher.exe
            bin/masc_browser_process_owner.exe bin/masc_browser_addon_worker.exe)
          if [[ "$PROOF_BROWSER" == webextension ]]; then
            targets+=(bin/masc_browser_host.exe)
          fi
          opam exec -- dune build --release "${targets[@]}"

      # Chrome for Testing, not branded Chrome: branded builds refuse
      # --load-extension from 137, and 154 is the build the CDP extension load
      # was checked on (docs/evidence/browser-stagehand-cdp-20260924).
      - name: Install Chrome for Testing
        if: inputs.browser == 'chromium'
        run: |
          npx --yes @puppeteer/browsers@3.2.3 install chrome@154.0.8037.57 --path "$RUNNER_TEMP/chrome-for-testing" > "$RUNNER_TEMP/chrome-for-testing.txt"
          echo "CHROME_FOR_TESTING=$(tail -1 "$RUNNER_TEMP/chrome-for-testing.txt" | sed 's/^[^ ]* //')" >> "$GITHUB_ENV"

      - name: Install the selected isolated Firefox release
        if: inputs.browser == 'firefox' || inputs.browser == 'gecko' || inputs.browser == 'webextension'
        env:
          FIREFOX_FIXTURE_VERSION: ${{ inputs.firefox_version }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil, urllib.parse, urllib.request
          from pathlib import Path
          version = os.environ["FIREFOX_FIXTURE_VERSION"]
          root = Path(os.environ["RUNNER_TEMP"]) / "browser-addon-firefox"
          root.mkdir(mode=0o700)
          relative = f"mac/en-US/Firefox {version}.dmg"
          base = f"https://archive.mozilla.org/pub/firefox/releases/{version}/"
          sums_url = base + "SHA256SUMS"
          with urllib.request.urlopen(sums_url) as response:
              sums = response.read()
          entries = []
          for line in sums.decode().splitlines():
              parts = line.split(maxsplit=1)
              if len(parts) == 2 and parts[1] == relative:
                  entries.append(parts[0])
          if len(entries) != 1 or len(entries[0]) != 64 or any(c not in "0123456789abcdef" for c in entries[0]):
              raise SystemExit("Mozilla SHA256SUMS must name exactly one valid selected DMG digest")
          url = base + urllib.parse.quote(relative, safe="/")
          dmg = root / "firefox.dmg"
          with urllib.request.urlopen(url) as source, dmg.open("xb") as target:
              shutil.copyfileobj(source, target)
          with dmg.open("rb") as source:
              digest = hashlib.file_digest(source, "sha256").hexdigest()
          if digest != entries[0]:
              raise SystemExit("selected Firefox DMG does not match Mozilla SHA256SUMS")
          evidence = Path("proof/native-browser")
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "FIREFOX_FIXTURE.json").write_text(json.dumps({
              "version": version, "url": url, "sha256sums_url": sums_url,
              "sha256sums_sha256": hashlib.sha256(sums).hexdigest(),
              "expected_sha256": entries[0], "actual_sha256": digest,
              "scope": "isolated official DMG verified against HTTPS release sums; no signature verification"
          }, indent=2) + "\n")
          PYCODE
          fixture="$RUNNER_TEMP/browser-addon-firefox"
          mount="$fixture/mount"
          mkdir "$mount"
          mounted=false
          cleanup_mount() {
            if [[ "$mounted" == true ]]; then
              mounted=false
              hdiutil detach "$mount" -quiet
            fi
          }
          trap cleanup_mount EXIT
          hdiutil attach "$fixture/firefox.dmg" -mountpoint "$mount" -readonly -nobrowse -quiet
          mounted=true
          ditto "$mount/Firefox.app" "$fixture/Firefox.app"
          cleanup_mount
          trap - EXIT
          test -x "$fixture/Firefox.app/Contents/MacOS/firefox"
          echo "FIREFOX_BINARY=$fixture/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV"

      - name: Install the owned Gecko driver
        if: inputs.browser == 'gecko' || inputs.browser == 'webextension'
        run: brew install geckodriver

      - name: Retain the exact proof inputs
        env:
          PROOF_WORKFLOW_COMMIT: ${{ github.sha }}
          PROOF_BROWSER: ${{ inputs.browser }}
        run: |
          mkdir -p proof/native-browser/binaries
          git rev-parse HEAD > proof/native-browser/SOURCE_COMMIT
          printf '%s\n' "$PROOF_WORKFLOW_COMMIT" > proof/native-browser/WORKFLOW_COMMIT
          printf '%s\n' "$PROOF_BROWSER" > proof/native-browser/BROWSER
          cp "_build/default/test/$PROBE_TARGET.exe" proof/native-browser/binaries/
          cp _build/default/bin/masc_native_addon_launcher.exe proof/native-browser/binaries/
          cp _build/default/bin/masc_browser_process_owner.exe proof/native-browser/binaries/
          cp _build/default/bin/masc_browser_addon_worker.exe proof/native-browser/binaries/
          if [[ "$PROOF_BROWSER" == webextension ]]; then
            cp _build/default/bin/masc_browser_host.exe proof/native-browser/binaries/
          fi
          (cd proof/native-browser && shasum -a 256 binaries/*.exe > SHA256SUMS)
          if [[ "$PROOF_BROWSER" == firefox || "$PROOF_BROWSER" == gecko || "$PROOF_BROWSER" == webextension ]]; then
            shasum -a 256 "$FIREFOX_BINARY" > proof/native-browser/FIREFOX_BINARY_SHA256
          fi

      - name: Exercise the Stagehand lane in a real Chromium
        if: inputs.browser == 'chromium'
        run: |
          python3 scripts/probe-stagehand.py \
            --chrome "$CHROME_FOR_TESTING" \
            --probe _build/default/test/stagehand_browser_probe.exe \
            --launcher _build/default/bin/masc_native_addon_launcher.exe \
            --guardian _build/default/bin/masc_browser_process_owner.exe \
            --worker _build/default/bin/masc_browser_addon_worker.exe \
            --base-path "$RUNNER_TEMP/stagehand-workspace" \
            --out proof/native-browser

      - name: Exercise owned Firefox input, retirement and reattachment
        if: inputs.browser == 'firefox'
        run: |
          MOZ_HEADLESS=1 "$FIREFOX_BINARY" --version > proof/native-browser/BROWSER_VERSION
          python3 scripts/probe-browser-addon-firefox.py \
            --firefox "$FIREFOX_BINARY" \
            --probe _build/default/test/browser_addon_firefox_probe.exe \
            --launcher _build/default/bin/masc_native_addon_launcher.exe \
            --guardian _build/default/bin/masc_browser_process_owner.exe \
            --worker _build/default/bin/masc_browser_addon_worker.exe \
            --out proof/native-browser

      - name: Exercise owned Gecko upload, download and artifact retention
        if: inputs.browser == 'gecko'
        run: |
          MOZ_HEADLESS=1 "$FIREFOX_BINARY" --version > proof/native-browser/BROWSER_VERSION
          geckodriver --version > proof/native-browser/DRIVER_VERSION
          python3 scripts/probe-browser-addon-gecko-transfer.py \
            --firefox "$FIREFOX_BINARY" \
            --driver "$(command -v geckodriver)" \
            --probe _build/default/test/browser_addon_gecko_transfer_probe.exe \
            --launcher _build/default/bin/masc_native_addon_launcher.exe \
            --guardian _build/default/bin/masc_browser_process_owner.exe \
            --worker _build/default/bin/masc_browser_addon_worker.exe \
            --out proof/native-browser

      - name: Exercise the external WebExtension through production native messaging and HTTP ingress
        if: inputs.browser == 'webextension'
        run: |
          MOZ_HEADLESS=1 "$FIREFOX_BINARY" --version > proof/native-browser/BROWSER_VERSION
          geckodriver --version > proof/native-browser/DRIVER_VERSION
          python3 scripts/probe-browser-addon-webextension.py \
            --firefox "$FIREFOX_BINARY" \
            --driver "$(command -v geckodriver)" \
            --probe _build/default/test/browser_addon_webextension_probe.exe \
            --launcher _build/default/bin/masc_native_addon_launcher.exe \
            --guardian _build/default/bin/masc_browser_process_owner.exe \
            --worker _build/default/bin/masc_browser_addon_worker.exe \
            --native-host _build/default/bin/masc_browser_host.exe \
            --out proof/native-browser

      - name: Upload native browser proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masc-browser-addon-${{ inputs.browser }}-proof-macos-arm64-${{ inputs.candidate_sha }}
          path: proof/native-browser/
          if-no-files-found: ignore
