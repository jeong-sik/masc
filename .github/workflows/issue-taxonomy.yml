name: Issue Taxonomy

# Applies taxonomy labels from the masc-triage declaration block in the issue body.
# The vocabulary SSOT is .github/issue-taxonomy.json. This workflow never creates labels.
# labeled/unlabeled are not triggers: labelling would re-enter this workflow and storm.

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Single issue number. Leave empty with scope=open to sweep open issues.
        required: false
        type: string
      scope:
        required: false
        default: single
        type: choice
        options: [single, open]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-taxonomy-${{ github.event.issue.number || inputs.issue_number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply declared taxonomy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/issue-taxonomy.json
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v9
        env:
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISPATCH_SCOPE: ${{ inputs.scope }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const SSOT = JSON.parse(fs.readFileSync('.github/issue-taxonomy.json', 'utf8'));
            const LANG = SSOT.declaration_block_language;
            const MARKER = '<!-- masc-taxonomy-gate -->';

            const knownLabels = new Set();
            for (const ax of Object.values(SSOT.axes))
              for (const v of Object.values(ax.values)) knownLabels.add(v.label);
            for (const f of Object.values(SSOT.flags)) knownLabels.add(f.label);

            const repoLabels = new Set(
              (await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 }))
                .map((l) => l.name),
            );
            const missing = [...knownLabels].filter((l) => !repoLabels.has(l));
            if (missing.length) {
              core.setFailed(
                `Repo labels drifted from the SSOT. Missing: ${missing.join(', ')}. ` +
                `Run scripts/sync-issue-labels.sh, then re-run.`,
              );
              return;
            }

            const declaredKeys = new Set([...Object.keys(SSOT.axes), ...Object.keys(SSOT.flags)]);

            // severity_order is the priority order the docs quote. Keep it honest against the
            // value set it orders, or the two drift inside one file.
            for (const [ax, spec] of Object.entries(SSOT.axes)) {
              if (!spec.severity_order) continue;
              const a = [...spec.severity_order].sort().join(',');
              const b = Object.keys(spec.values).sort().join(',');
              if (a !== b) {
                core.setFailed(`axis '${ax}': severity_order does not cover its values (${a} vs ${b}).`);
                return;
              }
            }

            const orderedValues = (spec) => spec.severity_order || Object.keys(spec.values);

            function parseDeclaration(body) {
              const re = new RegExp('```' + LANG + '\\s*\\n([\\s\\S]*?)```', 'g');
              const blocks = [...(body || '').matchAll(re)];
              if (blocks.length === 0) return { present: false };
              if (blocks.length > 1)
                return { present: true, error: `the body carries ${blocks.length} ${LANG} blocks; keep exactly one` };
              const out = {};
              for (const raw of blocks[0][1].split('\n')) {
                const line = raw.trim();
                if (!line || line.startsWith('#')) continue;
                const sep = line.indexOf(':');
                if (sep < 0) return { present: true, error: `line is not key: value -> ${line}` };
                const key = line.slice(0, sep).trim().toLowerCase();
                if (!declaredKeys.has(key))
                  return { present: true, error: `unknown key '${key}'. Keys: ${[...declaredKeys].join(', ')}` };
                if (key in out) return { present: true, error: `key '${key}' appears twice` };
                out[key] = line.slice(sep + 1).trim().toLowerCase();
              }
              return { present: true, fields: out };
            }

            function splitList(v) {
              return v.replace(/^\[|\]$/g, '').split(',').map((s) => s.trim()).filter(Boolean);
            }

            function resolve(fields) {
              const add = [], errors = [];
              for (const [ax, spec] of Object.entries(SSOT.axes)) {
                const raw = fields[ax];
                if (raw === undefined || raw === '') {
                  if (spec.required) errors.push(`axis '${ax}' is not declared.`);
                  continue;
                }
                const vals = splitList(raw);
                if (spec.cardinality === 'one' && vals.length !== 1) {
                  errors.push(`axis '${ax}' takes exactly one value, got ${vals.length}: ${raw}`);
                  continue;
                }
                for (const v of vals) {
                  const hit = spec.values[v];
                  if (!hit) errors.push(`'${ax}: ${v}' is not in the vocabulary. Allowed: ${orderedValues(spec).join(', ')}`);
                  else add.push(hit.label);
                }
              }
              for (const [flag, spec] of Object.entries(SSOT.flags)) {
                const raw = fields[flag] || '';
                if (raw === 'true') add.push(spec.label);
                else if (raw && raw !== 'false') errors.push(`'${flag}' takes true or false, got: ${raw}`);
              }
              return { add: [...new Set(add)], errors };
            }

            // One source for label names: knownLabels is what the SSOT declares. The prefixes
            // only catch orphans left behind by a value that the SSOT no longer carries.
            const axisPrefixes = Object.keys(SSOT.axes).map((a) => a + '/');
            const managed = (name) => knownLabels.has(name) || axisPrefixes.some((p) => name.startsWith(p));

            async function commentOnce(issue_number, body) {
              const existing = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const mine = existing.find((c) => (c.body || '').includes(MARKER));
              const payload = `${MARKER}\n${body}`;
              if (!mine) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
              } else if ((mine.body || '').trim() !== payload.trim()) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: payload });
              }
            }

            function template() {
              const lines = Object.entries(SSOT.axes).map(([ax, spec]) => {
                const opts = orderedValues(spec).join(' | ');
                return `${ax}: ${spec.required ? opts : '(optional) ' + opts}`;
              });
              for (const flag of Object.keys(SSOT.flags)) lines.push(`${flag}: true or false`);
              return ['```' + LANG, ...lines, '```'].join('\n');
            }

            // Labels claim a classification. When the body does not declare one, or declares
            // one we cannot read, the labels must not keep claiming it.
            async function clearManaged(issue_number, current) {
              const stale = current.filter(managed);
              for (const label of stale)
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label })
                  .catch((e) => { if (e.status !== 404) throw e; });
              return stale;
            }

            async function apply(issue) {
              const issue_number = issue.number;
              if (issue.pull_request) return { issue_number, skipped: 'pull request' };
              const current = issue.labels.map((l) => (typeof l === 'string' ? l : l.name)).filter(Boolean);

              const decl = parseDeclaration(issue.body);
              const reject = async (why) => {
                const cleared = await clearManaged(issue_number, current);
                await commentOnce(issue_number, `${why}\n\n${template()}\n\nValue meanings live in \`.github/issue-taxonomy.json\`.`);
                return { issue_number, declared: false, cleared };
              };
              if (!decl.present) return reject('No taxonomy declaration block, so no labels were applied.');
              if (decl.error) return reject(`Could not read the declaration block: ${decl.error}`);

              const { add, errors } = resolve(decl.fields);
              if (errors.length) return reject(`The declaration block does not match the vocabulary.\n\n- ${errors.join('\n- ')}`);

              const target = new Set(add);
              const toRemove = current.filter((l) => managed(l) && !target.has(l));
              const toAdd = [...target].filter((l) => !current.includes(l));

              for (const label of toRemove)
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label })
                  .catch((e) => { if (e.status !== 404) throw e; });
              if (toAdd.length)
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });

              // A run that changed nothing says nothing. Sweeps would otherwise notify every subscriber.
              if (toAdd.length || toRemove.length)
                await commentOnce(issue_number, `Taxonomy applied: ${[...target].sort().join(', ')}`);
              return { issue_number, declared: true, added: toAdd, removed: toRemove };
            }

            const dispatchNumber = (process.env.DISPATCH_ISSUE_NUMBER || '').trim();
            const dispatchScope = (process.env.DISPATCH_SCOPE || 'single').trim();

            let issues = [];
            if (context.payload.issue?.number) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: context.payload.issue.number });
              issues = [data];
            } else if (dispatchNumber) {
              const n = Number(dispatchNumber);
              if (!Number.isInteger(n) || n <= 0) { core.setFailed(`invalid issue number: ${dispatchNumber}`); return; }
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: n });
              issues = [data];
            } else if (dispatchScope === 'open') {
              // listForRepo already carries body and labels; re-fetching each issue would
              // spend the token's hourly budget before the sweep finishes.
              issues = (await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', per_page: 100,
              })).filter((i) => !i.pull_request);
            } else {
              core.setFailed('workflow_dispatch requires issue_number or scope=open.');
              return;
            }

            let changed = 0;
            for (const issue of issues) {
              const r = await apply(issue);
              if (r.added?.length || r.removed?.length || r.cleared?.length) changed++;
              core.info(JSON.stringify(r));
            }
            core.info(`scanned ${issues.length}, changed ${changed}`);
