name = "tool_execute"
description = """
Run one command inside the Keeper sandbox. Give exactly one of argv or \
script: argv is one non-empty argv process vector run without a shell, tokens \
verbatim, and script is one line handed to a real shell. cwd is a relative \
path inside the path jail, and MASC never interprets program or subcommand \
meaning. A call runs to completion or stops at timeout_sec; there is no \
background task lifecycle."""
additional_properties = false

[[params]]
name = "argv"
type = "array"
items = { type = "string" }
min_items = 1
description = "Direct process vector: executable and arguments passed verbatim without a shell."

[[params]]
name = "script"
type = "string"
min_length = 1
description = "Shell command line run by a shell. Use for pipes, redirections, and chained commands."

[[params]]
name = "shell"
type = "string"
enum = ["sh", "bash", "zsh", "dash", "ksh"]
default = "sh"
description = "Which shell runs script. Defaults to sh."

[[params]]
name = "cwd"
type = "string"
description = "Working directory for the command relative to workspace root. Defaults to '.'."

[[params]]
name = "timeout_sec"
type = "number"
exclusive_minimum = 0.0
description = "Subprocess timeout in seconds. Defaults to 600."

[[one_of]]
required = ["argv"]
forbidden = ["script"]
description = "Direct form with argv."

[[one_of]]
required = ["script"]
forbidden = ["argv"]
description = "Shell form with script."
