name = "masc_run_list"
description = """
List task runs, most recently updated first. A row has task_id, agent_name, \
plan_bytes (0 when no plan was written), created_at and updated_at; the plan \
text is not in it. count is every run, shown the rows returned (at most \
limit). Use it when starting a session to find abandoned work. masc_run_get \
reads one run's plan; masc_run_init starts a new run."""
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 10 turns needed it across 6317 provider requests, and its
# 369 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 10 turns and saves the 369 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true

[[params]]
name = "limit"
type = "integer"
description = "Most rows to return, newest update first."
default = 50
minimum = 1
maximum = 100
