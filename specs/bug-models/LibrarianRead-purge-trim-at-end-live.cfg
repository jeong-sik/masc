\* The recovery the code runs, asked whether it also keeps the other promise:
\* that a round comes back to what it could not read. It does -- no loss and
\* no stop. Two saves a turn make ends that no line states, which is what a
\* recovery must not move the position to
\* (LibrarianRead-purge-trim-anywhere-live-buggy.cfg). With MaxBad = 1 this
\* violates, but the counter-example holds no recovery at all, so the stop is
\* the one masc#37061 names and not the recovery's doing.
SPECIFICATION SpecPurgeTrimAtEndLive
CONSTANTS
    MaxTurns = 2
    MaxSaves = 2
    MaxClears = 0
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
PROPERTY EveryReachableAtomEventuallyRead
