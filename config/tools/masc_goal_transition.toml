name = "masc_goal_transition"
description = """
Apply an explicit Goal lifecycle transition (RFC-0387 stage 2 gate).

\
request_complete moves executing -> verifying and persists a proof request \
first; repeated while verifying, it requests recovery of a matching pending \
request or reconciles a committed verdict. A retained original may still be \
running, so a retry may be refused. A missing or inconsistent proof is refused \
because an earlier review may still be active. drop and reopen \
also leave verifying. Verifier verdicts are not accepted by this MCP tool. \
pause/block suspend Goal progression and new verification work, preserving the prior live phase. resume/unblock restore it. Linked Tasks remain independent of pause and block. drop needs a note saying why; it cancels the unclaimed linked Tasks unless another Goal that is not dropped also links them, and claimed Tasks keep running while the drop notice names their holders. Terminal Goals must be reopened first."""
additional_properties = false

# Held back from the request until the model asks for it by name. Not
# called once on 2026-08-29 or 2026-08-30 across the fleet.
defer_loading = true

[[params]]
name = "goal_id"
type = "string"
required = true
description = "The exact Goal ID, without leading or trailing space, tab, line feed, carriage return, or form feed."

# The enum mirrors Goal_phase.Public_action.all, which deliberately excludes
# the verifier verdict actions; test_enum_mirror_sync compares the published
# values against the variant.
[[params]]
name = "action"
type = "string"
required = true
enum = ["request_complete", "drop", "reopen", "pause", "resume", "block", "unblock"]

[[params]]
name = "note"
type = "string"
description = "Required for drop: why the Goal is dropped. It becomes the review note and the reason each author of a cancelled Task is told. Optional for the other actions."

[[params]]
name = "evidence_refs"
type = "array"
items = { type = "string" }
description = "For request_complete: explicit board:<post_id>, fusion:<run_id> or task:<task_id> references. Their exact source is captured with this proof request. Task lifecycle state is not complete approval history or external acceptance. Omit on retry to keep the submitted snapshot. While verifying, changed evidence is refused because an earlier review may still be active."

[[params]]
name = "expected_verification"
type = "object"
additional_properties = false
description = "Bind a completion request to the displayed Goal phase, criterion and proof request. Omit request_id only when an executing Goal's observed verification is idle. The server rejects a changed phase, criterion or request. Evidence may be submitted with an executing Goal."
[[params.params]]
name = "phase"
type = "string"
required = true
enum = ["executing", "verifying"]
[[params.params]]
name = "criterion_revision"
type = "string"
required = true
[[params.params]]
name = "request_id"
type = "string"

[[params]]
name = "expected_workspace"
type = "object"
additional_properties = false
description = "Optional canonical workspace paths observed by the caller. A mismatch refuses the transition before changing the Goal."
[[params.params]]
name = "base_path"
type = "string"
required = true
[[params.params]]
name = "masc_root"
type = "string"
required = true
