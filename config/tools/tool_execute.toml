[[params]]
name = "env"
type = "object"
additional_properties = { type = "string" }
description = """
Optional typed environment bindings. Keys must be [A-Za-z0-9_]+ and values \
are strings."""

[[params]]
name = "cwd"
type = "string"
description = """
Working directory for the command, and the only way to set one: there is no \
shell, so 'cd' runs as a program, changes the directory of a child that \
exits, and reports success having done nothing. Must stay within the keeper \
sandbox or an explicit allowed path. Pass a relative cwd, typically '.'. The \
Keeper-visible absolute root is informational, not a cwd input. Docker host \
absolute paths are unavailable."""

[[params]]
name = "timeout_sec"
type = "number"
exclusive_minimum = 0.0
description = """
Explicit subprocess wall-clock timeout in seconds. When absent it is 600, so \
name one for a command that legitimately runs longer, such as a whole test \
suite. A call that runs out of time is stopped and says so; it does not \
continue in the background."""

