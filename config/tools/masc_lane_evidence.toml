name = "masc_lane_evidence"
description = """
Freeze selected Lane observations and original evidence.

Evidence remains contextual material, never mandatory instructions or an approval gate. Preservation, delivery, consumption and actual action are distinct outcomes."""
additional_properties = false
defer_loading = true

[[params]]
name = "instance_id"
type = "string"
required = true
description = "Exact source Add-on instance."

[[params]]
name = "row_ids"
type = "array"
items = { type = "string" }
required = true
description = "Exact selected observation IDs owned by this instance."

[[params]]
name = "keeper_name"
type = "string"
description = "Optional single Keeper recipient, mutually exclusive with broadcast=true. Omit both destinations to preserve evidence only. The Keeper may use, defer or ignore it."

[[params]]
name = "broadcast"
type = "boolean"
description = "Explicitly share the preserved evidence reference in the workspace Broadcast stream. Mutually exclusive with keeper_name. A committed message is not proof of a Keeper read or action."

[[params]]
name = "request_id"
type = "string"
description = "Required for broadcast=true. Generate one unique ID per deliberate send and reuse that ID only to reconcile/retry the same unanswered send. A new deliberate send, even of the same rows, uses a new ID."
