<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASC · Layout language</title>
<style>
:root{color-scheme:dark;--page:#10131a;--surface:#1b1f29;--rail:#202530;--text:#d0d7e3;--muted:#8791a2;--line:#373d49;--accent:#afc8ef;--warn:#e2bd88;--selection:#d0d7e3}
*{box-sizing:border-box}body{margin:0;padding:42px 5vw;background:var(--page);color:var(--text);font:14px/1.7 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}header{max-width:1360px;margin:0 auto 24px;display:flex;align-items:end;justify-content:space-between;gap:24px}h1{font-size:27px;font-weight:600;letter-spacing:-.7px;line-height:1.3;margin:0 0 7px}header p,.note{margin:0;color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}.control{border:1px solid var(--line);border-radius:6px;background:transparent;padding:7px 13px}.control:hover,.control:focus-visible{border-color:var(--accent);outline:none}.control[aria-pressed=true]{background:var(--rail);border-color:var(--muted)}
.terminal{max-width:1360px;margin:auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 24px 80px #0004;font:14px/1.8 "SFMono-Regular",Consolas,"Liberation Mono",monospace}.strip{height:49px;display:flex;align-items:center;gap:26px;padding:0 23px;border-bottom:1px solid var(--line);overflow:auto}.tab{background:none;border:0;padding:0;color:var(--muted);white-space:nowrap;font:inherit}.tab.active{color:var(--text)}.tab.active::before{content:'› ';color:var(--accent)}.tab:focus-visible{outline:1px solid var(--accent);outline-offset:5px}.body{display:flex;min-height:580px}.rail{width:288px;flex:none;display:flex;flex-direction:column;background:var(--rail);border-right:1px solid var(--line);padding-top:22px}.rail-head{margin:0 22px 15px;border-bottom:1px solid var(--line);padding-bottom:13px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.6px}.index{list-style:none;margin:0;padding:0;flex:1}.index button{display:flex;gap:8px;align-items:center;width:100%;height:32px;padding:0 17px;border:0;background:none;text-align:left;font:inherit;color:var(--text)}.index .caret{width:10px;flex:none}.index .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.index button.selected{font-weight:600}.rail.focused .index button.selected{background:var(--selection);color:var(--surface);font-weight:400}.rail-meta{margin:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{min-width:0;flex:1;padding:24px 34px 22px;display:flex;flex-direction:column}.breadcrumb{font-size:12px;color:var(--muted);padding-bottom:20px;border-bottom:1px solid var(--line)}.breadcrumb strong{color:var(--text);font-weight:400}.article{padding:29px 0 35px;flex:1;max-width:880px}.article h2{font-size:20px;line-height:1.5;margin:0 0 11px;font-weight:500;letter-spacing:-.4px}.subhead{color:var(--muted);font-size:12px;margin:0 0 25px}.copy{margin:0 0 27px;line-height:2;max-width:780px}.section{margin:28px 0 15px;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.4px}.reading{display:grid;grid-template-columns:140px 1fr;gap:14px;padding:9px 0}.reading .key{color:var(--muted)}.reading .value{min-width:0;overflow-wrap:anywhere}.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row .meta{color:var(--muted);font-size:12px}.row .mark{color:var(--accent)}.row .warn{color:var(--warn)}.row .small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.message{display:grid;grid-template-columns:112px 1fr;gap:18px;margin-bottom:27px;line-height:1.9}.speaker{color:var(--muted)}.speaker.user{color:var(--accent)}.work{margin:0 0 28px 130px;color:var(--muted);font-size:12px}.composer{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;color:var(--muted)}.telemetry{padding-top:10px;font-size:11px;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:9px 23px;font-size:12px;color:var(--muted);display:flex;gap:23px;min-height:40px;flex-wrap:wrap}kbd{font:inherit;color:var(--text)}.note{max-width:1360px;margin:18px auto 0}.note a{color:var(--muted)}.pill{font-size:12px;color:var(--muted);margin-left:14px}.meter{display:flex;gap:3px;margin:12px 0 8px}.meter i{height:7px;width:13px;background:var(--line);display:block}.meter i.filled{background:var(--accent)}.diff{font:inherit;font-size:13px;color:var(--muted);line-height:1.9;margin:18px 0;white-space:pre-wrap}.diff .add{color:#bed3bd}.overview .rail{display:none}.overview .article{max-width:890px}.overview .main{padding-left:40px}.terminal.narrow{max-width:640px}.narrow .body{min-height:580px}.narrow .rail{width:100%;border-right:0}.narrow.browsing .main{display:none}.narrow:not(.browsing) .rail{display:none}.narrow .main{padding:23px}.narrow .reading{grid-template-columns:105px 1fr}.terminal.mono{--surface:#181818;--rail:#181818;--text:#ddd;--muted:#ddd;--line:#777;--accent:#ddd;--warn:#ddd;--selection:#ddd}.mono .diff .add{color:var(--text)}[hidden]{display:none!important}@media(max-width:750px){body{padding:22px 12px}header{align-items:start;flex-direction:column}.strip{gap:22px}.rail{width:100%;border:0}.browsing .main{display:none}.terminal:not(.browsing) .rail{display:none}.main{padding:22px}.reading{grid-template-columns:100px 1fr}.message{grid-template-columns:90px 1fr}.work{margin-left:108px}.footer{gap:13px;font-size:11px}}
</style>
<header><div><h1>하나의 작업대, 같은 호흡.</h1><p>얇은 구분선 · 여유 있는 여백 · 지금 읽는 곳에만 강조</p></div><div class="controls"><button class="control" id="width" aria-pressed="false">좁은 화면</button><button class="control" id="mono" aria-pressed="false">흑백</button><button class="control" id="focus">본문 읽기</button></div></header>
<div class="terminal" id="terminal" tabindex="0" aria-label="TUI layout design preview">
 <nav class="strip" aria-label="Surfaces" id="tabs"></nav>
 <div class="body"><aside class="rail" id="rail"><div class="rail-head"><span id="rail-title"></span><span id="count"></span></div><ul class="index" id="index"></ul><div class="rail-meta">이름은 같은 열에.<br>현재 위치는 선택 표시로.</div></aside><main class="main"><div class="breadcrumb" id="breadcrumb"></div><article class="article" id="article"></article><div class="composer" id="composer" hidden>› 메시지 입력…</div><div class="telemetry" id="telemetry"></div></main></div>
 <div class="footer"><span><kbd>Tab</kbd> 다음 화면</span><span><kbd>↑ ↓</kbd> 선택</span><span><kbd>Enter</kbd> 읽기</span><span><kbd>←</kbd> 목록</span></div>
</div>
<p class="note">디자인 시안 · 모든 내용은 예시 데이터입니다. 실제 TUI 실행 화면이 아닙니다. 공통 목록 틀은 소스에 적용했으며, 이 시안의 화면별 본문 배치 전체를 구현했다는 뜻은 아닙니다. <a href="LAYOUT-LANGUAGE.md">레이아웃 기준과 적용 범위</a></p>
<script>
const reading=(key,value)=>`<div class="reading"><span class="key">${key}</span><span class="value">${value}</span></div>`;
const row=(mark,title,description,meta='',warn=false)=>`<div class="row"><span class="mark ${warn?'warn':''}">${mark}</span><div>${title}<span class="small">${description}</span></div><span class="meta">${meta}</span></div>`;
const surfaces=[
 {name:'Dashboard',title:'오늘 이어갈 일',items:[],meta:'workspace · 예시 읽기',body:()=>`<h2>내 결정이 필요한 일</h2><p class="subhead">결정할 항목과 이어갈 대화를 먼저 봅니다.</p>${row('◇','외부 게시 요청','masc-pro-builder · 게시할 내용과 대상을 확인합니다.','1건',true)}<h3 class="section">이어가기</h3>${row('●','masc-pro-builder','Keeper 목록과 대화 사이의 이동을 다듬고 있어요.','대화 열기')}<h3 class="section">새 작업</h3><p class="copy">Keeper를 골라 새 일을 맡깁니다. <span class="pill">→ Keepers</span></p>`},
 {name:'Work',rail:'Goals',items:['[exec] 편하게 오가는 대화','[ver] 작업 결과 확인','[human] 근거 검토'],meta:'Goal과 Task의 완료는 각각의 근거로 표시합니다.',body:i=>`<h2>${['편하게 오가는 대화','작업 결과 확인','근거 검토'][i]}</h2><p class="subhead">Goal · ${['실행 중','검증 중','사람 확인 대기'][i]} · 예시</p><p class="copy">Keeper를 선택하고 대화를 이어가는 흐름을 한 작업대 안에서 읽습니다.</p><h3 class="section">완료 기준</h3>${reading('기준','대상을 고르고, 초안을 유지하고, 이전 위치로 돌아온다.')}${reading('관측','현재 후보의 실행 검증 대기')}<h3 class="section">연결된 작업</h3>${row('●','목록에서 대화 열기','tui-developer · 구현 검토 중')}${row('○','작은 화면에서 확인','실행 후보 준비 후 확인')}`},
 {name:'Keepers',rail:'KEEPERS',items:['● masc-pro-builder','· glossary-maniac','● tui-developer','○ code-reviewer'],meta:'대화 대상과 목록 커서는 별도로 유지됩니다.',chat:true,body:i=>`<div class="message"><span class="speaker user">▶ you</span><span>지금 진행 중인 작업을 정리해줘.</span></div><div class="work">■ Read &nbsp; workspace tasks</div><div class="message"><span class="speaker">● ${['builder','glossary','tui','reviewer'][i]}</span><span>목록과 본문이 같은 리듬으로 읽히도록 다듬고 있어요.<br>화면을 옮겨도 이름, 상태, 행동의 자리는 익숙하게 유지합니다.</span></div>`},
 {name:'Usage',rail:'Accounts',items:['OpenAI · account A','Anthropic · account B','Local · machine'],meta:'사용량 · 관측 창 · 관측 시각을 분리합니다.',body:i=>`<h2>${['OpenAI','Anthropic','Local'][i]}</h2><p class="subhead">선택한 계정의 사용량 · 아래 수치는 디자인 예시</p><h3 class="section">현재 관측 창</h3>${reading('사용 비율','36% · 예시값')}<div class="meter" aria-label="sample usage meter">${Array.from({length:25},(_,n)=>`<i class="${n<9?'filled':''}"></i>`).join('')}</div>${reading('관측 시각','14:20 · 예시')}${reading('범위','이 계정에서 관측한 창')}<h3 class="section">기록</h3><p class="copy">같은 측정의 이전 기록은 Trend에서 이어 봅니다.<br>읽지 못한 값은 0 대신 확인할 수 없다고 표시합니다.</p>`},
 {name:'Board',rail:'Board',items:['TUI 레이아웃 방향','Keeper 전환 시 초안','검증 결과 공유'],meta:'게시물과 답글은 읽는 순서대로 둡니다.',body:i=>`<h2>${['TUI 레이아웃 방향','Keeper 전환 시 초안','검증 결과 공유'][i]}</h2><p class="subhead">tui-developer · #product · 예시 게시물</p><p class="copy">제목과 이름이 먼저 보이고, 보조 정보는 한 단계 조용하게 둡니다.<br>넓은 화면의 빈 공간을 숫자로 채우지 않습니다.</p><p class="copy">목록에서 대상을 고른 뒤에는 본문이 충분한 폭을 갖습니다.<br>선택한 행과 지금 읽는 내용의 관계를 유지합니다.</p><h3 class="section">답글</h3>${row('●','code-reviewer','좁은 화면에서도 선택 위치와 돌아갈 곳이 남도록 확인하겠습니다.')}`},
 {name:'Workspace',rail:'Repositories',items:['masc','notes','examples'],meta:'경로와 diff가 실제 읽기 공간을 갖습니다.',body:i=>`<h2>${['masc','notes','examples'][i]}</h2><p class="subhead">Repository · feature/layout · 예시</p>${reading('위치','workspace / '+['masc','notes','examples'][i])}${reading('변경','수정된 파일 2개 · 예시')}<h3 class="section">선택한 변경</h3><p class="copy">render_sidebar.ml</p><pre class="diff">  let row = selected_item in\n<span class="add">+ draw_selection row;\n+ draw_content detail;</span>\n  finish_frame ()</pre><p class="subhead">소스·변경 내용이 중심이 되고, 상태 정보는 그 옆에서 보조합니다.</p>`},
 {name:'System',rail:'Settings',items:['Theme','Parameters','Prompts','Accounts'],meta:'값과 설명을 가까이, 세부 진단은 상세에서.',body:i=>`<h2>${['Theme','Parameters','Prompts','Accounts'][i]}</h2><p class="subhead">선택한 설정 · 예시</p>${reading('현재 값',['Terminal native','기본값 사용','workspace prompt','선택한 계정'][i])}${reading('출처','workspace 설정')}${reading('기본값','제품 기본값')}<h3 class="section">설명</h3><p class="copy">현재 값, 기본값, 출처가 같은 문맥에서 읽히도록 정리합니다.<br>편집과 적용 상태는 실제 설정 흐름을 따릅니다.</p>`}
];
let active=0,focused=false;const states=surfaces.map(()=>({cursor:0,opened:0}));const terminal=document.querySelector('#terminal');
function setFocus(value){focused=value&&surfaces[active].items.length>0;draw()}
function draw(){let view=surfaces[active],state=states[active];terminal.classList.toggle('overview',view.items.length===0);terminal.classList.toggle('browsing',focused);document.querySelector('#rail').classList.toggle('focused',focused);document.querySelector('#focus').hidden=view.items.length===0;document.querySelector('#focus').textContent=focused?'본문 읽기':'목록 선택';document.querySelector('#tabs').replaceChildren(...surfaces.map((v,i)=>{let b=document.createElement('button');b.className='tab'+(i===active?' active':'');b.textContent=v.name;b.setAttribute('aria-current',i===active?'page':'false');b.onclick=()=>{active=i;focused=false;draw()};return b}));document.querySelector('#rail-title').textContent=view.rail||'';document.querySelector('#count').textContent=String(view.items.length);document.querySelector('#index').replaceChildren(...view.items.map((label,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.className=i===state.cursor?'selected':'';let caret=document.createElement('span');caret.className='caret';caret.textContent=i===state.cursor?'›':'';let name=document.createElement('span');name.className='label';name.textContent=label;b.append(caret,name);b.onclick=()=>{state.cursor=i;focused=true;draw();terminal.focus()};b.ondblclick=()=>{state.opened=i;setFocus(false)};li.append(b);return li}));document.querySelector('#breadcrumb').textContent=view.name+(view.items.length?'  ›  '+view.items[state.opened]:'  /  workspace');document.querySelector('#article').innerHTML=view.body(state.opened);document.querySelector('#telemetry').textContent=view.meta;document.querySelector('#composer').hidden=!view.chat}
document.querySelector('#width').onclick=e=>{let narrow=terminal.classList.toggle('narrow');e.currentTarget.setAttribute('aria-pressed',String(narrow));e.currentTarget.textContent=narrow?'넓은 화면':'좁은 화면';draw()};document.querySelector('#mono').onclick=e=>{let mono=terminal.classList.toggle('mono');e.currentTarget.setAttribute('aria-pressed',String(mono))};document.querySelector('#focus').onclick=()=>{if(focused)states[active].opened=states[active].cursor;setFocus(!focused);terminal.focus()};terminal.onkeydown=e=>{if(e.target.closest('.strip'))return;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape','Tab'].includes(e.key))return;e.preventDefault();let state=states[active],view=surfaces[active];if(e.key==='Tab'){active=(active+(e.shiftKey?surfaces.length-1:1))%surfaces.length;focused=false;draw()}else if(e.key==='ArrowLeft')setFocus(true);else if(e.key==='Escape'||e.key==='ArrowRight')setFocus(false);else if(focused){if(e.key==='Enter'){state.opened=state.cursor;setFocus(false)}else{state.cursor=Math.max(0,Math.min(view.items.length-1,state.cursor+(e.key==='ArrowDown'?1:-1)));draw()}}};draw();
</script>
</html>
