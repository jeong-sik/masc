# --- agent-core boundary (v0.217.0) enable_thinking admission prep, 2026-07-20 ---
# The upstream ollama_cloud catalog rows declare thinking_control_format =
# "ollama_think", which only encodes on the native /api/chat wire. These lanes
# ride the OpenAI-compatible /v1 wire, where that format encodes nothing, so
# after the v0.217.0 pin bump an explicit enable_thinking=true keeper turn
# would be AcceptRejected(Enable_not_encodable) instead of silently dropped.
# Declare the /v1 truth: inherent reasoning, no wire control ("none" =>
# No_thinking_control + supports_reasoning=true => admission accepts as
# declared-inherent). Budget likewise has no /v1 control wire => false.
[[models]]
id_prefix = "kimi-k2.6"
provider_name = "ollama_cloud"
base = "ollama_cloud"
max_context_tokens = 262144
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
thinking_control_format = "none"
reasoning_replay = "preserve_always"
supports_multimodal_inputs = true
supports_image_input = true
modality_priority = "visual_first"
supports_response_format_json = false
supports_native_streaming = true
supports_structured_output = false

[[models]]
id_prefix = "minimax-m3"
provider_name = "ollama_cloud"
base = "ollama_cloud"
# https://ollama.com/api/show, model=minimax-m3, observed 2026-09-08:
# model_info["minimax-m3.context_length"] = 512000.
max_context_tokens = 512000
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
thinking_control_format = "none"
reasoning_streaming_format = "delta:reasoning"
# Mirror repair: an overlay copy that replaces the embedded base row wholesale
# must not drop the base row's declarations — the dropped reasoning_replay made
# code-reviewer repeat an identical five-tool bundle ~11x per turn (task-838,
# measured 2026-08-28). Value from the embedded base minimax-m3 row.
reasoning_replay = "preserve_always"
supports_multimodal_inputs = true
supports_image_input = true
modality_priority = "visual_first"
supports_response_format_json = false
supports_structured_output = false
supports_native_streaming = true

[[models]]
id_prefix = "deepseek-v4-pro"
provider_name = "ollama_cloud"
base = "ollama_cloud"
# /api/show model_info["deepseek4.context_length"] = 1048576 (2026-09-08).
max_context_tokens = 1048576
supports_tools = true
supports_tool_choice = false
supports_reasoning = true
thinking_control_format = "none"
# Mirror repair (task-838): value from the embedded base deepseek-v4-pro row.
reasoning_replay = "drop_without_tool_preserve_with_tool"
supports_multimodal_inputs = false
supports_image_input = false
supports_response_format_json = false
supports_native_streaming = true
supports_structured_output = false

