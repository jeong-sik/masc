\* The recovery of LibrarianRead-purge-trim-buggy.cfg under a guard stated
\* over turns: refuse while a turn is unread, and make the new end the
\* position.
\* NoAtomPassedUnread MUST be violated: the guard asks about turns while atoms
\* are what a recovery puts at risk. The code asks about atoms
\* (Keeper_checkpoint_purge.Unread_atoms_present).
SPECIFICATION SpecPurgeTrimGuardedByTurns
CONSTANTS
    MaxTurns = 3
    MaxSaves = 2
    MaxClears = 1
    MaxBad = 0
INVARIANT TypeOK
INVARIANT NoAtomPassedUnread
CHECK_DEADLOCK FALSE
