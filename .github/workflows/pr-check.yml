name: PR check

# One quick compile per pull request push. The manual CI stays as it is:
# dispatched at a work-unit boundary, one run for the whole repo. What that
# lane cannot give a PR is a fast answer, because its concurrency group is
# repo-global and parallel sessions' dispatches cancel each other's runs.
#
# Scope matches the manual job's: `dune build @check` type-checks the whole
# tree, test/ included, and links nothing -- linking is this repo's slow
# step, and every breakage class this session produced (unbound values,
# signature mismatches, an mli-only type, a label that would not resolve)
# is a compile error @check reports.
#
# Concurrency is per PR, so a new push cancels only that PR's older run and
# parallel PRs leave each other alone.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The lint suite is one job on purpose. It used to be ~30 GitHub Actions
  # jobs, each paying its own checkout and apt setup, which queued whole PRs
  # for tens of minutes; scripts/ci/run-lint-suite.sh was written to collapse
  # them into a single sequential run that still reports every failure rather
  # than stopping at the first. That driver then ran nowhere: the 2026-09-02
  # collapse of the 9-job lane dropped lint along with the jobs, and the
  # driver was never re-attached (#33211).
  #
  # It is a job of its own rather than a step in `check` because it needs no
  # OCaml toolchain -- checkout, ripgrep, jq and python3 are the whole
  # dependency -- so it runs beside the build instead of behind the opam
  # switch, and a lint failure and a compile failure are reported
  # independently. Measured on the two PRs that introduced this job: lint
  # 5m31s and 5m28s, build 6m16s and 6m4s, in parallel. The saving is not
  # the lint job's own speed; it is that a lint verdict does not queue
  # behind a toolchain it never uses.
  #
  # Mode is `blocking-pr`: the 37 whole-tree lints plus six guards that read
  # the diff against the PR's base -- Fun.protect finalizers, ignore
  # justification on new sites, the RFC-0235 stale-base revert guard, and
  # the cancel guard. Those six were left out when this job landed because
  # lint-cancel-guard.sh reported five hits on main; #33229 closed them, so
  # they run now. The diff guards need the base commit present, hence
  # fetch-depth: 0.
  lint:
    name: lint suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Full history: the blocking-pr guards diff HEAD against the PR's
        # base sha, and a depth-1 checkout does not contain that commit.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the tools the lints call
        # 29 of the 40 lints call rg or jq, and yaml-syntax.sh imports PyYAML.
        # apt-refresh.sh bounds a hung mirror at 90s and fails open, the same
        # way release.yml uses it.
        run: |
          set -euo pipefail
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y --no-install-recommends ripgrep jq python3-yaml gcc libc6-dev binutils

      # Runs before the lints because it answers whether this run is about the
      # current head at all. The payload carries the sha the run was created
      # for; a push that lands afterwards leaves that sha behind, and every
      # verdict below then describes a commit nobody is looking at. It cannot
      # live in run-lint-suite.sh -- that takes a base sha and knows nothing
      # about the head branch or the payload.
      - name: PR run is not stale
        run: |
          bash scripts/check-pr-sync.sh \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --expected-head-sha "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}"

      # These checks use only checked-in text, Bash and Python. Report them
      # alongside compilation without waiting for an OCaml toolchain.
      - name: Check doc truth
        run: scripts/check-doc-truth.sh

      - name: Verify doc truth uses stable checkout inputs
        run: python3 test/test_doc_truth_stable_inputs.py

      - name: Verify release distribution fixtures
        run: python3 test/test_release_dashboard_bundle.py -v

      - name: Verify release evidence receipt with private captures
        run: python3 test/test_release_evidence_report.py -v

      # The glibc floor decides which distros a release can start on, and
      # release.yml does not run on pull requests, so this is where the check
      # itself gets exercised before it is trusted at tag time.
      - name: Verify the glibc floor check
        run: python3 test/test_glibc_floor_check.py -v

      - name: Installer onboarding and removal behavior
        run: |
          python3 test/test_package_macos_runtime.py
          python3 test/test_installer_dependencies.py -v
          python3 test/test_installer_wizard.py -v
          python3 test/test_installer_upgrade.py -v
          python3 test/test_installer_uninstall.py -v
          python3 test/test_install_runtime_setup.py -v
          python3 test/test_onboarding_journey.py -v

      # The bench driver tells an operator which of three unrelated causes
      # stopped the masc binary from starting. Getting that wrong sends the
      # reader after the wrong fix, so the classifier is checked here.
      - name: Verify the bench dependency diagnosis
        run: python3 test/test_bench_deps_diagnosis.py -v

      - name: Verify onboarding oracle ordering and sibling selection
        run: |
          node --test test/test_imp_onboarding_browser.cjs
          python3 test/test_imp_onboarding_acceptance.py

      - name: Blocking lints
        run: |
          bash scripts/ci/run-lint-suite.sh blocking-pr \
            "${{ github.event.pull_request.base.sha }}"

      - name: Advisory lints
        # Recorded, not enforced -- the driver's own contract for this mode.
        continue-on-error: true
        run: bash scripts/ci/run-lint-suite.sh advisory

  check:
    name: dune build @check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only the edited-test step below reads it, and it asks the pull
      # request API which files changed because a three-dot git diff cannot
      # answer that here: this job checks out at depth 1, so there is no
      # merge base and the answer would be the whole tree. Scoped to this
      # job so the lint job, which runs 37 scripts over pull request
      # content, does not carry it.
      pull-requests: read
    steps:
      - name: Free disk space
        # Same preinstalled bulk the manual CI removes for the same reason:
        # the opam switch plus _build does not fit beside the Android SDK,
        # .NET, GHC, and the CodeQL bundle (issue #22954).
        run: |
          set -euo pipefail
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check source text integrity
        run: scripts/ci/check-source-text-integrity.sh

      # One RFC number names one document, and the index table is generated
      # from the frontmatter. The script refuses a number that two documents
      # claim and a table that differs from what the frontmatter says, so a
      # "RFC-NNNN §4.1" citation in the code names exactly one file. It reads
      # the checkout only, so it runs before the toolchain is set up.
      - name: Check RFC index
        run: scripts/rfc-generate-index.py --check

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-bisect

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep poppler-utils libreoffice-impress python3-venv

      - name: Prepare managed presentation verification inputs
        run: python3 scripts/ci/prepare-presentation-verifier.py

      - name: Verify standalone namespace fixtures
        run: python3 test/test_run_standalone_suites.py --compile-fixtures -v

      - name: Build
        env:
          DUNE_JOBS: "4"
        # NO continue-on-error: the build is deterministic and must hard-fail.
        # @test/stanzas/runtest is the generator-and-diff rule for the coverage
        # group stanza: a shell script and a diff, nothing linked. It is where a
        # suite that left the group without leaving coverage_test_names.txt is
        # caught on its own pull request instead of on the next nightly
        # (#33922 was caught by #34367 a week later, #34392 the day after).
        #
        # The node targets are the five browser-parity rules: each asserts the
        # extension and the OCaml driver carry the same injection script, a
        # match kept by hand across background.js and lib/browser_*.ml. None of
        # them had ever run in CI -- @check links test/ without running it, the
        # targeted runner builds a <name>.exe these rules do not have, and the
        # edited-test selector reads only test/test_*.ml (#34837). PR #34831
        # edited three of those sources and both node suites and the log shows
        # only the OCaml suite beside them. 3.3s for all five, node startup
        # included.
        #
        # Computed rather than listed here so a sixth rule joins by existing;
        # the reader exits non-zero when it finds none, because a build line
        # that expands to nothing reports success.
        run: |
          set -euo pipefail
          node_targets=$(python3 scripts/ci/list-node-alias-targets.py)
          printf 'browser parity suites:\n%s\n' "${node_targets}"
          dune build @check @test/stanzas/runtest ${node_targets}

      # #32511 dropped the nine-job lane and took this ratchet with it: the
      # script still has a GITHUB_ACTIONS branch, and between 2026-09-02 and
      # this commit no workflow called it. It runs here because it needs the
      # switch the build above already has, and it fetches its own base commit
      # because this job checks out at depth 1.
      # Needs `dune describe`, so it cannot live in the lint job. One of the
      # nine guards #32511 deleted with the "Meta bug-class gates" step.
      - name: Env reads below the config floor
        run: python3 scripts/ci/check_env_reads_below_config.py

      # Two guards #34018 found unwired that the lint job cannot run: this one
      # compiles a Parsetree checker with ocamlc -I +compiler-libs, and the
      # sublib gate below reads dune's own dependency graph. Wired here, where
      # the switch is, rather than into the lint suite, where they would fail
      # on a missing binary instead of on what they check.
      - name: Keeper event-queue projection boundary
        run: bash scripts/check-keeper-event-queue-projection-boundary.sh

      - name: Sublibrary leaf boundary (RFC-0056 G1)
        run: python3 scripts/audit-sublib-cycle.py

      - name: OCaml boundary ratchet
        env:
          OCAML_BOUNDARY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$OCAML_BOUNDARY_BASE_REF"
          bash scripts/ocaml-boundary-ratchet.sh

      # RFC-0428 step one. @check type-checks and links nothing, which is the
      # right trade for the whole tree and says nothing about whether an
      # assertion holds. Measured over 2026-09-06: five defects across five
      # TUI pull requests, @check caught one, and three of the four it missed
      # broke inside a test file the same pull request was editing.
      #
      # So this links only those and runs them. It is not the suite; 344
      # stanzas is the link cost the design above is buying and this does not
      # spend it. It runs here rather than in a job of its own because the
      # build cache it needs is the one the step above just filled.
      #
      # Blocking as of 2026-09-10. It was advisory "until main's red count is
      # known", because gating on an unknown number stops pull requests that
      # changed nothing to do with it. That number is now one: the 09-09
      # nightly named eight suites failing outside test/ci-known-failures.txt
      # and all eight are answered (#33782), leaving the single listed row.
      # The script skips whatever that file lists, so a failure here is a
      # suite that is supposed to pass and did not.
      #
      # What advisory cost, measured on the pull requests themselves: #34981
      # and #34983 each ran test_keeper_tool_schema_bytes through the
      # config/tools mapping, each read "over the 98940 ceiling by 942" and
      # "by 1516" in this step's own log, and both merged green. #35004
      # repaired the ceiling the next morning. The trigger worked; nothing
      # was answerable for the verdict.
      - name: Build the Keeper sandbox image the sandboxed suites read through
        # Four suites read a file through a Keeper's Docker sandbox. Without the
        # image the read answers "image_not_found: keeper sandbox image
        # masc-sandbox:general is not available" and the suite is red for a
        # reason the pull request had no part in. test.yml builds it before it
        # runs anything; this lane did not, so one suite had two verdicts
        # depending on which lane ran it. Measured on main 2026-09-10 by
        # dispatching both suites the release PR #35073 selected:
        # test_keeper_visible_path_projection is OK in the Test lane and red
        # here, on the same commit.
        #
        # MASC_TEST_ALLOW_REAL_DOCKER goes with it. A fixture whose keeper runs
        # a command starts a persistent container, and
        # Keeper_sandbox_runtime_setup refuses that under a test executable
        # unless the run says it wants the real daemon -- the guard is there so
        # a developer's daemon does not collect containers named for temp
        # workspaces. This runner is thrown away with its daemon, and a fixture
        # that started a container removes it in its own teardown
        # (Masc_test_deps.teardown_fixture_sandbox). Without the variable the
        # cases that used to fail on the missing image fail on the guard
        # instead, so the image alone would move the error, not remove it.
        #
        # The recipe is compiled from its own module rather than linked out of
        # bin/main_eio.exe, which is a minute of linking to print a string.
        # Measured in the sandbox-image lane on 2026-09-09: 3s for the printer
        # (14s there, including an apt-get this lane does not need) and 49s for
        # the docker build.
        run: |
          set -euo pipefail
          cp lib/keeper_sandbox_image/keeper_sandbox_image.ml "$RUNNER_TEMP/recipe.ml"
          printf '\nlet () = print_string dockerfile\n' >> "$RUNNER_TEMP/recipe.ml"
          opam exec -- ocamlc -o "$RUNNER_TEMP/print-recipe" "$RUNNER_TEMP/recipe.ml"
          "$RUNNER_TEMP/print-recipe" | docker build -t masc-sandbox:general -
          docker image inspect masc-sandbox:general --format '{{.Id}}'

      - name: Run the tests this pull request edits
        # Bounded twice, because a hung suite must not read as a break: the
        # deadline below ends the step, and the script gives each suite its
        # own timeout on top of that.
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          DUNE_JOBS: "4"
          MASC_TEST_ALLOW_REAL_DOCKER: "1"
        run: |
          bash scripts/ci/run-edited-tests.sh \
            "${{ github.event.pull_request.number }}"


  # dashboard/ ships a `typecheck` script and no lane calls it.
  #
  # ci.yml's header records that its dashboard job was folded away on
  # The dev profile builds ppx inline tests, the release profile drops them, so
  # a value only a let%test reaches is used in one and unused in the other --
  # warning 32, and the root dune makes it an error in both profiles. The only
  # workflow that built with the release profile was browser-host-proof.yml,
  # behind a paths: filter and over two executables' dependency graphs, so the
  # answer arrived days late and only when a pull request happened to touch
  # those paths: slot_scheduler.available and in_use (#34848) and
  # discovery.discovered_endpoint_contexts (#34861) reached main that way, and
  # were found together by an unrelated change (#34876 repairs them, #34878
  # asks for this).
  #
  # Its own job rather than a step in the one above, because it is a second
  # full compile: as a step it would double that job's six minutes on the
  # critical path, and as a job it runs beside it. The switch setup is the same
  # composite actions, so the duplication is five lines.
  release-check:
    name: dune build --profile release @check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Free disk space
        # The opam switch plus a second _build profile does not fit beside the
        # preinstalled Android SDK, .NET, GHC and CodeQL bundle (#22954).
        run: |
          set -euo pipefail
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test

      - name: Build
        env:
          DUNE_JOBS: "4"
        # --profile release rather than --release: the profile is what drops
        # inline tests and what the root dune names its flags for, and
        # --release carries a set of unrelated defaults with it.
        #
        # NO continue-on-error: an unused value is deterministic.
        run: |
          set -euo pipefail
          dune build --profile release @check

  # 2026-09-02, and pr-check.yml never had one, so nothing type-checks the
  # 697 test files and 9445 tests under dashboard/. What that cost, measured
  # on 2026-09-06: #33454 left two TS2352 errors on main and they sat a full
  # day, found only because a baseline was taken by hand (#33548 repairs them).
  #
  # This is the type-check alone, not the suite. `pnpm typecheck` over the
  # whole dashboard is 8.7s locally. `pnpm test` is 481s in the single-worker
  # shape package.json pins, or 95s parallel with one test that starves under
  # load; RFC-0428 carries those numbers and the suite waits on that decision.
  # The type-check does not need to wait for it.
  dashboard-types:
    name: dashboard typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        # The toolchain release.yml builds the SPA with: node 22 + pnpm 10.31.0.
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@10.31.0 --activate
          pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: dashboard
        # NO continue-on-error: main is green here once #33548 lands, and a
        # type error is deterministic. Do not merge this before that one.
        run: pnpm typecheck

      - name: Run the dashboard tests that read backend source
        # These suites assert that a TypeScript vocabulary still matches the
        # OCaml that produces it -- the SSE event union, turn outcomes, keeper
        # attention reasons, the lane registry fields, lifecycle events, the
        # TUI answering glow. Nothing else selects them: a backend token rename
        # touches no file under dashboard/, and the dashboard suite as a whole
        # is not in CI (#35032). That is how `keepalive_stopped` reached main
        # with no label on the dashboard side (#35031).
        #
        # The list is computed, not kept here, so a seventh such test joins the
        # lane by existing. 57 tests, ~4s locally.
        run: |
          set -euo pipefail
          coupled=$(python3 scripts/ci/list-dashboard-backend-coupled-tests.py)
          printf 'backend-coupled dashboard suites:\n%s\n' "${coupled}"
          cd dashboard
          pnpm exec vitest run ${coupled}

      - name: Build browser preview
        working-directory: dashboard
        run: pnpm exec vite build --config vite.preview.config.ts

      - name: Record browser preview provenance
        env:
          PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('assets/dashboard')
          files = sorted(path for path in root.rglob('*') if path.is_file())
          if not (root / 'index.html').is_file():
              raise SystemExit('Dashboard build did not produce index.html')
          manifest = {
              'checkout_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'pr_head_commit': os.environ['PR_HEAD_COMMIT'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'files': {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                        for path in files},
          }
          (root / 'preview-provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload browser preview
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-preview-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: assets/dashboard/
          include-hidden-files: true
          if-no-files-found: error
