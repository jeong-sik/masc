name = "keeper_composition_run"
description = """
Run the exact draft returned by keeper_composition_prepare. Rechecks \
the preparing Keeper and frozen contracts before effects. Inline drafts return \
execution results, including child scope/admission/disposition/exports in nested_scopes; \
only children reaching an actual ready leaf activate. Blocked or refused children \
remain visible, and independent exports may be available while the whole run fails. \
Async ordinary drafts return a durable request id and deliver completion \
later. Use valid selected exports from the completion projection. When results \
are referenced or required detail is missing, read keeper_composition_status \
with the exact request_id in result_reference. Do not repeatedly poll while \
other useful work is available. To continue a prepared async run after its previous \
request has canonically settled, supply its original composition_run_id as \
resume_run_id together with the same draft sha256. Completed nodes reuse their \
recorded result and occurrence. A producer-owned keeper_job_result wait rechecks \
the same job after status has committed complete outputs; this does not launch \
the original program or arrange an automatic job-completion wake. Unavailable evidence or unproven effects do not \
authorize replay. Shared Skill publication is optional and separate."""
additional_properties = false
defer_loading = true

[[params]]
name = "sha256"
type = "string"
required = true
min_length = 64
max_length = 64
description = "Exact sha256 from the durable draft reference returned by prepare."

[[params]]
name = "resume_run_id"
type = "string"
min_length = 36
max_length = 36
description = "Original composition_run_id of a prepared async run to continue after its previous request has canonically settled. Omit for a fresh run."
