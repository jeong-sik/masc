name = "tool_execute"
description = """
Run one command inside the Keeper sandbox. Give exactly one of argv or
command: argv is a non-empty process vector run without a shell; command
is one line handed to a real shell. cwd is relative to the path jail.
MASC does not interpret program or subcommand meaning. Calls finish or stop
at timeout_sec; there is no background task lifecycle.

Only intent=auto and intent=request_effect are valid; observe is not an
intent value. auto applies the configured sandbox policy. On setups that
enforce Observe, the result includes the exit status and output, even when
a write is refused. Use request_effect for persistent writes or network
effects: the configured Gate decides permission before execution, and the
request does not grant permission by itself. A nonzero exit alone is not
a permission request.
"""
additional_properties = false

[[params]]
name = "argv"
type = "array"
items = { type = "string" }
min_items = 1
description = "Direct process vector: executable and arguments passed verbatim without a shell."

[[params]]
name = "command"
type = "string"
min_length = 1
description = "Shell command line run by a shell. Use for pipes, redirections, and chained commands."

[[params]]
name = "shell"
type = "string"
enum = ["sh", "bash", "zsh", "dash", "ksh"]
default = "sh"
description = "Which shell runs command. Defaults to sh."

[[params]]
name = "cwd"
type = "string"
description = "Working directory for the command relative to workspace root. Defaults to '.'."

[[params]]
name = "timeout_sec"
type = "number"
exclusive_minimum = 0.0
description = "Subprocess timeout in seconds. Defaults to 600."

[[one_of]]
required = ["argv"]
forbidden = ["command"]
description = "Direct form with argv."

[[one_of]]
required = ["command"]
forbidden = ["argv"]
description = "Shell form with command."

[[params]]
name = "intent"
type = "string"
enum = ["auto", "request_effect"]
default = "auto"
description = "auto permits restricted execution as configured; request_effect asks the existing Gate for effect authorization, never grants permission by itself."
