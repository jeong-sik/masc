name = "keeper_spawn"
description = """
Start a program and return while it runs, so a long-lived process can be read.

A server, a watcher, a TUI: read from it and wait on it without blocking this call. The process ends when the turn does; nothing here survives into the next one. Use Execute for a command that finishes on its own."""
additional_properties = false

defer_loading = true

[[params]]
name = "argv"
type = "array"
required = true
description = "Program and its arguments, passed verbatim. No shell: a metacharacter here is a literal argument."

[[params]]
name = "cwd"
type = "string"
description = "Absolute directory to run in. Defaults to the keeper workspace."
