name: Terminal-Bench harness tests
# benchmarks/terminal_bench/tests had no CI: they ran only when someone ran
# pytest by hand before a bench run.
#
# Its own workflow behind paths: rather than a job in pr-check.yml, which runs
# on every pull request: the suite installs harbor and its dependencies, and
# almost no pull request touches the bench. The paths are everything the suite
# reads: the bench directory; config/ and skills/, which
# configs/render_configs.py copies into every rendered arm; and the two OCaml
# sources tests/test_endpoint_env.py compares the env_file refusals with.
on:
  pull_request:
    paths:
      - 'benchmarks/terminal_bench/**'
      - 'config/**'
      - 'skills/**'
      - 'lib/exec_shim/exec_shim.ml'
      - 'lib/exec_ssh_protocol/exec_ssh_protocol.ml'
      - '.github/workflows/bench-tests.yml'
      - 'scripts/harness/perf/compare_tui_artifacts.py'
      - 'test/test_tui_input_frame_pty.py'
      - 'test/test_tui_artifact_comparison.py'
  workflow_dispatch:
    inputs:
      compare_tui:
        description: Compare two existing macOS ARM runtime artifacts
        type: boolean
        default: false
      baseline_run:
        type: string
        description: Baseline Release workflow run ID
      baseline_artifact:
        type: string
        description: Baseline runtime-probe artifact ID
      baseline_commit:
        type: string
        description: Expected full baseline source commit
      candidate_run:
        type: string
        description: Candidate Release workflow run ID
      candidate_artifact:
        type: string
        description: Candidate runtime-probe artifact ID
      candidate_commit:
        type: string
        description: Expected full candidate source commit
      repetitions:
        type: string
        description: Repetitions per binary, alternating order
        default: '3'
      input_cycles:
        type: string
        description: Repeated sets of ten individually acknowledged input transitions
        default: '1'
      keeper_metadata:
        type: string
        description: Optional checked-in alpha/beta JSON fixture path for both binaries
      retained_channels:
        type: string
        description: Synthetic alpha bindings loaded before Info scroll; zero skips this setup
        default: '0'
permissions:
  contents: read
concurrency:
  group: bench-tests-${{ inputs.compare_tui && 'compare-tui' || 'pytest' }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    if: ${{ !inputs.compare_tui }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmarks/terminal_bench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install harbor and pytest
        run: python -m pip install -r requirements.txt
      - name: Check TUI comparison receipt validation
        working-directory: ${{ github.workspace }}
        run: python3 test/test_tui_artifact_comparison.py
      - name: Run the bench tests
        run: python -m pytest tests -q -rs --junitxml="${RUNNER_TEMP}/bench-tests.xml"
      - name: Refuse skipped tests
        # Some tests skip when a tool such as jq is missing, which pytest
        # counts as a pass. Here every test must run.
        run: |
          python - "${RUNNER_TEMP}/bench-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          skipped = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in ET.parse(sys.argv[1]).iter("testcase")
              if case.find("skipped") is not None
          ]
          for name in skipped:
              print(f"::error::skipped in CI: {name}")
          sys.exit(1 if skipped else 0)
          PY
  compare-tui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_tui }}
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install binary runtime libraries
        run: brew install gmp libpq openssl@3 zstd
      - name: Check TUI comparison receipt validation
        run: python3 test/test_tui_artifact_comparison.py
      - name: Download baseline
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.baseline_artifact }}
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: runtime-baseline
      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: runtime-candidate
      - name: Record source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT" > runtime-baseline/artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT" > runtime-candidate/artifact.json
      - name: Verify identity and compare acknowledged frames
        env:
          BASELINE_RUN: ${{ inputs.baseline_run }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPETITIONS: ${{ inputs.repetitions }}
          INPUT_CYCLES: ${{ inputs.input_cycles }}
          KEEPER_METADATA: ${{ inputs.keeper_metadata }}
          RETAINED_CHANNELS: ${{ inputs.retained_channels }}
        run: |
          fixture_args=()
          if [[ -n "$KEEPER_METADATA" ]]; then
            fixture_args=(--keeper-metadata "$KEEPER_METADATA")
          fi
          exec python3 scripts/harness/perf/compare_tui_artifacts.py \
            --baseline runtime-baseline --baseline-run "$BASELINE_RUN" \
            --baseline-artifact "$BASELINE_ARTIFACT" --baseline-commit "$BASELINE_COMMIT" \
            --candidate runtime-candidate --candidate-run "$CANDIDATE_RUN" \
            --candidate-artifact "$CANDIDATE_ARTIFACT" --candidate-commit "$CANDIDATE_COMMIT" \
            --repetitions "$REPETITIONS" --input-cycles "$INPUT_CYCLES" \
            --retained-channels "$RETAINED_CHANNELS" \
            "${fixture_args[@]}" \
            --output-dir comparison-results
      - name: Retain raw observations and identity receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-artifact-comparison-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: comparison-results/
          if-no-files-found: warn
