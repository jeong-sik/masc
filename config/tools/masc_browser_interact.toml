name = "masc_browser_interact"
description = """
Interact with an explicit Firefox/Zen tab; no arbitrary JavaScript. Read again after success or failure before retrying: page handlers can change external state. click/fill require one visible inspected element; fill targets text inputs/textarea and sends input/change without Enter or submit. scroll_at scrolls the pane under the point. drag uses trusted automation pointers. follow_link bypasses click handlers for observed same-tab HTTP(S) HTML/SVG anchors (_self/_top/_parent); rejects downloads, new-window targets, noreferrer and explicit referrerpolicy. destinationUrl is intent, not loaded-page evidence. activate_tab is live-only (extension >=0.6.0): verifies active=true without window focus or navigation."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 3,294 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 22개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름과 한 줄
# 요약이 남고, 부르면 그 턴에 붙는다.
defer_loading = true

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation"]
default = "live"

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "expectedUrl"
type = "string"
description = "Observed URL guard; required for pointer actions, follow_link and activate_tab."

[[params]]
name = "action"
type = "string"
required = true
enum = ["activate_tab", "follow_link", "click", "fill", "scroll", "click_at", "scroll_at", "drag"]

[[params]]
name = "selector"
type = "string"
description = "click/fill: one visible top-document element; alternative to documentId/nodeId."

[[params]]
name = "text"
type = "string"
description = "fill replacement; empty clears, never echoed."

[[params]]
name = "x"
type = "integer"
description = "scroll/scroll_at horizontal CSS-pixel delta."

[[params]]
name = "y"
type = "integer"
description = "scroll/scroll_at vertical CSS-pixel delta."

[[params]]
name = "clientId"
type = "string"
description = "Live UUID from BrowserTabs/Read; required for multiple clients, stale fails. Omit on automation."

[[params]]
name = "documentId"
type = "string"
description = "Scene document with nodeId; required for follow_link. Reload fails."

[[params]]
name = "nodeId"
type = "string"
description = "Scene node; survives reordering, fails on detach/replacement."

[[params]]
name = "point"
type = "object"
description = "click_at/scroll_at: normalized x/y in [0,1); copy screenshot viewport/expectedUrl."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0

[[params]]
name = "from"
type = "object"
description = "Automation drag start; normalized x/y in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0

[[params]]
name = "to"
type = "object"
description = "Automation drag end; normalized x/y in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0

[[params]]
name = "viewport"
type = "object"
description = "click_at/scroll_at/drag: copy screenshot documentId, CSS dimensions and scroll offsets exactly; changes fail."

additional_properties = false

[[params.params]]
name = "documentId"
type = "string"
required = true

[[params.params]]
name = "width"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "height"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "scrollX"
type = "number"
required = true

[[params.params]]
name = "scrollY"
type = "number"
required = true

# follow_link uses documentId/nodeId and expectedUrl already declared above.
