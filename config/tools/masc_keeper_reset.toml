name = "masc_keeper_reset"
description = """
Clear a keeper's lifecycle latch: drops the pause bit and the latched reason \
in one durable write. This is the operator recovery path for a keeper the \
generic resume transform refuses to unpause — \
Keeper_meta_contract.mark_resumed deliberately leaves \
Transcript_corruption_reset_required unchanged, so resume alone cannot free \
it. Does not touch usage counters, token stats, configuration, goals, or \
Keeper instructions."""
additional_properties = false

[[params]]
name = "name"
type = "string"
required = true
description = "Keeper handle to reset"
