name = "keeper_skill"
description = "Read one frozen instruction Skill body by the exact key the Available list below offers. When that body names a bundled file needed for the current work, call again with its relative `file` path. A file larger than the turn's configured `[skills].resource-read-max-bytes`, or content that cannot fit the provider's shared inline tool-result boundary, is rejected before activation is recorded. Only a key from this turn's Available list resolves; a key from another turn, or a bare Skill name, is refused."
additional_properties = false

[[params]]
name = "skill"
type = "string"
required = true
min_length = 1
description = "Exact key of one Skill, copied from this tool's Available list. It identifies the Skill and the frozen revision this turn holds; there is nothing else to supply."

[[params]]
name = "file"
type = "string"
required = false
min_length = 1
description = "Optional bundled resource path relative to the Skill root, exactly as SKILL.md names it. Omit it to read the frozen Skill body."
