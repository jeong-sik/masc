name = "masc_dos_step"
description = """
Let the DOS machine run with no key pressed.

Time is machine execution steps, including idle wait clocks. By default, stops when an empty keyboard poll \
overlaps unchanged screen memory between samples. This can happen during a \
game transition; settled does not prove a final prompt. until_ready=false \
runs the machine-step budget unless the program exits and always reports \
settled=false. Returns settled, steps_run, instructions_run, elapsed_cycles and input_requests."""
additional_properties = false

defer_loading = true

[[params]]
name = "steps"
type = "integer"
description = "Machine-step budget. Default 4000000."
minimum = 1
maximum = 4000000
default = 4000000

[[params]]
name = "until_ready"
type = "boolean"
description = "Stop at the empty-poll/unchanged-screen observation, as described above. Default true."
default = true
