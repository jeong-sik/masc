name = "masc_dos_step"
description = """
Let the DOS machine run with no key pressed.

Time is 8086 instructions. By default, stops when an empty keyboard poll \
overlaps unchanged screen memory between samples. This can happen during a \
game transition; settled does not prove a final prompt. until_ready=false \
runs the instruction budget unless the program exits and always reports \
settled=false. Returns settled, steps_run and input_requests."""
additional_properties = false

defer_loading = true

[[params]]
name = "steps"
type = "integer"
description = "Instruction budget. Default 4000000, about 170 ms."
minimum = 1
maximum = 4000000
default = 4000000

[[params]]
name = "until_ready"
type = "boolean"
description = "Stop at the empty-poll/unchanged-screen observation, as described above. Default true."
default = true
