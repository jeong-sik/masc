name = "masc_fusion_status"
description = """
Read Fusion status and original deliberation evidence.

Without run_id, list your tracked runs. With it, read original Board evidence: \
full panel answers, judge advice, source context, post/origin IDs and evidence hash, \
plus separate Keeper decisions. Missing registry metadata is null; Board evidence \
remains readable by run_id subject to retention. Registry history replays at startup. \
Do not poll: inspect evidence after the completion wake before attributing panel views \
or using masc_fusion_decision. Unavailable does not prove expiry. Read-only."""
additional_properties = false

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 16 times in 11 turns, 907 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 11 extra requests over the same week.
defer_loading = true

[[params]]
name = "run_id"
type = "string"
description = """
Run ID from masc_fusion. Omit to list your tracked running and recently completed runs."""
