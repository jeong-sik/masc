name = "masc_browser_interact"
description = """
Click, fill, scroll, hover, drag, follow a link or activate a browser tab. hover/drag_to accept observed elements (selector or scene reference) without guessing screenshot coordinates. They resolve visible, unobstructed targets in the current viewport; scroll and re-read offscreen targets first. hover_at (no click) and drag move a trusted pointer. automation, Stagehand Chromium and live webdriver_bidi serve these actions; Stagehand requires the default drag path and timing. activate_tab is live-only, on a web_extension connection (>=0.6.0): it verifies active=true without window focus or navigation. A live request its connection cannot serve is refused before input as live_transport_unsupported; servingClients are the connected browsers that can. List that connection's tabs first: tab IDs are per connection.
The tab is explicit; no arbitrary JavaScript. drag/drag_to issue trusted pointer input; a receipt does not prove the application accepted a drop. HTML5 DataTransfer/drop is not guaranteed by Firefox and has no synthetic fallback. Read again after success or failure before retrying: page handlers can change external state. click/fill require one visible inspected element. On automation, Stagehand Chromium and live webdriver_bidi, click resolves an unobstructed selector or scene node and sends native pointerDown/pointerUp, supporting trusted pointerdown/mousedown menus; disabled and aria-disabled targets are refused. Click captures the current URL when expectedUrl is omitted, then checks it before input. WebExtension retains DOM click. fill targets text inputs/textarea and sends input/change without Enter or submit. scroll_at scrolls the pane under the point. follow_link bypasses click handlers for observed same-tab HTTP(S) HTML/SVG anchors (_self/_top/_parent); rejects downloads, new-window targets, noreferrer and explicit referrerpolicy. destinationUrl is intent, not loaded-page evidence."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 3,294 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 22개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름이 남고,
# 부르면 그 턴에 스키마가 붙는다. 한 줄 요약은 그 답에 한 번 나온다.
defer_loading = true

[[params]]
name = "lane"
type = "string"
enum = ["live", "automation", "stagehand"]
default = "live"

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "expectedUrl"
type = "string"
description = "Observed URL guard; required for explicit pointer actions, hover/drag_to, follow_link and activate_tab. Semantic click may omit it; the native backend captures and guards the resolved page URL."

[[params]]
name = "action"
type = "string"
required = true
enum = ["activate_tab", "follow_link", "click", "fill", "scroll", "click_at", "scroll_at", "hover", "drag_to", "hover_at", "drag"]

[[params]]
name = "selector"
type = "string"
description = "click/fill/hover: one visible top-document element; alternative to documentId/nodeId."

[[params]]
name = "text"
type = "string"
description = "fill replacement; empty clears, never echoed."

[[params]]
name = "x"
type = "integer"
description = "scroll/scroll_at horizontal CSS-pixel delta."

[[params]]
name = "y"
type = "integer"
description = "scroll/scroll_at vertical CSS-pixel delta."

[[params]]
name = "clientId"
type = "string"
description = "Live UUID from BrowserTabs/Read; required for multiple clients, stale fails. Omit on automation."

[[params]]
name = "documentId"
type = "string"
description = "Scene document with nodeId; required for follow_link. Reload fails."

[[params]]
name = "nodeId"
type = "string"
description = "Scene node; survives reordering, fails on detach/replacement."

[[params]]
name = "point"
type = "object"
description = "click_at/hover_at/scroll_at: normalized x/y in [0,1); copy screenshot viewport/expectedUrl."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0

[[params]]
name = "from"
type = "object"
description = "Native drag start; normalized x/y in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0

[[params]]
name = "to"
type = "object"
description = "Native drag end; normalized x/y in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0

[[params]]
name = "viewport"
type = "object"
description = "click_at/hover_at/scroll_at/drag: copy screenshot documentId, CSS dimensions and scroll offsets exactly; changes fail."

additional_properties = false

[[params.params]]
name = "documentId"
type = "string"
required = true

[[params.params]]
name = "width"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "height"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "scrollX"
type = "number"
required = true

[[params.params]]
name = "scrollY"
type = "number"
required = true

# follow_link uses documentId/nodeId and expectedUrl already declared above.

[[params]]
name = "source"
type = "object"
description = "drag_to source: one selector OR observed documentId/nodeId. Must be visible and unobstructed."
additional_properties = false

[[params.params]]
name = "selector"
type = "string"

[[params.params]]
name = "documentId"
type = "string"

[[params.params]]
name = "nodeId"
type = "string"

[[params]]
name = "destination"
type = "object"
description = "drag_to destination: one selector OR observed documentId/nodeId, in the same current document."
additional_properties = false

[[params.params]]
name = "selector"
type = "string"

[[params.params]]
name = "documentId"
type = "string"

[[params.params]]
name = "nodeId"
type = "string"

[[params]]
name = "via"
type = "array"
items = { type = "object", additionalProperties = false, required = ["x", "y"], properties = { x = { type = "number", minimum = 0.0, exclusiveMaximum = 1.0 }, y = { type = "number", minimum = 0.0, exclusiveMaximum = 1.0 } } }
description = "drag/drag_to: observed intermediate viewport fractions, in order. Omit for a straight drag through its midpoint. Custom paths require automation or live webdriver_bidi."

[[params]]
name = "durationMs"
type = "integer"
minimum = 0
maximum = 9007199254740991
description = "drag/drag_to: duration of each intermediate and destination move in milliseconds; default 0. Requires automation or live webdriver_bidi when nonzero."
