name: Release essential behavior

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: release-behavior-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    # Keep the release guard's job identity; the receipt names its exact scope.
    name: test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ocaml-toolchain
      - uses: ./.github/actions/pin-ocaml-deps
      - name: Install test dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep
      - name: Run the same release behavior selection as local verification
        env:
          DUNE_JOBS: '4'
          CI_TEST_LOG_FILE: ${{ runner.temp }}/release-behavior.log
        run: scripts/run-release-behavior.sh
      - name: Preserve behavior results and failure captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-behavior-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-behavior.log
          if-no-files-found: warn
