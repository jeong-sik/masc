name = "masc_msx_peek"
description = """
Read memory bytes and refresh the snapshot for masc_msx_ram_diff.

Read-only. Address accepts hex (e000 or 0xE000) or decimal. Returns hex byte pairs."""
additional_properties = false

defer_loading = true

[[params]]
name = "address"
type = "string"
required = true
description = "Logical address to read from, hex (\"e000\") or decimal."

[[params]]
name = "length"
type = "integer"
description = "Bytes to read, 1..256. Default 16."
minimum = 1
maximum = 256
default = 16
