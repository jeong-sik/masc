name = "keeper_context_status"
description = """
Check your own persisted checkpoint and session state. Returns: name (your \
keeper name), checkpoint_bytes, message_count, generation, memory fact \
counts, sandbox health, and your workspace root plus backend/profile \
metadata. Context-window occupancy is not currently observed and is not \
returned. sandbox paths are tool-ready and can be passed directly as path or \
cwd to keeper tools without prefix. Use when checking checkpoint/session \
continuity or resolving a path without string-interpolating your own keeper \
name."""
additional_properties = false
