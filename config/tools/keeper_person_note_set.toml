name = "keeper_person_note_set"
description = """
Remember (or clear) a note about a person met on a connected surface, keyed \
by their roster speaker_id (RFC-0229). The note survives after their \
messages age out of the log window and shows up on the keeper_surface_read \
roster."""

[[params]]
name = "speaker_id"
type = "string"
required = true
description = """
Stable speaker id from the roster (Discord snowflake); notes attach to ids, \
never names"""

[[params]]
name = "note"
type = "string"
required = true
description = "What to remember about this person; blank clears the note"
