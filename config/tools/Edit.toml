name = "Edit"
description = """
Patch an existing file by replacing an exact string. Prefer Edit over \
sed -i/awk/perl via Execute for file changes: the exact-match check and \
the 'not found' error keep a failed edit from writing anything. Each call \
replaces one exact string (every occurrence with replace_all=true); apply \
several disjoint changes as successive Edit calls. Read the file \
first and copy old_string verbatim from its current bytes, including \
leading whitespace, indentation, and newlines; the match is exact and \
byte-sensitive. On 'old_string not found', re-Read the file to get the \
current text instead of retrying the same string."""

# Closed: the translator pins mode=patch, and the patch runtime reads exactly
# these four keys. An undeclared 'content' key used to flip the call into a
# whole-file overwrite through translator mode inference — silent, and in the
# destructive direction (masc#31573).
additional_properties = false

[[params]]
name = "file_path"
type = "string"
required = true
description = "Absolute or sandbox-relative file path to edit. The file must exist."

[[params]]
name = "old_string"
type = "string"
required = true
description = "Exact substring to replace. Must occur exactly once unless replace_all=true."

[[params]]
name = "new_string"
type = "string"
required = true
description = "Replacement substring. Pass an empty string to delete old_string."

[[params]]
name = "replace_all"
type = "boolean"
description = "Default false. When true, replaces every occurrence of old_string."
