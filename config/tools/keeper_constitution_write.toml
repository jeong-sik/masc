name = "keeper_constitution_write"
description = """
Write one norm into this world's constitution.

Every keeper here reads it at the top of every turn from then on. This is the world's shared text, not your own notes — those go to keeper_memory_write. Agreement happens on the board before you call this; the tool records what was decided and judges nothing."""
additional_properties = false

defer_loading = true

[[params]]
name = "text"
type = "string"
required = true
description = "The norm, as one sentence, rendered verbatim into every keeper's prompt."

[[params]]
name = "evidence_uri"
type = "string"
description = "Optional board post or comment id where this norm was agreed."

[[params]]
name = "replaces"
type = "array"
# Mirrors World_constitution_types.Article_id.json_schema_pattern.
# test_enum_mirror_sync compares the two; edit both or neither.
items = { type = "string", pattern = "^a-[0-9a-f]{32}$" }
unique_items = true
description = """
Article ids this norm supersedes, each named once. Absent or empty writes a
plain norm; naming held articles retires them and records this norm as their
replacement (RFC-0504).
"""

[[params]]
name = "reason"
type = "string"
description = "Why the bundle is replaced, in one sentence. Recorded in the ledger beside by/at. Refused on a plain write."
