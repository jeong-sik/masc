name = "masc_browser_act"
description = """
Configured Firefox/Zen automation only. Use BrowserRead lane=automation mode=elements for selectors and tabId. Reuse the observed decoded selector string exactly, preserving CSS combinators and escapes. After no match, read elements again in the same tab and frame before correcting the input. Actions can change external state; read the page after success or failure before retrying."""
additional_properties = false

[[params]]
name = "action"
type = "string"
enum = ["open_tab", "close_tab", "click", "fill", "press", "select", "scroll", "back", "forward", "reload", "upload", "accept_dialog", "dismiss_dialog"]
required = true
description = "Operation. fill replaces text; select picks an option by exact value."

[[params]]
name = "lane"
type = "string"
enum = ["automation"]
default = "automation"
description = "Browser source. Default: automation."

[[params]]
name = "tabId"
type = "integer"
minimum = 0
description = "Required except for open_tab. Use the observed tab id."

[[params]]
name = "selector"
type = "string"
description = "Observed CSS selector for click/fill/press/select/upload; must match exactly one element. Preserve the decoded string, including > and existing CSS escapes; do not insert literal JSON escape notation."

[[params]]
name = "text"
type = "string"
description = "Replacement text for fill, or optional prompt text for accept_dialog. Empty clears."

[[params]]
name = "key"
type = "string"
enum = ["Enter", "Tab", "Escape", "Backspace", "Delete", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End"]
description = "Key for press."

[[params]]
name = "value"
type = "string"
description = "Exact option value for select."

[[params]]
name = "url"
type = "string"
description = "Absolute HTTP(S) URL for open_tab."

[[params]]
name = "x"
type = "integer"
description = "Horizontal pixel delta for scroll; required with y."

[[params]]
name = "y"
type = "integer"
description = "Vertical pixel delta for scroll; required with x."

[[params]]
name = "framePath"
type = "array"
items = { type = "string" }
description = "Outer-to-inner iframe/frame CSS selectors from BrowserRead mode=frames. Reuse each decoded selector exactly, preserving CSS escapes. Omit for top-level. Only element and scroll actions accept a nonempty path."

[[params]]
name = "paths"
type = "array"
items = { type = "string" }
description = "Keeper-readable file paths (playground-relative or visible absolute paths). Files are privately staged through your sandbox before replacing the file input selection. Maximum 16 MiB per file."
