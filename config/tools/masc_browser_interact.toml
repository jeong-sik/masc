[[params]]
name = "steps"
type = "array"
description = "workflow: SDK Page calls in order; a step may carry only its method's fields. click/dblclick/hover/focus: selector. clickAndWaitForPopup: selector, popupOptions. dragAndDrop: selector, destination (selector). mouse.click/mouse.move: x,y CSS px. mouse.wheel: x,y deltas at the pointer; move or click over the scroll container first in the same workflow. fill: selector, text. press: selector, key. selectOption: selector, selectionJson. goto: absolute HTTP(S) url. waitForURL: url glob or urlRegex. waitForSelector: selector, state attached|detached|visible|hidden. waitForLoadState: optional state domcontentloaded|load|networkidle. keyboard.type/insertText: text. keyboard.paste: text, optional html. keyboard.press: key chord such as Meta+b. evaluate/waitForFunction: source, optional argumentJson. fetch: HTTP(S) or relative url; the step receipt is the response. download.cancel: downloadId. waitForTimeout: milliseconds. reload/url/title/info/snapshot/events: none. evaluate, insertText, paste, download.cancel, url, title, info, events and waitForTimeout take no options. events drains the Page event buffer; network requests are in BrowserRead/masc_browser_read mode=network. No step or time limit."

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
