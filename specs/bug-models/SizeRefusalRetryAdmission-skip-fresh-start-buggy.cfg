\* Buggy model: a refused Resume goes straight to the floor and skips the
\* fresh Start, cutting history the Resume never sent.
\* Expected: EveryResendStepsDown VIOLATED.
SPECIFICATION SpecSkipFreshStart

CONSTANTS
    TurnLimit       = 35
    WindowLimit     = 200
    FixedTurnSizes  = {20, 40}
    FixedSideSizes  = {30, 90, 190}
    ResumeTurnSizes = {30, 50}
    VendorSizes     = {20, 200}
    CarrierInline   = 40
    CarrierAddress  = 5
    MemoryFull      = 40
    MemoryDeferred  = 5
    HistoryFull     = 32
    HistoryFloor    = 4

INVARIANTS
    TypeOK

PROPERTIES
    EveryResendStepsDown

CHECK_DEADLOCK FALSE
