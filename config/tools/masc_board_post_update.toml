name = "masc_board_post_update"
description = """
Edit an existing board post you authored, by exact post_id.

Only the post's author can edit it; others are rejected. Pass the full new
content to replace the post body, not append to it. The body alias is also
accepted; if both are sent, body wins. title is optional; omit it to derive
the title from the body. author defaults to the caller's agent identity.
Get post_id from masc_board_list, masc_board_post_get, or visible Board
context.
"""


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 19 turns needed it across 6317 provider requests, and its
# 1095 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 19 turns and saves the 1095 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true
identity_fields = ["author"]

[[params]]
name = "post_id"
type = "string"
required = true
pattern = "^[A-Za-z0-9_-]{1,64}$"
description = """
Exact Board post ID to edit. IDs minted by Board use p- plus 32 lowercase hexadecimal characters. Copy the exact ID from masc_board_list, masc_board_post_get, or visible Board context; do not guess it.
"""

[[params]]
name = "body"
type = "string"
description = "Accepted alias for `content`; if both are sent, `body` wins."

[[params]]
name = "content"
type = "string"
description = "Canonical field for the full replacement post body."

[[params]]
name = "title"
type = "string"
description = """
Optional new title. When omitted, the title is re-derived \
from the new body."""

[[params]]
name = "author"
type = "string"
description = """
Editor identity; must match the post's author. Auto-filled \
from caller's agent_name when omitted."""

[[params]]
name = "new_author"
type = "string"
description = """
Transfer ownership to a new author. Only the current post \
owner can set this field."""
