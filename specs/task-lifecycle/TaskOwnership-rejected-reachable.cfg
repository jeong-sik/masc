\* Expects a violation. A clean run must be able to reach a returned Task, or
\* the two Rejected invariants are checking nothing. This cfg is the alarm for
\* that, so it names the thing that must not hold.

SPECIFICATION SpecClean

CONSTANTS
    Tasks = {t1, t2}
    Agents = {a1, a2}
    MaxSubmissions = 2
    NoOne = NoOne
    Operator = Operator

INVARIANTS
    RejectedNeverHappens

CHECK_DEADLOCK
    FALSE
