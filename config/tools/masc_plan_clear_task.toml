name = "masc_plan_clear_task"
description = """
Clear your current task assignment without completing it (does not change \
task status). Use when switching to a different task, abandoning work, or \
resetting session state. Use masc_transition to change task status \
separately."""
additional_properties = false


# Held back from the request until the model asks for it by name.
# 2026-09-01..03: 1 turns needed it across 6317 provider requests, and its
# 352 B schema rode every one of those requests. Loading it on demand costs
# one extra request on those 1 turns and saves the 352 B on the rest.
# What that trade does not cover is in Tool_loading_declarations.
defer_loading = true