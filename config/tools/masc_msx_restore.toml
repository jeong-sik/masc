name = "masc_msx_restore"
description = """
Resume a saved MSX machine, or list the saved ones.

Restore a named MSX checkpoint, replacing the current machine only after validation. Resumes the saved frame, mounted media and input ledger without rebooting. No slot lists the saved checkpoints and restores nothing; masc_msx_checkpoint_info shows what one slot holds."""
additional_properties = false
defer_loading = true

[[params]]
name = "slot"
type = "string"
description = "Checkpoint to restore: 1..64 letters, digits, underscores or hyphens. Omit to list them."
