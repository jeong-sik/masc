name = "masc_wiki_list"
description = """
List every page in the wiki.

Returns the wiki index: one line per page with its title, its file (<page>.md) and its one-line summary; a file whose header does not read is listed by filename and reason. Pair with masc_wiki_read to fetch one or masc_wiki_search to query by content."""

# Held back from the request until the model asks for it by name.
# 2026-08-25..08-31 across the fleet: called 3 times in 3 turns, 293 bytes of
# schema on every request. Deferring saves those bytes on ~254 requests
# a day and costs at most 3 extra requests over the same week.
defer_loading = true

# The Keeper reaches the two sibling tools under their keeper_* names
# (Transport_alias in keeper_tool_descriptor), so the sentence it reads names
# those. The catalog row above names the MCP surface's masc_wiki_* names.
[keeper_projection]
description = """
Returns the wiki index: one line per page with its title, its file \
(<page>.md) and its one-line summary; a file whose header does not read is \
listed by filename and reason. Use keeper_wiki_read to fetch one or \
keeper_wiki_search to query by content."""
