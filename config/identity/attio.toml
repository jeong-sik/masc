# Attio's remote MCP server.
#
# Only the server is named. Its endpoints, the scopes it publishes and whether
# a client has to be registered by hand come from the two well-known documents
# it serves, so none of that can go stale here.
#
# Measured 2026-08-27: the protected-resource document answers at the path
# this URL implies, the authorization server it names offers S256 and a
# registration endpoint, the token endpoint accepts a client that
# authenticates with nothing, and an MCP initialize is refused with 401
# rather than 404. It names 3 scopes, all of which are asked for.

id = "attio"
label = "Attio"
mcp_url = "https://mcp.attio.com/mcp"

access_token_env = "ATTIO_ACCESS_TOKEN"
expires_at_env = "ATTIO_ACCESS_TOKEN_EXPIRES_AT"
refresh_token_file = "/home/keeper/.attio/refresh_token"

# Margin, not a copy of a lifetime: the server states its own expiry on every
# exchange and this only decides how early to go back.
renew_before_sec = 600
