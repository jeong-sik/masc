<!doctype html><title>Owned BiDi drag fixture</title><style>#pad{width:450px;height:250px;background:lightblue}body{margin:0}</style><div id="pad">Drag this area</div><pre id="status">untouched</pre><script>window.events=[];let held=false;for(const type of ['pointerdown','pointermove','pointerup'])document.querySelector('#pad').addEventListener(type,e=>{if(type==='pointerdown')held=true;if(held){events.push({type:e.type,trusted:e.isTrusted,x:e.clientX,y:e.clientY});document.querySelector('#status').textContent=JSON.stringify(events)}if(type==='pointerup')held=false;});</script>
