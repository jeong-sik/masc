name: Main minimal build

on:
  # A red main must surface on the push that broke it, not at the next
  # half-hour tick: with no push signal, suite results vanish behind a
  # broken build and pre-existing suite regressions stay hidden.
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  # The failure step below files or updates the fixed main-health issue.
  # Successful runs never reach it, so this scope is unused on green paths.
  issues: write
  # The scheduled run deletes the Dune cache entries it has just replaced.
  actions: write

# Serialize before the receipt lookup. A queued run rechecks the successful
# receipt after the previous build finishes.
#
# No run cancels a build that has started. Push runs used to cancel their
# predecessors, and main moves faster than one build: of 88 push runs between
# 2026-11-10T13:30Z and 2026-11-12T01:18Z, 62 were cancelled part-way (median
# 112s each, 252 runner-minutes) and 20 finished. A started build now
# finishes and the next one builds whatever main is by then. GitHub keeps
# only the newest waiting run of a group, so a burst of merges costs one
# build, not one per merge.
#
# Push and the merge worker's dispatch share a group: both mean "main moved",
# and separate groups built the same commit twice side by side. The schedule
# keeps its own group so a waiting scheduled run is never replaced.
concurrency:
  group: main-minimal-build-${{ github.event_name == 'schedule' && 'schedule' || 'main-moved' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Cold compiler/dependency installation can take much longer than a warm
    # build. This is a stalled-job backstop, not the expected build duration.
    timeout-minutes: 90
    env:
      DUNE_JOBS: '4'
      # `enabled-except-user-rules` stored nothing: every saved Dune cache was
      # about 400 bytes and each build compiled from scratch (issue #51365).
      # With `enabled`, a rule is reused only while its declared inputs are
      # unchanged. The build-commit probe depends on (universe), so it still
      # runs every build.
      DUNE_CACHE: enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Identify build inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          # Conservatively include every tracked file except documentation
          # and changelog. In particular include scripts, assets, dashboard,
          # sandbox images, all Dune files and external dependency pins.
          digest=$(python3 - <<'PY'
          import hashlib, subprocess
          entries = subprocess.check_output(['git', 'ls-tree', '-r', '-z', 'HEAD']).split(b'\0')
          inputs = []
          for entry in entries:
              if not entry:
                  continue
              path = entry.split(b'\t', 1)[1]
              if path.startswith((b'docs/', b'docs-site/', b'changelog.d/')) or path == b'CHANGELOG.md':
                  continue
              inputs.append(entry + b'\0')
          print(hashlib.sha256(b''.join(inputs)).hexdigest())
          PY
          )
          echo "receipt=main-build-receipt-v2-${ImageOS}-${ImageVersion}-${digest}" >> "$GITHUB_OUTPUT"
          # v2: entries saved under v1 are empty (about 400 bytes, #51365) and
          # merge-compile.yml still saves under v1. A pull request that matched
          # one of them would restore nothing, so the names must differ.
          echo "dune=main-dune-v2-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          echo "DUNE_CACHE_ROOT=$RUNNER_TEMP/masc-dune-cache" >> "$GITHUB_ENV"

      - name: Look for a successful build of these inputs
        id: receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-main-build-receipt
          key: ${{ steps.inputs.outputs.receipt }}

      - uses: ./.github/actions/setup-ocaml-toolchain
        if: steps.receipt.outputs.cache-hit != 'true'
      - uses: ./.github/actions/pin-ocaml-deps
        if: steps.receipt.outputs.cache-hit != 'true'
      # Test dependencies are needed so the type-check step below can
      # resolve the test tree's libraries.
      - uses: ./.github/actions/install-ocaml-deps
        if: steps.receipt.outputs.cache-hit != 'true'
        with:
          install-flags: --with-test

      - name: Reuse Dune build artifacts
        if: steps.receipt.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/masc-dune-cache
          key: ${{ steps.inputs.outputs.dune }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.inputs.outputs.dune }}-

      - name: Build the operator executables
        id: product
        if: steps.receipt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # pipefail keeps Dune's exit status through tee; the log feeds
          # the failure digest and the fixed issue below.
          opam exec -- dune build --root . \
            bin/main_eio.exe bin/masc_tui.exe \
            bin/deployment_preflight_helper.exe 2>&1 | tee "$RUNNER_TEMP/main-build.log"

      # Type-check the whole tree, tests included, so a broken test tree is
      # caught on main instead of at release-candidate time. It also runs
      # when the product build failed, so both results are reported.
      - name: Type-check the tree (dune build @check)
        id: check
        if: (success() || failure()) && steps.receipt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          opam exec -- dune build --root . @check 2>&1 | tee -a "$RUNNER_TEMP/main-build.log"

      # PR type-checks restore this cache and never save one of their own
      # (pr-type-check.yml). One entry is about 1.1 GB, so only the scheduled
      # run saves: the number of entries per day then follows the half-hour
      # schedule, not the number of merges. Trimming to zero removes only the
      # entries this build did not use; the ones it used are hard-linked from
      # _build and stay, so the entry does not grow from run to run.
      - name: Drop Dune cache entries this build did not use
        if: success() && github.event_name == 'schedule' && steps.receipt.outputs.cache-hit != 'true'
        run: opam exec -- dune cache trim --size=0B

      - name: Save Dune build artifacts for pull request type-checks
        if: success() && github.event_name == 'schedule' && steps.receipt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/masc-dune-cache
          key: ${{ steps.inputs.outputs.dune }}-${{ github.sha }}

      # One entry is about 1.35 GB and the repository limit is 10 GB. Two
      # scheduled saves 20 minutes apart put usage at 10.6 GB on 2026-11-12,
      # and past the limit GitHub evicts whatever was read least recently,
      # which can be a toolchain cache. A type-check only ever restores the
      # newest entry, so the older ones are deleted here. A failed delete
      # leaves an entry behind and shows as a warning; it does not fail the
      # build.
      - name: Delete the Dune cache entries this one replaces
        if: success() && github.event_name == 'schedule' && steps.receipt.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ steps.inputs.outputs.dune }}-
          KEEP: ${{ steps.inputs.outputs.dune }}-${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?key=${PREFIX}&ref=refs/heads/main&per_page=100" \
            --jq '.actions_caches[] | select(.key != env.KEEP) | .id' |
          while read -r id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            echo "deleted Dune cache entry ${id}"
          done

      - name: Write the receipt
        if: success() && steps.receipt.outputs.cache-hit != 'true'
        run: printf '%s\n' "$GITHUB_SHA" > .ci-main-build-receipt

      # Only a completed successful build creates a receipt. Failures retry
      # at the next scheduled check; cache eviction also causes a rebuild.
      - name: Remember successful build inputs
        if: success() && steps.receipt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-main-build-receipt
          key: ${{ steps.inputs.outputs.receipt }}

      - name: Record checked scope
        if: always()
        env:
          RECEIPT_HIT: ${{ steps.receipt.outputs.cache-hit }}
          BUILD_STATUS: ${{ job.status }}
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            echo "Checked main SHA: $GITHUB_SHA"
            if [ "$RECEIPT_HIT" = true ]; then
              echo 'Build skipped: non-documentation inputs already built and type-checked successfully.'
              echo "Previously built SHA: $(cat .ci-main-build-receipt)"
              echo 'This skip is not compilation evidence for the checked SHA.'
            else
              echo "Build job status: $BUILD_STATUS"
              echo "Product build (server, TUI, deployment preflight): $PRODUCT_OUTCOME"
              echo "Type-check of the whole tree (dune build @check; tests compiled, not run): $CHECK_OUTCOME"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A red build used to surface only as a red job in the Actions tab:
      # the nightly suite lane files an issue, but nothing did for the
      # build lane, so a broken build silently masked every suite result
      # behind it. Extract the Dune errors here and file them below.
      # Every extraction is guarded: a digest that finds nothing says so
      # instead of failing the step or printing a misleading empty block.
      - name: Summarize the build failure
        if: always() && steps.receipt.outputs.cache-hit != 'true'
        run: |
          {
            echo "## Build failure digest"
            log="$RUNNER_TEMP/main-build.log"
            if [ ! -s "$log" ]; then
              echo 'extraction unavailable: no build log (setup failure or cache hit); see the step output above.'
            else
              # Drop whole blocks about sandbox deletion: runner-hygiene noise
              # (see #45218), not build signal. Verified against real logs.
              hits=$(grep -a -B4 -A8 '^Error' "$log" | awk 'BEGIN{RS="--\n"; ORS=""} !/failed to delete sandbox/ {print $0 "--\n"}' | grep -av '^--$' | head -n 80 || true)
              if [ -z "$hits" ]; then
                echo "extraction found no '^Error' block; see the full step output above."
              else
                printf '```\n%s\n```\n' "$hits"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File or update the main-build-health issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          label=main-health
          gh label create "${label}" \
            --color d93f0b \
            --description "Nightly main health report" \
            --force
          log="$RUNNER_TEMP/main-build.log"
          digest='(digest unavailable; see the run step summary and full logs.)'
          if [ -s "$log" ]; then
            hits=$(grep -a -B4 -A8 '^Error' "$log" | awk 'BEGIN{RS="--\n"; ORS=""} !/failed to delete sandbox/ {print $0 "--\n"}' | grep -av '^--$' | head -n 60 || true)
            [ -n "$hits" ] && digest="$hits"
          fi
          last_green=$(gh run list --workflow main-minimal-build.yml --branch main --status success --limit 1 --json headSha,url --jq '"\(.[0].headSha[0:9]) \(.[0].url)"' 2>/dev/null || true)
          [ -z "$last_green" ] && last_green='(no successful run found)'
          # The taxonomy workflow comments on any issue with no declaration
          # block, so this body carries one, copied from the nightly lane.
          body=$(printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "main 최소 빌드가 \`${JOB_STATUS}\` 로 끝났습니다." \
            "- 실행: ${RUN_URL}" \
            "- 커밋: \`${GITHUB_SHA}\`" \
            "- operator exes: \`${PRODUCT_OUTCOME}\` / @check: \`${CHECK_OUTCOME}\`" \
            "- 마지막 green: ${last_green}" \
            '```' \
            "${digest}" \
            '```' \
            '```masc-triage' \
            "kind: defect" \
            "area: ci" \
            "impact: degrades" \
            "must-do: false" \
            '```')
          existing=$(gh issue list --state open --label "${label}" \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "commented on #${existing}"
          else
            gh issue create --label "${label}" \
              --title "main 빌드가 빨갛습니다" \
              --body "${body}"
          fi
