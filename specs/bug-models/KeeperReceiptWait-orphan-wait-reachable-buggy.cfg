\* Reachability guard on the clean model: a task waits while its request is
\* active and its worker is gone after a restart.
\* Expected: WaitOnOrphanUnreachable VIOLATED.
SPECIFICATION Spec

CONSTANTS
    T1 = t1
    T2 = t2
    R1 = r1
    R2 = r2
    MaxRestarts = 1
    MaxPatrols = 2

INVARIANTS
    WaitOnOrphanUnreachable

CHECK_DEADLOCK FALSE
