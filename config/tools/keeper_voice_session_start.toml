name = "keeper_voice_session_start"
description = """
Start a voice session for this keeper.

Defaults to turn_based batch STT/TTS. \
conversation_mode=realtime_bridge is accepted only when \
MASC_VOICE_REALTIME_WS_URL points at a configured realtime audio bridge; \
otherwise the tool fails closed instead of pretending a duplex stream \
exists."""

# Held back from the request until the model asks for it by name. Not
# called once on 2026-08-29 or 2026-08-30 across the fleet.
defer_loading = true

[[params]]
name = "session_name"
type = "string"
description = "Optional session name"

[[params]]
name = "conversation_mode"
type = "string"
enum = ["turn_based", "realtime_bridge"]
description = """
Optional mode. realtime_bridge requires MASC_VOICE_REALTIME_WS_URL."""
