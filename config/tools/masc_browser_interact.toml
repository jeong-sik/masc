name = "masc_browser_interact"
description = """
Act on an observed browser tab: pointer, keys, touch, viewport, or a workflow.
Pass clientId and tabId from BrowserTabs/masc_browser_tabs; tab IDs belong to one connection. Only Pages the ego task space manages take input; adopt an operator tab first (BrowserAct/masc_browser_act adopt_tab). After a failure or unknown result, read the tab again before acting: page handlers may already have run, so never replay.
Name an element with selector, target or documentId/nodeId; prefer refs from BrowserRead/masc_browser_read mode=snapshot. fill (action or workflow step) replaces the value or editor content and does not press Enter or submit. scroll moves the page; scroll_at scrolls the pane under the point. hover_at moves the pointer without clicking. tap_at is a touch press and release; swipe holds a touch from one point to another, and a swipe longer than the command window is refused before it starts.
drag_to drags one selector onto another; its receipt does not prove the page accepted the drop.
set_viewport, tap_at and swipe invalidate snapshot refs: take a new snapshot and screenshot. A set viewport lasts while the SDK process runs; a later answer with another sdkProcessStartedAt means it is gone.
follow_link opens an observed same-tab HTTP(S) anchor without running click handlers; it refuses downloads, new-window targets, noreferrer and referrerpolicy. destinationUrl is the intended URL, not proof of load.
activate_tab restores the window only when minimized and reports active/window state, not OS focus; use it before hand_off. expectedUrl is compared before the SDK call, not atomically with it.
action=workflow runs steps in order, then returns a final snapshot. expectedUrl checks only the starting page. The first failing step, or a JavaScript dialog, stops the run; the answer keeps the completed steps. Start a new workflow when a step depends on what an earlier one shows. clickAndWaitForPopup moves later steps to the popup; pages lists each page's tabId and sourceTabId names the opener. A popup trigger whose popup was not acquired stays in pendingAction.
Page JavaScript runs only through workflow evaluate/waitForFunction; workflow fetch runs in the page under CORS. keyboard.insertText inserts literal text without key events; focus the editor before keyboard input. keyboard.type answers nativeCompletion when typing finished; unconfirmed typing stops the run, and the page may still reject the text. Typing drains the Page event buffer, so a later events step is not a full history."""
additional_properties = false
# 2026-09-24 측정: agent-core 레인 요청 5,047건(09-23)이 이 정의
# 3,294 B 를 매번 실었고, 09-17~23 7일간 이 도구를 부른 서로 다른
# Keeper 턴은 22개다. 지연의 손익은 호출 수가 아니라 필요했던 턴 수로
# 가른다(masc #32062). 지연돼도 keeper_tool_search 목록에 이름이 남고,
# 부르면 그 턴에 스키마가 붙는다. 한 줄 요약은 그 답에 한 번 나온다.
defer_loading = true

[[params]]
name = "tabId"
type = "integer"
required = true
minimum = 0

[[params]]
name = "expectedUrl"
type = "string"
description = "The tab URL you observed. Required for workflow, target, set_viewport, activate_tab, follow_link, hover, double_click, drag_to, type_text, press_key and every coordinate action; optional for click/fill by selector or documentId/nodeId, select_option and scroll."

[[params]]
name = "action"
type = "string"
required = true
enum = ["workflow", "set_viewport", "tap_at", "swipe", "activate_tab", "follow_link", "double_click", "double_click_at", "type_text", "press_key", "click", "fill", "select_option", "scroll", "click_at", "scroll_at", "hover", "drag_to", "hover_at"]

[[params]]
name = "selector"
type = "string"
description = "click/double_click/fill/hover/select_option: an ego locator (snapshot ref such as @12, role/text locator, CSS; reaches iframes and shadow roots). Give one of selector, target or documentId+nodeId; select_option takes selector only."

[[params]]
name = "text"
type = "string"
description = "fill: the new value; empty clears. type_text: literal text typed into the current focused editable; control characters are refused, use press_key."

[[params]]
name = "value"
type = "string"
description = "select_option: one exact option value. Disabled options can be selected."

[[params]]
name = "values"
type = "array"
items = { type = "string" }
description = "select_option, instead of value: distinct values; [] clears. The answer lists selectedValues."

[[params]]
name = "x"
type = "integer"
description = "scroll/scroll_at horizontal CSS-pixel delta; left out means 0. Give x, y or both."

[[params]]
name = "y"
type = "integer"
description = "scroll/scroll_at vertical CSS-pixel delta; left out means 0."

[[params]]
name = "button"
type = "string"
enum = ["primary", "middle", "secondary"]
description = "click_at only; default primary."

[[params]]
name = "clientId"
type = "string"
description = "Required: the clientId of the connection that listed this tab. A stale ID is refused."

[[params]]
name = "target"
type = "object"
additional_properties = false
description = "click/fill/hover/double_click, instead of selector, with expectedUrl: {ref} from the latest snapshot of this page (12 for ref=12), {role, name} or {text}. exact (default true) matches the whole name or text; false matches a part, any case. Take a new snapshot after a page change or a stale-ref refusal."

[[params.params]]
name = "ref"
type = "integer"
minimum = 0

[[params.params]]
name = "role"
type = "string"

[[params.params]]
name = "name"
type = "string"

[[params.params]]
name = "text"
type = "string"

[[params.params]]
name = "exact"
type = "boolean"

[[params]]
name = "documentId"
type = "string"
description = "From the latest scene read. With nodeId for click/fill/hover/double_click/follow_link (follow_link requires it). type_text/press_key require it alone and act on current focus. A reload changes it and the call is refused."

[[params]]
name = "nodeId"
type = "string"
description = "Scene node, with documentId; refused once the node is detached or replaced."

[[params]]
name = "point"
type = "object"
description = "click_at/double_click_at/hover_at/scroll_at/tap_at: x and y as fractions of the screenshot viewport, in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "from"
type = "object"
description = "swipe start: viewport fractions in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "to"
type = "object"
description = "swipe end: viewport fractions in [0,1)."

additional_properties = false

[[params.params]]
name = "x"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params.params]]
name = "y"
type = "number"
required = true
minimum = 0.0
exclusive_maximum = 1.0

[[params]]
name = "viewport"
type = "object"
description = "Every coordinate action (click_at, double_click_at, hover_at, scroll_at, tap_at, swipe): copy the screenshot's documentId, width, height, scrollX and scrollY exactly; a change is refused."

additional_properties = false

[[params.params]]
name = "documentId"
type = "string"
required = true

[[params.params]]
name = "width"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "height"
type = "number"
required = true
exclusive_minimum = 0.0

[[params.params]]
name = "scrollX"
type = "number"
required = true

[[params.params]]
name = "scrollY"
type = "number"
required = true

# follow_link uses documentId/nodeId and expectedUrl already declared above.

[[params]]
name = "source"
type = "object"
description = "drag_to: the source selector."
additional_properties = false

[[params.params]]
name = "selector"
type = "string"
required = true

[[params]]
name = "destination"
type = "object"
description = "drag_to: the destination selector."
additional_properties = false

[[params.params]]
name = "selector"
type = "string"
required = true

[[params]]
