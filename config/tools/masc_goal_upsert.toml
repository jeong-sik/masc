name = "masc_goal_upsert"
description = """
Create or update flat Goal metadata.

Creation requires a \
measurable success condition: measure and procedure. A changed \
effective criterion must keep title and procedure non-blank; \
omitted fields retain their stored values. This checks input completeness, \
not semantic feasibility. Use masc_goal_transition for lifecycle changes."""
additional_properties = false

# Held back from the request until the model asks for it by name. Not
# called once on 2026-08-29 or 2026-08-30 across the fleet.
defer_loading = true

[[params]]
name = "id"
type = "string"

[[params]]
name = "title"
type = "string"

# The creation requirement is NOT expressed as required = true on purpose:
# this one tool serves both create and update, and JSON Schema `required` is
# unconditional, so listing measure/procedure would reject every metadata
# update of an existing goal. The store checks creation and changed effective
# criteria inside the write lock. Omitted fields preserve stored values, so
# partial updates remain valid.
[[params]]
name = "measure"
type = "object"
description = """
What counts as done, as one of three shapes. A count: {"kind":"count","noun":"층","total":14}. A quantity against a limit: {"kind":"quantity","unit":"ms","direction":"at_most","target":100} (direction is at_least or at_most). A condition that holds or not: {"kind":"done_when","condition":"..."}. An unknown kind, a missing field or an extra field is refused. Required when the upsert creates a new goal; optional on update, preserving its stored value when omitted."""

[[params]]
name = "procedure"
type = "string"
description = """
How the measure is read: what to open and what to count or compare. From a Keeper, name a public http(s) URL or a board:<post-id> / fusion:<run-id> that request_complete submits in evidence_refs; a path in a Keeper's workspace is not one the judge can open. On the MASC host, a file under .masc/playground can also be named relative to that directory. The judge opens exactly what this names — it cannot list directories, search, or run a command, so a procedure that names no observable is refused as unmeasurable rather than hunted for. Required (non-blank) when the upsert creates a new goal; optional on update, preserving its stored value when omitted."""

[[params]]
name = "due_date"
type = "string"

[[params]]
name = "priority"
type = "integer"

[[params]]
name = "expected_workspace"
type = "object"
additional_properties = false
description = "Optional canonical workspace paths observed by the caller. A mismatch refuses the upsert before changing the Goal."
[[params.params]]
name = "base_path"
type = "string"
required = true
[[params.params]]
name = "masc_root"
type = "string"
required = true

[[params]]
name = "if_absent"
type = "boolean"
description = "When true, refuse if the Goal ID or a trimmed alias already exists; never update an existing Goal."
