name = "tool_edit_file"
description = """
Write, append, or patch a file. path is required. For mode='overwrite' \
(default) or 'append', content is required and non-empty. For mode='patch', \
old_string and new_string are required; old_string must match exactly once \
unless replace_all=true. Good overwrite: path='lib/foo.ml', content='let x = \
1'. Good patch: path='lib/foo.ml', mode='patch', old_string='old', \
new_string='new'. Bad: path='', content=''. Bad: mode='create' (use \
overwrite). Creates parent dirs."""

[[params]]
name = "path"
type = "string"
required = true
description = "Relative or absolute file path to write"

[[params]]
name = "content"
type = "string"
description = "File content to write"

[[params]]
name = "old_string"
type = "string"
description = "Patch mode substring to replace"

[[params]]
name = "new_string"
type = "string"
description = "Patch mode replacement substring"

[[params]]
name = "replace_all"
type = "boolean"
description = "Patch every occurrence instead of exactly one"

[[params]]
name = "mode"
type = "string"
enum = ["overwrite", "append", "patch"]
description = "Write mode (default: overwrite)"
