name = "tool_execute"
description = """
Execute a typed process invocation inside the Keeper sandbox. Accepted \
fields: argv, pipeline, script, shell, env, cwd, timeout_sec, stdin, \
stdout, stderr. Provide exactly one of: a non-empty argv process vector, an \
explicit pipeline of typed stages, or a script command line run by a real \
shell in the sandbox; this tool does not expose background task lifecycle \
tools. The cmd and command string fields are rejected. Shell \
metacharacters in argv are data, not syntax; use typed stdin/stdout/stderr \
objects for redirection and the pipeline field for pipelines. Use Grep for \
structured file-content search. cwd must resolve inside the Keeper path \
jail. Pass a relative cwd (typically '.') and relative filesystem operands, \
which resolve against cwd. The Keeper-visible absolute root is \
informational; Docker host absolute paths are unavailable. MASC does not \
interpret program or subcommand meaning: after typed lowering, path \
containment, sandbox resolution, and the external-effect Gate, the invoked \
program owns its syntax and exit result."""
additional_properties = false

[[params]]
name = "argv"
type = "array"
items = { type = "string" }
min_items = 1
description = """
Non-empty process vector: argv[0] is the executable and remaining tokens are \
arguments, all passed verbatim. There is no shell, so a literal '|', '&&' or \
'>' token is data, not an operator, and wildcards (*, ?, [...]) are not \
expanded: 'foo*.ml' names a file called 'foo*.ml'. Use script for a line you would \
have given a shell, or pipeline, then and the redirect fields to say the \
same thing field by field, and pass exact paths. Filesystem arguments use \
the selected sandbox namespace; relative operands resolve against the typed \
cwd, and Docker cannot reach host absolute paths."""

[[params]]
name = "pipeline"
type = "array"
description = """
Typed pipeline form: ordered exec stages. Use this instead of putting '|' in \
argv. Each stage may carry its own stdin/stdout/stderr, so piping and \
redirecting combine in one call. Stage argv uses the selected sandbox \
namespace, and relative path operands resolve against the typed cwd. \
Mutually exclusive with top-level argv."""

[params.items]
type = "object"
additional_properties = false

[[params.items.params]]
name = "argv"
type = "array"
required = true
items = { type = "string" }
min_items = 1
description = """
Same shape as the top-level argv. Still no shell: '|', '&&' and '>' are \
data, and wildcards are not expanded."""

[[params.items.params]]
name = "stdin"
type = "object"
additional_properties = false
min_properties = 1
max_properties = 1

[[params.items.params.params]]
name = "discard"
type = "boolean"

[[params.items.params.params]]
name = "file"
type = "string"
min_length = 1
pattern = "^/.*$"

[[params.items.params.params]]
name = "literal"
type = "string"
description = """
The bytes themselves, fed to the child's stdin without touching the \
filesystem — what a heredoc is. Use this to pipe a patch, a script body, \
or any inline input; mutually exclusive with discard and file."""

[[params.items.params]]
name = "stdout"
type = "object"
additional_properties = false
min_properties = 1
max_properties = 1

[[params.items.params.params]]
name = "discard"
type = "boolean"

[[params.items.params.params]]
name = "truncate"
type = "string"
min_length = 1
pattern = "^/.*$"

[[params.items.params.params]]
name = "append"
type = "string"
min_length = 1
pattern = "^/.*$"

[[params.items.params.params]]
name = "fd"
type = "integer"
enum = [1, 2]

[[params.items.params]]
name = "stderr"
type = "object"
additional_properties = false
min_properties = 1
max_properties = 1

[[params.items.params.params]]
name = "discard"
type = "boolean"

[[params.items.params.params]]
